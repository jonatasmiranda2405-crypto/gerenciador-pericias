name: Vigia de segurança

# Todo dia às 6h (horário de Brasília) e quando alguém pedir em Actions > Vigia > Run workflow.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ferramentas/vigia.mjs'
      - '.github/workflows/vigia.yml'

permissions:
  contents: read

jobs:
  regras:
    name: Regras do Firebase (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/testes
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm test

  verificacoes:
    name: Banco, bibliotecas, site e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Vigia
        env:
          # num push, o site ainda está sendo publicado: compara com o repositório só nas rodadas diárias e manuais
          VIGIA_COMPARAR_SITE: ${{ github.event_name == 'push' && '0' || '1' }}
        run: node ferramentas/vigia.mjs
