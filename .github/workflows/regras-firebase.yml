name: Regras do Firebase

on:
  push:
    paths:
      - 'firebase/**'
      - '.github/workflows/regras-firebase.yml'
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase/testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
