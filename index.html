<style>
:root{
  color-scheme: light;
  --ground:#F3F5F4;
  --surface:#FFFFFF;
  --surface-2:#E9EDEB;
  --surface-3:#DFE5E3;
  --ink:#16202A;
  --ink-2:#31424A;
  --muted:#5B6B6E;
  --line:#DAE1DF;
  --line-strong:#C3CDCA;
  --accent:#14655C;
  --accent-deep:#0E4A44;
  --accent-soft:#E1EEEB;
  --ok:#2E6B4F;
  --ok-soft:#DFEDE5;
  --warn:#8A5F10;
  --warn-soft:#F4EAD2;
  --danger:#A33D33;
  --danger-soft:#F5E2DE;
  --violet:#5B4A86;
  --violet-soft:#EAE5F3;
  /* series validadas para superficie clara */
  --s1:#0b8f7f;
  --s2:#eb6834;
  --r1:#62c1b4; --r2:#38a99b; --r3:#0b8f7f; --r4:#0a7568; --r5:#085a50;
  --shadow:0 1px 2px rgba(22,32,42,.05), 0 10px 24px -16px rgba(22,32,42,.22);
  --radius:10px;
  --sidebar-w:248px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0E1417;
    --surface:#151D20;
    --surface-2:#1C262A;
    --surface-3:#243036;
    --ink:#E3EBE9;
    --ink-2:#C2D0CD;
    --muted:#93A5A2;
    --line:#27353A;
    --line-strong:#38484E;
    --accent:#5FB8AE;
    --accent-deep:#8FD3C9;
    --accent-soft:#12302D;
    --ok:#74C39A;
    --ok-soft:#163024;
    --warn:#D3A15A;
    --warn-soft:#332916;
    --danger:#E08B7A;
    --danger-soft:#33201C;
    --violet:#B3A3DD;
    --violet-soft:#241F33;
    --s1:#2a9d8f;
    --s2:#d95926;
    --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1417;
  --surface:#151D20;
  --surface-2:#1C262A;
  --surface-3:#243036;
  --ink:#E3EBE9;
  --ink-2:#C2D0CD;
  --muted:#93A5A2;
  --line:#27353A;
  --line-strong:#38484E;
  --accent:#5FB8AE;
  --accent-deep:#8FD3C9;
  --accent-soft:#12302D;
  --ok:#74C39A;
  --ok-soft:#163024;
  --warn:#D3A15A;
  --warn-soft:#332916;
  --danger:#E08B7A;
  --danger-soft:#33201C;
  --violet:#B3A3DD;
  --violet-soft:#241F33;
  --s1:#2a9d8f;
  --s2:#d95926;
  --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.num{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.011em;}
button{font-family:inherit;}
a{color:var(--accent); text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* ---------- estrutura ---------- */
.app{display:grid; grid-template-columns:auto 1fr; min-height:100%;}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:20px;
  padding:20px 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
  width:var(--sidebar-w);
  transition:width .22s ease, padding .22s ease;
}

/* punho para recolher a barra lateral */
.rail-toggle{
  position:fixed; top:50%; left:var(--sidebar-w);
  transform:translate(-50%,-50%);
  width:18px; height:70px; padding:0; border:none; background:transparent;
  cursor:pointer; z-index:40;
  display:flex; align-items:center; justify-content:center;
  transition:left .22s ease;
}
.rail-toggle::before{
  content:''; width:4px; height:42px; border-radius:99px;
  background:var(--line-strong);
  transition:background .15s ease, height .15s ease;
}
.rail-toggle:hover::before{background:var(--accent); height:58px;}
.rail-toggle:focus-visible::before{background:var(--accent); height:58px;}

body.rail{--sidebar-w:66px;}
body.rail .sidebar{padding-left:11px; padding-right:11px;}
body.rail .brand-text,
body.rail .perito-info,
body.rail .side-label,
body.rail .nav-item > span,
body.rail .nav-badge,
body.rail .account-text,
body.rail #authBtn{display:none;}
body.rail .brand,
body.rail .account{justify-content:center; padding:0;}
body.rail .perito-btn{justify-content:center; padding:8px 0;}
body.rail .nav-item{justify-content:center; padding:10px 0;}
body.rail .side-actions{justify-content:center;}
body.rail #themeBtn{flex:1; justify-content:center;}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
.brand-mark{
  width:34px; height:34px; border-radius:9px; flex-shrink:0; line-height:0;
  display:flex; align-items:center; justify-content:center;
  font-family:'IBM Plex Mono',monospace;
}
.brand-text{min-width:0;}
.brand-name{font-size:13.5px; font-weight:600; line-height:1.2; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-top:2px; white-space:nowrap;}

.side-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); font-weight:600; padding:0 8px; margin-bottom:8px;
}
.peritos{display:flex; flex-direction:column; gap:6px;}
.perfil-nums{display:flex; gap:6px; margin-top:7px;}
.perfil-num{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px;
  padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:transparent;
  color:var(--muted); font-family:inherit; cursor:pointer; text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.perfil-num:hover{background:var(--surface-2);}
.perfil-num.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
.perfil-num b{font-size:15px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink);}
.perfil-num.on b{color:var(--accent-deep);}
.perfil-num span{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
body.rail .perfil-nums{display:none;}
.chips.visoes{margin-bottom:2px;}
.chip-num{
  margin-left:7px; padding:1px 6px; border-radius:99px; font-size:10.5px;
  background:var(--surface-2); color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.active .chip-num{background:rgba(255,255,255,.22); color:inherit;}
.perito-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 9px; border-radius:8px; cursor:pointer;
  border:1px solid transparent; background:transparent; color:inherit;
  transition:background .12s, border-color .12s;
}
.perito-btn:hover{background:var(--surface-2);}
.perito-btn.active{background:var(--pcolor-soft); border-color:var(--pcolor);}
.perito-avatar{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:var(--pcolor); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace;
}
:root[data-theme="dark"] .perito-avatar, :root:not([data-theme="light"]) .perito-avatar{color:#0E1417;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .perito-avatar{color:#fff;} }
.perito-info{min-width:0; display:flex; flex-direction:column;}
.perito-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.perito-count{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}

.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  border:none; background:transparent; color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-deep); font-weight:600;}
.nav-item svg{width:17px; height:17px; flex-shrink:0; stroke-width:1.75;}
.nav-pro{margin-left:auto; font-size:9.5px; font-weight:700; letter-spacing:.06em; padding:1px 5px; border-radius:5px; border:1px solid var(--accent); color:var(--accent);}
.pro-planos{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin:14px 0 6px;}
.pro-plano{display:flex; flex-direction:column; gap:4px; align-items:flex-start; padding:14px; border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); text-align:left; cursor:pointer; font:inherit; color:inherit;}
.pro-plano:hover{border-color:var(--accent);}
.pro-plano b{font-size:13px;}
.pro-plano .pro-preco{font-size:20px; font-weight:700;}
.pro-plano small{color:var(--muted);}
.pro-plano.destaque{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset;}
.pro-lista{margin:6px 0 0 18px; display:grid; gap:4px;}
.nav-badge{
  margin-left:auto; font-size:11px; font-family:'IBM Plex Mono',monospace;
  background:var(--surface-3); color:var(--muted);
  padding:1px 6px; border-radius:99px; font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-badge{background:var(--accent); color:var(--surface);}
.nav-badge.alert{background:var(--danger-soft); color:var(--danger);}

.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid var(--line);}
.account{display:flex; align-items:center; gap:8px; padding:0 4px; min-width:0;}
.account-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--muted);}
.account-dot.on{background:var(--ok);}
.account-text{min-width:0; font-size:11.5px; line-height:1.35;}
.account-state{color:var(--ink); font-weight:500;}
.account-mail{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.side-actions{display:flex; gap:6px;}

/* ---------- area principal ---------- */
.main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.menu-btn{display:none; background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px; cursor:pointer; color:var(--ink);}
.menu-btn svg{width:18px; height:18px; display:block;}
.topbar-title{display:flex; flex-direction:column; min-width:0; margin-right:auto;}
.topbar-title h1{font-size:19px;}
.topbar-title p{margin:1px 0 0; font-size:12.5px; color:var(--muted);}
.content{padding:24px 28px 72px; max-width:1180px; width:100%;}

/* ---------- controles ---------- */
.btn{
  border:1px solid transparent; border-radius:8px; padding:9px 14px;
  font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  transition:background .12s, border-color .12s, color .12s;
}
.btn svg{width:15px; height:15px; stroke-width:2;}
.btn-primary{background:var(--accent); color:var(--surface);}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn[disabled]{opacity:.5; cursor:default;}
.icon-btn{
  background:transparent; border:none; cursor:pointer; color:var(--muted);
  padding:4px; border-radius:6px; display:inline-flex; line-height:0;
}
.icon-btn svg{width:15px; height:15px; stroke-width:1.9;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}

.search{position:relative; flex:1 1 280px; max-width:420px;}
.search input{
  width:100%; padding:9px 12px 9px 34px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:13.5px; font-family:inherit;
}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); stroke-width:2;}

.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.chip:hover{border-color:var(--line-strong); color:var(--ink);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--surface);}

.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; display:inline-block; white-space:nowrap;}
.campo-invalido{border-color:var(--danger) !important;}
.campo-aviso{display:block; font-size:11px; color:var(--danger); margin-top:4px; line-height:1.35;}
.pill-muted{background:var(--surface-2); color:var(--muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-deep);}
.pill-warning{background:var(--warn-soft); color:var(--warn);}
.pill-success{background:var(--ok-soft); color:var(--ok);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}

.banner{
  border-radius:var(--radius); padding:11px 14px; font-size:12.5px;
  margin-bottom:18px; display:flex; gap:9px; align-items:flex-start;
  background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
}
.banner-info{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent);}
.banner svg{width:15px; height:15px; flex-shrink:0; margin-top:2px; stroke-width:2;}

/* ---------- blocos ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden;
}
.panel-head{
  width:100%; display:flex; align-items:center; gap:10px;
  padding:15px 20px; background:transparent; border:none; cursor:pointer;
  text-align:left; color:inherit;
  transition:background .12s ease;
}
.panel-head:hover{background:var(--surface-2);}
.panel-head h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.panel-head .note{margin-left:auto; font-size:11.5px; color:var(--muted); white-space:nowrap;}
.panel-caret{display:flex; color:var(--muted); flex-shrink:0; transition:transform .22s ease;}
.panel-caret svg{width:15px; height:15px; stroke-width:2.2;}
.panel.collapsed .panel-caret{transform:rotate(-90deg);}
.panel-body{display:grid; grid-template-rows:1fr; transition:grid-template-rows .22s ease;}
.panel.collapsed .panel-body{grid-template-rows:0fr;}
.panel-body > .panel-inner{overflow:hidden; min-height:0;}
.panel-inner > .panel-pad{padding:0 20px 18px;}
.section-gap{display:flex; flex-direction:column; gap:18px;}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px;}
.kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.kpi .v{font-size:27px; font-weight:600; margin-top:5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.kpi .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.kpi.tone-danger{border-left:3px solid var(--danger);}
.kpi.tone-danger .v{color:var(--danger);}
.kpi.tone-accent{border-left:3px solid var(--accent);}
.kpi.tone-ok{border-left:3px solid var(--ok);}
.kpi.tone-ok .v{color:var(--ok);}

.two-col{display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start;}

/* ---------- graficos ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.legend-swatch{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.bar-row{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:12px; align-items:center; margin-bottom:11px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{display:flex; align-items:center; gap:10px; min-width:0;}
.bar{display:flex; height:16px; flex:1; min-width:0; background:var(--surface-2); border-radius:4px; overflow:hidden; gap:2px;}
.bar-seg{height:100%; min-width:2px; transition:filter .12s;}
.bar-seg:first-child{border-radius:4px 0 0 4px;}
.bar-seg:last-child{border-radius:0 4px 4px 0;}
.bar-seg:only-child{border-radius:4px;}
.bar-seg:hover{filter:brightness(1.12);}
.bar-value{font-size:12px; color:var(--ink-2); white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.chart-empty{font-size:12.5px; color:var(--muted); padding:8px 0;}

#tooltip{
  position:fixed; z-index:200; pointer-events:none; opacity:0;
  background:var(--ink); color:var(--ground);
  padding:6px 9px; border-radius:6px; font-size:12px; line-height:1.4;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5); transition:opacity .1s;
  max-width:240px;
}
#tooltip .tt-v{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

/* ---------- lista de pericias ---------- */
.list{display:flex; flex-direction:column; gap:9px;}
.case{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 17px; display:grid; gap:14px; align-items:center; cursor:pointer;
  grid-template-columns:auto 1fr auto auto;
  transition:border-color .12s;
}
.case:hover{border-color:var(--accent);}
.case-code{font-size:11.5px; color:var(--accent-deep); background:var(--accent-soft); padding:4px 8px; border-radius:6px; font-weight:600; font-family:'IBM Plex Mono',monospace;}
.case-title{min-width:0;}
.case-name{font-weight:600; font-size:14.5px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-meta{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-prazo{text-align:right; white-space:nowrap;}
.case-prazo .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.case-prazo .d{font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:13px;}
.case-prazo.atrasada .d{color:var(--danger);}
.case-prazo.proxima .d{color:var(--warn);}
.case-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; white-space:nowrap;}
.case-valor{font-size:12.5px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

.empty-state{text-align:center; padding:48px 20px; color:var(--muted);}
.empty-state h3{color:var(--ink); margin-bottom:6px; font-size:15px;}
.empty-state p{margin:0; font-size:13px;}

/* ---------- tabelas / agenda / documentos ---------- */
.group{margin-bottom:22px;}
.group:last-child{margin-bottom:0;}
.group-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.group-head h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.group-rule{flex:1; height:1px; background:var(--line);}
.rows{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.row-item{
  background:var(--surface); padding:11px 15px; display:grid; gap:12px; align-items:center;
  grid-template-columns:1fr auto; cursor:pointer;
}
.row-item:hover{background:var(--surface-2);}
.row-item.com-avatar{grid-template-columns:auto 1fr auto;}
.drawer-body.somente-leitura input, .drawer-body.somente-leitura select,
.drawer-body.somente-leitura textarea{opacity:.6; pointer-events:none;}
.row-full{grid-column:1/-1;}
.row-main{min-width:0;}
.row-title{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-side{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.row-date{font-size:12.5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink-2);}
.row-date.late{color:var(--danger); font-weight:600;}
.row-date.soon{color:var(--warn); font-weight:600;}

/* ---------- projudi ---------- */
.svc{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; padding:13px 0; border-bottom:1px solid var(--line);}
.svc:last-child{border-bottom:none; padding-bottom:0;}
.svc-code{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
  background:var(--surface-2); color:var(--ink-2); padding:3px 8px; border-radius:6px; white-space:nowrap;
}
.svc-name{font-size:13.5px; font-weight:600;}
.svc-desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
.svc-fields{font-size:11.5px; color:var(--muted); margin-top:5px; font-family:'IBM Plex Mono',monospace;}
.consulta-form{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
.consulta-form input{
  flex:1 1 240px; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--ground); color:var(--ink); font-size:13.5px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
}
/* ---------- calculadoras ---------- */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:13px; margin-bottom:14px;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.field input, .field select{
  border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%;
}
.field input[inputmode="decimal"]{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.field .dica{font-size:10.5px; color:var(--muted);}
.field textarea{
  border:1px solid var(--line); border-radius:7px; padding:9px 11px; font-size:13px; line-height:1.55;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%; resize:vertical; min-height:70px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.celula-horas{
  width:82px; text-align:right; padding:5px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12.5px;
}
.acoes{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.resumo-calc{display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:12px; margin:4px 0 14px;}
.resumo-item{background:var(--ground); border:1px solid var(--line); border-radius:8px; padding:11px 13px;}
.resumo-item.destaque{border-color:var(--accent); background:var(--accent-soft);}
.resumo-item .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.resumo-item .v{font-size:17px; font-weight:600; margin-top:3px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.tabela-wrap{overflow-x:auto; overflow-y:auto; max-height:420px; border:1px solid var(--line); border-radius:8px; margin-top:14px;}
table.memoria{border-collapse:collapse; width:100%; font-size:12.5px;}
table.memoria th{
  position:sticky; top:0; z-index:1; background:var(--surface-2); text-align:right;
  padding:8px 11px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); white-space:nowrap; font-weight:600;
}
table.memoria th:first-child, table.memoria td:first-child{text-align:left;}
table.memoria td{
  padding:7px 11px; text-align:right; border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; white-space:nowrap;
}
table.memoria tbody tr:hover{background:var(--surface-2);}
table.memoria tfoot td{font-weight:600; border-top:2px solid var(--line-strong); background:var(--surface-2);}
.calc-nota{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.55;}
.kv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px;}
.kv{min-width:0;}
.kv .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.kv .v{font-size:13.5px; margin-top:2px; overflow-wrap:break-word;}

/* ---------- gaveta (detalhe da pericia) ---------- */
.drawer{
  position:fixed; inset:0; background:var(--ground); z-index:60;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none; transform:scale(.995);
  transition:opacity .16s ease, transform .16s ease;
}
.drawer.open{opacity:1; visibility:visible; pointer-events:auto; transform:scale(1);}
.drawer-head{
  padding:13px 24px; border-bottom:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap;
}
.back-btn{
  background:transparent; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:8px; flex-shrink:0;
}
.back-btn:hover{background:var(--surface-2); color:var(--ink);}
.back-btn svg{width:14px; height:14px; stroke-width:2.2;}
.codigo-input{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent-deep);
  background:var(--accent-soft); border:1px solid transparent; border-radius:6px;
  padding:6px 9px; font-weight:600; width:150px; flex-shrink:0;
}
.nome-input{
  font-size:18px; font-weight:600; border:1px solid transparent; background:transparent;
  color:var(--ink); flex:1; padding:4px 6px; min-width:160px; border-radius:6px;
  font-family:inherit; letter-spacing:-.011em;
}
.nome-input:hover, .codigo-input:hover{border-color:var(--line);}
.drawer-body{flex:1; overflow-y:auto;}
.meta-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:13px;
  padding:18px 24px; border-bottom:1px solid var(--line); background:var(--surface);
}
.meta-item{display:flex; flex-direction:column; gap:4px; min-width:0;}
.meta-item label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.meta-item input, .meta-item select{
  border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%;
}
.meta-item .readout{padding:7px 0; font-size:14px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.drawer-cols{display:grid; grid-template-columns:1.35fr 1fr; gap:0;}
.col-pane{padding:20px 24px;}
.col-docs{border-right:1px solid var(--line);}
.sub{margin-bottom:22px;}
.sub:last-child{margin-bottom:0;}
.sub h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
.fase-group{border-left:2px solid var(--line); padding-left:14px; margin:0 0 16px 4px; position:relative;}
.fase-group:before{content:''; position:absolute; left:-5px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
.fase-title{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; font-size:12.5px; margin-bottom:8px;}
.doc-item, .obs-item{
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
  font-size:13px; display:flex; justify-content:space-between; gap:10px;
  background:var(--surface); align-items:flex-start;
}
.doc-item .d-name{font-weight:600;}
.doc-item .d-meta, .obs-item .o-date{font-size:11.5px; color:var(--muted); margin-top:3px;}
.doc-item .d-actions{display:flex; gap:2px; flex-shrink:0;}
.doc-item.editing{display:block;}
.doc-item.has-file{cursor:pointer;}
.doc-item.has-file:hover{border-color:var(--accent);}
.add-row{display:flex; gap:8px; margin-top:7px;}
.add-row input, .add-row select, .add-row textarea{
  flex:1; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; min-width:0;
}
.add-row .btn{flex:0 0 auto;}
.hint{font-size:11.5px; color:var(--muted); margin-top:6px;}
.import-box{border-top:1px solid var(--line); padding-top:13px; margin-top:8px;}
.confirm-box{background:var(--danger-soft); border:1px solid var(--danger); border-radius:8px; padding:11px 13px; font-size:13px; color:var(--ink);}
.confirm-box .row{display:flex; gap:8px; margin-top:9px;}

/* ---------- visualizador ---------- */
.viewer-overlay{
  position:fixed; inset:0; background:rgba(10,14,18,.72); z-index:80;
  display:flex; align-items:center; justify-content:center; padding:22px;
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity .15s;
}
.viewer-overlay.open{opacity:1; visibility:visible; pointer-events:auto;}
.viewer-box{
  background:var(--surface); border-radius:12px; width:min(900px,100%); height:min(88vh,100%);
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
}
.viewer-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 17px; border-bottom:1px solid var(--line); flex-shrink:0;}
.viewer-head .v-title{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.viewer-body{flex:1; overflow:auto; background:var(--ground); display:flex; align-items:center; justify-content:center;}
.viewer-body iframe{width:100%; height:100%; border:none;}
.viewer-body img{max-width:100%; max-height:100%; object-fit:contain;}
.viewer-fallback{padding:40px; text-align:center; color:var(--muted); font-size:13px;}

/* ---------- responsivo ---------- */
.scrim{display:none;}
@media (max-width:1040px){
  .two-col{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .drawer-cols{grid-template-columns:1fr;}
  .col-docs{border-right:none; border-bottom:1px solid var(--line);}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .rail-toggle{display:none;}
  body.rail{--sidebar-w:270px;}
  body.rail .brand-text, body.rail .side-label, body.rail .account-text{display:block;}
  body.rail .perito-info{display:flex;}
  body.rail .nav-item > span{display:inline;}
  body.rail .nav-badge{display:inline-block;}
  body.rail #authBtn{display:inline-flex;}
  body.rail .brand, body.rail .account, body.rail .perito-btn, body.rail .nav-item{justify-content:flex-start;}
  body.rail .nav-item{padding:9px 10px;}
  body.rail .perito-btn{padding:8px 9px;}
  body.rail .sidebar{padding:20px 14px;}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:270px; z-index:70;
    transform:translateX(-100%); transition:transform .18s ease; height:100%;
  }
  body.nav-open .sidebar{transform:translateX(0);}
  body.nav-open .scrim{display:block; position:fixed; inset:0; background:rgba(10,14,18,.45); z-index:65;}
  .menu-btn{display:inline-flex;}
  .topbar{padding:13px 16px;}
  .content{padding:18px 16px 64px;}
  .meta-grid, .col-pane, .drawer-head{padding-left:16px; padding-right:16px;}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr;}
  .case{grid-template-columns:1fr; gap:9px;}
  .case-prazo, .case-right{text-align:left; align-items:flex-start;}
  .case-code{justify-self:start;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}

/* ---------- marca ---------- */
.wordmark{
  font-family:'Montserrat','IBM Plex Sans',system-ui,sans-serif;
  font-size:15px; line-height:1.15; letter-spacing:-.015em; white-space:nowrap;
}
.wordmark b{display:block; font-weight:700; color:var(--ink);}
.wordmark i{display:block; font-style:normal; font-weight:600; color:var(--accent);}
.wordmark.grande{font-size:25px; line-height:1.1; letter-spacing:-.025em;}

/* ---------- selo de privacidade ---------- */
.selo{
  display:inline-flex; align-items:center; gap:9px; cursor:pointer;
  padding:8px 13px 8px 10px; border-radius:99px; font-family:inherit; text-align:left;
  background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent-deep);
  transition:background .15s ease;
}
.selo:hover{background:var(--surface-2);}
.selo svg{width:19px; height:19px; stroke-width:1.7; flex-shrink:0;}
.selo span{display:flex; flex-direction:column; font-size:12.5px; font-weight:600; line-height:1.25;}
.selo b{font-weight:500; font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; opacity:.8;}
.selo-sm{padding:6px 11px 6px 9px;}
.selo-sm svg{width:16px; height:16px;}
.selo-sm span{font-size:11.5px;}
.selo-sm b{font-size:9.5px;}

/* ---------- paletas ---------- */
.paletas{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:9px;}
.paleta-op{
  display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer;
  border:1px solid var(--line); border-radius:9px; background:var(--surface);
  color:var(--ink); font-family:inherit; font-size:12.5px; text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.paleta-op:hover{background:var(--surface-2);}
.paleta-op.active{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep); font-weight:600;}
.paleta-amostra{
  width:22px; height:22px; border-radius:6px; flex-shrink:0;
  border:1px solid rgba(0,0,0,.12);
  background:linear-gradient(135deg, var(--pa) 0 50%, var(--pb) 50% 100%);
}
.paleta-amostra[data-palette="flow"]   {--pa:#4B718C; --pb:#E3634C;}
