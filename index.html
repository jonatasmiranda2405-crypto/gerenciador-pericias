<script>
/* ==========================================================================
   Constantes de domínio
   ========================================================================== */
const STATUS = {
  aguardando_nomeacao: {label:'Aguardando nomeação', pill:'pill-muted',   final:false, ramp:'var(--r1)'},
  aguardando_quesitos: {label:'Aguardando quesitos', pill:'pill-warning', final:false, ramp:'var(--r2)'},
  em_andamento:        {label:'Em andamento',        pill:'pill-accent',  final:false, ramp:'var(--r3)'},
  laudo_entregue:      {label:'Laudo entregue',      pill:'pill-success', final:true,  ramp:'var(--r4)'},
  concluida:           {label:'Concluída',           pill:'pill-success', final:true,  ramp:'var(--r5)'},
};
const DOC_TYPES = ['Despacho','Laudo Pericial','Quesitos','Procuração','Comprovante de Pagamento','Ofício','Ata de Audiência','Manifestação','Decisão/Sentença','Memória de Cálculo','Outro'];

/* Séries do Banco Central usadas na correção monetária (api.bcb.gov.br, consulta pública) */
const INDICES = {
  ipca:  {cod:433,  nome:'IPCA (IBGE)',            nota:'variação mensal'},
  ipcaE: {cod:7478, nome:'IPCA-E (IPCA-15)',       nota:'variação mensal'},
  inpc:  {cod:188,  nome:'INPC (IBGE)',            nota:'variação mensal'},
  igpm:  {cod:189,  nome:'IGP-M (FGV)',            nota:'variação mensal'},
  tr:    {cod:226,  nome:'TR (Banco Central)',     nota:'acumulada por período'},
  selic: {cod:4390, nome:'Selic acumulada no mês', nota:'já engloba juros de mora'},
};
const STATUS_PROCESSO = {
  em_tramitacao:  {label:'Em tramitação'},
  suspenso:       {label:'Suspenso'},
  sobrestado:     {label:'Sobrestado'},
  aguardando_julgamento: {label:'Aguardando julgamento'},
  baixado:        {label:'Baixado para cumprimento'},
  arquivado:      {label:'Arquivado'},
  transitado:     {label:'Transitado em julgado'},
  extinto:        {label:'Extinto'},
};
/* ==========================================================================
   Equipe e acesso
   Cada perícia guarda o e-mail do dono e a lista de quem recebeu acesso.
   A relação de membros mora no Firestore, em config/equipe, e é a mesma lista
   que as regras do servidor consultam para liberar o login — mudar aqui muda
   quem entra, sem precisar republicar o site.
   ========================================================================== */
const LS_PERFIL = 'pericias.perfil';
const CORES_MEMBRO = ['var(--accent)','var(--violet)','var(--s2)','var(--ok)','var(--warn)','var(--danger)'];
const LEGADO = ['jonatasmiranda2405@gmail.com','rodrigodosantosmiranda@gmail.com','periciamiranda@gmail.com'];

const PERFIL_VAZIO = {
  email:'', nome:'', criadoEm:'', ficha:{}, aparencia:{}, aceite:null, contatos:[], ia:{},
};
let perfil = (function(){
  try{ const raw = localStorage.getItem(LS_PERFIL); if(raw) return {...PERFIL_VAZIO, ...JSON.parse(raw)}; }catch(e){}
  return JSON.parse(JSON.stringify(PERFIL_VAZIO));
})();
let perfilCarregado = false;

function meuEmail(){ return ((currentUser && currentUser.email) || '').trim().toLowerCase(); }
function contaVerificada(){ return !!(currentUser && currentUser.emailVerified); }
function contaPronta(){ return !currentUser || contaVerificada(); }
function possoCriar(){ return contaPronta(); }
function souTitular(){ return true; }   /* no próprio espaço, cada um manda */

function iniciaisDe(texto){
  const partes = String(texto || '').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean);
  if(partes.length === 0) return '?';
  if(partes.length === 1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0] + partes[partes.length-1][0]).toUpperCase();
}
function corDoEmail(email){
  let n = 0;
  for(const ch of String(email)) n = (n * 31 + ch.charCodeAt(0)) % 997;
  return CORES_MEMBRO[n % CORES_MEMBRO.length];
}
/* a agenda é minha: eu escolho como cada e-mail aparece na minha tela */
function membroDe(email){
  const e = String(email || '').trim().toLowerCase();
  if(!e) return {email:'', nome:'Sem conta', iniciais:'?', cor:'var(--muted)'};
  if(e === meuEmail()){
    const nome = perfil.nome || (currentUser && currentUser.displayName) || e.split('@')[0];
    return {email:e, nome, iniciais: iniciaisDe(nome), cor:'var(--accent)', souEu:true};
  }
  const achado = (perfil.contatos || []).find(c => c.email === e);
  const nome = (achado && achado.nome) || e.split('@')[0];
  return {email:e, nome, iniciais: iniciaisDe(nome), cor: corDoEmail(e)};
}
/* quem convive com as minhas perícias: sai dos compartilhamentos e da agenda */
function pessoasDoEspaco(){
  const vistos = new Set(), lista = [];
  const juntar = e => {
    const x = String(e||'').toLowerCase();
    if(x && !vistos.has(x)){ vistos.add(x); lista.push(membroDe(x)); }
  };
  juntar(meuEmail());
  casos.forEach(c => { juntar(donoDe(c)); acessosDe(c).forEach(juntar); });
  (perfil.contatos || []).forEach(c => juntar(c.email));
  return lista;
}
function quantasPericias(email){
  const e = String(email||'').toLowerCase();
  return casos.filter(c => acessosDe(c).includes(e)).length;
}

/* ---------- gravação do perfil ---------- */
function persistirPerfilLocal(){
  try{ localStorage.setItem(LS_PERFIL, JSON.stringify(perfil)); }catch(e){}
}
async function salvarPerfil(patch){
  perfil = {...perfil, ...patch};
  persistirPerfilLocal();
  if(usingDb && db && currentUser){
    try{ await db.collection('usuarios').doc(currentUser.uid).set(patch, {merge:true}); }
    catch(e){ cloudSetBanner(bannerAviso('Não foi possível salvar o perfil agora (' + escapeHtml(e.code||'erro') + ').')); return false; }
  }
  return true;
}
/* As três contas antigas guardavam ficha e aceite em config/*. Na primeira
   entrada com esta versão, o que era delas passa para o perfil pessoal. */
async function trazerDoLegado(){
  const e = meuEmail();
  if(!LEGADO.includes(e)) return {};
  const trazido = {};
  try{
    const d = await db.collection('config').doc('peritos').get();
    if(d.exists && d.data()[e]) trazido.ficha = d.data()[e];
  }catch(err){}
  try{
    const d = await db.collection('config').doc('aceites').get();
    const meu = d.exists && (d.data().lista||[]).find(a => a.email === e);
    if(meu) trazido.aceite = {versao: meu.versao, quando: meu.quando};
  }catch(err){}
  try{
    const d = await db.collection('config').doc('equipe').get();
    if(d.exists){
      const m = (d.data().membros||[]).find(x => x.email === e);
      if(m && m.nome) trazido.nome = m.nome;
      trazido.contatos = (d.data().membros||[]).filter(x => x.email !== e).map(x => ({email:x.email, nome:x.nome}));
    }
  }catch(err){}
  return trazido;
}
async function carregarPerfil(){
  if(!usingDb || !db || !currentUser) return;
  const ref = db.collection('usuarios').doc(currentUser.uid);
  let dados = null;
  try{
    const d = await ref.get();
    if(d.exists) dados = d.data();
  }catch(e){ return; }
  if(!dados){
    dados = {
      email: meuEmail(),
      nome: (currentUser.displayName || '').trim() || meuEmail().split('@')[0],
      criadoEm: new Date().toISOString(),
      ficha:{}, aparencia:{}, aceite:null, contatos:[], ia:{},
      ...(await trazerDoLegado()),
    };
    try{ await ref.set(dados); }catch(e){}
  }
  perfil = {...PERFIL_VAZIO, ...dados, email: meuEmail()};
  perfilCarregado = true;
  persistirPerfilLocal();
  aparenciaDoPerfil();
  renderAll();
}

/* ---------- agenda de contatos ---------- */
async function definirContato(email, nome){
  const e = String(email||'').trim().toLowerCase();
  if(!e) return;
  const contatos = [...(perfil.contatos||[]).filter(c => c.email !== e)];
  if(nome && nome.trim()) contatos.push({email:e, nome:nome.trim()});
  await salvarPerfil({contatos});
}

/* ---------- dono e acesso de cada perícia ---------- */
const DE_PARA_ANTIGO = {jonatas:'jonatasmiranda2405@gmail.com', rodrigo:'rodrigodosantosmiranda@gmail.com'};
function donoDe(c){
  if(c && c.dono) return String(c.dono).toLowerCase();
  if(c && c.contador && DE_PARA_ANTIGO[c.contador]) return DE_PARA_ANTIGO[c.contador];
  return meuEmail();
}
function acessosDe(c){ return Array.isArray(c.emails) ? c.emails : [donoDe(c)]; }
function editoresDe(c){ return Array.isArray(c.editores) ? c.editores : [donoDe(c)]; }
function souDono(c){ const e = meuEmail(); return !e || donoDe(c) === e; }
function temAcesso(c){ const e = meuEmail(); return !e || acessosDe(c).includes(e); }
function podeEditar(c){ const e = meuEmail(); return !e || editoresDe(c).includes(e); }
function compartilhamentosDe(c){ return Array.isArray(c.compartilhamentos) ? c.compartilhamentos : []; }

/* ---------- as três visões da lista ---------- */
const VISOES = [
  {id:'minhas',         label:'Minhas',                teste: c => souDono(c)},
  {id:'compartilhadas', label:'Compartilhadas comigo', teste: c => !souDono(c) && temAcesso(c)},
  {id:'todas',          label:'Todas',                 teste: () => true},
];
let activeVisao = (function(){
  try{ const v = localStorage.getItem('pericias.visao'); if(VISOES.some(x=>x.id===v)) return v; }catch(e){}
  return 'minhas';
})();
function casosVisiveis(visao){
  const alvo = VISOES.find(v => v.id === (visao || activeVisao)) || VISOES[0];
  return casos.filter(c => temAcesso(c) && alvo.teste(c));
}
function contarVisao(id){
  const alvo = VISOES.find(v => v.id === id);
  return casos.filter(c => temAcesso(c) && alvo.teste(c)).length;
}
function setVisao(id){
  if(!VISOES.some(v => v.id === id) || id === activeVisao) return;
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  activeVisao = id;
  activeFilter = 'todas';
  searchQuery = '';
  try{ localStorage.setItem('pericias.visao', id); }catch(e){}
  renderAll();
}

/* ---------- migração das perícias antigas ----------
   Toda perícia sem dono recebe um: o perito que estava marcado nela. As outras
   contas da equipe entram como acesso herdado, para ninguém perder de vista o
   que já enxergava; dá para remover uma a uma dentro da perícia. */
let migracaoFeita = false;
async function migrarAcessos(){
  if(migracaoFeita || !usingDb || !db) return;
  const pendentes = casos.filter(c => !c.dono || !Array.isArray(c.emails));
  if(pendentes.length === 0){ migracaoFeita = true; return; }
  for(const c of pendentes){
    const dono = donoDe(c);
    const outros = LEGADO.filter(e => e !== dono);
    try{
      await saveCaso(c.id, {
        dono,
        emails: [dono, ...outros],
        editores: [dono, ...outros],
        compartilhamentos: outros.map(e => ({email:e, nivel:'editar', quando: todayIso(), por: dono, herdado:true})),
      });
    }catch(e){ return; }
  }
  migracaoFeita = true;
  renderAll();
}

/* ---------- compartilhar ---------- */
function nivelDe(c, email){
  const e = String(email||'').toLowerCase();
  if(donoDe(c) === e) return 'dono';
  if(!acessosDe(c).includes(e)) return null;
  return editoresDe(c).includes(e) ? 'editar' : 'leitura';
}
async function compartilhar(casoId, emailBruto, nivel){
  const c = casos.find(x => x.id === casoId);
  if(!c) return {erro:'Perícia não encontrada.'};
  const email = String(emailBruto||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return {erro:'Informe um e-mail válido.'};
  if(email === donoDe(c)) return {erro:'Este e-mail já é o dono da perícia.'};
  if(!podeEditar(c)) return {erro:'Só quem tem acesso de edição pode compartilhar.'};
  if(!souDono(c) && editoresDe(c).includes(email) && nivel !== 'editar') return {erro:'Só o dono da perícia pode reduzir o acesso de alguém.'};

  const aviso = ' Se a pessoa ainda não tiver conta, ela cria a dela com este mesmo e-mail e a perícia aparece lá.';
  const emails = [...new Set([...acessosDe(c), email])];
  const editores = nivel === 'editar'
    ? [...new Set([...editoresDe(c), email])]
    : editoresDe(c).filter(x => x !== email);
  const compartilhamentos = [...compartilhamentosDe(c).filter(s => s.email !== email),
    {email, nivel, quando: todayIso(), por: meuEmail() || donoDe(c)}];
  await saveCaso(casoId, {emails, editores, compartilhamentos});
  return {ok:true, aviso};
}
async function mudarNivel(casoId, email, nivel){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const e = String(email).toLowerCase();
  const editores = nivel === 'editar'
    ? [...new Set([...editoresDe(c), e])]
    : editoresDe(c).filter(x => x !== e);
  await saveCaso(casoId, {
    editores,
    compartilhamentos: compartilhamentosDe(c).map(s => s.email === e ? {...s, nivel, herdado:false} : s),
  });
  renderAll();
}
async function descompartilhar(casoId, email){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const e = String(email).toLowerCase();
  await saveCaso(casoId, {
    emails: acessosDe(c).filter(x => x !== e),
    editores: editoresDe(c).filter(x => x !== e),
    compartilhamentos: compartilhamentosDe(c).filter(s => s.email !== e),
  });
  renderAll();
}

/* ---------- convite por e-mail ---------- */
function enderecoDoApp(){ return location.origin + location.pathname; }
function textoConvite(c, email){
  const nivel = nivelDe(c, email) === 'editar' ? 'editar a perícia e anexar documentos' : 'consultar a perícia e os documentos';
  const quem = membroDe(meuEmail() || donoDe(c));
  return [
    'Olá,',
    '',
    `Compartilhei com você a perícia ${c.codigo} — ${c.nome} no Gerenciador de Perícia.`,
    '',
    c.numeroProcesso ? `Processo: ${c.numeroProcesso}` : null,
    (c.vara || c.comarca) ? `Vara: ${[c.vara, c.comarca].filter(Boolean).join(' — ')}` : null,
    c.partes ? `Partes: ${c.partes}` : null,
    `Seu acesso permite ${nivel}.`,
    '',
    `Endereço: ${enderecoDoApp()}`,
    `Entre com a conta Google ${email}.`,
    '',
    quem.nome,
  ].filter(l => l !== null).join('\n');
}
function abrirConvite(casoId, email){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const assunto = `Perícia ${c.codigo} compartilhada com você`;
  location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(textoConvite(c, email))}`;
}
async function copiarConvite(casoId, email, alvoId){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const aviso = document.getElementById(alvoId);
  try{
    await navigator.clipboard.writeText(textoConvite(c, email));
    if(aviso) aviso.textContent = 'Convite copiado.';
  }catch(e){
    if(aviso) aviso.textContent = 'Não foi possível copiar; use o botão de e-mail.';
  }
  setTimeout(() => { if(aviso) aviso.textContent = ''; }, 4000);
}

/* Argumento de texto para atributos on*="...": vira um literal JS entre aspas simples em que
   aspas, barra, <, >, & e quebras de linha saem como \uXXXX. Assim nenhum dado (id, e-mail,
   nome vindo de perícia compartilhada ou da IA) consegue fechar a string nem o atributo. */
function jsq(v){
  return "'" + String(v ?? '').replace(/[\\'"<>&\n\r\u2028\u2029`$]/g, c => '\\u' + c.charCodeAt(0).toString(16).padStart(4, '0')) + "'";
}
/* Dados que chegam da nuvem passam por aqui antes de virar tela: ids fora do padrão e
   e-mails malformados não entram (eles iriam para atributos e chamadas de função). */
const ID_SEGURO = /^[A-Za-z0-9_-]{1,150}$/;
const EMAIL_SEGURO = /^[^\s@'"<>\\`]+@[^\s@'"<>\\`]+\.[^\s@'"<>\\`]{2,}$/;
function idLimpo(v){
  const s = String(v ?? '');
  return ID_SEGURO.test(s) ? s : (s.replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 150) || 'x');
}
const isoLimpo = v => (typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) ? v : '';
const numLimpo = v => (typeof v === 'number' && isFinite(v)) ? v
  : (typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v.trim())) ? Number(v) : 0;
const textoLimpo = v => (v == null ? '' : (typeof v === 'object' ? '' : String(v)));
const umDe = (v, opcoes, padrao) => opcoes.includes(v) ? v : padrao;
/* Cada campo volta ao tipo esperado: data ISO, número, hora HH:MM ou um valor de lista fechada.
   Assim um campo adulterado por outro membro nunca chega à tela como marcação. */
function limparCaso(c){
  const o = {...c};
  ['dataNomeacao', 'prazoEntrega'].forEach(k => { if(k in o) o[k] = isoLimpo(o[k]); });
  ['honorarios', 'valorRecebido', 'honorariosDepositados', 'valorCausa'].forEach(k => { if(k in o && o[k] != null) o[k] = numLimpo(o[k]); });
  if('statusCaso' in o && typeof STATUS !== 'undefined' && !STATUS[o.statusCaso]) o.statusCaso = Object.keys(STATUS)[0];
  if('statusProcesso' in o && typeof STATUS_PROCESSO !== 'undefined' && o.statusProcesso && !STATUS_PROCESSO[o.statusProcesso]) o.statusProcesso = '';
  ['tarefas', 'compromissos', 'observacoes'].forEach(k => {
    if(Array.isArray(o[k])) o[k] = o[k].filter(x => x && typeof x === 'object').map(x => ({...x, id: idLimpo(x.id)}));
    else if(k in o) o[k] = [];
  });
  if(Array.isArray(o.tarefas)) o.tarefas = o.tarefas.map(t => ({...t, titulo: textoLimpo(t.titulo),
    col: umDe(t.col, ['fazer', 'fazendo', 'feito'], 'fazer'), prio: umDe(t.prio, ['alta', 'media', 'baixa'], 'media'), ate: isoLimpo(t.ate)}));
  if(Array.isArray(o.compromissos)) o.compromissos = o.compromissos.map(e => ({...e, titulo: textoLimpo(e.titulo), local: textoLimpo(e.local),
    data: isoLimpo(e.data), hora: (typeof e.hora === 'string' && /^\d{2}:\d{2}$/.test(e.hora)) ? e.hora : '',
    tipo: umDe(e.tipo, ['diligencia', 'audiencia', 'reuniao', 'outro'], 'outro')}));
  if(Array.isArray(o.observacoes)) o.observacoes = o.observacoes.map(x => ({...x, data: isoLimpo(x.data), texto: textoLimpo(x.texto)}));
  if(o.proposta && typeof o.proposta === 'object') o.proposta = {...o.proposta, adiantamento: Math.max(0, Math.min(100, numLimpo(o.proposta.adiantamento)))};
  ['emails', 'editores'].forEach(k => {
    if(Array.isArray(o[k])) o[k] = o[k].map(e => String(e || '').toLowerCase()).filter(e => EMAIL_SEGURO.test(e));
  });
  if(Array.isArray(o.compartilhamentos)) o.compartilhamentos = o.compartilhamentos.filter(x => x && EMAIL_SEGURO.test(String(x.email || '')))
    .map(x => ({...x, nivel: umDe(x.nivel, ['editar', 'leitura'], 'leitura')}));
  return o;
}

function bytesToBase64(bytes){

function cleanFolderName(folder){
  if(!folder) return null;

function guessDateFromFilename(filename){
  let m;
  if((m = filename.match(/(\d{4})[-_.](\d{2})[-_.](\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = filename.match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/))) return `${m[3]}-${m[2]}-${m[1]}`;
  if((m = filename.match(/(?:^|[^\d])(\d{8})(?:[^\d]|$)/))){
    const s = m[1], y = s.slice(0,4);
    if(y >= '1990' && y <= '2100') return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  }

}
function guessProcessoFromFilename(filename){

  if(m) return m[1];
  m = filename.match(/(?:^|[^\d])(\d{20})(?:[^\d]|$)/);
  if(m){
    const s = m[1];
    return `${s.slice(0,7)}-${s.slice(7,9)}.${s.slice(9,13)}.${s.slice(13,14)}.${s.slice(14,16)}.${s.slice(16,20)}`;

}

/* Só dois tipos de endereço são aceitos para um arquivo anexado: o do Firebase Storage e um
   data: de tipo inofensivo. Qualquer outro (javascript:, http:, data:text/html...) vira vazio,

function arquivoSrc(arquivo){

  if(/^https:\/\/firebasestorage\.googleapis\.com\/v0\/b\/gerenciador-pericias-app\.(firebasestorage\.app|appspot\.com)\/o\/casos%2F[^?#"'<>\s]+\?/.test(u)) return u;
  if(/^data:(application\/(pdf|zip|octet-stream|msword|vnd\.[a-z0-9.+-]+)|image\/(png|jpe?g|gif|webp)|text\/(plain|csv));base64,/i.test(u.slice(0, 120))) return u;

/* Chave de acesso do processo no PROJUDI: letras e números misturados, como "zrrxk42nj8dcwbqmzd".
   Os PDFs também trazem códigos só de números (validação do documento, id da movimentação), que
   não abrem o processo: esses nunca são aceitos como código de acesso. */
function codigoAcessoValido(v){
  const t = String(v || '').trim();
  return /^[A-Za-z0-9]{10,30}$/.test(t) && /[A-Za-z]/.test(t) && /\d/.test(t);
}
function guessCodigoAcessoFromText(text){
  // O PROJUDI diferencia maiúsculas de minúsculas no código: guardar exatamente como veio.
  const re = /(?:c[oó]digo|chave)\s*(?:de|do|da)?\s*acesso(?:\s*(?:ao|do)\s*processo)?\s*[:\-–]?\s*([A-Za-z0-9]{4,40})/gi;
  const t = String(text || '');
  for(const m of t.matchAll(re)){
    if(codigoAcessoValido(m[1])) return m[1];
  }
  /* rótulo com mais palavras no meio ("Código de acesso ao processo (consulta pública): …"):
     procura a chave logo depois de "acesso" */
  for(const m of t.matchAll(/(?:c[oó]digo|chave)[^.]{0,40}?acesso([\s\S]{0,140})/gi)){
    const k = (m[1].match(/\b[A-Za-z0-9]{14,24}\b/g) || []).find(codigoAcessoValido);
    if(k) return k;
  }
  return null;
}

function diasAte(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+'T00:00:00') - new Date(todayIso()+'T00:00:00')) / 86400000);
}
function prazoState(caso){
  const meta = STATUS[caso.statusCaso];
  if(meta && meta.final) return 'ok';
  const diff = diasAte(caso.prazoEntrega);
  if(diff === null) return 'ok';
  if(diff < 0) return 'atrasada';
  if(diff <= 7) return 'proxima';
  return 'ok';
}

let pdfJsReady = false;
function ensurePdfJs(){
  if(typeof pdfjsLib === 'undefined') return false;
  if(!pdfJsReady){
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdfjs-6.4.299/pdf.worker.min.mjs';
      pdfJsReady = true;
    }catch(e){ return false; }
  }
  return true;
}
async function extractPdfInfo(bytes){
  const result = {processo:null, codigoAcesso:null};
  if(!ensurePdfJs()) return result;
  try{
    const doc = await pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported: false, enableXfa: false}).promise;
    let text = '';
    const maxPages = Math.min(doc.numPages, 3);
    for(let i=1; i<=maxPages; i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += ' ' + content.items.map(it => it.str).join(' ');
      if(text.length > 20000) break;
    }
    result.processo = guessProcessoFromFilename(text);
    result.codigoAcesso = guessCodigoAcessoFromText(text);
  }catch(e){ /* PDF sem camada de texto, corrompido ou leitor indisponível */ }
  return result;
}

function matchesQuery(c, q){
  if(!q) return true;

  return hay.includes(q.toLowerCase());
}
function matchesFilter(c, f){
  if(f === 'todas') return true;
  if(f === 'ativas') return !(STATUS[c.statusCaso]||{}).final;
  if(f === 'atrasadas') return prazoState(c) === 'atrasada';
  if(f === 'concluidas') return !!(STATUS[c.statusCaso]||{}).final;
  return true;
}

function visibleCasos(){
  return casosVisiveis()
    .filter(c => matchesFilter(c, activeFilter) && matchesQuery(c, searchQuery))

}
function todosDocumentos(){
  const out = [];
  casosVisiveis().forEach(c => {

/* ---------- registro de erros (todos os usuários logados) ---------- */
const PF_ERROS = {enviados: new Set(), n: 0, fila: []};
function pfRegistrarErro(tipo, msg, origem, pilha){
  try{
    const m = String(msg || '').slice(0, 500);
    if(!m || /ResizeObserver loop|^Script error\.?$/i.test(m)) return;
    const chave = iaHash(m + '|' + String(origem || '').replace(/:\d+:\d+$/, ''));
    if(PF_ERROS.enviados.has(chave) || PF_ERROS.n >= 15) return;
    PF_ERROS.enviados.add(chave); PF_ERROS.n++;
    const doc = {tipo: tipo === 'promessa' ? 'promessa' : 'erro', msg: m, origem: String(origem || '').slice(0, 300), pilha: String(pilha || '').slice(0, 3000),
      secao: /^[a-z]{0,40}$/.test(activeSection || '') ? (activeSection || '') : '', navegador: navigator.userAgent.slice(0, 240), versao: APP_VERSAO,
      email: meuEmail() || '', chave};
    PF_ERROS.fila.push({...doc, quando: new Date().toISOString()});
    if(PF_ERROS.fila.length > 30) PF_ERROS.fila.shift();
    /* id = conta + erro: o mesmo erro da mesma pessoa vira um registro só; o horário é o do servidor */
    if(usingDb && db && currentUser && contaVerificada())
      db.collection('erros').doc(currentUser.uid + '_' + chave).set({...doc, quando: firebase.firestore.FieldValue.serverTimestamp()}).catch(() => {});
  }catch(e){}
}
window.addEventListener('error', e => { if(e && e.message) pfRegistrarErro('erro', e.message, (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0), e.error && e.error.stack); });
window.addEventListener('unhandledrejection', e => { const r = e && e.reason; pfRegistrarErro('promessa', (r && (r.message || r.code)) || String(r), '', r && r.stack); });

/* ==========================================================================
   Agente comercial (só administradores)
   Lista de contatos (peritos a convidar), mensagens prontas com o nome de
   quem envia, fila de envio pelo Gmail de quem está logado (um e-mail por
   pessoa, sem cópia oculta), lembrete depois de 7 dias, descadastro

   Os contatos ficam na coleção `comercial` e as contas criadas por convite
   em `conversoes`; as duas só os administradores leem (regras do Firestore).
   ========================================================================== */
const COM_STATUS = {
  novo:      {rot: 'Novo',          pill: 'pill-muted'},
  convidado: {rot: 'Convidado',     pill: 'pill-accent'},
  lembrado:  {rot: 'Lembrado',      pill: 'pill-accent'},

  cliente:   {rot: 'Cliente',       pill: 'pill-success'},
  nao:       {rot: 'Não quer',      pill: 'pill-danger'},
};
const COM_MODELOS = {
  convite: {nome: 'Convite', assunto: 'Uma ferramenta para organizar as suas perícias',

Passando para saber se conseguiu conhecer o Gerenciador de Perícia. Ele importa os autos do PROJUDI, avisa dos prazos e revisa os documentos com IA.

Estou usando um sistema que montei para as perícias: puxa os autos do PROJUDI, avisa dos prazos e confere os cálculos com IA. Achei que pode te ajudar também.

Me fala o que achou.

{remetente}`},
};
const COM = {contatos: null, conversoes: [], carregando: false, falha: '', filtro: 'todos', busca: '', modelo: 'convite', assunto: '', corpo: '', porDia: 20, iaRodando: false, importAviso: '', previa: null};
const comEmailOk = e => /^[^\s@'"<>\\`,;]+@[^\s@'"<>\\`,;]+\.[^\s@'"<>\\`,;]{2,}$/.test(e);
function comId(email){ return iaHash('com|' + email); }
function comConvite(email){ return iaHash('conv|' + email).slice(1).padStart(6, '0'); }
function comLinkBase(){ return location.origin + location.pathname.replace(/index\.html$/, ''); }
function comLink(c){ return comLinkBase() + '?convite=' + c.convite; }
function comRemetente(){
  const f = fichaDe(meuEmail()) || {};
  return {nome: f.nomeCompleto || membroDe(meuEmail()).nome || 'Equipe do Gerenciador de Perícia', cidade: f.cidadeUf || ''};
}
function comPreencher(texto, c){
  const r = comRemetente();
  const primeiro = String(c.nome || '').trim().split(/\s+/)[0] || 'colega';
  return String(texto)
    .replace(/\{nome\}/g, primeiro)
    .replace(/\{cidade\}/g, c.cidade || '')
    .replace(/\{remetente\}/g, r.nome)
    .replace(/\{link\}/g, comLink(c));
}
function comMensagemAtual(){
  const m = COM_MODELOS[COM.modelo] || COM_MODELOS.convite;
  return {assunto: COM.assunto || m.assunto, corpo: COM.corpo || m.corpo};
}
function comEscolherModelo(id){ COM.modelo = COM_MODELOS[id] ? id : 'convite'; COM.assunto = ''; COM.corpo = ''; renderAll(); }

/* ---------- dados ---------- */
async function comCarregar(){
  if(COM.carregando || !souAdmin()) return;
  COM.carregando = true; COM.falha = '';
  try{
    if(usingDb && db){
      const [cs, cv] = await Promise.all([db.collection('comercial').get(), db.collection('conversoes').get().catch(() => ({docs: []}))]);
      COM.contatos = cs.docs.map(d => ({...d.data(), id: d.id}));
      COM.conversoes = cv.docs.map(d => ({...d.data(), uid: d.id}));
      /* quem criou conta pelo link (ou com o mesmo e-mail) vira "Criou conta" sozinho */
      const porConvite = new Map(COM.conversoes.map(x => [String(x.convite), x]));
      const porEmail = new Map(COM.conversoes.map(x => [String(x.email || '').toLowerCase(), x]));
      for(const c of COM.contatos){
        if(['conta', 'cliente', 'nao'].includes(c.status)) continue;
        if(porConvite.has(c.convite) || porEmail.has(c.email)) await comSalvar(c, {status: 'conta', contaEm: new Date().toISOString()}, true);
      }
    } else {
      COM.contatos = JSON.parse(localStorage.getItem('pf_comercial') || '[]');
    }
  }catch(e){
    COM.contatos = COM.contatos || [];
    COM.falha = 'A lista de contatos fica na nuvem e abre quando as regras novas do Firestore estiverem publicadas e você tiver entrado com a conta Google.';
  }finally{
    COM.carregando = false;
    renderAll();
  }
}
async function comSalvar(c, patch, semRender){
  Object.assign(c, patch);
  if(usingDb && db){
    const {id, ...dados} = c;
    try{ await db.collection('comercial').doc(id).set(dados, {merge: true}); }
    catch(e){ pfAviso('Não foi possível salvar o contato agora.'); }
  } else {
    try{ localStorage.setItem('pf_comercial', JSON.stringify(COM.contatos)); }catch(e){}
  }
  if(!semRender) renderAll();
}
async function comImportar(){
  const caixa = document.getElementById('comImport');
  const texto = (caixa && caixa.value) || '';
  const existentes = new Set((COM.contatos || []).map(c => c.email));
  let novos = 0, repetidos = 0, invalidos = 0;
  for(const linha of texto.split(/\r?\n/)){
    const t = linha.trim();
    if(!t) continue;
    const m = t.match(/[^\s@<>;,"']+@[^\s@<>;,"']+\.[^\s@<>;,"']{2,}/);
    if(!m){ invalidos++; continue; }
    const email = m[0].toLowerCase();
    if(!comEmailOk(email)){ invalidos++; continue; }
    if(existentes.has(email)){ repetidos++; continue; }
    const resto = t.replace(m[0], '').split(/[;,\t]/).map(x => x.replace(/[<>"]/g, '').trim()).filter(Boolean);
    const c = {id: comId(email), email, nome: (resto[0] || '').slice(0, 80), cidade: (resto[1] || '').slice(0, 60), origem: (resto[2] || 'lista').slice(0, 60),
      status: 'novo', convite: comConvite(email), criadoEm: new Date().toISOString(), notas: ''};
    COM.contatos = [...(COM.contatos || []), c];
    existentes.add(email);
    await comSalvar(c, {}, true);
    novos++;
  }
  COM.importAviso = `${novos} contato${novos === 1 ? '' : 's'} novo${novos === 1 ? '' : 's'}` + (repetidos ? ` · ${repetidos} já estava${repetidos === 1 ? '' : 'm'} na lista` : '') + (invalidos ? ` · ${invalidos} linha${invalidos === 1 ? '' : 's'} sem e-mail válido` : '');
  if(caixa) caixa.value = '';
  renderAll();
}
async function comMudarStatus(id, status){
  const c = (COM.contatos || []).find(x => x.id === id);
  if(!c || !COM_STATUS[status]) return;
  await comSalvar(c, {status});
}
async function comRemover(id){
  const c = (COM.contatos || []).find(x => x.id === id);
  if(!c) return;
  COM.contatos = COM.contatos.filter(x => x.id !== id);
  if(usingDb && db){ try{ await db.collection('comercial').doc(id).delete(); }catch(e){} }
  else { try{ localStorage.setItem('pf_comercial', JSON.stringify(COM.contatos)); }catch(e){} }
  renderAll();
}
function comFila(){
  const hoje = Date.now();
  const lista = (COM.contatos || []);
  const novos = lista.filter(c => c.status === 'novo');
  const lembrar = lista.filter(c => c.status === 'convidado' && c.enviadoEm && hoje - new Date(c.enviadoEm).getTime() > 7 * 864e5);
  return {novos, lembrar};
}
function comEnviadosHoje(){
  const hoje = todayIso();
  return (COM.contatos || []).filter(c => String(c.enviadoEm || '').slice(0, 10) === hoje || String(c.lembradoEm || '').slice(0, 10) === hoje).length;
}
/* Abre o Gmail com a mensagem pronta para UMA pessoa; quem envia é o administrador. */
async function comEnviar(id, via){
  const c = (COM.contatos || []).find(x => x.id === id);
  if(!c || c.status === 'nao') return;
  const lembrete = c.status === 'convidado';
  const base = lembrete ? COM_MODELOS.lembrete : null;
  const msg = base ? {assunto: base.assunto, corpo: base.corpo} : comMensagemAtual();
  const assunto = comPreencher(msg.assunto, c);
  const corpo = comPreencher(msg.corpo, c);
  const url = via === 'mailto'
    ? `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`
    : `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(c.email)}&su=${encodeURIComponent(assunto)}&body=${encodeURIComponent(corpo)}`;
  if(via === 'mailto') location.href = url; else window.open(url, '_blank', 'noopener');
  await comSalvar(c, lembrete ? {status: 'lembrado', lembradoEm: new Date().toISOString()} : {status: 'convidado', enviadoEm: new Date().toISOString()});
}
function comProximo(){
  const {novos, lembrar} = comFila();
  if(comEnviadosHoje() >= COM.porDia){ pfAviso(`Limite de ${COM.porDia} por dia atingido. Amanhã a fila continua.`); return; }
  const c = lembrar[0] || novos[0];
  if(!c){ pfAviso('Ninguém na fila agora.'); return; }
  comEnviar(c.id, 'gmail');
}
function comExportar(){
  const linhas = [['email', 'nome', 'cidade', 'status', 'convite', 'link', 'enviado_em'].join(';')];
  (COM.contatos || []).forEach(c => linhas.push([c.email, c.nome, c.cidade, (COM_STATUS[c.status] || {}).rot || c.status, c.convite, comLink(c), c.enviadoEm || ''].map(v => String(v || '').replace(/[;\r\n]/g, ' ')).join(';')));
  const blob = new Blob(['﻿' + linhas.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `contatos-comerciais-${todayIso()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
/* Reescreve a mensagem com a IA (chave do próprio administrador). */
async function comVariarComIA(tom){
  if(iaProvedor() === 'conta'){ pfAviso('Com "Minha conta de IA", copie o texto e peça a variação no seu chat.'); return; }
  if(!iaChave()){ pfAviso(`Guarde a sua chave do ${IA_PROVEDORES[iaProvedor()].curto} na Revisão IA para usar este botão.`); return; }
  const atual = comMensagemAtual();
  COM.iaRodando = true; renderAll();
  try{
    const prompt = `Reescreva o e-mail comercial abaixo, em português do Brasil, com tom ${tom}. Público: peritos judiciais contábeis. Regras: no máximo 140 palavras; não invente números, clientes, depoimentos nem promessas; mantenha exatamente as marcações {nome}, {link} e {remetente}; mantenha a última linha sobre responder "remover" quando ela existir. Responda só em JSON com os campos "assunto" e "corpo".\n\nASSUNTO: ${atual.assunto}\n\nCORPO:\n${atual.corpo}`;
    const out = await iaPedirJson(prompt, {type: 'OBJECT', properties: {assunto: {type: 'STRING'}, corpo: {type: 'STRING'}}, required: ['assunto', 'corpo']});
    if(!out.corpo || !String(out.corpo).includes('{link}')) throw new Error('a resposta veio sem o link do convite');
    COM.assunto = String(out.assunto || atual.assunto).slice(0, 160);
    COM.corpo = String(out.corpo).slice(0, 3000);
  }catch(e){ pfAviso('A IA não conseguiu reescrever agora: ' + e.message); }
  finally{ COM.iaRodando = false; renderAll(); }
}

(function guardarConvite(){
  try{
    const u = new URL(location.href);
    const cv = u.searchParams.get('convite');
    if(cv && /^[a-z0-9]{4,16}$/.test(cv)){
      localStorage.setItem('pf_convite', cv);
      u.searchParams.delete('convite');
      history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + u.hash);
    }
  }catch(e){}
})();

/* ==========================================================================
   Tooltip dos gráficos
   ========================================================================== */
const tooltipEl = () => document.getElementById('tooltip');
function showTip(evt, html){
  const t = tooltipEl();
  t.innerHTML = html;
  t.style.opacity = '1';
  moveTip(evt);
}
function moveTip(evt){
  const t = tooltipEl();
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const r = t.getBoundingClientRect();
  if(x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if(y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function hideTip(){ tooltipEl().style.opacity = '0'; }

function chartHonorarios(base){
  const visiveis = casos.filter(temAcesso);
  const donos = [...new Set(visiveis.map(donoDe))];
  const linhas = donos.map(email => {
    const list = visiveis.filter(c => donoDe(c) === email);
    const recebido = list.reduce((s,c) => s + (c.valorRecebido||0), 0);
    const aReceber = list.reduce((s,c) => s + Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)), 0);
    return {nome: membroDe(email).nome, recebido, aReceber, total: recebido + aReceber};
  }).filter(l => l.total > 0).sort((a,b) => b.total - a.total);

  if(linhas.length === 0) return `<div class="chart-empty">Nenhum honorário lançado ainda.</div>`;
  const max = Math.max(...linhas.map(l => l.total));

  return `
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s1)"></span>Recebido</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s2)"></span>A receber</span>
    </div>
    ${linhas.map(l => {
      const wR = max ? (l.recebido / max) * 100 : 0;
      const wA = max ? (l.aReceber / max) * 100 : 0;
      return `
      <div class="bar-row">
        <span class="bar-label">${escapeHtml(l.nome)}</span>
        <span class="bar-track">
          <span class="bar">
            ${l.recebido > 0 ? `<span class="bar-seg" style="width:${wR}%; background:var(--s1)"
              onmousemove="showTip(event, 'Recebido<br><span class=\\'tt-v\\'>${fmtMoney(l.recebido)}</span>')" onmouseleave="hideTip()"></span>` : ''}
            ${l.aReceber > 0 ? `<span class="bar-seg" style="width:${wA}%; background:var(--s2)"
              onmousemove="showTip(event, 'A receber<br><span class=\\'tt-v\\'>${fmtMoney(l.aReceber)}</span>')" onmouseleave="hideTip()"></span>` : ''}
          </span>
          <span class="bar-value">${fmtMoney(l.total)}</span>
        </span>
      </div>`;
    }).join('')}`;
}

function chartStatus(base){
  const counts = Object.entries(STATUS).map(([key, meta]) => ({
    key, label: meta.label, ramp: meta.ramp,
    n: base.filter(c => c.statusCaso === key).length
  }));
  const total = counts.reduce((s,c) => s + c.n, 0);
  if(total === 0) return `<div class="chart-empty">Nenhuma perícia cadastrada para este perito.</div>`;
  const max = Math.max(...counts.map(c => c.n));
  return counts.map(c => `
    <div class="bar-row">
      <span class="bar-label">${c.label}</span>
      <span class="bar-track">
        <span class="bar">
          ${c.n > 0 ? `<span class="bar-seg" style="width:${(c.n/max)*100}%; background:${c.ramp}"
            onmousemove="showTip(event, '${c.label}<br><span class=\\'tt-v\\'>${c.n} de ${total}</span>')" onmouseleave="hideTip()"></span>` : ''}
        </span>
        <span class="bar-value">${c.n}</span>
      </span>
    </div>`).join('');
}

        <div class="search">
          ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
          <input id="searchInput" type="text" value="${escapeHtml(searchQuery)}" placeholder="Buscar por código, nome, processo, comarca ou partes" oninput="onSearch()">
        </div>
        <div class="chips">
          ${chips.map(([k,label]) => `<button class="chip ${activeFilter===k?'active':''}" onclick="setFilter(${jsq(k)})">${label}</button>`).join('')}
        </div>
      </div>
      ${resumo}
      ${items.length === 0
        ? `<div class="empty-state"><h3>Nenhuma perícia aqui</h3><p>${activeVisao==='compartilhadas' ? 'Ninguém compartilhou uma perícia com você ainda.' : 'Ajuste os filtros ou crie uma nova perícia.'}</p></div>`
        : `<div class="list">${items.map(c => cardCaso(c)).join('')}</div>`}
    </div>`;
}

function resumoBusca(){
  const matches = casosVisiveis().filter(c => matchesQuery(c, searchQuery));
  if(matches.length === 0){
    return panel('resumo', 'Resumo da busca', `"${escapeHtml(searchQuery)}"`,
      `<div class="chart-empty">Nenhuma perícia encontrada para "${escapeHtml(searchQuery)}".</div>`);
  }
  const totalHonorarios = matches.reduce((s,c)=>s+(c.honorarios||0),0);
  const totalAReceber = matches.reduce((s,c)=>s+Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)),0);
  const atrasadasN = matches.filter(c=>prazoState(c)==='atrasada').length;
  return panel('resumo', 'Resumo da busca', `"${escapeHtml(searchQuery)}"`, `
      <div class="kv-grid">
        <div class="kv"><div class="k">Encontradas</div><div class="v num">${matches.length}</div></div>
        <div class="kv"><div class="k">Honorários (total)</div><div class="v num">${fmtMoney(totalHonorarios)}</div></div>
        <div class="kv"><div class="k">A receber</div><div class="v num">${fmtMoney(totalAReceber)}</div></div>
        <div class="kv"><div class="k">Com prazo atrasado</div><div class="v num">${atrasadasN}</div></div>
      </div>`);
}

function cardCaso(c){
  const st = prazoState(c);
  const saldo = Math.max(0,(c.honorarios||0)-(c.valorRecebido||0));
  return `
    <div class="case" onclick="openDrawer(${jsq(c.id)})">
      <span class="case-code">${escapeHtml(c.codigo)}</span>
      <div class="case-title">
        <div class="case-name">${escapeHtml(c.nome)}</div>
        <div class="case-meta">${escapeHtml(c.partes)} · ${escapeHtml(c.comarca)}${c.statusProcesso && STATUS_PROCESSO[c.statusProcesso] ? ' · '+STATUS_PROCESSO[c.statusProcesso].label : ''}</div>
      </div>
      <div class="case-prazo ${st}">
        <div class="lbl">Prazo</div>
        <div class="d">${fmtDate(c.prazoEntrega)}</div>
      </div>
      <div class="case-right">
        <span class="pill ${STATUS[c.statusCaso].pill}">${STATUS[c.statusCaso].label}${st==='atrasada' ? ' · atrasada' : ''}</span>
        <span class="case-valor">${saldo>0 ? fmtMoney(saldo)+' a receber' : 'pago'}</span>
      </div>
    </div>`;
}

function setFilter(f){ activeFilter = f; renderAll(); }
function onSearch(){
  const el = document.getElementById('searchInput');
  searchQuery = el.value.trim();
  const pos = el.selectionStart;
  renderAll();
  const novo = document.getElementById('searchInput');
  if(novo){ novo.focus(); try{ novo.setSelectionRange(pos,pos); }catch(e){} }
}

/* ==========================================================================
   Seção: agenda de prazos
   ========================================================================== */
function rowPrazo(c){
  const dias = diasAte(c.prazoEntrega);
  const st = prazoState(c);
  const cls = st === 'atrasada' ? 'late' : (st === 'proxima' ? 'soon' : '');
  let quando;
  if(dias === null) quando = '';
  else if(dias < 0) quando = `${Math.abs(dias)} dia${Math.abs(dias)===1?'':'s'} em atraso`;
  else if(dias === 0) quando = 'vence hoje';
  else quando = `em ${dias} dia${dias===1?'':'s'}`;
  return `
    <div class="row-item" onclick="openDrawer(${jsq(c.id)})">
      <div class="row-main">
        <div class="row-title">${escapeHtml(c.nome)}</div>
        <div class="row-sub"><span class="mono">${escapeHtml(c.codigo)}</span> · ${escapeHtml(c.partes)} · ${escapeHtml(c.vara||'vara não informada')}</div>
      </div>
      <div class="row-side">
        <span class="pill ${STATUS[c.statusCaso].pill}">${STATUS[c.statusCaso].label}</span>
        <span class="row-date ${cls}" title="${quando}">${fmtDate(c.prazoEntrega)}</span>
      </div>
    </div>`;
}

function renderPrazos(){
  const base = casosVisiveis().filter(c => c.prazoEntrega);
  const pend = base.filter(c => !STATUS[c.statusCaso].final).sort((a,b) => a.prazoEntrega.localeCompare(b.prazoEntrega));
  const concl = base.filter(c => STATUS[c.statusCaso].final).sort((a,b) => b.prazoEntrega.localeCompare(a.prazoEntrega));

  const grupos = [
    {titulo:'Atrasados', teste: c => diasAte(c.prazoEntrega) < 0, vazio:'Nenhum prazo vencido.'},
    {titulo:'Próximos sete dias', teste: c => { const d = diasAte(c.prazoEntrega); return d >= 0 && d <= 7; }, vazio:'Nada vencendo nesta semana.'},
    {titulo:'Próximos trinta dias', teste: c => { const d = diasAte(c.prazoEntrega); return d > 7 && d <= 30; }, vazio:'Nada no mês.'},
    {titulo:'Mais adiante', teste: c => diasAte(c.prazoEntrega) > 30, vazio:'Nada agendado.'},
  ];

  const blocos = grupos.map((g, i) => {
    const items = pend.filter(g.teste);
    return panel('prazo'+i, g.titulo, `${items.length} perícia${items.length===1?'':'s'}`,
      items.length
        ? `<div class="rows">${items.map(rowPrazo).join('')}</div>`
        : `<div class="chart-empty">${g.vazio}</div>`);
  }).join('');

  const concluido = concl.length
    ? panel('prazoFim', 'Encerradas', `${concl.length} perícia${concl.length===1?'':'s'}`,
        `<div class="rows">${concl.map(rowPrazo).join('')}</div>`)
    : '';

  return `<div class="section-gap">${panel('alertas', 'Alertas de prazo', 'quando e por onde avisar', renderAlertasPainel())}${blocos}${concluido}</div>`;
}

/* ==========================================================================
   Seção: documentos
   ========================================================================== */
/* Documentos: escolhe o processo à esquerda e procura os autos dele à direita, por tópico,
   por texto ou na linha do tempo. Os documentos de cada perícia são lidos uma vez da nuvem. */
const DOC_TOPICOS = [
  {id:'nomeacao',   rot:'Nomeação e intimações', re:/nomea|intimacao do perito|designa|aceite|ciencia/},
  {id:'quesitos',   rot:'Quesitos',              re:/quesito/},
  {id:'laudos',     rot:'Laudos e pareceres',    re:/laudo|parecer|esclarec/},
  {id:'honorarios', rot:'Honorários e pagamentos', re:/honorar|pagamento|alvara|deposito|guia|comprovante|levantamento/},
  {id:'decisoes',   rot:'Decisões e despachos',  re:/decis|senten|despacho|acordao|ato ordinatorio/},
  {id:'peticoes',   rot:'Petições',              re:/petic|manifest|contestac|impugna|inicial|replica|recurso|embargo/},
  {id:'comunicacoes', rot:'E-mails, ofícios e certidões', re:/e-?mail|oficio|carta|mandado|certid|intimac|aviso|online/},
  {id:'provas',     rot:'Provas e documentos',   re:/procura|contrato|extrato|planilha|calculo|nota fiscal|balanc|demonstra|holerite|recibo|documento/},
];
const DOC_TOPICO_OUTROS = {id:'outros', rot:'Outros'};
const DOCS_OK = new Set();          // perícias cujos documentos já foram lidos da nuvem
const DOCS_LENDO = new Set();
let docCasoSel = null, docTopico = 'todos', docAgrupar = 'data', docProcQuery = '';
try{ docCasoSel = localStorage.getItem('pf_doc_caso') || null; docAgrupar = localStorage.getItem('pf_doc_agrupar') || 'data'; }catch(e){}

function docTopicoDe(d){
  const campos = [d.nome, d.tipo, d.movimentacao, d.fase].map(x => normalizeText(String(x || '')));
  for(const campo of campos){
    if(!campo) continue;
    const t = DOC_TOPICOS.find(t => t.re.test(campo));
    if(t) return t;
  }
  return DOC_TOPICO_OUTROS;
}
function docNomeLimpo(nome){
  let s = String(nome || '').replace(/\.(pdf|html?|docx?|xlsx?|zip|p7s|jpe?g|png|txt)$/i, '');
  s = s.replace(/^\d{4}[-_.]\d{2}[-_.]\d{2}[\s_-]*/, '').replace(/^\d{1,4}\s*-\s*/, '');
  s = s.replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim();
  s = s.replace(/^email de tjgo\s*/i, 'E-mail do TJGO · ');
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : String(nome || 'Documento');
}
function docExt(nome){ const m = String(nome || '').match(/\.([a-z0-9]{2,4})$/i); return m ? m[1].toUpperCase() : 'ARQ'; }
function casoNomeCurto(c){
  const partes = String(c.nome || '').split('->').map(x => x.trim()).filter(Boolean);
  const n = (partes.length ? partes[partes.length - 1] : c.nome || '').replace(/^\d+\s*-\s*/, '');
  return n || c.codigo || 'Perícia';
}
async function docsGarantir(c){
  if(!c || !usingDb || !db || DOCS_OK.has(c.id) || DOCS_LENDO.has(c.id)) return;
  DOCS_LENDO.add(c.id);
  try{
    const snap = await db.collection('casos').doc(c.id).collection('documentos').get();
    c.documentos = snap.docs.filter(d => ID_SEGURO.test(d.id)).map(d => limparDocumento({...d.data(), id: d.id}));
  }catch(e){ /* sem permissão ou sem rede: fica o que já havia */ }
  finally{
    DOCS_OK.add(c.id);   /* não tenta de novo em laço; o painel da perícia continua atualizando */
    DOCS_LENDO.delete(c.id);
    if(activeSection === 'docs') docsRedesenhar();
  }
}
/* lê os documentos das perícias aos poucos, para contar e buscar em todas */
async function docsPreCarregar(){
  if(!usingDb || !db) return;
  const fila = casosVisiveis().filter(c => !DOCS_OK.has(c.id)).slice(0, 60);
  const trabalhar = async () => { while(fila.length){ await docsGarantir(fila.shift()); } };
  await Promise.all([trabalhar(), trabalhar(), trabalhar()]);
}
function docsRedesenhar(){
  const foco = document.activeElement;
  const id = foco && foco.id;
  const pos = foco && typeof foco.selectionStart === 'number' ? foco.selectionStart : null;
  const view = document.getElementById('view');
  if(view) view.innerHTML = renderDocs();
  if(id){ const n = document.getElementById(id); if(n){ n.focus(); if(pos !== null) try{ n.setSelectionRange(pos, pos); }catch(e){} } }
}
function docsDoCaso(c){ return [...(c.documentos || [])].sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')) || String(b.nome || '').localeCompare(String(a.nome || ''))); }
function docsCarregado(c){ return !usingDb || DOCS_OK.has(c.id); }
function docMarcar(textoEscapado, q){
  if(!q || q.length < 2) return textoEscapado;
  const alvo = escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return textoEscapado.replace(new RegExp(alvo, 'gi'), m => `<mark>${m}</mark>`);
}
function docMesRotulo(iso){
  if(!iso) return 'Sem data';
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  if(isNaN(d)) return 'Sem data';
  const r = d.toLocaleDateString('pt-BR', {month: 'long', year: 'numeric'});
  return r.charAt(0).toUpperCase() + r.slice(1);
}

function renderDocs(){
  const lista = casosVisiveis();
  if(!lista.length) return `<div class="empty-state"><h3>Nenhuma perícia ainda</h3><p>Os documentos aparecem aqui quando uma perícia tiver autos importados do PROJUDI ou anexados.</p></div>`;
  setTimeout(docsPreCarregar, 0);
  let c = lista.find(x => x.id === docCasoSel);
  if(!c){
    c = [...lista].sort((a, b) => (b.documentos || []).length - (a.documentos || []).length)[0];
    docCasoSel = c.id;
  }
  if(!docsCarregado(c)) setTimeout(() => docsGarantir(c), 0);

  /* ---------- coluna dos processos ---------- */
  const qp = normalizeText(docProcQuery);
  const procs = lista.filter(x => !qp
      || normalizeText(`${x.codigo} ${x.nome} ${x.numeroProcesso} ${x.partes || ''} ${x.comarca || ''}`).includes(qp)
      || (qp.length >= 3 && (x.documentos || []).some(d => normalizeText(d.nome).includes(qp))))
    .sort((a, b) => String(b.dataNomeacao || '').localeCompare(String(a.dataNomeacao || '')));
  const colunaProcessos = `
    <aside class="dc-procs" aria-label="Processos">
      <div class="search dc-busca-proc">
        ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
        <input id="docProcBusca" type="search" value="${escapeHtml(docProcQuery)}" placeholder="Processo, perícia ou documento" aria-label="Buscar processo" oninput="docProcQuery = this.value; docsRedesenhar();">
      </div>
      <div class="dc-procs-lista" role="listbox">
        ${procs.length ? procs.map(x => {
          const n = (x.documentos || []).length;
          const conta = docsCarregado(x) ? `${n} doc${n === 1 ? '' : 's'}` : (DOCS_LENDO.has(x.id) ? '…' : '');
          return `<button class="dc-proc ${x.id === c.id ? 'sel' : ''}" role="option" aria-selected="${x.id === c.id}" onclick="docEscolherCaso(${jsq(x.id)})">
            <span class="dc-proc-top"><span class="mono">${escapeHtml(x.codigo || '')}</span><span class="dc-proc-n">${conta}</span></span>
            <span class="dc-proc-nome">${escapeHtml(casoNomeCurto(x))}</span>
            <span class="dc-proc-num mono">${escapeHtml(x.numeroProcesso || 'sem número')}</span>
          </button>`;
        }).join('') : '<div class="chart-empty">Nenhum processo encontrado.</div>'}
      </div>
    </aside>`;

  /* ---------- documentos do processo escolhido ---------- */
  const todos = docsDoCaso(c);
  const comTopico = todos.map(d => ({d, t: docTopicoDe(d)}));
  const contagem = {};
  comTopico.forEach(({t}) => { contagem[t.id] = (contagem[t.id] || 0) + 1; });
  const topicosVisiveis = [...DOC_TOPICOS, DOC_TOPICO_OUTROS].filter(t => contagem[t.id]);
  if(docTopico !== 'todos' && !contagem[docTopico]) docTopico = 'todos';
  const q = normalizeText(docQuery);
  const filtrados = comTopico.filter(({d, t}) => (docTopico === 'todos' || t.id === docTopico)
    && (!q || normalizeText(`${d.nome} ${d.tipo || ''} ${d.fase || ''} ${d.movimentacao || ''} ${d.obs || ''}`).includes(q)));

  const chave = ({d, t}) => docAgrupar === 'fase' ? (d.fase || 'Sem fase identificada') : docAgrupar === 'topico' ? t.rot : docMesRotulo(d.data);
  const grupos = new Map();
  filtrados.forEach(x => { const k = chave(x); if(!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(x); });

  const linha = ({d, t}) => `
    <div class="dc-doc" role="button" tabindex="0" onclick="abrirDocumento(${jsq(c.id)},${jsq(d.id)})" onkeydown="if(event.key==='Enter'){abrirDocumento(${jsq(c.id)},${jsq(d.id)})}">
      <span class="dc-ext dc-ext-${escapeHtml(docExt(d.nome).toLowerCase())}">${escapeHtml(docExt(d.nome))}</span>
      <span class="dc-doc-txt">
        <span class="dc-doc-nome" title="${escapeHtml(d.nome || '')}">${docMarcar(escapeHtml(docNomeLimpo(d.nome)), docQuery)}</span>
        <span class="dc-doc-sub">${escapeHtml(t.rot)}${docAgrupar !== 'fase' && d.fase ? ' · ' + docMarcar(escapeHtml(cleanFolderName(d.fase) || d.fase), docQuery) : ''}${d.tamanho ? ' · ' + fmtBytes(d.tamanho) : ''}${d.arquivo ? '' : ' · sem arquivo'}</span>
      </span>
      <span class="dc-doc-data mono">${fmtDate(d.data)}</span>
    </div>`;

  const lendo = !docsCarregado(c);
  const corpo = lendo
    ? marcaCarregando('Abrindo os documentos deste processo…')
    : !todos.length
      ? `<div class="empty-state dc-vazio"><h3>Nenhum documento neste processo</h3><p>Traga os autos do PROJUDI pela perícia ou anexe arquivos.</p>
           <button class="btn btn-primary btn-sm" onclick="openDrawer(${jsq(c.id)})">Abrir a perícia</button></div>`
      : !filtrados.length
        ? `<div class="chart-empty">Nada encontrado${docQuery ? ` para "${escapeHtml(docQuery)}"` : ''}${docTopico !== 'todos' ? ' neste tópico' : ''}. <a href="#" onclick="docQuery=''; docTopico='todos'; docsRedesenhar(); return false;">Limpar filtros</a></div>`
        : [...grupos.entries()].map(([k, itens]) => `
            <section class="dc-grupo">
              <h4 class="dc-grupo-tit"><span>${escapeHtml(k)}</span><i>${itens.length}</i></h4>
              <div class="dc-docs">${itens.map(linha).join('')}</div>
            </section>`).join('');

  const ultimo = todos[0];
  const detalhe = `
    <div class="dc-det">
      <div class="dc-cab">
        <div class="dc-cab-txt">
          <div class="dc-cab-cod"><span class="mono">${escapeHtml(c.codigo || '')}</span>${c.comarca ? ' · ' + escapeHtml(c.comarca) : ''}</div>
          <h3 class="dc-cab-nome">${escapeHtml(casoNomeCurto(c))}</h3>
          <div class="dc-cab-num mono">${escapeHtml(c.numeroProcesso || 'sem número de processo')}</div>
        </div>
        <div class="dc-cab-acoes">
          <button class="btn btn-ghost btn-sm" onclick="openDrawer(${jsq(c.id)})">Abrir perícia</button>
          ${podeEditar(c) ? `<button class="btn btn-primary btn-sm" onclick="openDrawer(${jsq(c.id)}); pjBaixarAutos(${jsq(c.id)});">${svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/>')} Baixar autos novos</button>` : ''}
        </div>
      </div>
      <div class="dc-resumo">
        <span><b>${todos.length}</b> documento${todos.length === 1 ? '' : 's'}</span>
        ${ultimo ? `<span>último em <b>${fmtDate(ultimo.data)}</b></span>` : ''}
        <span><b>${topicosVisiveis.length}</b> tópico${topicosVisiveis.length === 1 ? '' : 's'}</span>
      </div>
      <div class="dc-ferramentas">
        <div class="search dc-busca-doc">
          ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
          <input id="docSearch" type="search" value="${escapeHtml(docQuery)}" placeholder="Buscar neste processo" aria-label="Buscar documento neste processo" oninput="docQuery = this.value; docsRedesenhar();">
        </div>
        <div class="dc-agrupar" role="group" aria-label="Agrupar por">
          ${[['data', 'Data'], ['topico', 'Tópico'], ['fase', 'Movimentação']].map(([k, r]) => `<button class="${docAgrupar === k ? 'sel' : ''}" aria-pressed="${docAgrupar === k}" onclick="docMudarAgrupar(${jsq(k)})">${r}</button>`).join('')}
        </div>
      </div>
      ${todos.length ? `<div class="chips dc-topicos" role="tablist" aria-label="Tópicos">
        <button class="chip ${docTopico === 'todos' ? 'active' : ''}" onclick="docTopico='todos'; docsRedesenhar();">Todos <span class="chip-num">${todos.length}</span></button>
        ${topicosVisiveis.map(t => `<button class="chip ${docTopico === t.id ? 'active' : ''}" onclick="docTopico=${jsq(t.id)}; docsRedesenhar();">${escapeHtml(t.rot)} <span class="chip-num">${contagem[t.id]}</span></button>`).join('')}
      </div>` : ''}
      <div class="dc-lista">${corpo}</div>
    </div>`;

  setTimeout(() => {   /* deixa o processo escolhido à vista na lista (no celular ela corre para o lado) */
    const l = document.querySelector('.dc-procs-lista'), sel = l && l.querySelector('.dc-proc.sel');
    if(!sel) return;
    if(l.scrollWidth > l.clientWidth + 4){ if(sel.offsetLeft < l.scrollLeft || sel.offsetLeft + sel.offsetWidth > l.scrollLeft + l.clientWidth) l.scrollLeft = sel.offsetLeft - 8; }
    else if(sel.offsetTop < l.scrollTop || sel.offsetTop + sel.offsetHeight > l.scrollTop + l.clientHeight) l.scrollTop = sel.offsetTop - 8;
  }, 0);
  return `<div class="dc">${colunaProcessos}${detalhe}</div>`;
}
function docEscolherCaso(id){
  docCasoSel = id; docTopico = 'todos'; docQuery = '';
  try{ localStorage.setItem('pf_doc_caso', id); }catch(e){}
  docsRedesenhar();
  const det = document.querySelector('.dc-det');
  if(det && window.innerWidth < 960) det.scrollIntoView({behavior: 'smooth', block: 'start'});
}
function docMudarAgrupar(k){
  docAgrupar = k;
  try{ localStorage.setItem('pf_doc_agrupar', k); }catch(e){}
  docsRedesenhar();
}
function abrirDocumento(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && (c.documentos||[]).find(x => x.id === docId);
  if(d && d.arquivo){ openViewer(casoId, docId); return; }
  openDrawer(casoId);
}

/* ==========================================================================
   Seção: Projudi
   ========================================================================== */
function renderProjudi(){
  const configurado = !!PROJUDI_ENDPOINT;
  const corpoConsulta = `
        ${configurado ? '' : `
          <div class="banner" style="margin-bottom:14px;">
            ${svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>')}
            <span>A consulta ainda não foi publicada. Falta subir a função no Firebase e informar o endereço dela aqui — o restante do app já está preparado.</span>
          </div>`}
        <div class="consulta-form">
          <input id="projudiNumero" type="text" placeholder="0000000-00.0000" value="" ${configurado ? '' : 'disabled'}>
          <button class="btn btn-primary" onclick="consultarProjudi()" ${configurado ? '' : 'disabled'}>
            ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')} Consultar

   Seção: cálculos periciais

let calcAba = 'financiamento';
let calcSaida = {};   // html do último resultado por aba
let calcDados = {};   // dados estruturados do último resultado (CSV, anexo, cópia)

/* aceita 1.234,56 · 1234,56 · 1234.56 */
function num(v){
  if(typeof v === 'number') return v;
  let s = String(v ?? '').trim().replace(/\s|R\$/g, '');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const brl = n => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n, casas) => (isFinite(n) ? n*100 : 0).toLocaleString('pt-BR', {minimumFractionDigits:casas??4, maximumFractionDigits:casas??4}) + '%';

/* ---------- sistemas de amortização ---------- */
function tabelaPrice(pv, i, n){
  const linhas = [];
  const pmt = i === 0 ? pv/n : pv * i / (1 - Math.pow(1+i, -n));
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let amort = pmt - juros, parcela = pmt;
    if(k === n){ amort = saldo; parcela = amort + juros; }   // fecha o saldo no último mês
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
function tabelaSac(pv, i, n){
  const linhas = [], amortFixa = pv/n;
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let amort = (k === n) ? saldo : amortFixa;
    const parcela = amort + juros;
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
function tabelaSam(pv, i, n){
  const p = tabelaPrice(pv, i, n), s = tabelaSac(pv, i, n);
  const linhas = [];
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let parcela = (p[k-1].parcela + s[k-1].parcela) / 2;
    let amort = parcela - juros;
    if(k === n){ amort = saldo; parcela = amort + juros; }
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
const SISTEMAS = {price:{nome:'Price', fn:tabelaPrice}, sac:{nome:'SAC', fn:tabelaSac}, sam:{nome:'Misto (SAM)', fn:tabelaSam}};

/* ---------- valor presente, VPL e TIR ---------- */
function vpl(taxa, fluxo){ return fluxo.reduce((s,v,k) => s + v/Math.pow(1+taxa, k), 0); }
function tir(fluxo){
  let lo = -0.9999, hi = 10, flo = vpl(lo, fluxo);
  if(!isFinite(flo) || flo * vpl(hi, fluxo) > 0) return null;
  for(let it=0; it<300; it++){
    const mid = (lo+hi)/2, f = vpl(mid, fluxo);
    if(flo * f <= 0){ hi = mid; } else { lo = mid; flo = f; }
  }
  return (lo+hi)/2;
}

/* ---------- datas ---------- */
function dataBr(iso){ return iso ? iso.split('-').reverse().join('/') : ''; }
function mesesEntre(ini, fim){
  const a = new Date(ini+'T00:00:00'), b = new Date(fim+'T00:00:00');
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return Math.max(0, m);
}
function diasEntre(ini, fim){
  return Math.round((new Date(fim+'T00:00:00') - new Date(ini+'T00:00:00')) / 86400000);
}

/* ---------- consulta de índice no Banco Central ---------- */
async function buscarIndice(cod, dataIni, dataFim){
  const url = `https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados?formato=json`
            + `&dataInicial=${dataBr(dataIni)}&dataFinal=${dataBr(dataFim)}`;
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('O Banco Central respondeu com status ' + r.status);
  const j = await r.json();
  if(!Array.isArray(j) || j.length === 0) throw new Error('A série não retornou valores para esse período.');
  return j.map(x => ({data:x.data, valor: parseFloat(String(x.valor).replace(',', '.'))}));
}

/* ==========================================================================
   Cálculos: entrega dos resultados (planilha, cópia, anexo na perícia)
   ========================================================================== */
function csvDe(aba){
  const d = calcDados[aba];
  if(!d) return '';
  const linhas = [d.titulo, ''];
  (d.parametros||[]).forEach(([k,v]) => linhas.push(`${k};${v}`));
  linhas.push('');
  linhas.push(d.colunas.join(';'));
  d.linhas.forEach(l => linhas.push(l.join(';')));
  if(d.totais){ linhas.push(d.totais.join(';')); }
  linhas.push('');
  linhas.push('Gerado pelo Gerenciador de Pericias em ' + new Date().toLocaleString('pt-BR'));
  if(d.fonte) linhas.push(d.fonte);
  return linhas.join('\n');
}
function nomeArquivoCalc(aba){
  const d = calcDados[aba];
  const base = (d && d.titulo ? d.titulo : 'calculo').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase();
  return base.slice(0,60) + '_' + todayIso() + '.csv';
}
function exportarCSV(aba){
  const csv = csvDe(aba);
  if(!csv) return;
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivoCalc(aba);
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  avisoCalc('Planilha baixada.');
}
async function copiarLaudo(aba){
  const d = calcDados[aba];
  if(!d) return;
  const cab = `<tr>${d.colunas.map(c=>`<th>${escapeHtml(c)}</th>`).join('')}</tr>`;
  const corpo = d.linhas.map(l => `<tr>${l.map(c=>`<td>${escapeHtml(String(c))}</td>`).join('')}</tr>`).join('');
  const rodape = d.totais ? `<tr>${d.totais.map(c=>`<td><b>${escapeHtml(String(c))}</b></td>`).join('')}</tr>` : '';
  const html = `<p><b>${escapeHtml(d.titulo)}</b></p><table border="1" cellspacing="0" cellpadding="4">${cab}${corpo}${rodape}</table>`;
  const texto = [d.titulo, d.colunas.join('\t'), ...d.linhas.map(l=>l.join('\t')), d.totais ? d.totais.join('\t') : ''].filter(Boolean).join('\n');
  try{
    if(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([texto], {type:'text/plain'}),
      })]);
    } else {
      await navigator.clipboard.writeText(texto);
    }
    avisoCalc('Tabela copiada. É só colar no laudo.');
  }catch(e){
    avisoCalc('Não foi possível copiar. Use a exportação em planilha.');
  }
}

/* ==========================================================================
   Cálculo 1 — financiamento (Price, SAC e Misto)
   ========================================================================== */
function rodarFinanciamento(){
  const pv = num(document.getElementById('fPv').value);
  const prazo = Math.round(num(document.getElementById('fPrazo').value));
  const taxaInf = num(document.getElementById('fTaxa').value) / 100;
  const periodo = document.getElementById('fPeriodo').value;
  const sistema = document.getElementById('fSistema').value;
  const saida = document.getElementById('calcSaidaBox');

  if(pv <= 0 || prazo <= 0){
    saida.innerHTML = bannerAviso('Informe o valor financiado e o prazo em meses.');
    return;
  }
  if(prazo > 600){
    saida.innerHTML = bannerAviso('O prazo máximo aceito é de 600 meses.');
    return;
  }
  // taxa anual vira mensal equivalente (capitalização composta)
  const i = periodo === 'ano' ? Math.pow(1 + taxaInf, 1/12) - 1 : taxaInf;

  const linhas = SISTEMAS[sistema].fn(pv, i, prazo);
  const totalJuros = linhas.reduce((s,l)=>s+l.juros, 0);
  const totalPago = linhas.reduce((s,l)=>s+l.parcela, 0);

  const comparativo = Object.entries(SISTEMAS).map(([k, s]) => {
    const t = s.fn(pv, i, prazo);
    return {chave:k, nome:s.nome, juros:t.reduce((a,l)=>a+l.juros,0), total:t.reduce((a,l)=>a+l.parcela,0), primeira:t[0].parcela, ultima:t[t.length-1].parcela};
  });
  const maxTotal = Math.max(...comparativo.map(c=>c.total));

  const colunas = ['Parcela','Prestação (R$)','Juros (R$)','Amortização (R$)','Saldo devedor (R$)'];
  const linhasCsv = linhas.map(l => [l.k, brl(l.parcela), brl(l.juros), brl(l.amort), brl(l.saldo)]);
  const totais = ['Total', brl(totalPago), brl(totalJuros), brl(pv), '0,00'];

  calcDados.financiamento = {
    titulo: `Financiamento pelo sistema ${SISTEMAS[sistema].nome}`,
    parametros: [
      ['Valor financiado (R$)', brl(pv)],
      ['Prazo (meses)', prazo],
      ['Taxa informada', num(document.getElementById('fTaxa').value).toLocaleString('pt-BR') + '% ao ' + (periodo === 'ano' ? 'ano' : 'mês')],
      ['Taxa mensal equivalente', pct(i)],
      ['Sistema', SISTEMAS[sistema].nome],
    ],
    colunas, linhas: linhasCsv, totais,
    resumo: `${SISTEMAS[sistema].nome} — ${prazo}x, juros totais de R$ ${brl(totalJuros)} sobre R$ ${brl(pv)} financiados.`,
  };

  saida.innerHTML = `
    <div class="resumo-calc">
      <div class="resumo-item destaque"><div class="k">1ª prestação</div><div class="v">R$ ${brl(linhas[0].parcela)}</div></div>
      <div class="resumo-item"><div class="k">Última prestação</div><div class="v">R$ ${brl(linhas[linhas.length-1].parcela)}</div></div>
      <div class="resumo-item"><div class="k">Total de juros</div><div class="v">R$ ${brl(totalJuros)}</div></div>
      <div class="resumo-item"><div class="k">Total pago</div><div class="v">R$ ${brl(totalPago)}</div></div>
      <div class="resumo-item"><div class="k">Taxa mensal</div><div class="v">${pct(i)}</div></div>
    </div>

    <h4 style="font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 10px;">Composição do total pago em cada sistema</h4>
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s1)"></span>Amortização (principal)</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s2)"></span>Juros</span>
    </div>
    ${comparativo.map(c => `
      <div class="bar-row">
        <span class="bar-label" ${c.chave===sistema?'style="color:var(--accent-deep); font-weight:600;" title="sistema selecionado"':''}>${c.nome}</span>
        <span class="bar-track">
          <span class="bar">
            <span class="bar-seg" style="width:${(pv/maxTotal)*100}%; background:var(--s1)"
              onmousemove="showTip(event, 'Principal<br><span class=\\'tt-v\\'>R$ ${brl(pv)}</span>')" onmouseleave="hideTip()"></span>
            <span class="bar-seg" style="width:${(c.juros/maxTotal)*100}%; background:var(--s2)"
              onmousemove="showTip(event, 'Juros<br><span class=\\'tt-v\\'>R$ ${brl(c.juros)}</span>')" onmouseleave="hideTip()"></span>
          </span>
          <span class="bar-value">R$ ${brl(c.total)}</span>
        </span>
      </div>`).join('')}
    <div class="calc-nota">
      Os três sistemas usam a mesma taxa mensal. O SAC começa com prestação maior e paga menos juros no total;
      o Price mantém a prestação fixa; o Misto fica na média aritmética entre os dois.
    </div>

    ${tabelaHtml(colunas, linhasCsv, totais)}
    <div class="calc-nota">A última prestação absorve o arredondamento, de modo que o saldo devedor encerre exatamente em zero.</div>
    ${blocoAcoes('financiamento')}`;
  calcSaida.financiamento = saida.innerHTML;
}

/* ==========================================================================
   Cálculo 2 — atualização de débito (correção + juros + multa)
   ========================================================================== */
async function rodarAtualizacao(){
  const principal = num(document.getElementById('aValor').value);
  const di = document.getElementById('aInicio').value;
  const df = document.getElementById('aFim').value;
  const chave = document.getElementById('aIndice').value;
  const jurosMes = num(document.getElementById('aJuros').value) / 100;
  const tipoJuros = document.getElementById('aTipoJuros').value;
  const multa = num(document.getElementById('aMulta').value) / 100;
  const baseMulta = document.getElementById('aBaseMulta').value;
  const saida = document.getElementById('calcSaidaBox');

  if(principal <= 0 || !di || !df){ saida.innerHTML = bannerAviso('Informe o valor, a data inicial e a data final.'); return; }
  if(di >= df){ saida.innerHTML = bannerAviso('A data final precisa ser posterior à inicial.'); return; }

  saida.innerHTML = `<div class="chart-empty">Consultando a série do Banco Central...</div>`;
  let serie;
  try{
    serie = await buscarIndice(INDICES[chave].cod, di, df);
  }catch(e){
    saida.innerHTML = bannerAviso('Não foi possível obter o índice agora: ' + escapeHtml(e.message));
    return;
  }

  let fator = 1;
  const linhasTab = [];
  serie.forEach(p => {
    fator *= (1 + p.valor/100);
    linhasTab.push([p.data, p.valor.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:4}), fator.toFixed(8).replace('.', ','), brl(principal * fator)]);
  });

  const corrigido = principal * fator;
  const meses = mesesEntre(di, df);
  const ehSelic = chave === 'selic';
  const jurosAplicados = ehSelic ? 0 : (tipoJuros === 'composto'
    ? corrigido * (Math.pow(1 + jurosMes, meses) - 1)
    : corrigido * jurosMes * meses);
  const subtotal = corrigido + jurosAplicados;
  const valorMulta = multa * (baseMulta === 'corrigido' ? corrigido : subtotal);
  const total = subtotal + valorMulta;

  const colunas = ['Competência','Índice (%)','Fator acumulado','Valor corrigido (R$)'];
