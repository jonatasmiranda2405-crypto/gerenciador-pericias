  calcDados.atualizacao = {
    titulo: `Atualização de débito por ${INDICES[chave].nome}`,
    parametros: [
      ['Valor original (R$)', brl(principal)],
      ['Período', `${dataBr(di)} a ${dataBr(df)}`],
      ['Índice', INDICES[chave].nome],
      ['Fator de correção', fator.toFixed(8).replace('.', ',')],
      ['Valor corrigido (R$)', brl(corrigido)],
      ['Juros de mora', ehSelic ? 'não aplicados (Selic já engloba juros)' : `${(jurosMes*100).toLocaleString('pt-BR')}% ao mês, ${tipoJuros}, por ${meses} meses`],
      ['Juros (R$)', brl(jurosAplicados)],
      ['Multa (R$)', brl(valorMulta)],
      ['Total apurado (R$)', brl(total)],
    ],
    colunas, linhas: linhasTab, totais,
    fonte: `Fonte: Banco Central do Brasil, serie SGS ${INDICES[chave].cod}, consultada em ${new Date().toLocaleDateString('pt-BR')}.`,
    resumo: `R$ ${brl(principal)} atualizado por ${INDICES[chave].nome} de ${dataBr(di)} a ${dataBr(df)} resulta em R$ ${brl(total)}.`,
  };

  saida.innerHTML = `
    ${ehSelic ? bannerInfo('A Selic acumulada já embute juros de mora, então os juros informados não foram aplicados — evita a contagem em duplicidade.') : ''}
    <div class="resumo-calc">
      <div class="resumo-item"><div class="k">Valor original</div><div class="v">R$ ${brl(principal)}</div></div>
      <div class="resumo-item"><div class="k">Correção</div><div class="v">R$ ${brl(corrigido - principal)}</div></div>
      <div class="resumo-item"><div class="k">Juros de mora</div><div class="v">R$ ${brl(jurosAplicados)}</div></div>
      <div class="resumo-item"><div class="k">Multa</div><div class="v">R$ ${brl(valorMulta)}</div></div>
      <div class="resumo-item destaque"><div class="k">Total apurado</div><div class="v">R$ ${brl(total)}</div></div>
    </div>
    <div class="calc-nota">
      Fator de correção acumulado no período: <b>${fator.toFixed(8).replace('.', ',')}</b> em ${serie.length} competências.
      Fonte: Banco Central do Brasil, série SGS ${INDICES[chave].cod}, consultada agora.
    </div>
    ${tabelaHtml(colunas, linhasTab, totais)}
    ${blocoAcoes('atualizacao')}`;
  calcSaida.atualizacao = saida.innerHTML;
}

/* ==========================================================================
   Cálculo 3 — verbas rescisórias
   ========================================================================== */
function rodarRescisao(){
  const salario = num(document.getElementById('rSalario').value);
  const adm = document.getElementById('rAdmissao').value;
  const dem = document.getElementById('rDemissao').value;
  const motivo = document.getElementById('rMotivo').value;
  const aviso = document.getElementById('rAviso').value;
  const feriasVencidas = Math.round(num(document.getElementById('rFeriasVenc').value));
  const saldoFgts = num(document.getElementById('rFgts').value);
  const saida = document.getElementById('calcSaidaBox');

  if(salario <= 0 || !adm || !dem){ saida.innerHTML = bannerAviso('Informe o salário, a data de admissão e a de demissão.'); return; }
  if(adm >= dem){ saida.innerHTML = bannerAviso('A data de demissão precisa ser posterior à admissão.'); return; }

  const dDem = new Date(dem+'T00:00:00');
  const anosCompletos = Math.floor(mesesEntre(adm, dem) / 12);

  // direitos conforme o motivo da rescisão
  const temAviso = (motivo === 'sem_justa_causa') && aviso === 'indenizado';
  const temDecimo = motivo !== 'justa_causa';
  const temFeriasProp = motivo !== 'justa_causa';
  const temMulta = (motivo === 'sem_justa_causa');
  const descontaAviso = (motivo === 'pedido' && aviso === 'nao_cumprido');

  // saldo de salário: dias trabalhados no mês da rescisão
  const diasSaldo = dDem.getDate();
  const saldoSalario = salario / 30 * diasSaldo;

  // aviso prévio: 30 dias + 3 por ano completo, limitado a 90 (Lei 12.506/2011)
  const diasAviso = Math.min(90, 30 + 3 * anosCompletos);
  const valorAviso = temAviso ? salario / 30 * diasAviso : 0;
  const descontoAviso = descontaAviso ? salario : 0;

  // a projeção do aviso indenizado integra o tempo de serviço
  const fimProjetado = new Date(dDem);
  if(temAviso) fimProjetado.setDate(fimProjetado.getDate() + diasAviso);
  const isoProjetado = fimProjetado.toISOString().slice(0,10);

  // 13º proporcional: avos no ano, contando mês com 15 dias ou mais
  const inicioAno = isoProjetado.slice(0,4) + '-01-01';
  const baseDecimo = adm > inicioAno ? adm : inicioAno;
  let avosDecimo = 0;
  if(temDecimo){
    avosDecimo = mesesEntre(baseDecimo, isoProjetado);
    const resto = diasEntre(baseDecimo, isoProjetado) - avosDecimo*30;
    if(resto >= 15) avosDecimo++;
    avosDecimo = Math.min(12, Math.max(0, avosDecimo));
  }
  const decimo = salario / 12 * avosDecimo;

  // férias proporcionais: avos desde o último período aquisitivo completo
  let avosFerias = 0;
  if(temFeriasProp){
    const mesesTotais = mesesEntre(adm, isoProjetado);
    avosFerias = mesesTotais % 12;
    const aniversario = new Date(adm+'T00:00:00');
    aniversario.setMonth(aniversario.getMonth() + (mesesTotais - avosFerias));
    const resto = diasEntre(aniversario.toISOString().slice(0,10), isoProjetado) - avosFerias*30;
    if(resto >= 15) avosFerias++;
    avosFerias = Math.min(12, Math.max(0, avosFerias));
  }
  const feriasProp = salario / 12 * avosFerias;
  const tercoProp = feriasProp / 3;
  const feriasVenc = salario * feriasVencidas;
  const tercoVenc = feriasVenc / 3;

  // FGTS do mês e multa rescisória
  const fgtsSobreVerbas = 0.08 * (saldoSalario + valorAviso + decimo);
  const baseMulta = saldoFgts + fgtsSobreVerbas;
  const multaFgts = temMulta ? 0.40 * baseMulta : 0;

  const itens = [
    ['Saldo de salário', `${diasSaldo} dia(s)`, saldoSalario],
    ['Aviso prévio indenizado', temAviso ? `${diasAviso} dia(s)` : 'não devido', valorAviso],
    ['13º salário proporcional', `${avosDecimo}/12`, decimo],
    ['Férias proporcionais', `${avosFerias}/12`, feriasProp],
    ['Um terço sobre férias proporcionais', '', tercoProp],
    ['Férias vencidas', feriasVencidas ? `${feriasVencidas} período(s)` : 'nenhuma', feriasVenc],
    ['Um terço sobre férias vencidas', '', tercoVenc],
    ['FGTS incidente sobre as verbas', '8%', fgtsSobreVerbas],
    ['Multa rescisória do FGTS', temMulta ? '40% sobre R$ '+brl(baseMulta) : 'não devida', multaFgts],
  ];
  if(descontoAviso > 0) itens.push(['Desconto de aviso prévio não cumprido', '', -descontoAviso]);

  const total = itens.reduce((s, it) => s + it[2], 0);
  const colunas = ['Verba','Base','Valor (R$)'];
  const linhasCsv = itens.map(it => [it[0], it[1], brl(it[2])]);
  const totais = ['Total bruto', '', brl(total)];

  const MOTIVOS = {sem_justa_causa:'Dispensa sem justa causa', pedido:'Pedido de demissão', justa_causa:'Dispensa por justa causa', termino:'Término de contrato por prazo determinado'};

  calcDados.rescisao = {
    titulo: 'Verbas rescisórias',
    parametros: [
      ['Salário (R$)', brl(salario)],
      ['Admissão', dataBr(adm)],
      ['Demissão', dataBr(dem)],
      ['Motivo', MOTIVOS[motivo]],
      ['Tempo de serviço', `${anosCompletos} ano(s), ${mesesEntre(adm,dem)} meses`],
      ['Projeção do aviso até', temAviso ? dataBr(isoProjetado) : 'não aplicável'],
    ],
    colunas, linhas: linhasCsv, totais,
    resumo: `${MOTIVOS[motivo]} — total bruto de R$ ${brl(total)}.`,
  };

  saida.innerHTML = `
    <div class="resumo-calc">
      <div class="resumo-item"><div class="k">Tempo de serviço</div><div class="v">${anosCompletos}a ${mesesEntre(adm,dem)%12}m</div></div>
      <div class="resumo-item"><div class="k">Verbas salariais</div><div class="v">R$ ${brl(saldoSalario + valorAviso + decimo)}</div></div>
      <div class="resumo-item"><div class="k">Férias e terço</div><div class="v">R$ ${brl(feriasProp+tercoProp+feriasVenc+tercoVenc)}</div></div>
      <div class="resumo-item"><div class="k">FGTS e multa</div><div class="v">R$ ${brl(fgtsSobreVerbas+multaFgts)}</div></div>
      <div class="resumo-item destaque"><div class="k">Total bruto</div><div class="v">R$ ${brl(total)}</div></div>
    </div>
    ${tabelaHtml(colunas, linhasCsv, totais)}
    <div class="calc-nota">
      Valores <b>brutos</b>: não estão deduzidos INSS, imposto de renda nem descontos contratuais, que dependem das tabelas
      vigentes na competência. O aviso prévio segue a Lei 12.506/2011 — trinta dias, mais três por ano completo, limitado a noventa.
      Quando indenizado, a projeção integra o tempo de serviço e repercute no 13º e nas férias.
    </div>
    ${blocoAcoes('rescisao')}`;
  calcSaida.rescisao = saida.innerHTML;
}

/* ==========================================================================
   Cálculo 4 — taxas, anatocismo e viabilidade
   ========================================================================== */
function rodarTaxas(){
  const modo = document.getElementById('tModo').value;
  const saida = document.getElementById('calcSaidaBox');

  if(modo === 'equivalencia'){
    const taxa = num(document.getElementById('tTaxa').value)/100;
    const de = document.getElementById('tDe').value;
    const para = document.getElementById('tPara').value;
    const PER = {dia:1, mes:30, trimestre:90, semestre:180, ano:360};
    const expo = PER[para]/PER[de];
    const equivalente = Math.pow(1+taxa, expo) - 1;
    const proporcional = taxa * expo;
    const colunas = ['Critério','Taxa resultante','Diferença sobre R$ 100.000'];
    const linhas = [
      ['Equivalência composta (juros sobre juros)', pct(equivalente), 'R$ '+brl(100000*equivalente)],
      ['Proporcionalidade simples (linear)', pct(proporcional), 'R$ '+brl(100000*proporcional)],
      ['Diferença', pct(equivalente-proporcional), 'R$ '+brl(100000*(equivalente-proporcional))],
    ];
    calcDados.taxas = {
      titulo:'Equivalência de taxas',
      parametros:[['Taxa informada', pct(taxa)],['Período de origem', de],['Período de destino', para]],
      colunas, linhas, totais:null,
      resumo:`${pct(taxa)} ao ${de} equivale a ${pct(equivalente)} ao ${para}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item destaque"><div class="k">Taxa equivalente</div><div class="v">${pct(equivalente)}</div></div>
        <div class="resumo-item"><div class="k">Taxa proporcional</div><div class="v">${pct(proporcional)}</div></div>
        <div class="resumo-item"><div class="k">Diferença</div><div class="v">${pct(equivalente-proporcional)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas)}
      <div class="calc-nota">
        A conversão proporcional divide a taxa linearmente e é o critério dos juros simples; a equivalente preserva o
        montante sob capitalização composta. A distância entre as duas é justamente o ponto discutido nas ações revisionais.
      </div>
      ${blocoAcoes('taxas')}`;

  } else if(modo === 'anatocismo'){
    const capital = num(document.getElementById('tCapital').value);
    const taxa = num(document.getElementById('tTaxaMes').value)/100;
    const n = Math.round(num(document.getElementById('tMeses').value));
    if(capital <= 0 || n <= 0){ saida.innerHTML = bannerAviso('Informe o capital e o número de meses.'); return; }
    if(n > 600){ saida.innerHTML = bannerAviso('O prazo máximo aceito é de 600 meses.'); return; }
    const linhas = [];
    for(let k=1; k<=n; k++){
      const simples = capital * (1 + taxa*k);
      const composto = capital * Math.pow(1+taxa, k);
      linhas.push([k, brl(simples), brl(composto), brl(composto-simples)]);
    }
    const mSimples = capital*(1+taxa*n), mComposto = capital*Math.pow(1+taxa,n);
    const colunas = ['Mês','Montante simples (R$)','Montante composto (R$)','Diferença (R$)'];
    calcDados.taxas = {
      titulo:'Juros simples comparados a juros compostos',
      parametros:[['Capital (R$)', brl(capital)],['Taxa mensal', pct(taxa)],['Prazo (meses)', n]],
      colunas, linhas, totais:['Final', brl(mSimples), brl(mComposto), brl(mComposto-mSimples)],
      resumo:`Em ${n} meses a ${pct(taxa)} ao mês, a capitalização composta supera a simples em R$ ${brl(mComposto-mSimples)}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item"><div class="k">Montante simples</div><div class="v">R$ ${brl(mSimples)}</div></div>
        <div class="resumo-item"><div class="k">Montante composto</div><div class="v">R$ ${brl(mComposto)}</div></div>
        <div class="resumo-item destaque"><div class="k">Diferença</div><div class="v">R$ ${brl(mComposto-mSimples)}</div></div>
        <div class="resumo-item"><div class="k">Excesso relativo</div><div class="v">${pct((mComposto-mSimples)/mSimples, 2)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas, calcDados.taxas.totais)}
      <div class="calc-nota">A diferença mês a mês é exatamente o efeito da capitalização de juros sobre juros no período.</div>
      ${blocoAcoes('taxas')}`;

  } else {
    const fluxoTxt = document.getElementById('tFluxo').value;
    const taxaDesc = num(document.getElementById('tDesconto').value)/100;
    const fluxo = fluxoTxt.split(/[;,\n\s]+/).map(s=>s.trim()).filter(Boolean).map(num);
    if(fluxo.length < 2){ saida.innerHTML = bannerAviso('Informe ao menos dois valores no fluxo, começando pelo investimento como negativo.'); return; }
    const valorPresente = vpl(taxaDesc, fluxo);
    const taxaInterna = tir(fluxo);
    const colunas = ['Período','Fluxo (R$)','Fator de desconto','Valor presente (R$)'];
    const linhas = fluxo.map((v,k) => {
      const fator = 1/Math.pow(1+taxaDesc, k);
      return [k, brl(v), fator.toFixed(8).replace('.', ','), brl(v*fator)];
    });
    calcDados.taxas = {
      titulo:'Valor presente líquido e taxa interna de retorno',
      parametros:[['Taxa de desconto', pct(taxaDesc)],['Períodos', fluxo.length-1]],
      colunas, linhas, totais:['VPL','','', brl(valorPresente)],
      resumo:`VPL de R$ ${brl(valorPresente)} à taxa de ${pct(taxaDesc)}${taxaInterna!==null?`, com TIR de ${pct(taxaInterna)}`:''}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item destaque"><div class="k">VPL</div><div class="v">R$ ${brl(valorPresente)}</div></div>
        <div class="resumo-item"><div class="k">TIR por período</div><div class="v">${taxaInterna!==null?pct(taxaInterna):'não converge'}</div></div>
        <div class="resumo-item"><div class="k">Taxa de desconto</div><div class="v">${pct(taxaDesc)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas, calcDados.taxas.totais)}
      <div class="calc-nota">
        Serve tanto para apuração de haveres e avaliação de fluxo quanto para o Custo Efetivo Total de um financiamento:
        nesse caso, informe o valor liberado como positivo no período zero e as prestações como negativas.
        ${taxaInterna!==null ? `A TIR encontrada, de ${pct(taxaInterna)} por período, equivale a ${pct(Math.pow(1+taxaInterna,12)-1, 2)} ao ano se o período for mensal.` : 'O fluxo informado não muda de sinal, então não existe TIR.'}
      </div>
      ${blocoAcoes('taxas')}`;
  }
  calcSaida.taxas = saida.innerHTML;
}

/* ---------- número por extenso, em reais ---------- */
const EXT_UNI = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const EXT_DEZ = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const EXT_CEM = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function trecho(n){
  if(n === 0) return '';
  if(n === 100) return 'cem';
  let t = [];
  const c = Math.floor(n/100), d = n % 100;
  if(c) t.push(EXT_CEM[c]);
  if(d){
    if(d < 20) t.push(EXT_UNI[d]);
    else {
      const dz = Math.floor(d/10), un = d % 10;
      t.push(EXT_DEZ[dz] + (un ? ' e ' + EXT_UNI[un] : ''));
    }
  }
  return t.join(' e ');
}
function inteiroExtenso(n){
  if(n === 0) return 'zero';
  const grupos = [];
  let resto = n;
  while(resto > 0){ grupos.push(resto % 1000); resto = Math.floor(resto/1000); }
  const nomes = [['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  const partes = [];
  for(let g = grupos.length-1; g >= 0; g--){
    const v = grupos[g];
    if(v === 0) continue;
    let txt = (g === 1 && v === 1) ? 'mil' : trecho(v);
    if(g > 1) txt += ' ' + (v === 1 ? nomes[g][0] : nomes[g][1]);
    else if(g === 1 && v !== 1) txt += ' mil';
    partes.push({txt, valor:v});
  }
  /* O conectivo "e" entra antes do último grupo quando ele é menor que cem
     ou uma centena exata; nos demais casos a norma pede vírgula.
     Ex.: mil e quinhentos · doze mil, trezentos e quarenta e cinco */
  let saida = '';
  partes.forEach((p, idx) => {
    if(idx === 0){ saida = p.txt; return; }
    const usaE = p.valor < 100 || p.valor % 100 === 0;
    saida += (usaE ? ' e ' : ', ') + p.txt;
  });
  return saida;
}
function porExtenso(valor){
  const inteiro = Math.floor(Math.abs(valor));
  const centavos = Math.round((Math.abs(valor) - inteiro) * 100);
  const partes = [];
  if(inteiro > 0){
    const txt = inteiroExtenso(inteiro);
    /* milhão e bilhão redondos pedem a preposição: "um milhão de reais" */
    const usaDe = /(milhão|milhões|bilhão|bilhões)$/.test(txt);
    partes.push(txt + (usaDe ? ' de reais' : (inteiro === 1 ? ' real' : ' reais')));
  }
  if(centavos > 0) partes.push(inteiroExtenso(centavos) + (centavos === 1 ? ' centavo' : ' centavos'));
  if(partes.length === 0) return 'zero real';
  return partes.join(' e ');
}
/* "setenta e duas horas", "vinte e uma horas" */
function extensoFeminino(n){
  return inteiroExtenso(n).replace(/\bum\b/g, 'uma').replace(/\bdois\b/g, 'duas');
}
function capitalizar(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ==========================================================================
   Reescrita do .docx
   Um parágrafo do Word costuma vir picado em vários <w:t>; por isso o texto é
   lido e reescrito no parágrafo inteiro, mantendo a formatação do primeiro
   trecho e esvaziando os demais.
   ========================================================================== */
function escaparXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function desescaparXml(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                  .replace(/&apos;/g,"'").replace(/&#39;/g,"'").replace(/&amp;/g,'&');
}
function definirTextoParagrafo(par, texto){
  let i = 0;
  const novo = par.replace(/(<w:t)((?:\s[^>]*)?)(>)([\s\S]*?)(<\/w:t>)/g, (m, ini, attrs, fecha, conteudo, fim) => {
    const valor = i === 0 ? escaparXml(texto) : '';
    i++;
    const comEspaco = attrs.includes('xml:space') ? attrs : attrs + ' xml:space="preserve"';
    return ini + comEspaco + fecha + valor + fim;
  });
  return i === 0 ? par : novo;
}
/* Percorre só os parágrafos-folha: é onde o texto realmente mora, inclusive
   dentro das caixas de texto que o Word duplica em <mc:Fallback>. */
function mapearParagrafos(xml, fn){
  const tok = /<w:p(?:\s[^>]*)?>|<\/w:p>/g;
  const pilha = [], trocas = [];
  let m;
  while((m = tok.exec(xml)) !== null){
    if(m[0] === '</w:p>'){
      const ini = pilha.pop();
      if(ini === undefined) continue;
      const fim = m.index + m[0].length;
      const corpo = xml.slice(ini, fim);
      if(/<w:p[\s>]/.test(corpo.slice(1))) continue;
      const texto = (corpo.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>/g) || [])
        .map(t => desescaparXml(t.replace(/^<w:t(?:\s[^>]*)?>/, '').replace(/<\/w:t>$/, ''))).join('');
      const novo = fn(texto, corpo);
      if(novo !== null && novo !== undefined) trocas.push({ini, fim, corpo: definirTextoParagrafo(corpo, novo)});
    } else {
      pilha.push(m.index);
    }
  }
  let saida = xml;
  for(let i = trocas.length - 1; i >= 0; i--){
    saida = saida.slice(0, trocas[i].ini) + trocas[i].corpo + saida.slice(trocas[i].fim);
  }
  return saida;
}
function inicioParagrafoDeCorpo(xml, pos){
  const tok = /<w:p(?:\s[^>]*)?>|<\/w:p>/g;
  let m, prof = 0, inicio = -1;
  while((m = tok.exec(xml)) !== null){
    if(m[0] === '</w:p>'){
      prof--;
      if(prof === 0 && inicio >= 0 && inicio <= pos && pos < m.index + m[0].length) return inicio;
    } else {
      if(prof === 0) inicio = m.index;
      prof++;
    }
  }
  return -1;
}
function paragrafoCentrado(texto, negrito){
  const rpr = '<w:rFonts w:ascii="Calibri"/>' + (negrito ? '<w:b/>' : '') + '<w:sz w:val="24"/>';
  return '<w:p><w:pPr><w:spacing w:before="200"/><w:jc w:val="center"/><w:rPr>' + rpr + '</w:rPr></w:pPr>'
       + '<w:r><w:rPr>' + rpr + '</w:rPr><w:t xml:space="preserve">' + escaparXml(texto) + '</w:t></w:r></w:p>';
}
/* O arquivo de origem traz o carimbo visual de uma assinatura digital já
   aplicada. Ele é retirado e no lugar fica a linha de assinatura em branco —
   o documento novo precisa ser assinado com o certificado do perito. */
function trocarCarimboPorAssinatura(xml, ficha){
  const i = xml.indexOf('Assinado');
  if(i < 0) return xml;
  const corte = inicioParagrafoDeCorpo(xml, i);
  if(corte < 0) return xml;
  /* aproveita a última seção do arquivo (tamanho da página e margens), sem as
     colunas que existiam só para acomodar o carimbo */
  let sect = '';
  const fimBody = xml.lastIndexOf('</w:body>');
  const fimSect = fimBody > 0 ? xml.lastIndexOf('</w:sectPr>', fimBody) : -1;
  const iniSect = fimSect > 0 ? xml.lastIndexOf('<w:sectPr', fimSect) : -1;
  if(iniSect > 0 && iniSect > corte){
    sect = xml.slice(iniSect, fimSect + 11)
              .replace(/<w:type[^>]*\/>/g, '')
              .replace(/<w:cols[\s\S]*?<\/w:cols>/g, '')
              .replace(/<w:cols[^>]*\/>/g, '');
  }
  const assinatura =
      paragrafoCentrado('')
    + paragrafoCentrado('_____________________________________________')
    + paragrafoCentrado(ficha.nomeCompleto || '', true)
    + paragrafoCentrado('Perito-Contador' + (ficha.crcRegistro ? ' — CRC ' + ficha.crcRegistro : ''));
  return xml.slice(0, corte) + assinatura + sect + '</w:body></w:document>';
}
/* O modelo traz uma quebra de seção num parágrafo vazio, herdada da conversão
   do PDF: ela gasta uma folha inteira sem escrever nada. Quando a seção
   seguinte tem o mesmo tamanho de página e as mesmas margens, a quebra sai. */
function juntarSecoesIguais(xml){
  const fimBody = xml.lastIndexOf('</w:body>');
  const iniFinal = fimBody > 0 ? xml.lastIndexOf('<w:sectPr', fimBody) : -1;
  if(iniFinal < 0) return xml;
  const chave = frag => ((frag.match(/<w:pgSz[^>]*\/>/) || [''])[0]) + ((frag.match(/<w:pgMar[^>]*\/>/) || [''])[0]);
  const alvo = chave(xml.slice(iniFinal, fimBody));
  if(!alvo) return xml;
  return xml.replace(/<w:p(?:\s[^>]*)?>(?:(?!<\/w:p>)[\s\S])*?<\/w:p>/g, par => {
    if(!/<w:sectPr/.test(par) || /<w:t[\s>]/.test(par)) return par;
    const sect = (par.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/) || [''])[0];
    if(!sect || /<w:type\s[^>]*w:val="(?!nextPage)/.test(sect)) return par;
    if(chave(sect) !== alvo) return par;
    return par.replace(sect, '');
  });
}
/* Quadro orçamentário: as tarefas são fixas, então só as horas, o total e o
   valor mudam. As linhas são localizadas pelo texto da primeira coluna. */
function preencherQuadro(xml, d){
  const iniTbl = xml.indexOf('<w:tbl>');
  if(iniTbl < 0) return xml;
  const fimTbl = xml.indexOf('</w:tbl>', iniTbl);
  if(fimTbl < 0) return xml;
  const tbl = xml.slice(iniTbl, fimTbl + 8);
  const linhas = tbl.match(/<w:tr(?:\s[^>]*)?>[\s\S]*?<\/w:tr>/g);
  if(!linhas) return xml;
  /* os runs já trazem os espaços; juntar com espaço extra quebraria a busca */
  const textoDe = frag => normalizeText((frag.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>/g) || [])
    .map(t => desescaparXml(t.replace(/^<w:t(?:\s[^>]*)?>/, '').replace(/<\/w:t>$/, ''))).join(''))
    .replace(/\s+/g, ' ').trim();
  const celulasDe = tr => tr.match(/<w:tc>[\s\S]*?<\/w:tc>/g) || [];

  let idxCabecalho = -1, idxTotal = -1, idxValor = -1;
  linhas.forEach((tr, k) => {
    const primeira = textoDe(celulasDe(tr)[0] || '');
    if(idxCabecalho < 0 && /^tarefas a serem executadas/.test(primeira)) idxCabecalho = k;
    if(idxValor < 0 && /^hora t[eé]cnica/.test(primeira)) idxValor = k;
    else if(idxTotal < 0 && /^total de horas/.test(primeira)) idxTotal = k;
  });
  if(idxCabecalho < 0 || idxTotal < 0) return xml;
  const fimTarefas = idxValor > idxCabecalho ? Math.min(idxTotal, idxValor) : idxTotal;

  /* escreve o texto na segunda coluna, preservando a formatação da célula */
  const definirSegundaColuna = (tr, texto) => {
    const cels = celulasDe(tr);
    if(cels.length < 2) return tr;
    const alvo = cels[cels.length - 1];
    let primeiro = true;
    const novoAlvo = mapearParagrafos(alvo, () => {
      if(primeiro){ primeiro = false; return texto; }
      return '';
    });
    return tr.slice(0, tr.lastIndexOf(alvo)) + novoAlvo + tr.slice(tr.lastIndexOf(alvo) + alvo.length);
  };

  let t = 0;
  const novas = linhas.map((tr, k) => {
    if(k > idxCabecalho && k < fimTarefas){
      const valor = t < d.horas.length ? String(d.horas[t]) : '0';
      t++;
      return definirSegundaColuna(tr, valor);
    }
    if(k === idxTotal) return definirSegundaColuna(tr, String(d.totalHoras));
    if(k === idxValor) return definirSegundaColuna(tr, 'R$ ' + brl(d.valor));
    return tr;
  });
  let novoTbl = tbl;
  for(let k = linhas.length - 1; k >= 0; k--){
    if(novas[k] === linhas[k]) continue;
    const pos = novoTbl.lastIndexOf(linhas[k]);
    if(pos < 0) continue;
    novoTbl = novoTbl.slice(0, pos) + novas[k] + novoTbl.slice(pos + linhas[k].length);
  }
  return xml.slice(0, iniTbl) + novoTbl + xml.slice(fimTbl + 8);
}
function dadosDoDocumento(c, r, ficha){
  const horas = r.horas.reduce((s,h) => s + h, 0);
  const valor = horas * r.horaTecnica;
  const pct = Math.min(100, Math.max(0, r.adiantamento));
  const adiantado = valor * pct / 100;
  const hoje = new Date();
  const mes = hoje.toLocaleDateString('pt-BR', {month:'long'}).toLowerCase();   /* "10 de outubro de 2026" */
  const sigla = (ficha.crcRegistro || '').slice(0,2).toUpperCase();
  return {
    horas: r.horas, totalHoras: horas, valor, pct, adiantado, horaTecnica: r.horaTecnica,
    juizo: r.juizo,
    processo: c.numeroProcesso || '',
    acao: r.acao,
    resumo: r.resumo,
    complexidade: r.complexidade,
    requerimento: (r.requerimento || '').trim(),
    qualificacao: [
      ficha.nomeCompleto || '',
      'contador, perito judicial e extrajudicial, especializado em Perícia Contábil',
      ficha.crcEstado ? 'regularmente inscrito no Conselho Regional de Contabilidade de ' + ficha.crcEstado
        + (sigla ? ' – CRC ' + sigla : '') + (ficha.crcRegistro ? ' com registro número ' + ficha.crcRegistro : '') : '',
      ficha.cpf ? 'inscrito no CPF sob o nº ' + ficha.cpf : '',
      'com endereço profissional indicado no rodapé desta, em cumprimento à intimação recebida, a fim de realizar o encargo confiado, '
        + 'vem, mui respeitosamente, apresentar a PROPOSTA DE HONORÁRIOS PERICIAIS na forma que segue:',
    ].filter(Boolean).join(', '),
    paragrafoHora: 'Ressalta-se que o valor da hora técnica empregado nesta proposta levou em consideração os padrões da '
      + (ficha.referenciaHora || 'entidade de classe da categoria') + ', no montante de R$ ' + brl(r.horaTecnica)
      + ' (' + porExtenso(r.horaTecnica) + ');',
    paragrafoHoras: 'Para apresentação do Laudo Pericial e dos elementos que formarão prova no processo, estima-se o quantitativo de '
      + horas + ' (' + capitalizar(extensoFeminino(horas)) + ') horas técnicas, conforme quadro composto pelas respectivas tarefas abaixo:',
    paragrafoAdiantamento: 'Requer-se, o adiantamento de ' + pct + '% (' + inteiroExtenso(Math.round(pct))
      + ' por cento) do valor estipulado para os honorários periciais, correspondente a R$ ' + brl(adiantado)
      + ', ficando o saldo remanescente para pagamento após a entrega do laudo e a prestação dos esclarecimentos necessários, '
      + 'nos termos do art. 465, §4º, do CPC.',
    email: (c && donoDe(c)) || '',
    dataLinha: (ficha.cidadeUf || (c.comarca || 'Goiânia')) + ', ' + String(hoje.getDate()).padStart(2,'0')
      + ' de ' + mes + ' de ' + hoje.getFullYear(),
    ficha,
  };
}
const RE_DATA_LOCAL = /^[^,]{2,60},\s*\d{1,2}\s+de\s+\p{L}+\s+de\s+\d{4}\s*$/u;
function reescreverDocumento(xml, d){
  xml = trocarCarimboPorAssinatura(xml, d.ficha);
  xml = juntarSecoesIguais(xml);
  xml = preencherQuadro(xml, d);
  let jaRequerimento = false;
  return mapearParagrafos(xml, texto => {
    const t = texto.trim();
    if(!t) return null;
    if(/^(AO\s+DOUTO\s+JU[ÍI]ZO|EXCELENT[ÍI]SSIMO\s+SENHOR)/i.test(t)) return d.juizo;
    if(/^PROCESSO\s*:/i.test(t)) return 'PROCESSO: ' + d.processo;
    if(/^A[ÇC][ÃA]O\s*:/i.test(t)) return d.acao;
    if(/regularmente inscrito no Conselho Regional/i.test(t)) return d.qualificacao;
    if(/^O processo trata/i.test(t)) return d.resumo;
    if(/^A realiza[çc][ãa]o do procedimento pericial/i.test(t)) return d.complexidade;
    if(/valor da hora t[ée]cnica empregado/i.test(t)) return d.paragrafoHora;
    if(/estima-se o quantitativo de/i.test(t)) return d.paragrafoHoras;
    if(/^Requer-se,?\s*o adiantamento/i.test(t)) return d.paragrafoAdiantamento;
    if(/^Em aten[çc][ãa]o ao art\.\s*473/i.test(t)){ jaRequerimento = true; return d.requerimento; }
    if(jaRequerimento && /junte aos autos/i.test(t)){ jaRequerimento = false; return ''; }
    if(RE_DATA_LOCAL.test(t)) return d.dataLinha;
    return null;
  });
}
function reescreverRodape(xml, ficha){
  return mapearParagrafos(xml, texto => {
    const t = texto.trim();
    if(/^Tel\.?\s*:/i.test(t) && ficha.telefone) return 'Tel.: ' + ficha.telefone;
    if(/^Endere[çc]o\s*:/i.test(t) && ficha.endereco) return 'Endereço: ' + ficha.endereco;
    return null;
  });
}
async function montarDocx(baseBytes, d, logo){
  const zip = await JSZip.loadAsync(baseBytes);
  const doc = zip.file('word/document.xml');
  if(!doc) throw new Error('documento sem word/document.xml');
  zip.file('word/document.xml', reescreverDocumento(await doc.async('string'), d));
  for(const nome of Object.keys(zip.files)){
    if(/^word\/(header|footer)\d*\.xml$/.test(nome)){
      zip.file(nome, reescreverRodape(await zip.file(nome).async('string'), d.ficha));
    }
  }
  if(logo) await docxInserirLogo(zip, logo);
  return await zip.generateAsync({type:'uint8array'});
}

/* ---------- importação do modelo ---------- */
async function importarModelo(input){
  const f = input.files[0];
  if(!f) return;
  const status = document.getElementById('modeloStatus');
  const bytes = new Uint8Array(await f.arrayBuffer());
  if(bytes.length > 3 * 1024 * 1024){
    status.textContent = 'O modelo passa de 3 MB. Use um arquivo menor.';
    input.value = ''; return;
  }
  if(extOf(f.name) !== 'docx'){
    status.textContent = 'O modelo precisa ser um arquivo .docx do Word.';
    input.value = ''; return;
  }
  modeloProposta = {nome:f.name, ext:'docx', base64:bytesToBase64(bytes), quando:todayIso(), tamanho:bytes.length};
  try{
    localStorage.setItem(LS_MODELO, JSON.stringify(modeloProposta));
  }catch(e){
    status.textContent = 'O modelo foi carregado, mas não coube no armazenamento do navegador — ele vale só para esta sessão.';
  }
  input.value = '';
  renderAll();
}
function removerModelo(){
  modeloProposta = null;
  try{ localStorage.removeItem(LS_MODELO); }catch(e){}
  renderAll();
}

/* ---------- geração ---------- */
async function gerarProposta(anexar){
  if(!temPro()){ setSection('proposta'); return; }
  const status = document.getElementById('propStatus');
  const c = casoDaProposta();
  if(!c || !rascunho){ if(status) status.textContent = 'Escolha a perícia.'; return; }
  const ficha = fichaDe(donoDe(c));
  if(!ficha.nomeCompleto){
    status.textContent = 'Preencha o seu cadastro em Meu perfil (clique no seu nome, no rodapé da barra lateral) antes de gerar.';
    return;
  }
  const d = dadosDoDocumento(c, rascunho, ficha);
  if(d.totalHoras <= 0){ status.textContent = 'Informe as horas de pelo menos uma tarefa.'; return; }
  status.textContent = 'Gerando...';
  let bytes, nomeArq, mime;
  try{
    if(typeof JSZip === 'undefined') throw new Error('leitor de .docx indisponível; recarregue a página');
    const logo = propLogo();
    bytes = modeloProposta
      ? await montarDocx(base64ToBytes(modeloProposta.base64), d, logo && logo.noModelo ? logo : null)
      : await gerarDocxPadrao(d, logo);
    nomeArq = 'proposta_honorarios_' + c.codigo + '.docx';
    mime = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  }catch(e){
    status.textContent = 'Não foi possível reescrever o modelo (' + (e.message || 'erro') + ').';
    return;
  }
  const patch = {proposta: {...rascunho}};
  if(!c.honorarios) patch.honorarios = d.valor;   /* nao mexe num valor que o perito ja anotou */
  await saveCaso(c.id, patch);
  if(anexar){
    const docId = 'd' + Date.now() + Math.random().toString(36).slice(2,6);
    const built = await buildArquivo(c.id, docId, bytes, nomeArq, mime);
    await addDoc(c.id, {
      nome: nomeArq, fase:'Proposta de Honorários', tipo:'Outro', data: todayIso(),
      obs: 'R$ ' + brl(d.valor) + ' — ' + d.totalHoras + ' horas a R$ ' + brl(rascunho.horaTecnica) + '/hora.',
      tamanho: bytes.length, arquivo: built.arquivo, processo: c.numeroProcesso || null, codigoAcesso: null
    }, docId);
    status.textContent = 'Anexado em ' + c.codigo + '.';
    renderNav();
  } else {
    const blob = new Blob([bytes], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nomeArq;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    status.textContent = 'Documento gerado.';
  }
}

   Fica no perfil do perito (perfil.logo), já reduzida e em PNG/JPEG, e entra no

const LOGO_TAMANHOS = {P: {rot: 'Pequena', cm: 1.3}, M: {rot: 'Média', cm: 2}, G: {rot: 'Grande', cm: 2.8}};
const LOGO_POSICOES = {esquerda: {rot: 'Esquerda', jc: 'left'}, centro: {rot: 'Centro', jc: 'center'}, direita: {rot: 'Direita', jc: 'right'}};
const RE_LOGO = /^data:image\/(png|jpeg);base64,[A-Za-z0-9+/=]+$/;
function propLogo(){
  const l = perfil && perfil.logo;
  if(!l || typeof l !== 'object' || !RE_LOGO.test(String(l.dataUrl || ''))) return null;
  return {
    dataUrl: l.dataUrl, nome: String(l.nome || 'logo').slice(0, 80),
    w: Math.max(1, num(l.w) || 1), h: Math.max(1, num(l.h) || 1),
    tamanho: LOGO_TAMANHOS[l.tamanho] ? l.tamanho : 'M',
    posicao: LOGO_POSICOES[l.posicao] ? l.posicao : 'esquerda',
    noModelo: l.noModelo !== false,
  };
}
function logoCarregarImagem(src){
  return new Promise((ok, falha) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => falha(new Error('imagem ilegível')); i.src = src; });
}
/* reduz para no máximo 900 x 360, apara as bordas vazias e grava em PNG (ou JPEG, se ficar grande) */
async function logoNormalizar(blob){
  const url = URL.createObjectURL(blob);
  try{
    const img = await logoCarregarImagem(url);
    let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h) throw new Error('imagem sem tamanho');
    const esc = Math.min(1, 900 / w, 360 / h);
    w = Math.max(1, Math.round(w * esc)); h = Math.max(1, Math.round(h * esc));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    /* apara margens transparentes ou brancas */
    const px = ctx.getImageData(0, 0, w, h).data;
    const vazio = i => px[i + 3] < 12 || (px[i] > 248 && px[i + 1] > 248 && px[i + 2] > 248);
    let x0 = w, y0 = h, x1 = -1, y1 = -1;
    for(let y = 0; y < h; y++) for(let x = 0; x < w; x++){
      if(!vazio((y * w + x) * 4)){ if(x < x0) x0 = x; if(x > x1) x1 = x; if(y < y0) y0 = y; if(y > y1) y1 = y; }
    }
    let out = cv;
    if(x1 >= x0 && y1 >= y0 && (x0 > 2 || y0 > 2 || x1 < w - 3 || y1 < h - 3)){
      const m = 4;
      x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
      out = document.createElement('canvas'); out.width = x1 - x0 + 1; out.height = y1 - y0 + 1;
      out.getContext('2d').drawImage(cv, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
    }
    let dataUrl = out.toDataURL('image/png');
    if(dataUrl.length > 350000){
      const j = document.createElement('canvas'); j.width = out.width; j.height = out.height;
      const jc = j.getContext('2d'); jc.fillStyle = '#fff'; jc.fillRect(0, 0, j.width, j.height); jc.drawImage(out, 0, 0);
      dataUrl = j.toDataURL('image/jpeg', 0.88);
    }
    if(dataUrl.length > 700000) throw new Error('a imagem continua grande demais');
    return {dataUrl, w: out.width, h: out.height};
  } finally { URL.revokeObjectURL(url); }
}
async function logoReceber(blob, nome){
  const st = document.getElementById('logoStatus');
  const dizer = t => { if(st) st.textContent = t; };
  if(!blob || !/^image\//.test(blob.type || '')){ dizer('Use uma imagem PNG, JPG, WEBP ou SVG.'); return; }
  if(blob.size > 8 * 1024 * 1024){ dizer('A imagem passa de 8 MB. Use um arquivo menor.'); return; }
  dizer('Preparando a logo…');
  try{
    const n = await logoNormalizar(blob);
    const atual = propLogo() || {};
    const ok = await salvarPerfil({logo: {...n, nome: String(nome || blob.name || 'logo').slice(0, 80), tamanho: atual.tamanho || 'M', posicao: atual.posicao || 'esquerda', noModelo: atual.noModelo !== false, quando: todayIso()}});
    pfAviso(ok ? 'Logo adicionada. Ela entra no cabeçalho da proposta.' : 'A logo ficou neste navegador, mas não foi para a nuvem agora.');
    renderAll();
  }catch(e){ dizer('Não deu para usar esta imagem (' + (e.message || 'erro') + ').'); }
}

async function logoIniciais(){

  ctx.fillText(ini, 120, 126);

function logoBytes(l){ return base64ToBytes(l.dataUrl.split(',')[1]); }
function logoExt(l){ return /^data:image\/jpeg/.test(l.dataUrl) ? 'jpeg' : 'png'; }
function logoEmu(l){

function dxImagem(rid, cx, cy, id){

    + `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`

    + `</a:graphicData></a:graphic></wp:inline></w:drawing></w:r>`;

const DX_REL_IMG = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/image';
const DX_REL_HDR = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/header';
function dxGarantirNs(xml, raiz){
  const ini = xml.indexOf('<' + raiz);
  if(ini < 0) return xml;
  const fim = xml.indexOf('>', ini);
  let tag = xml.slice(ini, fim);
  if(!/xmlns:wp=/.test(tag)) tag += ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"';
  if(!/xmlns:r=/.test(tag)) tag += ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  return xml.slice(0, ini) + tag + xml.slice(fim);
}
async function dxGarantirTipo(zip, ext){
  const f = zip.file('[Content_Types].xml');
  if(!f) return;
  let ct = await f.async('string');
  if(!new RegExp(`Extension="${ext}"`, 'i').test(ct)){
    ct = ct.replace('</Types>', `<Default Extension="${ext}" ContentType="image/${ext}"/></Types>`);
    zip.file('[Content_Types].xml', ct);
  }
}
function dxAttr(tag, nome){ const m = tag.match(new RegExp(`\\b${nome}="([^"]*)"`)); return m ? m[1] : ''; }
async function docxInserirLogo(zip, l){
  const ext = logoExt(l);
  const alvoMedia = `media/pf_logo.${ext}`;
  zip.file('word/' + alvoMedia, logoBytes(l));
  await dxGarantirTipo(zip, ext);
  const {cx, cy} = logoEmu(l);
  const jc = LOGO_POSICOES[l.posicao].jc;
  const docF = zip.file('word/document.xml');
  let docXml = await docF.async('string');
  const relsF = zip.file('word/_rels/document.xml.rels');
  let docRels = relsF ? await relsF.async('string') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
  /* cabeçalhos usados pelo documento */
  const alvos = new Map();
  for(const tag of docXml.match(/<w:headerReference\b[^>]*\/>/g) || []){
    const rid = dxAttr(tag, 'r:id');
    const rel = (docRels.match(new RegExp(`<Relationship\\b[^>]*\\bId="${rid}"[^>]*/>`)) || [''])[0];
    const alvo = dxAttr(rel, 'Target').replace(/^\/?word\//, '').replace(/^\//, '');
    if(alvo) alvos.set(alvo, true);
  }
  if(!alvos.size){
    /* sem cabeçalho: cria um só com a logo */
    zip.file('word/header_pf.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:p><w:pPr><w:jc w:val="${jc}"/></w:pPr>${dxImagem('rIdPfLogo', cx, cy, 9101)}</w:p></w:hdr>`);
    zip.file('word/_rels/header_pf.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdPfLogo" Type="${DX_REL_IMG}" Target="${alvoMedia}"/></Relationships>`);
    docRels = docRels.replace('</Relationships>', `<Relationship Id="rIdPfHdr" Type="${DX_REL_HDR}" Target="header_pf.xml"/></Relationships>`);
    zip.file('word/_rels/document.xml.rels', docRels);
    docXml = dxGarantirNs(docXml, 'w:document').replace(/<w:sectPr\b[^>]*>/g, m => m + '<w:headerReference w:type="default" r:id="rIdPfHdr"/>');
    zip.file('word/document.xml', docXml);
    const ctF = zip.file('[Content_Types].xml');
    if(ctF){
      const ct = await ctF.async('string');
      zip.file('[Content_Types].xml', ct.replace('</Types>', '<Override PartName="/word/header_pf.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/></Types>'));
    }
    return 'criado';
  }
  let resultado = 'inserido';
  let n = 0;
  for(const nome of alvos.keys()){
    const hf = zip.file('word/' + nome);
    if(!hf) continue;
    let hx = await hf.async('string');
    const relsNome = 'word/_rels/' + nome + '.rels';
    const rf = zip.file(relsNome);
    let hr = rf ? await rf.async('string') : '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';
    const desenho = (hx.match(/<w:drawing>[\s\S]*?<\/w:drawing>/) || [''])[0];
    const embed = desenho && dxAttr((desenho.match(/<a:blip\b[^>]*>/) || [''])[0], 'r:embed');
    const relImg = embed && (hr.match(new RegExp(`<Relationship\\b[^>]*\\bId="${embed}"[^>]*/>`)) || [''])[0];
    if(relImg && /\/image"/.test(relImg)){
      /* troca a imagem que o modelo já tinha, mantendo a altura dela */
      hr = hr.replace(relImg, relImg.replace(/Target="[^"]*"/, `Target="${alvoMedia}"`).replace(/\s*TargetMode="[^"]*"/, ''));
      const ext0 = desenho.match(/<wp:extent cx="(\d+)" cy="(\d+)"\/>/);
      let novo = desenho;
      if(ext0){
        const h0 = +ext0[2];
        let w0 = Math.round(h0 * l.w / l.h);
        let hh = h0;
        const maxW = Math.max(+ext0[1], 16 * 360000 / 2);
        if(w0 > maxW){ w0 = Math.round(maxW); hh = Math.round(maxW * l.h / l.w); }
        novo = novo.replace(/<wp:extent cx="\d+" cy="\d+"\/>/, `<wp:extent cx="${w0}" cy="${hh}"/>`)
                   .replace(/<a:ext cx="\d+" cy="\d+"\/>/, `<a:ext cx="${w0}" cy="${hh}"/>`);
      }
      hx = hx.replace(desenho, novo);
      resultado = 'trocado';
    } else {
      hr = hr.replace('</Relationships>', `<Relationship Id="rIdPfLogo" Type="${DX_REL_IMG}" Target="${alvoMedia}"/></Relationships>`);
      hx = dxGarantirNs(hx, 'w:hdr');
      hx = hx.replace(/(<w:hdr\b[^>]*>)/, `$1<w:p><w:pPr><w:jc w:val="${jc}"/><w:spacing w:after="120"/></w:pPr>${dxImagem('rIdPfLogo', cx, cy, 9100 + (++n))}</w:p>`);
    }
    zip.file('word/' + nome, hx);
    zip.file(relsNome, hr);
  }
  return resultado;
}

    const cel = `<w:tc><w:tcPr><w:tcW w:w="${larguraLogo}" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>${dxP(img, {jc: logo.posicao === 'direita' ? 'right' : 'left', depois: 0, linha: 240})}</w:tc>`;
    const tabelaCab = (a, b, ga, gb) => `<w:tbl><w:tblPr><w:tblW w:w="${DX_LARG}" w:type="dxa"/>${dxSemBorda}<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="0" w:type="dxa"/><w:right w:w="0" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="${ga}"/><w:gridCol w:w="${gb}"/></w:tblGrid><w:tr>${a}${b}</w:tr></w:tbl>`;
    const cab = logo.posicao === 'centro'
      ? dxP(img, {jc: 'center', depois: 60, linha: 240}) + dxP('', {bordaBaixo: true, depois: 0, linha: 120})
      : logo.posicao === 'direita'
        ? tabelaCab(fio, cel, DX_LARG - larguraLogo, larguraLogo)
        : tabelaCab(cel, fio, larguraLogo, DX_LARG - larguraLogo);
    zip.file('word/header1.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${DX_NS}>${cab}${dxP('', {depois: 0, linha: 240})}</w:hdr>`);
    zip.file('word/_rels/header1.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdLogo" Type="${DX_REL_IMG}" Target="media/logo.${ext}"/></Relationships>`);
  }
  const sect = `<w:sectPr>${logo ? '<w:headerReference w:type="default" r:id="rIdHdr"/>' : ''}<w:footerReference w:type="default" r:id="rIdFtr"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1418" w:right="1134" w:bottom="1418" w:left="1701" w:header="454" w:footer="397" w:gutter="0"/></w:sectPr>`;
  zip.file('word/document.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${DX_NS}><w:body>${corpo}${sect}</w:body></w:document>`);
  zip.file('word/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Calibri" w:cs="Calibri"/><w:sz w:val="22"/><w:szCs w:val="22"/><w:lang w:val="pt-BR"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="200" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style></w:styles>`);
  zip.file('word/_rels/document.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">`
    + `<Relationship Id="rIdStyles" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>`
    + `<Relationship Id="rIdFtr" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>`
    + (logo ? `<Relationship Id="rIdHdr" Type="${DX_REL_HDR}" Target="header1.xml"/>` : '')
    + `</Relationships>`);
  zip.file('_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file('[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">`
    + `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>`
    + `<Default Extension="png" ContentType="image/png"/><Default Extension="jpeg" ContentType="image/jpeg"/>`
    + `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>`
    + `<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>`
    + `<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>`
    + (logo ? `<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/>` : '')
    + `</Types>`);
  return await zip.generateAsync({type: 'uint8array'});
}

  const editavel = podeEditar(c);
  const outros = acessosDe(c).filter(e => e !== donoDe(c));
  const corpo = `
      <div class="rows">
        ${linhaCompartilhamento(c, donoDe(c), false)}
        ${outros.map(e => linhaCompartilhamento(c, e, souDono(c))).join('')}
      </div>
      ${editavel ? `
      <div class="form-grid" style="margin:14px 0 0;">
        <div class="field" style="grid-column:1/-1;"><label for="shareEmail-${c.id}">Compartilhar com</label>
          <input id="shareEmail-${c.id}" type="email" placeholder="email@exemplo.com"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();enviarCompartilhamento(${jsq(c.id)})}">

async function enviarCompartilhamento(casoId){
  const campo = document.getElementById('shareEmail-'+casoId);
  const nivel = document.getElementById('shareNivel-'+casoId).value;
  const aviso = document.getElementById('shareAviso-'+casoId);
  aviso.textContent = 'Compartilhando...';
  const r = await compartilhar(casoId, campo.value, nivel);
  if(r.erro){ aviso.textContent = r.erro; return; }
  const email = campo.value.trim().toLowerCase();
  campo.value = '';
  if(drawerCasoId === casoId) renderDrawer(); else renderAll();
  const novo = document.getElementById('shareAviso-'+casoId);
  if(novo) novo.textContent = 'Acesso liberado para ' + email + '.' + (r.aviso || '') + ' Use Enviar convite para avisar a pessoa.';
}

/* ==========================================================================
   Aparência
   Tema e paleta ficam na ficha da pessoa, então acompanham a conta em
   qualquer dispositivo. Sem conta, valem só neste navegador.
   As paletas foram geradas em OKLCH e conferidas: em todas elas o texto sobre
   o botão passa de 4,5:1, as duas séries dos gráficos se distinguem e a escala
   ordinal mantém contraste contra o fundo claro e o escuro.
   ========================================================================== */
const PALETAS = [
  {id:'flow',    nome:'Padrão',      amostra:'#4B718C'},
  {id:'jade',    nome:'Jade',        amostra:'#0E7B62'},
  {id:'indigo',  nome:'Índigo',      amostra:'#526AAE'},
  {id:'grafite', nome:'Grafite',     amostra:'#656E77'},
  {id:'bordo',   nome:'Bordô',       amostra:'#A7535A'},
  {id:'oliva',   nome:'Oliva',       amostra:'#52772F'},
];
const TEMAS = [
  {id:'auto',  nome:'Automático', dica:'segue o sistema'},
  {id:'light', nome:'Claro',      dica:''},
  {id:'dark',  nome:'Escuro',     dica:''},
];
const LS_APARENCIA = 'pericias.aparencia';
let prefTema = 'auto', prefPaleta = 'flow';
(function(){
  try{
    const raw = JSON.parse(localStorage.getItem(LS_APARENCIA) || '{}');
    if(TEMAS.some(t => t.id === raw.tema)) prefTema = raw.tema;
    if(PALETAS.some(p => p.id === raw.paleta)) prefPaleta = raw.paleta;
  }catch(e){}
})();
function temaResolvido(){
  if(prefTema === 'light' || prefTema === 'dark') return prefTema;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function aplicarAparencia(){
  const raiz = document.documentElement;
  raiz.setAttribute('data-theme', temaResolvido());
  raiz.setAttribute('data-palette', prefPaleta);
  try{ localStorage.setItem(LS_APARENCIA, JSON.stringify({tema:prefTema, paleta:prefPaleta})); }catch(e){}
  if(typeof renderThemeButton === 'function') renderThemeButton();
}
async function definirTema(id){
  if(!TEMAS.some(t => t.id === id)) return;
  prefTema = id;
  aplicarAparencia();
  if(meuEmail()) await salvarPerfil({aparencia: {...(perfil.aparencia||{}), tema: id}});
  renderAll();
}
async function definirPaleta(id){
  if(!PALETAS.some(p => p.id === id)) return;
  prefPaleta = id;
  aplicarAparencia();
  if(meuEmail()) await salvarPerfil({aparencia: {...(perfil.aparencia||{}), paleta: id}});
  renderAll();
}
/* depois que as fichas chegam da nuvem, a preferência da conta prevalece */
function aparenciaDoPerfil(){
  const a = perfil.aparencia || {};
  let mudou = false;
  if(a.tema && TEMAS.some(t => t.id === a.tema) && a.tema !== prefTema){ prefTema = a.tema; mudou = true; }
  if(a.paleta && PALETAS.some(p => p.id === a.paleta) && a.paleta !== prefPaleta){ prefPaleta = a.paleta; mudou = true; }
  if(mudou) aplicarAparencia();
}
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if(prefTema === 'auto') aplicarAparencia();
});

function legalBlocos(b){
  return b.map(bl => {

    if(tipo === 'lista') return `<ul>${bl[1].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ul>`;
    if(tipo === 'passos') return `<ol>${bl[1].map(x => `<li>${escapeHtml(x)}</li>`).join('')}</ol>`;
    if(tipo === 'alerta') return `<div class="lg-aviso"><b>${escapeHtml(bl[1])}</b><p>${escapeHtml(bl[2])}</p></div>`;
    if(tipo === 'dica') return `<div class="lg-aviso lg-dica"><p>${escapeHtml(bl[1])}</p></div>`;
    return '';
  }).join('');
}

/* destaca no índice a seção que está sendo lida */
let legalObs = null;
function legalObservar(raiz){
  if(legalObs){ legalObs.disconnect(); legalObs = null; }
  if(!('IntersectionObserver' in window)) return;
  const caixa = raiz || document;
  const secs = [...caixa.querySelectorAll('.lg-sec')];
  if(!secs.length) return;
  legalObs = new IntersectionObserver(ents => {
    ents.forEach(e => {
      if(!e.isIntersecting) return;
      caixa.querySelectorAll('.lg-indice-item').forEach(b => b.classList.toggle('on', b.dataset.alvo === e.target.id));
    });
  }, {root: raiz ? raiz.querySelector('.lg-modal-rolagem') : null, rootMargin:'0px 0px -70% 0px'});
  secs.forEach(s => legalObs.observe(s));
}

    data: `Versão ${VERSAO_PRIVACIDADE}, de ${DATA_PRIVACIDADE}`, indice: 'Neste documento',
  });
  if(ok) pfAviso(`${d.titulo} baixado em PDF.`);
}

function abrirLegal(aba){
  legalModalAba = LEGAL[aba] ? aba : 'termos';
  let el = document.getElementById('legalModal');
  if(!el){
    el = document.createElement('div');
    el.id = 'legalModal';
    el.className = 'lg-modal';
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', 'Termos e privacidade');
    el.addEventListener('click', ev => { if(ev.target === el) fecharLegal(); });
    document.body.appendChild(el);
  }
  el.innerHTML = `<div class="lg-modal-caixa">
      <button class="icon-btn lg-modal-fechar" onclick="fecharLegal()" aria-label="Fechar">${svg('<path d="M6 6l12 12M18 6L6 18"/>')}</button>
      <div class="lg-modal-rolagem">${legalLeitor(legalModalAba, true)}</div>

  el.classList.add('aberto');
  legalObservar(el);
  const f = el.querySelector('.lg-aba.on'); if(f) f.focus();
}

function mensagemAuth(codigo){
  const mapa = {
    'auth/invalid-email': 'Esse e-mail não parece válido.',
    'auth/user-disabled': 'Esta conta está desativada.',
    'auth/user-not-found': 'E-mail ou senha não conferem.',
    'auth/wrong-password': 'E-mail ou senha não conferem.',
    'auth/invalid-credential': 'E-mail ou senha não conferem.',
    'auth/invalid-login-credentials': 'E-mail ou senha não conferem.',
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Use Entrar, ou peça um link de senha.',
    'auth/weak-password': 'Senha fraca. Use pelo menos 8 caracteres, com letras e números.',
    'auth/missing-password': 'Digite a senha.',
    'auth/too-many-requests': 'Muitas tentativas seguidas. Aguarde alguns minutos.',
    'auth/network-request-failed': 'Sem conexão com o servidor. Verifique a internet.',
    'auth/operation-not-allowed': 'A entrada por senha não está habilitada neste projeto.',
    'auth/popup-closed-by-user': 'A janela do Google foi fechada antes de concluir.',
    'auth/popup-blocked': 'O navegador bloqueou a janela do Google. Libere os pop-ups deste site.',
  };
  return mapa[codigo] || 'Não foi possível concluir agora. Tente novamente.';
}
function avisoLogin(texto, tipo){
  const el = document.getElementById('loginAviso');
  if(!el) return;
  el.textContent = texto || '';
  el.className = 'login-aviso ' + (tipo || '');
}
let loginEmailMemo = '';
let recuperarEnviado = '';
let recuperarEspera = 0;
function trocarModoLogin(modo){
  const em = document.getElementById('loginEmail');
  if(em) loginEmailMemo = em.value.trim();
  loginModo = modo;
  if(modo !== 'recuperar') recuperarEnviado = '';
  renderLogin();
  const alvo = document.getElementById(modo === 'criar' ? 'loginNome' : 'loginEmail');
  if(alvo){ if(alvo.id === 'loginEmail' && loginEmailMemo && !alvo.value) alvo.value = loginEmailMemo; alvo.focus(); }
}

async function entrarComSenha(){
  if(!auth) return;
  const email = (document.getElementById('loginEmail').value || '').trim();
  const senha = document.getElementById('loginSenha').value || '';
  if(!email || !senha){ avisoLogin('Preencha o e-mail e a senha.', 'erro'); return; }
  avisoLogin('Entrando...');
  try{ await auth.signInWithEmailAndPassword(email, senha); }
  catch(e){ avisoLogin(mensagemAuth(e.code), 'erro'); }
}

async function criarConta(){
  if(!auth) return;
  const nome = (document.getElementById('loginNome').value || '').trim();
  const email = (document.getElementById('loginEmail').value || '').trim();
  const senha = document.getElementById('loginSenha').value || '';
  if(nome.length < 3){ avisoLogin('Escreva o seu nome completo.', 'erro'); return; }
  if(!email){ avisoLogin('Informe o e-mail.', 'erro'); return; }
  if(senha.length < 8 || !/[A-Za-z]/.test(senha) || !/\d/.test(senha)){ avisoLogin('Use uma senha com pelo menos 8 caracteres, com letras e números.', 'erro'); return; }
  if(senha.toLowerCase().includes(email.split('@')[0].toLowerCase()) && email.split('@')[0].length >= 4){ avisoLogin('A senha não pode conter o seu e-mail.', 'erro'); return; }
  avisoLogin('Criando a conta...');
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, senha);
    try{ await cred.user.updateProfile({displayName: nome}); }catch(e){}
    /* o cadastro entra no banco já aqui, antes mesmo da confirmação */
    try{
      await firebase.firestore().collection('usuarios').doc(cred.user.uid).set({
        email: email.toLowerCase(), nome, criadoEm: new Date().toISOString(),
        ficha:{}, aparencia:{}, aceite:null, contatos:[],
      });
    }catch(e){}
    try{ await cred.user.sendEmailVerification(); }catch(e){}
    avisoLogin('Conta criada. Enviamos um e-mail de confirmação para ' + email + '.', 'ok');
  }catch(e){
    avisoLogin(mensagemAuth(e.code), 'erro');
  }
}

async function recuperarSenha(reenviar){
  if(!auth){ avisoLogin('Sem conexão com o servidor de contas agora. Tente de novo em instantes.', 'erro'); return; }
  const campo = document.getElementById('loginEmail');
  const email = reenviar ? recuperarEnviado : ((campo && campo.value) || '').trim();
  if(!email){ avisoLogin('Digite o e-mail da sua conta.', 'erro'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ avisoLogin('Esse e-mail não parece válido.', 'erro'); return; }
  if(reenviar && Date.now() < recuperarEspera) return;
  avisoLogin('Enviando...');
  try{ await auth.sendPasswordResetEmail(email); }
  catch(e){
    if(e.code === 'auth/invalid-email'){ avisoLogin('Esse e-mail não parece válido.', 'erro'); return; }
    /* user-not-found não é revelado: dizer quais e-mails existem entregaria
       a lista de quem tem conta no sistema */
    if(e.code !== 'auth/user-not-found'){ avisoLogin(mensagemAuth(e.code), 'erro'); return; }
  }
  loginEmailMemo = email;
  recuperarEnviado = email;
  recuperarEspera = Date.now() + 30000;
  loginModo = 'recuperar';
  renderLogin();
  setTimeout(() => { if(loginModo === 'recuperar' && recuperarEnviado) renderLogin(); }, 30500);
}

/* ---------- confirmação do e-mail ---------- */
async function reenviarConfirmacao(){
  if(!currentUser || enviandoEmail) return;
  enviandoEmail = true;
  const el = document.getElementById('confirmaAviso');
  if(el) el.textContent = 'Enviando...';
  try{
    await currentUser.sendEmailVerification();
    if(el){ el.textContent = 'Enviamos outro e-mail para ' + currentUser.email + '.'; el.className = 'login-aviso ok'; }
  }catch(e){
    if(el){ el.textContent = mensagemAuth(e.code); el.className = 'login-aviso erro'; }
  }
  setTimeout(() => { enviandoEmail = false; }, 4000);
}
async function jaConfirmei(){
  if(!currentUser) return;
  const el = document.getElementById('confirmaAviso');
  if(el){ el.textContent = 'Verificando...'; el.className = 'login-aviso'; }
  try{
    await currentUser.reload();
    currentUser = auth.currentUser;
    if(currentUser && currentUser.emailVerified){
      try{ await currentUser.getIdToken(true); }catch(e){}
      await applyAuthState();
      return;
    }
    if(el){ el.textContent = 'Ainda não consta como confirmado. Abra o link do e-mail e tente de novo.'; el.className = 'login-aviso erro'; }
  }catch(e){
    if(el){ el.textContent = mensagemAuth(e.code); el.className = 'login-aviso erro'; }
  }
}

  const alvo = document.getElementById('confirma');
  if(!alvo) return;
  const precisa = !!(currentUser && !currentUser.emailVerified);
  if(!precisa){ alvo.classList.remove('aberto'); alvo.innerHTML = ''; return; }
  alvo.classList.add('aberto');
  alvo.innerHTML = `
    <div class="login-caixa">
      <div class="login-marca">
        <span class="brand-mark grande">${MARCA_SVG}</span>
        <span class="wordmark grande"><b>Gerenciador</b><i>de Perícia</i></span>

      <p style="font-size:13px; line-height:1.6; color:var(--ink-2); margin:0 0 10px;">
        Enviamos uma mensagem para <b class="mono">${escapeHtml(currentUser.email || '')}</b>.
        Abra o link que está nela para liberar a conta.
      </p>
      <p style="font-size:12.5px; line-height:1.55; color:var(--muted); margin:0 0 18px;">
        O seu cadastro já está guardado; falta só a confirmação. A mensagem chega de
        <b class="mono">noreply@gerenciador-pericias-app.firebaseapp.com</b>, com o assunto
        “Verifique seu e-mail do app Gerenciador de Perícia”. Se não aparecer em alguns minutos, procure no spam.
      </p>
      <button class="btn btn-primary login-entrar" style="margin-top:0;" onclick="jaConfirmei()">Já confirmei, entrar</button>
      <button class="link-sutil" onclick="reenviarConfirmacao()">Enviar o e-mail de novo</button>

    </div>`;

  if(!alvo) return;
  if(!loginAberto){ alvo.classList.remove('aberto', 'lp-modo'); alvo.innerHTML = ''; lpParar(); lpEntrarAberto = false; return; }
  alvo.classList.add('aberto', 'lp-modo');

    alvo.innerHTML = renderApresentacao() + '<div class="lp-janela" id="lpJanela" role="dialog" aria-modal="true" aria-label="Entrar ou criar conta" onclick="if(event.target===this) lpFecharEntrar()"></div>';

/* ---------- comportamento ---------- */
function lpIr(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
}
function lpEntrar(modo){
  loginModo = modo === 'criar' ? 'criar' : 'entrar';
  lpEntrarAberto = true;
  renderLogin();
  setTimeout(() => { const el = document.getElementById(loginModo === 'criar' ? 'loginNome' : 'loginEmail'); if(el) el.focus(); }, 60);
}
function lpFecharEntrar(){ lpEntrarAberto = false; renderLogin(); }
function lpDemo(i, manual){
  const n = LP_TELAS.length;
  LP.demo = ((i % n) + n) % n;
  const t = LP_TELAS[LP.demo];
  const img = document.getElementById('lpDemoImg');
  if(!img) return;
  img.classList.add('troca');
  setTimeout(() => { img.src = `apresentacao/${t.img}.webp?v=${LP_VERSAO}`; img.alt = `Tela ${t.nome} do Gerenciador de Perícia`; img.classList.remove('troca'); }, manual ? 80 : 200);
  document.getElementById('lpDemoTxt').textContent = t.txt;
  document.getElementById('lpDemoNum').textContent = `${LP.demo + 1}/${n}`;
  document.querySelectorAll('.lp-demo-aba').forEach((b, k) => {
    b.classList.toggle('on', k === LP.demo); b.setAttribute('aria-selected', k === LP.demo);
    const s = b.querySelector('s'); if(s){ s.style.animation = 'none'; void s.offsetWidth; s.style.animation = ''; }
  });
  LP.decorrido = 0;
}
const LP_ACHADOS = [
  ['Cálculo', 'Erro', 'Juros contados antes do termo inicial', 'A planilha aplica juros desde o contrato; o acórdão fixou a citação.', 'Planilha do exequente, p. 3'],
  ['Índices', 'Atenção', 'Índice trocado no meio do período', 'INPC até dez/2024 e IPCA-E depois, sem previsão na decisão.', 'Planilha do exequente, p. 4'],
  ['Documentos', 'Verificar', 'Extratos de 2023 ausentes', 'Os pagamentos de 2023 não têm como ser conferidos.', 'Petição dos embargos, anexos 4 a 9'],
  ['Valores', 'Erro', 'Total não confere com as parcelas', 'O total declarado é maior que a soma das 36 parcelas.', 'Planilha do exequente, p. 5'],
];
function lpTrocarAchado(){
  LP.ach = ((LP.ach || 0) + 1) % LP_ACHADOS.length;
  const [cat, grav, tit, det, fonte] = LP_ACHADOS[LP.ach];
  const box = document.getElementById('lpAchado');
  if(!box) return;
  box.classList.add('troca');
  setTimeout(() => {
    const el = id => document.getElementById(id);
    if(!el('lpAchCat') || !el('lpAchGrav')) return;   /* a apresentação já fechou */
    el('lpAchCat').textContent = cat;
    const g = el('lpAchGrav'); g.textContent = grav; g.dataset.g = grav;
    if(el('lpAchTit')) el('lpAchTit').textContent = tit;
    if(el('lpAchDet')) el('lpAchDet').textContent = det;
    if(el('lpAchFonte')) el('lpAchFonte').textContent = fonte;
    box.classList.remove('troca');
  }, 260);
}
function lpFerr(qual){
  const hon = qual !== 'prazo';
  document.getElementById('lpFerrHon').hidden = !hon;
  document.getElementById('lpFerrPrazo').hidden = hon;
  [['lpAbaHon', hon], ['lpAbaPrazo', !hon]].forEach(([id, on]) => { const b = document.getElementById(id); b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  if(!hon) lpPrazo();
}
function lpSimular(){
  const hora = Math.max(0, Number(document.getElementById('lpHora').value) || 0);
  let horas = 0;
  for(let i = 0; i < 5; i++){
    const v = Number(document.getElementById('lpH' + i).value) || 0;
    horas += v;
    document.getElementById('lpHv' + i).textContent = v + ' h';
  }
  const total = horas * hora;
  document.getElementById('lpTotal').textContent = fmtMoney(total);
  document.getElementById('lpHoras').textContent = `${horas} hora${horas === 1 ? '' : 's'} × ${fmtMoney(hora)}`;
  document.getElementById('lpAdiant').textContent = fmtMoney(total / 2);
}
function lpPrazo(){
  const ini = document.getElementById('lpPzData');
  if(!ini.value) ini.value = todayIso();
  const dias = Math.min(365, Math.max(1, parseInt(document.getElementById('lpPzDias').value, 10) || 1));
  const uteis = document.getElementById('lpPzTipo').value === 'uteis';
  const d = new Date(ini.value + 'T12:00:00');
  let n = 0;
  while(n < dias){
    d.setDate(d.getDate() + 1);
    const w = d.getDay();
    if(!uteis || (w !== 0 && w !== 6)) n++;
  }
  if(!uteis){ while(d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); }
  const iso = d.toISOString().slice(0, 10);
  document.getElementById('lpPzFim').textContent = d.toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long', year: 'numeric'});
  const falta = diasAte(iso);
  document.getElementById('lpPzFalta').textContent = falta > 0 ? `faltam ${falta} dia${falta === 1 ? '' : 's'} corridos` : falta === 0 ? 'vence hoje' : `venceu há ${-falta} dia${falta === -1 ? '' : 's'}`;
}
function lpSuporteEnviar(){
  const nome = document.getElementById('lpSupNome').value.trim();
  const email = document.getElementById('lpSupEmail').value.trim();
  const assunto = document.getElementById('lpSupAssunto').value;
  const msg = document.getElementById('lpSupMsg').value.trim();
  const diag = [`Navegador: ${navigator.userAgent}`, `Extensão PROJUDI PDFs: ${(typeof PJ !== 'undefined' && PJ.versao) ? 'v' + PJ.versao : 'não detectada'}`, `Página: ${location.href.split('#')[0]}`].join('\n');
  const corpo = `${msg}\n\n— ${nome} <${email}>\n\n---\n${diag}`;
  location.href = `mailto:${SUPORTE_EMAIL}?subject=${encodeURIComponent(assunto + ' - Gerenciador de Perícia')}&body=${encodeURIComponent(corpo)}`;
}
function lpParar(){
  LP.timers.forEach(t => clearInterval(t)); LP.timers = [];
  if(LP.obs){ LP.obs.disconnect(); LP.obs = null; }
}
function lpIniciar(raiz){
  lpParar();
  const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
  /* entra na tela ao rolar */
  if('IntersectionObserver' in window && !calmo){
    LP.obs = new IntersectionObserver(ents => ents.forEach(e => { if(e.isIntersecting){ e.target.classList.add('lp-vis'); LP.obs.unobserve(e.target); } }), {root: raiz, rootMargin: '0px 0px -8% 0px'});
    raiz.querySelectorAll('.lp-rev').forEach(el => LP.obs.observe(el));
  } else raiz.querySelectorAll('.lp-rev').forEach(el => el.classList.add('lp-vis'));
  /* cabeçalho ganha fundo ao rolar */
  raiz.addEventListener('scroll', () => { const c = document.getElementById('lpCab'); if(c) c.classList.toggle('rolou', raiz.scrollTop > 8); }, {passive: true});
  lpSimular();
  if(calmo) return;
  /* telas do topo trocam sozinhas */
  LP.timers.push(setInterval(() => {
    const imgs = document.querySelectorAll('#lpHeroiTelas img');
    if(!imgs.length) return;
    imgs[LP.heroi].classList.remove('on');
    LP.heroi = (LP.heroi + 1) % imgs.length;
    imgs[LP.heroi].classList.add('on');
  }, 4200));
  /* demonstração avança a cada 6 s, pausa com o mouse em cima */
  LP.decorrido = 0;
  LP.timers.push(setInterval(() => {
    if(LP.pausado || lpEntrarAberto) return;
    LP.decorrido += 250;
    if(LP.decorrido >= 6000) lpDemo(LP.demo + 1, false);
  }, 250));
  LP.timers.push(setInterval(lpTrocarAchado, 3600));
}

function abrirLogin(v){
  loginAberto = !!v;
  renderLogin();
  document.body.classList.toggle('travado', loginAberto || !!(currentUser && !currentUser.emailVerified));
}

  const corpoConta = `
        <div class="kv-grid">

        <div class="hint" style="margin-top:12px;">
          Sem login, os dados ficam apenas neste navegador e não acompanham você em outro dispositivo.
          Ao entrar com uma conta autorizada, tudo passa a sincronizar automaticamente.
        </div>`;

  const corpoContas = `
        <div class="kv-grid">
          <div class="kv"><div class="k">Cadastro</div><div class="v">${currentUser ? 'aberto, com confirmação' : '—'}</div></div>
          <div class="kv"><div class="k">Meu e-mail</div><div class="v">${currentUser ? (contaVerificada() ? 'confirmado' : 'pendente') : '—'}</div></div>
          <div class="kv"><div class="k">Meu espaço</div><div class="v num">${contarVisao('minhas')}</div></div>
          <div class="kv"><div class="k">Recebidas</div><div class="v num">${contarVisao('compartilhadas')}</div></div>
        </div>
        <div class="hint" style="margin-top:12px;">
          Qualquer pessoa cria a própria conta e confirma o e-mail. O espaço dela nasce vazio: nenhuma conta enxerga
          as perícias de outra, a não ser as que forem compartilhadas com o e-mail dela.
        </div>`;

  const corpoArmazenamento = `
        <div class="kv-grid">
          <div class="kv"><div class="k">Registros</div><div class="v num">${totalDocs}</div></div>
          <div class="kv"><div class="k">Com arquivo anexado</div><div class="v num">${comArquivo}</div></div>
          <div class="kv"><div class="k">Volume aproximado</div><div class="v num">${fmtBytes(bytes) || '0 B'}</div></div>
          <div class="kv"><div class="k">Limite por arquivo</div><div class="v num">${usingDb && storage ? '50 MB' : '5 MB'}</div></div>
        </div>
        <div class="hint" style="margin-top:12px;">
          Conectado à nuvem, cada arquivo vai para o Storage e aceita até 50 MB. Sem conexão, o arquivo fica embutido no próprio registro do navegador.
        </div>`;

  const campoFicha = (key, campo, rotulo, valor, dica, largo) => {
    const editado = !!(fichaRascunho && campo in fichaRascunho);
    const v = editado ? fichaRascunho[campo] : valor;
    return `
        <div class="field ${editado ? 'ficha-editado' : ''}" ${largo ? 'style="grid-column:1/-1;"' : ''}>
          <label for="ficha-${campo}">${rotulo}</label>
          <input id="ficha-${campo}" data-campo="${campo}" value="${escapeHtml(String(v == null ? '' : v))}"
                 oninput="fichaEditar(${jsq(campo)}, this.value); this.closest('.field').classList.add('ficha-editado');"
                 onkeydown="if(event.key==='Enter'){ event.preventDefault(); fichaSalvar(); }">
          ${dica ? `<span class="dica">${dica}</span>` : ''}
        </div>`;
  };
  const meuCad = meuEmail();
  const f = fichaDe(meuCad);
  const eu = membroDe(meuCad);
  const corpoMeuCadastro = meuCad ? `
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        ${avatarMembro(eu, 30, currentUser && currentUser.photoURL)}
        <div style="min-width:0;">
          <b style="font-size:13.5px;">${escapeHtml(eu.nome)}</b>
          <div class="mono" style="font-size:11.5px; color:var(--muted);">${escapeHtml(meuCad)}</div>
        </div>
      </div>
      <div class="form-grid" style="margin-bottom:0;">

        ${campoFicha(meuCad, 'crcEstado', 'CRC — estado', f.crcEstado, 'Ex.: Goiás')}
        ${campoFicha(meuCad, 'crcRegistro', 'CRC — registro', f.crcRegistro, 'Ex.: GO-030689/O-8')}
        ${campoFicha(meuCad, 'cpf', 'CPF', f.cpf, '')}
        ${campoFicha(meuCad, 'telefone', 'Telefone', f.telefone, 'Vai para o rodapé da proposta')}
        ${campoFicha(meuCad, 'cidadeUf', 'Cidade e UF', f.cidadeUf, 'Usada na linha da data')}
        ${campoFicha(meuCad, 'horaTecnica', 'Hora técnica (R$)', brl(f.horaTecnica), 'Valor sugerido em cada proposta')}
        ${campoFicha(meuCad, 'endereco', 'Endereço profissional', f.endereco, 'Linha completa do rodapé', true)}
        ${campoFicha(meuCad, 'referenciaHora', 'Referência da hora técnica', f.referenciaHora, 'Entidade citada na proposta', true)}
      </div>
      ${fichaBarraHtml()}
      <div class="hint" style="margin-top:12px;">
        Este cadastro é seu: só você edita. Ele entra na qualificação do perito, no rodapé e na assinatura das propostas que você gerar.
        O cadastro dos outros peritos é de cada um — se faltar algum dado no documento de um colega, peça para ele completar aqui.
      </div>`
    : `<div class="chart-empty">Entre com a sua conta para preencher o cadastro profissional.</div>`;


  const campos = ['nomeCompleto','crcEstado','crcRegistro','cpf','telefone','cidadeUf','horaTecnica','endereco','referenciaHora'];
  const feitos = meuCad ? campos.filter(k => f[k] != null && String(f[k]).trim() !== '' && f[k] !== 0).length : 0;
  const nomeTopo = meuCad ? (f.nomeCompleto || eu.nome) : 'Sem conta conectada';

          ${f.crcRegistro ? `<span class="pill pill-muted">CRC ${escapeHtml(f.crcRegistro)}</span>` : ''}

    </div>`;
