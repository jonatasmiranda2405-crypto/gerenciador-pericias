  return criarCaso({
    dono, emails:[dono], editores:[dono], compartilhamentos:[],
    codigo: nextCodigo(), nome: capa.classe || `Processo ${pedido.numero}`,
    numeroProcesso: pedido.numero, codigoAcesso:'', vara: capa.serventia || '', comarca: capa.comarca || '',
    partes: [capa.poloAtivo, capa.poloPassivo].filter(Boolean).join(' x '),
    dataNomeacao: todayIso(), prazoEntrega: todayIso(), honorarios:0, valorRecebido:0,
    statusCaso:'em_andamento', observacoes:[], origem:'projudi'
  });
}

function pjMostrarOfertas(){
  let caixa = document.getElementById('pjOferta');
  if(!PJ.ofertas.size){ if(caixa) caixa.remove(); return; }
  if(!caixa){
    caixa = document.createElement('div');
    caixa.id = 'pjOferta';
    caixa.setAttribute('role', 'dialog');
    caixa.setAttribute('aria-label', 'Autos recebidos do PROJUDI');
    caixa.style.cssText = 'position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:80; width:min(380px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; display:grid; gap:10px;';
    document.body.appendChild(caixa);
  }
  const editaveis = casos.filter(c => podeEditar(c));
  caixa.innerHTML = [...PJ.ofertas.values()].map(p => {
    const dig = String(p.numero).replace(/\D/g,'');
    const igual = editaveis.find(c => (c.numeroProcesso||'').replace(/\D/g,'') === dig);
    const opcoes = [`<option value="novo" ${igual?'':'selected'}>Nova perícia com os dados do processo</option>`]
      .concat(editaveis.map(c => `<option value="${c.id}" ${igual && igual.id===c.id ? 'selected' : ''}>${escapeHtml(c.codigo)} · ${escapeHtml(c.nome)}</option>`)).join('');
    return `<div style="display:grid; gap:8px;">
        <div><b>Chegou do PROJUDI</b><div class="hint">Processo <span class="mono">${escapeHtml(p.numero)}</span> · ${p.total} arquivo(s)</div></div>
        <label class="hint" for="pjDestino-${p.id}">Guardar em</label>
        <select id="pjDestino-${p.id}">${opcoes}</select>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn btn-primary btn-sm" onclick="pjAceitarOferta(${jsq(p.id)})">Importar</button>
          <button class="btn btn-ghost btn-sm" onclick="pjDescartarOferta(${jsq(p.id)})">Descartar</button>
        </div>
      </div>`;
  }).join('<hr style="border:0; border-top:1px solid var(--line); margin:4px 0;">');
}

async function pjAceitarOferta(pedidoId){
  const p = PJ.ofertas.get(pedidoId);
  if(!p) return;
  const sel = document.getElementById(`pjDestino-${pedidoId}`);
  let casoId = sel ? sel.value : 'novo';
  if(casoId === 'novo'){
    if(!possoCriar()){ cloudSetBanner(bannerAviso('Confirme o seu e-mail para criar perícias.')); return; }
    casoId = await pjCriarPericiaDoProjudi(p);
  }
  PJ.ofertas.delete(pedidoId); pjMostrarOfertas();
  PJ.pedidos[pedidoId] = casoId;
  openDrawer(casoId);
  pjStatus(casoId, {etapa:'pedindo', texto:'Conferindo o que já foi importado…', feitos:0, total:0, falhas:0, pedidoId});
  const jaTenho = await pjIdsJaImportados(casoId);
  const r = await pjPedir({tipo:'aceitar', pedidoId, casoId, jaTenho});
  if(!r.ok) pjStatus(casoId, {etapa:'erro', texto: r.erro || 'Não foi possível aceitar o envio.', pedidoId:null});
}
function pjDescartarOferta(pedidoId){
  PJ.ofertas.delete(pedidoId);
  pjPost({tipo:'cancelar', pedidoId});
  pjMostrarOfertas();
}

    : `<span class="pill pill-warning">v${escapeHtml(PJ.versao)} · atualize para ${PJ_VERSAO_MINIMA}</span>`;
  return `
    <div class="kv-grid">
      <div class="kv"><div class="k">Extensão</div><div class="v">${ext}</div></div>
      <div class="kv"><div class="k">Login no PROJUDI</div><div class="v">feito por você, no site do tribunal</div></div>
    </div>

      ${PJ_METODOS.map(m => `<button class="chip ${atual===m.id?'active':''}" onclick="pjDefinirMetodo(${jsq(m.id)})" aria-pressed="${atual===m.id}">${m.nome}</button>`).join('')}
    </div>

      <button class="btn btn-ghost btn-sm" onclick="pjEntrar()" ${PJ.versao ? '' : 'disabled'}>Entrar no PROJUDI</button>
    </div>
    <div class="hint" style="margin-top:12px;">
      O Gerenciador de Perícia não pede nem guarda a sua senha ou o seu certificado. Quando o pedido precisar do seu login,
      a aba do PROJUDI vem para a frente e você entra como sempre: certificado digital (token) ou CPF, senha e o código
      que chega por e-mail. A extensão só usa a sessão que você abriu, e a busca continua sozinha depois disso.
    </div>`;

/* ---------- mensagens da extensão ---------- */
window.addEventListener('message', (ev) => {
  if(ev.source !== window || ev.origin !== location.origin || !ev.data || ev.data.__pf !== 'ext') return;
  const d = ev.data;
  switch(d.tipo){
    case 'pronta': {
      const antes = PJ.versao; PJ.versao = d.versao || '0';
      if(antes !== PJ.versao && ['perfil','projudi','publicacoes','integracoes'].includes(activeSection)) renderAll();
      if(!antes) setTimeout(pubVerificarDoDia, 4000);
      break;
    }
    case 'resposta': { const r = PJ.respostas.get(d.ref); if(r){ PJ.respostas.delete(d.ref); r(d); } break; }
    case 'oferta': PJ.ofertas.set(d.pedido.id, d.pedido); pjMostrarOfertas(); break;
    case 'status': {
      const casoId = pjCasoDoPedido(d.pedidoId, d.casoId);
      if(!casoId) break;
      const fim = ['fim','cancelado'].includes(d.etapa);
      pjStatus(casoId, {etapa: d.etapa === 'lista' ? 'buscando' : d.etapa, texto: d.texto, pedidoId: fim ? null : d.pedidoId});
      if(fim) delete PJ.pedidos[d.pedidoId];
      break;
    }
    case 'inicio': {
      const casoId = pjCasoDoPedido(d.pedido.id, d.pedido.casoId);
      PJ.pedidos[d.pedido.id] = casoId;
      pjStatus(casoId, {etapa:'transferindo', pedidoId:d.pedido.id, feitos:0, falhas:0, total:d.pedido.total,
        texto:`Recebendo ${d.pedido.total} arquivo(s)` + (d.pedido.pulados ? ` (${d.pedido.pulados} já estavam aqui)` : '') + '…'});
      break;
    }
    case 'arquivo': PJ.fila = PJ.fila.then(() => pjGravarArquivo(d)); break;
    case 'falha': {
      const casoId = pjCasoDoPedido(d.pedidoId, d.casoId);
      const s = PJ.status[casoId] || {};
      pjStatus(casoId, {feitos:(s.feitos||0)+1, falhas:(s.falhas||0)+1, texto:`Não foi possível baixar ${d.meta && d.meta.nome}: ${d.erro}`});
      break;
    }
    case 'fim': {
      PJ.fila = PJ.fila.then(() => {
        const casoId = pjCasoDoPedido(d.pedidoId, d.casoId);
        const s = PJ.status[casoId] || {};
        const r = d.resumo || {};
        const falhas = s.falhas || 0;
        pjStatus(casoId, {etapa: falhas && !r.gravados ? 'erro' : 'fim', pedidoId:null,
          texto: `${r.gravados || 0} arquivo(s) importado(s)` + (r.pulados ? `, ${r.pulados} já estavam aqui` : '') +
            (falhas ? `, ${falhas} com falha (peça de novo para tentar só esses)` : '') + '.'});
        delete PJ.pedidos[d.pedidoId];
        if(r.gravados && typeof iaAgendarAuto === 'function') iaAgendarAuto(casoId);
        if(drawerCasoId === casoId) renderDrawer();
        renderAll();
      });
      break;
    }
    case 'erro': {
      const casoId = pjCasoDoPedido(d.pedidoId, d.casoId);
      pjStatus(casoId, {etapa:'erro', texto:d.erro, pedidoId:null});
      delete PJ.pedidos[d.pedidoId];
      break;
    }
  }
});

/* ==========================================================================
   Telas novas (protótipo aprovado → app): Importar processo, Publicações,
   Tarefas, Agenda, Financeiro, Integrações e alertas de prazo.

   Os dados novos ficam DENTRO da perícia (mesmo documento do Firestore):
     tarefas:      [{id, titulo, col:'fazer'|'fazendo'|'feito', prio:'alta'|'media'|'baixa', ate}]
     compromissos: [{id, data, hora, titulo, local, tipo:'diligencia'|'audiencia'|'reuniao'|'outro'}]
     honorariosDepositados: número (o que já está depositado em juízo)
   Assim funciona no Firebase e no modo local, sem coleção nova nem regra nova.
   Partes que dependem de servidor (DJEN, e-mail, DataJud) aparecem como "a conectar".
   ========================================================================== */
const PF_TAREFA_COLS = [['fazer','A fazer'], ['fazendo','Em andamento'], ['feito','Feito']];
const PF_PRIO = {alta:'Alta', media:'Média', baixa:'Baixa'};
const PF_TIPO_COMP = {diligencia:'Diligência', audiencia:'Audiência', reuniao:'Reunião', outro:'Compromisso'};
const pfNovoId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pfEditaveis = () => casosVisiveis('todas').filter(c => podeEditar(c));
const pfOpcoesCasos = (sel) => pfEditaveis().map(c => `<option value="${c.id}" ${sel===c.id?'selected':''}>${escapeHtml(c.codigo)} · ${escapeHtml(c.nome)}</option>`).join('');
const pfEscolhaCaso = (sel) => `<option value="" ${sel ? '' : 'selected'} disabled>Escolha a perícia</option>` + pfOpcoesCasos(sel);
function pfQuando(iso){
  const n = diasAte(iso);
  if(n === null) return '';
  if(n < 0) return `${-n} dia${n===-1?'':'s'} em atraso`;
  if(n === 0) return 'hoje';
  if(n === 1) return 'amanhã';
  return `em ${n} dias`;
}
function pfPillData(iso, final){
  if(final) return `<span class="pill pill-success">feito</span>`;
  const n = diasAte(iso);
  if(n === null) return '';
  const cls = n < 0 ? 'pill-danger' : n <= 3 ? 'pill-danger' : n <= 7 ? 'pill-warning' : 'pill-muted';
  return `<span class="pill ${cls}">${pfQuando(iso)}</span>`;
}
function pfAviso(texto, desfazer, rotulo){
  const el = document.getElementById('pfAviso');
  if(!el) return;
  el.innerHTML = '';
  el.append(texto);
  if(desfazer){
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = rotulo || 'Desfazer';
    b.onclick = async () => { el.hidden = true; await desfazer(); };
    el.append(b);
  }
  el.hidden = false;
  clearTimeout(pfAviso.t); pfAviso.t = setTimeout(() => { el.hidden = true; }, desfazer ? 7000 : 3200);
}

/* ---------- Tarefas (quadro) ---------- */
function pfTodasTarefas(){
  const out = [];
  casosVisiveis('todas').forEach(c => (c.tarefas || []).forEach(t => out.push({...t, casoId:c.id, caso:c})));
  return out;
}
const pfTarefasAbertas = () => pfTodasTarefas().filter(t => t.col !== 'feito');

async function pfSalvarTarefas(casoId, transformar){
  const c = casos.find(x => x.id === casoId);
  if(!c || !podeEditar(c)) return;
  await saveCaso(casoId, {tarefas: transformar([...(c.tarefas || [])])});
  renderAll();
}
async function pfAddTarefa(ev){
  ev.preventDefault();
  const f = ev.target;
  const titulo = f.titulo.value.trim();
  if(!titulo || !f.caso.value){ pfAviso('Escreva a tarefa e escolha a perícia.'); return; }
  await pfSalvarTarefas(f.caso.value, l => [...l, {id:pfNovoId('t'), titulo, col:'fazer', prio:f.prio.value, ate:f.ate.value || ''}]);
  pfAviso('Tarefa criada.');
}
function pfMoverTarefa(casoId, id, col){ return pfSalvarTarefas(casoId, l => l.map(t => t.id === id ? {...t, col} : t)); }
function pfPassoTarefa(casoId, id, delta){
  const c = casos.find(x => x.id === casoId); const t = c && (c.tarefas || []).find(x => x.id === id);
  if(!t) return;
  const i = PF_TAREFA_COLS.findIndex(x => x[0] === t.col);
  const j = Math.max(0, Math.min(PF_TAREFA_COLS.length - 1, i + delta));
  if(i !== j) pfMoverTarefa(casoId, id, PF_TAREFA_COLS[j][0]);
}
async function pfApagarTarefa(casoId, id){
  const c = casos.find(x => x.id === casoId);
  const lista = c ? [...(c.tarefas || [])] : [];
  const t = lista.find(x => x.id === id);
  await pfSalvarTarefas(casoId, l => l.filter(x => x.id !== id));
  if(t) pfAviso('Tarefa apagada.', () => pfSalvarTarefas(casoId, () => lista));
}
function pfSoltar(ev, col){
  ev.preventDefault();
  ev.currentTarget.classList.remove('over');
  const [casoId, id] = (ev.dataTransfer.getData('text/plain') || '').split('|');
  if(casoId && id) pfMoverTarefa(casoId, id, col);
}

function renderTarefas(){
  const todas = pfTodasTarefas();
  const editaveis = pfEditaveis();
  const ordemPrio = {alta:0, media:1, baixa:2};
  const form = editaveis.length ? `
    <form class="pf-form" onsubmit="pfAddTarefa(event)">
      <label class="pf-campo pf-largo"><span>Tarefa</span><input name="titulo" id="pfTarefaTitulo" placeholder="Ex.: responder quesitos" required></label>
      <label class="pf-campo pf-largo"><span>Perícia</span><select name="caso" id="pfTarefaCaso" required>${pfEscolhaCaso(drawerCasoId)}</select></label>
      <label class="pf-campo"><span>Prioridade</span><select name="prio" id="pfTarefaPrio"><option value="alta">Alta</option><option value="media" selected>Média</option><option value="baixa">Baixa</option></select></label>
      <label class="pf-campo"><span>Até</span><input type="date" name="ate" id="pfTarefaAte"></label>
      <button class="btn btn-primary" type="submit">Adicionar</button>
    </form>` : `<div class="chart-empty">Crie uma perícia para começar a organizar as tarefas.</div>`;
  const colunas = PF_TAREFA_COLS.map(([k, rotulo], ci) => {
    const lista = todas.filter(t => (t.col || 'fazer') === k)
      .sort((a, b) => (ordemPrio[a.prio] ?? 1) - (ordemPrio[b.prio] ?? 1) || (a.ate || '9').localeCompare(b.ate || '9'));
    return `<div class="pf-kcol" data-col="${k}" ondragover="event.preventDefault(); this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="pfSoltar(event,${jsq(k)})">
      <h5>${rotulo}<span>${lista.length}</span></h5>
      ${lista.map(t => `
        <div class="pf-kcard" draggable="true" ondragstart="event.dataTransfer.setData('text/plain',${jsq(t.casoId + '|' + t.id)})">
          <div class="pf-krow"><span class="pf-prio ${PF_PRIO[t.prio] ? t.prio : 'media'}" title="prioridade ${PF_PRIO[t.prio] || 'Média'}"></span><b>${escapeHtml(t.titulo)}</b></div>
          <div class="pf-krow pf-kmeta"><button class="link-sutil mono" onclick="openDrawer(${jsq(t.casoId)})">${escapeHtml(t.caso.codigo)}</button><span style="flex:1"></span>${t.ate ? pfPillData(t.ate, k === 'feito') : ''}</div>
          <div class="pf-krow pf-kacoes">
            ${ci > 0 ? `<button class="btn btn-ghost btn-sm" onclick="pfPassoTarefa(${jsq(t.casoId)},${jsq(t.id)},-1)" aria-label="Voltar" title="Voltar para ${PF_TAREFA_COLS[ci-1][1]}">←</button>` : ''}
            ${ci < 2 ? `<button class="btn btn-ghost btn-sm" onclick="pfPassoTarefa(${jsq(t.casoId)},${jsq(t.id)},1)" aria-label="Avançar" title="Mover para ${PF_TAREFA_COLS[ci+1][1]}">→</button>` : ''}
            <span style="flex:1"></span>
            <button class="btn btn-ghost btn-sm" onclick="pfApagarTarefa(${jsq(t.casoId)},${jsq(t.id)})">Apagar</button>
          </div>
        </div>`).join('') || `<div class="pf-vazio">${['Nenhuma tarefa por fazer. Crie a próxima no formulário acima.', 'Arraste para cá a tarefa que você começar.', 'As tarefas concluídas aparecem aqui.'][ci]}</div>`}
    </div>`;
  }).join('');
  return `<div class="section-gap">
    ${panel('tarefasNova', 'Nova tarefa', 'fica ligada à perícia', form)}
    <div class="pf-kanban">${colunas}</div>
  </div>`;
}

/* ---------- Agenda (compromissos + prazos de entrega) ---------- */
function pfEventos(){
  const ev = [];
  casosVisiveis('todas').forEach(c => {
    (c.compromissos || []).forEach(m => ev.push({...m, casoId:c.id, caso:c, origem:'compromisso'}));
    if(c.prazoEntrega && !(STATUS[c.statusCaso] || {}).final) ev.push({id:'prazo-'+c.id, data:c.prazoEntrega, hora:'', titulo:'Entrega do laudo', local:c.vara || '', tipo:'prazo', casoId:c.id, caso:c, origem:'prazo'});
  });
  return ev.sort((a, b) => (a.data + (a.hora || '99')).localeCompare(b.data + (b.hora || '99')));
}
async function pfAddCompromisso(ev){
  ev.preventDefault();
  const f = ev.target;
  const c = casos.find(x => x.id === f.caso.value);
  if(!c || !f.titulo.value.trim() || !f.data.value){ pfAviso('Preencha o que é, a data e a perícia.'); return; }
  await saveCaso(c.id, {compromissos: [...(c.compromissos || []), {id:pfNovoId('m'), titulo:f.titulo.value.trim(), data:f.data.value, hora:f.hora.value || '', local:f.local.value.trim(), tipo:f.tipo.value}]});
  renderAll();
  pfAviso('Compromisso salvo.');
}
async function pfApagarCompromisso(casoId, id){
  const c = casos.find(x => x.id === casoId);
  if(!c || !podeEditar(c)) return;
  const lista = [...(c.compromissos || [])];
  await saveCaso(casoId, {compromissos: lista.filter(m => m.id !== id)});
  renderAll();
  pfAviso('Compromisso apagado.', async () => { await saveCaso(casoId, {compromissos: lista}); renderAll(); });
}
// Arquivo .ics: abre no Google Agenda, Outlook e celular.
function pfBaixarIcs(){
  const ev = pfEventos().filter(e => diasAte(e.data) >= -1);
  const esc = (s) => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const carimbo = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const linhas = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PericiaFlow//Agenda//PT-BR', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Gerenciador de Perícia', 'X-WR-TIMEZONE:America/Sao_Paulo'];
  ev.forEach(e => {
    const d = e.data.replace(/-/g, '');
    linhas.push('BEGIN:VEVENT', `UID:${e.id}-${e.casoId}@periciaflow`, `DTSTAMP:${carimbo}`);
    if(e.hora){
      const [h, m] = e.hora.split(':');
      const fimH = String(Math.min(23, +h + 1)).padStart(2, '0');
      linhas.push(`DTSTART;TZID=America/Sao_Paulo:${d}T${h}${m}00`, `DTEND;TZID=America/Sao_Paulo:${d}T${fimH}${m}00`);
    } else {
      const dt = new Date(e.data + 'T12:00:00'); dt.setDate(dt.getDate() + 1);
      linhas.push(`DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${dt.toISOString().slice(0, 10).replace(/-/g, '')}`);
    }
    linhas.push(`SUMMARY:${esc((e.tipo === 'prazo' ? 'PRAZO: ' : '') + e.titulo + ' — ' + e.caso.codigo)}`);
    if(e.local) linhas.push(`LOCATION:${esc(e.local)}`);
    linhas.push(`DESCRIPTION:${esc(e.caso.nome + (e.caso.numeroProcesso ? ' · Processo ' + e.caso.numeroProcesso : ''))}`, 'END:VEVENT');
  });
  linhas.push('END:VCALENDAR');
  const blob = new Blob([linhas.join('\r\n')], {type:'text/calendar;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'gerenciador-pericia-agenda.ics';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  pfAviso(`${ev.length} compromisso(s) exportado(s).`);
}
function renderAgenda(){
  const ev = pfEventos();
  const futuros = ev.filter(e => diasAte(e.data) >= 0);
  const passados = ev.filter(e => diasAte(e.data) < 0 && e.origem === 'compromisso').slice(-10).reverse();
  const sem = ['dom','seg','ter','qua','qui','sex','sáb'];
  const porDia = {};
  futuros.forEach(e => (porDia[e.data] = porDia[e.data] || []).push(e));
  const pillTipo = {prazo:'pill-danger', audiencia:'pill-warning', diligencia:'pill-accent', reuniao:'pill-muted', outro:'pill-muted'};
  const linha = (e) => `<div class="pf-ev">
      <time class="mono">${escapeHtml(e.hora || '—')}</time>
      <div style="flex:1; min-width:0;">
        <b>${escapeHtml(e.titulo)}</b> <span class="pill ${pillTipo[e.tipo] || 'pill-muted'}">${e.tipo === 'prazo' ? 'Prazo' : PF_TIPO_COMP[e.tipo] || 'Compromisso'}</span>
        <div class="hint"><button class="link-sutil mono" onclick="openDrawer(${jsq(e.casoId)})">${escapeHtml(e.caso.codigo)}</button>${e.local ? ' · ' + escapeHtml(e.local) : ''}</div>
      </div>
      ${e.origem === 'compromisso' && podeEditar(e.caso) ? `<button class="btn btn-ghost btn-sm" onclick="pfApagarCompromisso(${jsq(e.casoId)},${jsq(e.id)})">Apagar</button>` : ''}
    </div>`;
  const lista = Object.keys(porDia).length ? Object.entries(porDia).map(([d, itens]) => {
      const dt = new Date(d + 'T12:00:00');
      return `<div class="pf-dia"><div class="pf-dia-d"><b>${dt.getDate()}</b><small>${sem[dt.getDay()]}, ${dt.toLocaleDateString('pt-BR', {month:'short'}).replace('.', '')}</small></div><div>${itens.map(linha).join('')}</div></div>`;
    }).join('') : `<div class="chart-empty">Nenhum compromisso pela frente.</div>`;
  const form = pfEditaveis().length ? `
    <form class="pf-form" onsubmit="pfAddCompromisso(event)">
      <label class="pf-campo pf-largo"><span>O que é</span><input name="titulo" id="pfCompTitulo" placeholder="Ex.: diligência na sede da empresa" required></label>
      <label class="pf-campo"><span>Tipo</span><select name="tipo" id="pfCompTipo">${Object.entries(PF_TIPO_COMP).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
      <label class="pf-campo"><span>Data</span><input type="date" name="data" id="pfCompData" required></label>
      <label class="pf-campo"><span>Hora</span><input type="time" name="hora" id="pfCompHora"></label>
      <label class="pf-campo pf-largo"><span>Local</span><input name="local" id="pfCompLocal" placeholder="Endereço ou sala"></label>
      <label class="pf-campo"><span>Perícia</span><select name="caso" id="pfCompCaso" required>${pfEscolhaCaso(drawerCasoId)}</select></label>
      <button class="btn btn-primary" type="submit">Salvar</button>
    </form>` : `<div class="chart-empty">Crie uma perícia para agendar compromissos.</div>`;
  return `<div class="section-gap">
    <div class="pf-card">
      <div class="pf-linha"><div style="flex:1; min-width:0;"><b>Levar para o Google Agenda ou o celular</b>
        <div class="hint">Baixe o arquivo .ics com os compromissos e os prazos de entrega e abra no Google Agenda (Configurações → Importar) ou no celular. A sincronização automática com o Google é a próxima etapa.</div></div>
        <button class="btn btn-ghost" onclick="pfBaixarIcs()">Baixar agenda (.ics)</button></div>
    </div>
    ${panel('agendaNovo', 'Novo compromisso', 'vistoria, audiência, reunião', form)}
    ${panel('agendaLista', 'Próximos compromissos', `${futuros.length} na agenda`, lista)}
    ${passados.length ? panel('agendaPassados', 'Já aconteceram', 'últimos 10', passados.map(linha).join('')) : ''}
  </div>`;
}

/* ---------- Financeiro ---------- */
function pfFin(c){
  const arbitrado = +c.honorarios || 0;
  const levantado = +c.valorRecebido || 0;
  const depositado = Math.max(+c.honorariosDepositados || 0, levantado);
  return {arbitrado, depositado, levantado, semDeposito: Math.max(0, arbitrado - depositado), aLevantar: Math.max(0, depositado - levantado)};
}
async function pfSalvarDepositado(casoId, valor){
  const c = casos.find(x => x.id === casoId);
  if(!c || !podeEditar(c)) return;
  const v = Math.max(0, parseFloat(String(valor).replace(/\./g, '').replace(',', '.')) || 0);
  await saveCaso(casoId, {honorariosDepositados: v});
  renderAll();
  pfAviso('Valor depositado atualizado.');
}
function renderFinanceiro(){
  const base = casosVisiveis().filter(c => (+c.honorarios || 0) > 0 || (+c.valorRecebido || 0) > 0);
  const tot = base.reduce((s, c) => { const f = pfFin(c); Object.keys(f).forEach(k => s[k] = (s[k] || 0) + f[k]); return s; }, {});
  const linhas = base.sort((a, b) => pfFin(b).semDeposito - pfFin(a).semDeposito).map(c => {
    const f = pfFin(c);
    const pct = (v) => f.arbitrado ? Math.min(100, Math.round(100 * v / f.arbitrado)) : 0;
    return `<tr>
      <td><button class="link-sutil" onclick="openDrawer(${jsq(c.id)})"><b>${escapeHtml(c.nome)}</b></button><div class="hint mono">${escapeHtml(c.codigo)}</div></td>
      <td style="min-width:140px;"><div class="pf-fin-bar" title="levantado ${pct(f.levantado)}% · depositado ${pct(f.depositado)}%"><i class="lev" style="width:${pct(f.levantado)}%"></i><i class="dep" style="width:${pct(f.depositado) - pct(f.levantado)}%"></i></div></td>
      <td class="n">${fmtMoney(f.arbitrado)}</td>
      <td class="n">${podeEditar(c) ? `<input class="pf-num" id="pfDep-${c.id}" inputmode="decimal" value="${f.depositado ? f.depositado.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}) : ''}" placeholder="0,00" onchange="pfSalvarDepositado(${jsq(c.id)}, this.value)" aria-label="Depositado em juízo">` : fmtMoney(f.depositado)}</td>
      <td class="n">${fmtMoney(f.levantado)}</td>
    </tr>`;
  }).join('');
  return `<div class="section-gap">
    <div class="kpis">
      <div class="kpi"><div class="k">Arbitrado</div><div class="v">${fmtMoney(tot.arbitrado)}</div><div class="sub">${base.length} perícia${base.length === 1 ? '' : 's'} com honorários</div></div>

  if(f.codigo.value.trim() && !codigoAcessoValido(f.codigo.value)){ pfAviso('Confira o código de acesso: a chave do PROJUDI mistura letras e números, como zrrxk42nj8dcwbqmzd. Se não tiver, deixe em branco.'); f.codigo.focus(); return; }
  let casoId = f.destino.value;
  if(casoId === 'novo'){

/* ---------- Publicações (DJEN) ----------
   O DJEN (Comunica API do CNJ) é público, mas só responde a quem está no Brasil e não
   aceita chamada direta de outro site. Por isso a consulta passa pela extensão PROJUDI PDFs,
   que roda no navegador do perito. Busca pelo nome do perito (nomeações e intimações) e
   pelos números das perícias em andamento. O resultado fica guardado neste navegador; o que
   já foi lido fica no perfil, para valer em qualquer computador. */
const DJEN_VERSAO_EXT = '1.7.5';
const DJEN_LS = 'pf_djen_cache';
const PUB = {itens: null, rodando: false, progresso: '', erro: '', filtro: 'todas', busca: '', abertos: new Set(), ultima: null};
function djenExtOk(){
  if(!PJ.versao) return false;
  const a = PJ.versao.split('.').map(Number), b = DJEN_VERSAO_EXT.split('.').map(Number);
  for(let i = 0; i < 3; i++){ if((a[i] || 0) !== (b[i] || 0)) return (a[i] || 0) > (b[i] || 0); }
  return true;
}
function pubCarregarCache(){
  if(PUB.itens) return;
  try{
    const c = JSON.parse(localStorage.getItem(DJEN_LS) || '{}');
    PUB.itens = Array.isArray(c.itens) ? c.itens.filter(x => x && typeof x.id === 'string') : [];
    PUB.ultima = typeof c.ultima === 'string' ? c.ultima : null;
  }catch(e){ PUB.itens = []; }
}
function pubGuardarCache(){
  try{ localStorage.setItem(DJEN_LS, JSON.stringify({ultima: PUB.ultima, itens: (PUB.itens || []).slice(0, 400)})); }catch(e){}
}
function pubVistos(){ const v = perfil && perfil.pubVistos; return new Set(Array.isArray(v) ? v.map(String) : []); }
let pubVistosTimer = null;
function pubMarcarVisto(ids, render){
  const v = pubVistos();
  [].concat(ids).forEach(id => v.add(String(id)));
  perfil = {...perfil, pubVistos: [...v].slice(-1500)};
  persistirPerfilLocal();
  clearTimeout(pubVistosTimer);
  pubVistosTimer = setTimeout(() => salvarPerfil({pubVistos: perfil.pubVistos}), 800);
  if(render !== false) renderAll();
}
function pubNaoLidas(){ pubCarregarCache(); const v = pubVistos(); return (PUB.itens || []).filter(x => !v.has(x.id)).length; }

/* deixa cada comunicação num formato só, aceitando as variações de nome de campo da API */
function djenTextoLimpo(h){
  const div = document.createElement('div');
  div.innerHTML = String(h || '').replace(/<(br|\/p|\/div|\/li|\/tr)\s*\/?>/gi, '\n');
  return (div.textContent || '').replace(/ /g, ' ').replace(/[ \t]+/g, ' ').replace(/\n\s*\n+/g, '\n\n').trim();
}
function djenNormalizar(it, origem){
  const pega = (...ks) => { for(const k of ks){ if(it[k] != null && it[k] !== '') return it[k]; } return ''; };
  const id = String(pega('id', 'idComunicacao', 'hash') || '').slice(0, 80);
  if(!id) return null;
  const digitos = String(pega('numero_processo', 'numeroProcesso', 'numeroprocessocommascara')).replace(/\D/g, '');
  const mascara = String(pega('numeroprocessocommascara', 'numeroProcessoComMascara')) || (digitos.length === 20 ? `${digitos.slice(0,7)}-${digitos.slice(7,9)}.${digitos.slice(9,13)}.${digitos.slice(13,14)}.${digitos.slice(14,16)}.${digitos.slice(16)}` : digitos);
  const data = String(pega('data_disponibilizacao', 'dataDisponibilizacao', 'datadisponibilizacao')).slice(0, 10);
  const dest = Array.isArray(it.destinatarios) ? it.destinatarios.map(d => String((d && (d.nome || d.nomeDestinatario)) || '')).filter(Boolean).slice(0, 12) : [];
  const hash = String(pega('hash') || '');
  return {
    id, origem: [origem], hash: /^[A-Za-z0-9_-]{4,80}$/.test(hash) ? hash : '',
    data: /^\d{4}-\d{2}-\d{2}$/.test(data) ? data : todayIso(),
    tribunal: String(pega('siglaTribunal', 'sigla_tribunal')).slice(0, 20),
    orgao: String(pega('nomeOrgao', 'nome_orgao', 'orgao')).slice(0, 200),
    tipo: String(pega('tipoComunicacao', 'tipo_comunicacao')).slice(0, 60) || 'Comunicação',
    tipoDoc: String(pega('tipoDocumento', 'tipo_documento')).slice(0, 80),
    classe: String(pega('nomeClasse', 'nome_classe')).slice(0, 160),
    processo: digitos.length === 20 ? digitos : '', processoMascara: String(mascara).slice(0, 30),
    texto: djenTextoLimpo(pega('texto', 'conteudo')).slice(0, 20000),
    destinatarios: dest,
  };
}
function pubCasoDe(p){ return p.processo ? casosVisiveis().find(c => String(c.numeroProcesso || '').replace(/\D/g, '') === p.processo) : null; }
function pubEhNomeacao(p){ return /nomeio|nomead[oa] (como |para )?perit|nomea[çc][ãa]o d[oa] perit|designo .{0,40}perit|perit[oa] nomead/i.test(p.texto); }

async function pubVerificar(automatico){
  if(!temPro()){ if(!automatico) setSection('publicacoes'); return; }
  if(PUB.rodando) return;
  if(!djenExtOk()){ if(!automatico) pfAviso(`Instale ou atualize a extensão PROJUDI PDFs (versão ${DJEN_VERSAO_EXT} ou mais nova) para buscar no DJEN.`); return; }
  pubCarregarCache();
  const nome = String((fichaDe(meuEmail()) || {}).nomeCompleto || '').trim();
  const processos = [...new Set(casosVisiveis().filter(c => !(STATUS[c.statusCaso] || {}).final).map(c => String(c.numeroProcesso || '').replace(/\D/g, '')).filter(d => d.length === 20))].slice(0, 40);
  if(!nome && !processos.length){ if(!automatico) pfAviso('Preencha o seu nome completo em Meu perfil ou o número do processo nas perícias para buscar no DJEN.'); return; }
  PUB.rodando = true; PUB.erro = ''; renderPub();
  const hoje = todayIso();
  const menos = d => { const x = new Date(); x.setDate(x.getDate() - d); return x.toISOString().slice(0, 10); };
  const consultas = [];
  if(nome) consultas.push({origem: 'nome', rotulo: 'pelo seu nome', params: {nomeParte: nome, dataDisponibilizacaoInicio: menos(30), dataDisponibilizacaoFim: hoje, itensPorPagina: 100, pagina: 1}});
  processos.forEach(n => consultas.push({origem: 'processo', rotulo: 'processo ' + n.slice(0, 7), params: {numeroProcesso: n, dataDisponibilizacaoInicio: menos(90), dataDisponibilizacaoFim: hoje, itensPorPagina: 100, pagina: 1}}));
  const mapa = new Map((PUB.itens || []).map(x => [x.id, x]));
  let novos = 0, falhas = 0, ultimoErro = '';
  for(let i = 0; i < consultas.length; i++){
    const q = consultas[i];
    PUB.progresso = `Consultando ${q.rotulo} (${i + 1} de ${consultas.length})…`; renderPubProgresso();
    const r = await pjPedir({tipo: 'djen', params: q.params}, 40000);
    if(!r || !r.ok){ falhas++; ultimoErro = (r && r.erro) || 'sem resposta'; if(r && (r.status === 403 || r.status === 429)) break; continue; }
    for(const bruto of r.items || []){
      const n = djenNormalizar(bruto, q.origem);
      if(!n) continue;
      const ja = mapa.get(n.id);
      if(ja){ if(!ja.origem.includes(q.origem)) ja.origem.push(q.origem); continue; }
      mapa.set(n.id, n); novos++;
    }
  }
  PUB.itens = [...mapa.values()].sort((a, b) => b.data.localeCompare(a.data) || b.id.localeCompare(a.id));
  PUB.ultima = new Date().toISOString();
  try{ localStorage.setItem('pf_djen_dia', hoje); }catch(e){}
  pubGuardarCache();
  PUB.rodando = false; PUB.progresso = '';
  PUB.erro = falhas === consultas.length ? ultimoErro : falhas ? `${falhas} consulta${falhas === 1 ? '' : 's'} falharam (${ultimoErro}).` : '';
  if(!automatico || novos) pfAviso(novos ? `${novos} publicaç${novos === 1 ? 'ão nova' : 'ões novas'} no DJEN.` : PUB.erro ? 'O DJEN não respondeu como esperado.' : 'Nenhuma publicação nova no DJEN.');
  renderAll();
}
/* uma vez por dia, ao abrir o sistema com a extensão instalada */
function pubVerificarDoDia(){
  let dia = '';
  try{ dia = localStorage.getItem('pf_djen_dia') || ''; }catch(e){}
  if(dia !== todayIso() && djenExtOk() && meuEmail() && temPro()) pubVerificar(true);
}
function renderPubProgresso(){ const el = document.getElementById('pubProgresso'); if(el) el.textContent = PUB.progresso; }
function renderPub(){ if(activeSection === 'publicacoes'){ const v = document.getElementById('view'); if(v && !(document.activeElement && document.activeElement.id === 'pubBusca')) v.innerHTML = renderPublicacoes(); } }
function pubAlternar(id){

async function pubCriarPericia(id){
  const p = (PUB.itens || []).find(x => x.id === id);
  if(!p || !p.processo) return;
  if(pubCasoDe(p)){ openDrawer(pubCasoDe(p).id); return; }
  if(!possoCriar()){ pfAviso('Confirme o seu e-mail para criar perícias.'); return; }
  const dono = meuEmail();
  const comarca = (p.orgao.match(/comarca de ([^,–-]+)/i) || p.orgao.match(/ de ([A-ZÁ-Úa-zá-ú ]+)$/) || [])[1] || '';
  const casoId = await criarCaso({dono, emails: [dono], editores: [dono], compartilhamentos: [], codigo: nextCodigo(), nome: p.classe || `Processo ${p.processoMascara}`,
    numeroProcesso: p.processoMascara, codigoAcesso: '', vara: p.orgao, comarca: comarca.trim(), partes: '', dataNomeacao: p.data, prazoEntrega: p.data,
    honorarios: 0, valorRecebido: 0, statusCaso: 'aguardando_nomeacao', observacoes: [], origem: 'djen'});
  pubMarcarVisto(id, false);
  pfAviso('Perícia criada a partir da publicação. Confira os dados e o prazo.');
  openDrawer(casoId);
  renderAll();
}
function pubMarcarTodas(){ pubMarcarVisto((PUB.itens || []).map(x => x.id)); }

function renderPublicacoes(){

  const lista = PUB.itens || [];

  const grupos = new Map();

  const realce = t => {

        <span class="pub-orgao">${escapeHtml(x.orgao)}</span>
        ${lida ? '' : '<span class="pub-nova" title="não lida"></span>'}
      </header>
      <div class="pub-proc">
        <span class="mono">${escapeHtml(x.processoMascara || 'sem número')}</span>
        ${c ? `<button class="link-sutil" onclick="openDrawer(${jsq(c.id)})">${escapeHtml(c.codigo)} · ${escapeHtml(casoNomeCurto(c))}</button>` : x.classe ? `<span class="pub-classe">${escapeHtml(x.classe)}</span>` : ''}
      </div>

        ${x.hash ? `<a class="btn btn-ghost btn-sm" href="https://comunicaapi.pje.jus.br/api/v1/comunicacao/${encodeURIComponent(x.hash)}/certidao" target="_blank" rel="noopener">Certidão</a>` : ''}
        ${lida ? '' : `<button class="btn btn-ghost btn-sm" onclick="pubMarcarVisto(${jsq(x.id)})">Marcar como lida</button>`}

  const status = !PJ.versao

const PF_ALERTA_PADRAO = {dias:[7, 3, 1, 0], navegador:false};
function pfAlertas(){ try{ return {...PF_ALERTA_PADRAO, ...JSON.parse(localStorage.getItem('pf_alertas') || '{}')}; }catch(e){ return {...PF_ALERTA_PADRAO}; } }
function pfSalvarAlertas(cfg){ try{ localStorage.setItem('pf_alertas', JSON.stringify(cfg)); }catch(e){} renderAll(); }
function pfAlternarDia(d){
  const cfg = pfAlertas();
  cfg.dias = cfg.dias.includes(d) ? cfg.dias.filter(x => x !== d) : [...cfg.dias, d].sort((a, b) => b - a);
  pfSalvarAlertas(cfg);
}
async function pfAlternarNavegador(){
  const cfg = pfAlertas();
  if(!cfg.navegador){
    if(!('Notification' in window)){ pfAviso('Este navegador não mostra notificações.'); return; }
    const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
    if(p !== 'granted'){ pfAviso('O navegador não autorizou as notificações. Libere nas configurações do site.'); return; }
  }
  cfg.navegador = !cfg.navegador;
  pfSalvarAlertas(cfg);
  if(cfg.navegador) pfVerificarAlertas(true);
}
// Avisa no navegador os prazos que caem nos dias escolhidos (uma vez por prazo e por dia).
function pfVerificarAlertas(forcar){
  const cfg = pfAlertas();
  if(!cfg.navegador || !('Notification' in window) || Notification.permission !== 'granted') return 0;
  let enviados = {};
  try{ enviados = JSON.parse(localStorage.getItem('pf_alertas_enviados') || '{}'); }catch(e){}
  const hoje = todayIso();
  let n = 0;
  const avisar = (chave, titulo, corpo, casoId) => {
    if(enviados[chave] === hoje && !forcar) return;
    enviados[chave] = hoje; n++;
    try{
      const no = new Notification(titulo, {body: corpo, tag: chave, icon: 'icones/icone-192.png', badge: 'icones/favicon-32.png'});
      no.onclick = () => { window.focus(); if(casoId) openDrawer(casoId); };
    }catch(e){}
  };
  casosVisiveis().forEach(c => {
    if((STATUS[c.statusCaso] || {}).final || !c.prazoEntrega) return;
    const d = diasAte(c.prazoEntrega);
    if(cfg.dias.includes(d) || d < 0) avisar(`prazo-${c.id}-${c.prazoEntrega}`, d < 0 ? 'Prazo vencido' : d === 0 ? 'Prazo vence hoje' : `Prazo em ${d} dia${d === 1 ? '' : 's'}`, `${c.codigo} · ${c.nome}`, c.id);
  });
  pfTarefasAbertas().forEach(t => {
    if(!t.ate) return;
    const d = diasAte(t.ate);
    if(d === 0 || d === 1 || d < 0) avisar(`tarefa-${t.id}-${t.ate}`, d < 0 ? 'Tarefa atrasada' : d === 0 ? 'Tarefa para hoje' : 'Tarefa para amanhã', `${t.titulo} · ${t.caso.codigo}`, t.casoId);
  });
  try{ localStorage.setItem('pf_alertas_enviados', JSON.stringify(enviados)); }catch(e){}
  return n;
}

  const cfg = pfAlertas();
  const perm = 'Notification' in window ? Notification.permission : 'indisponivel';
  return `<div class="pf-grid2">

let pfIndTopo = null; // posição anterior do destaque, para ele deslizar
function renderNav(){
  const base = casosVisiveis();
  const atrasadas = base.filter(c => prazoState(c) === 'atrasada').length;
  const tarefasUrgentes = pfTarefasAbertas().filter(t => t.ate && diasAte(t.ate) <= 0).length;

    tarefas: tarefasUrgentes ? `<span class="nav-badge warn" title="${tarefasUrgentes} tarefa(s) para hoje ou atrasada(s)">${tarefasUrgentes}</span>` : '',

  const item = (id) => {

    return `<button class="nav-item ${activeSection === id ? 'active' : ''}" data-sec="${id}" onclick="setSection(${jsq(id)})" title="${escapeHtml(s.titulo)}" ${activeSection === id ? 'aria-current="page"' : ''}>

  };
  const html = PF_NAV.map(g => {

      <button class="pf-grupo-tit" onclick="pfAlternarGrupo(${jsq(g.id)})" aria-expanded="${aberto}" aria-controls="pfg-${g.id}">
        <span>${g.titulo}</span>${alerta ? '<i class="pf-ponto" aria-label="tem pendências"></i>' : ''}
        ${svg('<path d="M9 6l6 6-6 6"/>', 'class="pf-chev"')}
      </button>
      <div class="pf-grupo-corpo" id="pfg-${g.id}"><div class="pf-grupo-itens">${g.itens.map(item).join('')}</div></div>
    </div>`;
  }).join('');
  const nav = document.getElementById('nav');
  nav.innerHTML = `<span class="pf-ind" aria-hidden="true"></span>${html}`;
  requestAnimationFrame(() => pfPosicionarInd(true));
  pfObservarNav(nav);
}

// Destaque deslizante: anima ao trocar de tela; ao mudar o tamanho da barra, só acompanha.
function pfPosicionarInd(animar){
  const nav = document.getElementById('nav');
  const ind = nav && nav.querySelector('.pf-ind');
  const ativo = nav && nav.querySelector('.nav-item.active');
  if(!ind) return;
  if(!ativo || !ativo.offsetParent || getComputedStyle(ativo).visibility === 'hidden'){ ind.style.opacity = 0; return; }
  const topo = ativo.offsetTop, alt = ativo.offsetHeight;
  const deslizar = animar && pfIndTopo !== null && pfIndTopo !== topo;
  ind.style.transition = 'none';
  if(deslizar){ ind.style.transform = `translateY(${pfIndTopo}px)`; void ind.offsetHeight; ind.style.transition = ''; }
  ind.style.transform = `translateY(${topo}px)`; ind.style.height = alt + 'px'; ind.style.opacity = 1;
  if(!deslizar) requestAnimationFrame(() => { ind.style.transition = ''; });
  pfIndTopo = topo;
}
let pfNavObs = null;
function pfObservarNav(nav){
  if(pfNavObs || typeof ResizeObserver === 'undefined') return;
  pfNavObs = new ResizeObserver(() => pfPosicionarInd(false));
  pfNavObs.observe(nav);
  // a abertura/fechamento dos grupos é animada: acompanha até o fim
  nav.addEventListener('transitionend', (e) => { if(e.target.classList && e.target.classList.contains('pf-grupo-corpo')) pfPosicionarInd(false); });
}

    {grupo:'Ações', titulo:'Nova tarefa', sub:'no quadro de tarefas', icone:ICONS.tarefas, busca:'nova tarefa adicionar fazer', fazer:() => { setSection('tarefas'); setTimeout(() => { const i = document.getElementById('pfTarefaTitulo'); if(i) i.focus(); }, 50); }},
    {grupo:'Ações', titulo:'Novo compromisso', sub:'diligência, audiência ou reunião', icone:ICONS.agenda, busca:'novo compromisso agenda diligencia audiencia vistoria reuniao', fazer:() => { setSection('agenda'); setTimeout(() => { const i = document.getElementById('pfCompTitulo'); if(i) i.focus(); }, 50); }},
    {grupo:'Ações', titulo:'Alternar tema claro/escuro', sub:'', icone:'<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>', busca:'tema escuro claro modo noturno', fazer:() => toggleTheme()},
  ].filter(Boolean);
  return {telas, pericias, acoes};
}
function pfFiltrarPaleta(q){
  const {telas, pericias, acoes} = pfOpcoesPaleta();
  const termos = normalizeText(q).split(/\s+/).filter(Boolean);
  const casa = (o) => { const t = normalizeText(o.busca + ' ' + o.titulo); return termos.every(p => t.includes(p)); };
  let lista;
  if(!termos.length){
    const recentes = pericias.slice(-4).reverse();
    lista = [...acoes.slice(0, 4), ...recentes, ...telas.slice(0, 6)];
  } else {
    lista = [...telas.filter(casa).slice(0, 5), ...pericias.filter(casa).slice(0, 8), ...acoes.filter(casa).slice(0, 4)];
  }
  pfPal.itens = lista; pfPal.sel = 0;
  const box = document.getElementById('pfPalLista');
  if(!lista.length){ box.innerHTML = `<div class="pf-pal-vazio">Nada encontrado para “${escapeHtml(q)}”. Tente o número do processo ou o nome das partes.</div>`; return; }
  let grupo = '';
  box.innerHTML = lista.map((o, i) => {
    const cab = o.grupo !== grupo ? `<div class="pf-pal-grupo">${termos.length || o.grupo !== 'Perícias' ? o.grupo : 'Perícias recentes'}</div>` : '';
    grupo = o.grupo;
    return `${cab}<button class="pf-pal-item ${i === 0 ? 'sel' : ''}" role="option" aria-selected="${i === 0}" data-i="${i}" onmousemove="pfMarcarPaleta(${i})" onclick="pfExecutarPaleta(${i})">
      ${svg(o.icone)}<span class="pf-pal-txt"><b>${escapeHtml(o.titulo)}</b>${o.sub ? `<span>${escapeHtml(o.sub)}</span>` : ''}</span></button>`;
  }).join('');
}
function pfMarcarPaleta(i){
  if(i === pfPal.sel) return;
  pfPal.sel = i;
  document.querySelectorAll('.pf-pal-item').forEach(b => { const on = +b.dataset.i === i; b.classList.toggle('sel', on); b.setAttribute('aria-selected', on); });
  const atual = document.querySelector('.pf-pal-item.sel');
  if(atual) atual.scrollIntoView({block:'nearest'});
}
function pfExecutarPaleta(i){
  const o = pfPal.itens[i];
  pfFecharPaleta();
  if(o) o.fazer();
}
document.addEventListener('keydown', (e) => {
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '') || (document.activeElement || {}).isContentEditable;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); pfPal.aberta ? pfFecharPaleta() : pfAbrirPaleta(); return; }
  if(!pfPal.aberta){ if(e.key === '/' && !digitando){ e.preventDefault(); pfAbrirPaleta(); } return; }
  if(e.key === 'Escape'){ e.preventDefault(); pfFecharPaleta(); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); pfMarcarPaleta(Math.min(pfPal.itens.length - 1, pfPal.sel + 1)); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); pfMarcarPaleta(Math.max(0, pfPal.sel - 1)); }
  else if(e.key === 'Enter'){ e.preventDefault(); pfExecutarPaleta(pfPal.sel); }
});
// atalho certo para o sistema (⌘ no Mac)
setTimeout(() => { const k = document.getElementById('pfAtalho'); if(k && /Mac|iPhone|iPad/.test(navigator.platform)) k.textContent = '⌘K'; }, 0);

/* ========================================================================== */
aplicarRail();
aplicarAparencia();
renderAll();
initDb();
</script>
