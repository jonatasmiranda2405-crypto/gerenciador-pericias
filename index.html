<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Perícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
:root{
  color-scheme: light;
  --ground:#F3F5F4;
  --surface:#FFFFFF;
  --surface-2:#E9EDEB;
  --surface-3:#DFE5E3;
  --ink:#16202A;
  --ink-2:#31424A;
  --muted:#5B6B6E;
  --line:#DAE1DF;
  --line-strong:#C3CDCA;
  --accent:#14655C;
  --accent-deep:#0E4A44;
  --accent-soft:#E1EEEB;
  --ok:#2E6B4F;
  --ok-soft:#DFEDE5;
  --warn:#8A5F10;
  --warn-soft:#F4EAD2;
  --danger:#A33D33;
  --danger-soft:#F5E2DE;
  --violet:#5B4A86;
  --violet-soft:#EAE5F3;
  /* series validadas para superficie clara */
  --s1:#0b8f7f;
  --s2:#eb6834;
  --r1:#62c1b4; --r2:#38a99b; --r3:#0b8f7f; --r4:#0a7568; --r5:#085a50;
  --shadow:0 1px 2px rgba(22,32,42,.05), 0 10px 24px -16px rgba(22,32,42,.22);
  --radius:10px;
  --sidebar-w:248px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0E1417;
    --surface:#151D20;
    --surface-2:#1C262A;
    --surface-3:#243036;
    --ink:#E3EBE9;
    --ink-2:#C2D0CD;
    --muted:#93A5A2;
    --line:#27353A;
    --line-strong:#38484E;
    --accent:#5FB8AE;
    --accent-deep:#8FD3C9;
    --accent-soft:#12302D;
    --ok:#74C39A;
    --ok-soft:#163024;
    --warn:#D3A15A;
    --warn-soft:#332916;
    --danger:#E08B7A;
    --danger-soft:#33201C;
    --violet:#B3A3DD;
    --violet-soft:#241F33;
    --s1:#2a9d8f;
    --s2:#d95926;
    --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1417;
  --surface:#151D20;
  --surface-2:#1C262A;
  --surface-3:#243036;
  --ink:#E3EBE9;
  --ink-2:#C2D0CD;
  --muted:#93A5A2;
  --line:#27353A;
  --line-strong:#38484E;
  --accent:#5FB8AE;
  --accent-deep:#8FD3C9;
  --accent-soft:#12302D;
  --ok:#74C39A;
  --ok-soft:#163024;
  --warn:#D3A15A;
  --warn-soft:#332916;
  --danger:#E08B7A;
  --danger-soft:#33201C;
  --violet:#B3A3DD;
  --violet-soft:#241F33;
  --s1:#2a9d8f;
  --s2:#d95926;
  --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.num{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.011em;}
button{font-family:inherit;}
a{color:var(--accent); text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* ---------- estrutura ---------- */
.app{display:grid; grid-template-columns:var(--sidebar-w) 1fr; min-height:100%;}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:20px;
  padding:20px 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
.brand-mark{
  width:34px; height:34px; border-radius:8px; flex-shrink:0;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:13px; letter-spacing:.02em;
  font-family:'IBM Plex Mono',monospace;
}
.brand-text{min-width:0;}
.brand-name{font-size:13.5px; font-weight:600; line-height:1.2; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-top:2px; white-space:nowrap;}

.side-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); font-weight:600; padding:0 8px; margin-bottom:8px;
}
.peritos{display:flex; flex-direction:column; gap:6px;}
.perito-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 9px; border-radius:8px; cursor:pointer;
  border:1px solid transparent; background:transparent; color:inherit;
  transition:background .12s, border-color .12s;
}
.perito-btn:hover{background:var(--surface-2);}
.perito-btn.active{background:var(--pcolor-soft); border-color:var(--pcolor);}
.perito-avatar{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:var(--pcolor); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace;
}
:root[data-theme="dark"] .perito-avatar, :root:not([data-theme="light"]) .perito-avatar{color:#0E1417;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .perito-avatar{color:#fff;} }
.perito-info{min-width:0; display:flex; flex-direction:column;}
.perito-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.perito-count{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}

.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  border:none; background:transparent; color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-deep); font-weight:600;}
.nav-item svg{width:17px; height:17px; flex-shrink:0; stroke-width:1.75;}
.nav-badge{
  margin-left:auto; font-size:11px; font-family:'IBM Plex Mono',monospace;
  background:var(--surface-3); color:var(--muted);
  padding:1px 6px; border-radius:99px; font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-badge{background:var(--accent); color:var(--surface);}
.nav-badge.alert{background:var(--danger-soft); color:var(--danger);}

.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid var(--line);}
.account{display:flex; align-items:center; gap:8px; padding:0 4px; min-width:0;}
.account-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--muted);}
.account-dot.on{background:var(--ok);}
.account-text{min-width:0; font-size:11.5px; line-height:1.35;}
.account-state{color:var(--ink); font-weight:500;}
.account-mail{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.side-actions{display:flex; gap:6px;}

/* ---------- area principal ---------- */
.main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.menu-btn{display:none; background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px; cursor:pointer; color:var(--ink);}
.menu-btn svg{width:18px; height:18px; display:block;}
.topbar-title{display:flex; flex-direction:column; min-width:0; margin-right:auto;}
.topbar-title h1{font-size:19px;}
.topbar-title p{margin:1px 0 0; font-size:12.5px; color:var(--muted);}
.content{padding:24px 28px 72px; max-width:1180px; width:100%;}

/* ---------- controles ---------- */
.btn{
  border:1px solid transparent; border-radius:8px; padding:9px 14px;
  font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  transition:background .12s, border-color .12s, color .12s;
}
.btn svg{width:15px; height:15px; stroke-width:2;}
.btn-primary{background:var(--accent); color:var(--surface);}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn[disabled]{opacity:.5; cursor:default;}
.icon-btn{
  background:transparent; border:none; cursor:pointer; color:var(--muted);
  padding:4px; border-radius:6px; display:inline-flex; line-height:0;
}
.icon-btn svg{width:15px; height:15px; stroke-width:1.9;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}

.search{position:relative; flex:1 1 280px; max-width:420px;}
.search input{
  width:100%; padding:9px 12px 9px 34px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:13.5px; font-family:inherit;
}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); stroke-width:2;}

.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.chip:hover{border-color:var(--line-strong); color:var(--ink);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--surface);}

.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; display:inline-block; white-space:nowrap;}
.pill-muted{background:var(--surface-2); color:var(--muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-deep);}
.pill-warning{background:var(--warn-soft); color:var(--warn);}
.pill-success{background:var(--ok-soft); color:var(--ok);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}

.banner{
  border-radius:var(--radius); padding:11px 14px; font-size:12.5px;
  margin-bottom:18px; display:flex; gap:9px; align-items:flex-start;
  background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
}
.banner-info{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent);}
.banner svg{width:15px; height:15px; flex-shrink:0; margin-top:2px; stroke-width:2;}

/* ---------- blocos ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:18px 20px;
}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
.panel-head h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.panel-head .note{font-size:11.5px; color:var(--muted);}
.section-gap{display:flex; flex-direction:column; gap:18px;}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px;}
.kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.kpi .v{font-size:27px; font-weight:600; margin-top:5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.kpi .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.kpi.tone-danger{border-left:3px solid var(--danger);}
.kpi.tone-danger .v{color:var(--danger);}
.kpi.tone-accent{border-left:3px solid var(--accent);}
.kpi.tone-ok{border-left:3px solid var(--ok);}
.kpi.tone-ok .v{color:var(--ok);}

.two-col{display:grid; grid-template-columns:1.25fr 1fr; gap:18px;}

/* ---------- graficos ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.legend-swatch{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.bar-row{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:12px; align-items:center; margin-bottom:11px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{display:flex; align-items:center; gap:10px; min-width:0;}
.bar{display:flex; height:16px; flex:1; min-width:0; background:var(--surface-2); border-radius:4px; overflow:hidden; gap:2px;}
.bar-seg{height:100%; min-width:2px; transition:filter .12s;}
.bar-seg:first-child{border-radius:4px 0 0 4px;}
.bar-seg:last-child{border-radius:0 4px 4px 0;}
.bar-seg:only-child{border-radius:4px;}
.bar-seg:hover{filter:brightness(1.12);}
.bar-value{font-size:12px; color:var(--ink-2); white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.chart-empty{font-size:12.5px; color:var(--muted); padding:8px 0;}

#tooltip{
  position:fixed; z-index:200; pointer-events:none; opacity:0;
  background:var(--ink); color:var(--ground);
  padding:6px 9px; border-radius:6px; font-size:12px; line-height:1.4;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5); transition:opacity .1s;
  max-width:240px;
}
#tooltip .tt-v{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

/* ---------- lista de pericias ---------- */
.list{display:flex; flex-direction:column; gap:9px;}
.case{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 17px; display:grid; gap:14px; align-items:center; cursor:pointer;
  grid-template-columns:auto 1fr auto auto;
  transition:border-color .12s;
}
.case:hover{border-color:var(--accent);}
.case-code{font-size:11.5px; color:var(--accent-deep); background:var(--accent-soft); padding:4px 8px; border-radius:6px; font-weight:600; font-family:'IBM Plex Mono',monospace;}
.case-title{min-width:0;}
.case-name{font-weight:600; font-size:14.5px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-meta{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-prazo{text-align:right; white-space:nowrap;}
.case-prazo .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.case-prazo .d{font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:13px;}
.case-prazo.atrasada .d{color:var(--danger);}
.case-prazo.proxima .d{color:var(--warn);}
.case-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; white-space:nowrap;}
.case-valor{font-size:12.5px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

.empty-state{text-align:center; padding:48px 20px; color:var(--muted);}
.empty-state h3{color:var(--ink); margin-bottom:6px; font-size:15px;}
.empty-state p{margin:0; font-size:13px;}

/* ---------- tabelas / agenda / documentos ---------- */
.group{margin-bottom:22px;}
.group:last-child{margin-bottom:0;}
.group-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.group-head h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.group-rule{flex:1; height:1px; background:var(--line);}
.rows{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.row-item{
  background:var(--surface); padding:11px 15px; display:grid; gap:12px; align-items:center;
  grid-template-columns:1fr auto; cursor:pointer;
}
.row-item:hover{background:var(--surface-2);}
.row-main{min-width:0;}
.row-title{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-side{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.row-date{font-size:12.5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink-2);}
.row-date.late{color:var(--danger); font-weight:600;}
.row-date.soon{color:var(--warn); font-weight:600;}

/* ---------- projudi ---------- */
.svc{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; padding:13px 0; border-bottom:1px solid var(--line);}
.svc:last-child{border-bottom:none; padding-bottom:0;}
.svc-code{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
  background:var(--surface-2); color:var(--ink-2); padding:3px 8px; border-radius:6px; white-space:nowrap;
}
.svc-name{font-size:13.5px; font-weight:600;}
.svc-desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
.svc-fields{font-size:11.5px; color:var(--muted); margin-top:5px; font-family:'IBM Plex Mono',monospace;}
.consulta-form{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
.consulta-form input{
  flex:1 1 240px; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--ground); color:var(--ink); font-size:13.5px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
}
.kv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px;}
.kv{min-width:0;}
.kv .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.kv .v{font-size:13.5px; margin-top:2px; overflow-wrap:break-word;}

/* ---------- gaveta (detalhe da pericia) ---------- */
.drawer{
  position:fixed; inset:0; background:var(--ground); z-index:60;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none; transform:scale(.995);
  transition:opacity .16s ease, transform .16s ease;
}
.drawer.open{opacity:1; visibility:visible; pointer-events:auto; transform:scale(1);}
.drawer-head{
  padding:13px 24px; border-bottom:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap;
}
.back-btn{
  background:transparent; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:8px; flex-shrink:0;
}
.back-btn:hover{background:var(--surface-2); color:var(--ink);}
.back-btn svg{width:14px; height:14px; stroke-width:2.2;}
.codigo-input{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent-deep);
  background:var(--accent-soft); border:1px solid transparent; border-radius:6px;
  padding:6px 9px; font-weight:600; width:150px; flex-shrink:0;
}
.nome-input{
  font-size:18px; font-weight:600; border:1px solid transparent; background:transparent;
  color:var(--ink); flex:1; padding:4px 6px; min-width:160px; border-radius:6px;
  font-family:inherit; letter-spacing:-.011em;
}

  if(!pdfJsReady){
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      pdfJsReady = true;
    }catch(e){ return false; }
  }
  return true;
}
async function extractPdfInfo(bytes){
  const result = {processo:null, codigoAcesso:null};
  if(!ensurePdfJs()) return result;
  try{
    const doc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
    let text = '';
    const maxPages = Math.min(doc.numPages, 3);
    for(let i=1; i<=maxPages; i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += ' ' + content.items.map(it => it.str).join(' ');
      if(text.length > 20000) break;
    }
    result.processo = guessProcessoFromFilename(text);
    result.codigoAcesso = guessCodigoAcessoFromText(text);
  }catch(e){ /* PDF sem camada de texto, corrompido ou leitor indisponível */ }
  return result;
}

/* ==========================================================================
   Seleção e filtros
   ========================================================================== */
function matchesQuery(c, q){
  if(!q) return true;
  const hay = [c.codigo, c.nome, c.numeroProcesso, c.comarca, c.vara, c.partes].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function matchesFilter(c, f){
  if(f === 'todas') return true;
  if(f === 'ativas') return !STATUS[c.statusCaso].final;
  if(f === 'atrasadas') return prazoState(c) === 'atrasada';
  if(f === 'concluidas') return STATUS[c.statusCaso].final;
  return true;
}
function casosDoContador(contador){
  contador = contador || activeContador;
  return casos.filter(c => c.contador === contador);
}
function visibleCasos(){
  return casosDoContador()
    .filter(c => matchesFilter(c, activeFilter) && matchesQuery(c, searchQuery))
    .sort((a,b) => (a.prazoEntrega||'').localeCompare(b.prazoEntrega||''));
}
function todosDocumentos(){
  const out = [];
  casosDoContador().forEach(c => {
    (c.documentos||[]).forEach(d => out.push({...d, caso:c}));
  });
  return out.sort((a,b) => (b.data||'').localeCompare(a.data||''));
}

  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);

/* ==========================================================================

   ========================================================================== */
const tooltipEl = () => document.getElementById('tooltip');
function showTip(evt, html){
  const t = tooltipEl();
  t.innerHTML = html;
  t.style.opacity = '1';
  moveTip(evt);
}
function moveTip(evt){
  const t = tooltipEl();
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const r = t.getBoundingClientRect();
  if(x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if(y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function hideTip(){ tooltipEl().style.opacity = '0'; }

/* ==========================================================================
   Seção: visão geral
   ========================================================================== */
function chartHonorarios(base){
  const linhas = Object.entries(CONTADORES).map(([key, meta]) => {
    const list = casos.filter(c => c.contador === key);
    const recebido = list.reduce((s,c) => s + (c.valorRecebido||0), 0);
    const aReceber = list.reduce((s,c) => s + Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)), 0);
    return {nome: meta.label, recebido, aReceber, total: recebido + aReceber};
  }).filter(l => l.total > 0);

  if(linhas.length === 0) return `<div class="chart-empty">Nenhum honorário lançado ainda.</div>`;
  const max = Math.max(...linhas.map(l => l.total));

  return `
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s1)"></span>Recebido</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s2)"></span>A receber</span>
    </div>
    ${linhas.map(l => {
      const wR = max ? (l.recebido / max) * 100 : 0;
      const wA = max ? (l.aReceber / max) * 100 : 0;
      return `
      <div class="bar-row">
        <span class="bar-label">${escapeHtml(l.nome)}</span>
        <span class="bar-track">
          <span class="bar">
            ${l.recebido > 0 ? `<span class="bar-seg" style="width:${wR}%; background:var(--s1)"
              onmousemove="showTip(event, 'Recebido<br><span class=\\'tt-v\\'>${fmtMoney(l.recebido)}</span>')" onmouseleave="hideTip()"></span>` : ''}
            ${l.aReceber > 0 ? `<span class="bar-seg" style="width:${wA}%; background:var(--s2)"
              onmousemove="showTip(event, 'A receber<br><span class=\\'tt-v\\'>${fmtMoney(l.aReceber)}</span>')" onmouseleave="hideTip()"></span>` : ''}
          </span>
          <span class="bar-value">${fmtMoney(l.total)}</span>
        </span>
      </div>`;
    }).join('')}`;
}

function chartStatus(base){
  const counts = Object.entries(STATUS).map(([key, meta]) => ({
    key, label: meta.label, ramp: meta.ramp,
    n: base.filter(c => c.statusCaso === key).length
  }));
  const total = counts.reduce((s,c) => s + c.n, 0);
  if(total === 0) return `<div class="chart-empty">Nenhuma perícia cadastrada para este perito.</div>`;
  const max = Math.max(...counts.map(c => c.n));
  return counts.map(c => `
    <div class="bar-row">
      <span class="bar-label">${c.label}</span>
      <span class="bar-track">
        <span class="bar">
          ${c.n > 0 ? `<span class="bar-seg" style="width:${(c.n/max)*100}%; background:${c.ramp}"
            onmousemove="showTip(event, '${c.label}<br><span class=\\'tt-v\\'>${c.n} de ${total}</span>')" onmouseleave="hideTip()"></span>` : ''}
        </span>
        <span class="bar-value">${c.n}</span>
      </span>
    </div>`).join('');
}

function renderVisao(){
  const base = casosDoContador();
  const ativas = base.filter(c => !STATUS[c.statusCaso].final).length;
  const atrasadas = base.filter(c => prazoState(c) === 'atrasada').length;
  const aReceber = base.reduce((s,c) => s + Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)), 0);
  const recebido = base.reduce((s,c) => s + (c.valorRecebido||0), 0);
  const concluidas = base.filter(c => STATUS[c.statusCaso].final).length;
  const totalHon = aReceber + recebido;
  const pctRecebido = totalHon ? Math.round((recebido/totalHon)*100) : 0;

  const proximos = base
    .filter(c => !STATUS[c.statusCaso].final && c.prazoEntrega)
    .sort((a,b) => a.prazoEntrega.localeCompare(b.prazoEntrega))
    .slice(0,5);

  return `
    <div class="section-gap">
      <div class="kpis">
        <div class="kpi tone-accent">
          <div class="k">Em andamento</div>
          <div class="v">${ativas}</div>
          <div class="sub">de ${base.length} perícia${base.length===1?'':'s'}</div>
        </div>
        <div class="kpi ${atrasadas ? 'tone-danger' : ''}">
          <div class="k">Prazos atrasados</div>
          <div class="v">${atrasadas}</div>
          <div class="sub">${atrasadas ? 'exigem atenção imediata' : 'nenhum prazo vencido'}</div>
        </div>
        <div class="kpi">
          <div class="k">Honorários a receber</div>
          <div class="v">${fmtMoney(aReceber)}</div>
          <div class="sub">${pctRecebido}% do total já recebido</div>
        </div>
        <div class="kpi tone-ok">
          <div class="k">Concluídas</div>
          <div class="v">${concluidas}</div>
          <div class="sub">laudo entregue ou encerrada</div>
        </div>
      </div>

      <div class="two-col">
        <div class="panel">
          <div class="panel-head">
            <h3>Honorários por perito</h3>
            <span class="note">os dois peritos, acumulado</span>
          </div>
          ${chartHonorarios(base)}
        </div>
        <div class="panel">
          <div class="panel-head">
            <h3>Distribuição por status</h3>
            <span class="note">${base.length} perícia${base.length===1?'':'s'}</span>
          </div>
          ${chartStatus(base)}
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Próximas entregas</h3>
          <span class="note">perícias não concluídas</span>
        </div>
        ${proximos.length === 0
          ? `<div class="chart-empty">Nenhuma entrega pendente.</div>`
          : `<div class="rows">${proximos.map(c => rowPrazo(c)).join('')}</div>`}
      </div>
    </div>`;
}

function renderPericias(){
  const items = visibleCasos();
  const chips = [['todas','Todas'], ['ativas','Ativas'], ['atrasadas','Atrasadas'], ['concluidas','Concluídas']];
  const resumo = searchQuery ? resumoBusca() : '';
  return `
    <div class="section-gap">
      <div class="topbar-tools" style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <div class="search">
          ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
          <input id="searchInput" type="text" value="${escapeHtml(searchQuery)}" placeholder="Buscar por código, nome, processo, comarca ou partes" oninput="onSearch()">
        </div>
        <div class="chips">
          ${chips.map(([k,label]) => `<button class="chip ${activeFilter===k?'active':''}" onclick="setFilter('${k}')">${label}</button>`).join('')}
        </div>
      </div>
      ${resumo}
      ${items.length === 0
        ? `<div class="empty-state"><h3>Nenhuma perícia aqui</h3><p>Ajuste os filtros ou crie uma nova perícia.</p></div>`
        : `<div class="list">${items.map(c => cardCaso(c)).join('')}</div>`}
    </div>`;
}

function resumoBusca(){
  const matches = casosDoContador().filter(c => matchesQuery(c, searchQuery));
  if(matches.length === 0){
    return `<div class="panel"><div class="chart-empty">Nenhuma perícia encontrada para "${escapeHtml(searchQuery)}".</div></div>`;
  }
  const totalHonorarios = matches.reduce((s,c)=>s+(c.honorarios||0),0);
  const totalAReceber = matches.reduce((s,c)=>s+Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)),0);
  const atrasadasN = matches.filter(c=>prazoState(c)==='atrasada').length;
  return `
    <div class="panel">
      <div class="panel-head"><h3>Resumo da busca</h3><span class="note">"${escapeHtml(searchQuery)}"</span></div>
      <div class="kv-grid">
        <div class="kv"><div class="k">Encontradas</div><div class="v num">${matches.length}</div></div>
        <div class="kv"><div class="k">Honorários (total)</div><div class="v num">${fmtMoney(totalHonorarios)}</div></div>
        <div class="kv"><div class="k">A receber</div><div class="v num">${fmtMoney(totalAReceber)}</div></div>
        <div class="kv"><div class="k">Com prazo atrasado</div><div class="v num">${atrasadasN}</div></div>
      </div>
    </div>`;
}

function cardCaso(c){
  const st = prazoState(c);
  const saldo = Math.max(0,(c.honorarios||0)-(c.valorRecebido||0));
  return `
    <div class="case" onclick="openDrawer('${c.id}')">
      <span class="case-code">${escapeHtml(c.codigo)}</span>
      <div class="case-title">
        <div class="case-name">${escapeHtml(c.nome)}</div>
        <div class="case-meta">${escapeHtml(c.partes)} · ${escapeHtml(c.comarca)}${c.statusProcesso && STATUS_PROCESSO[c.statusProcesso] ? ' · '+STATUS_PROCESSO[c.statusProcesso].label : ''}</div>
      </div>
      <div class="case-prazo ${st}">

/* ==========================================================================
   Seção: agenda de prazos
   ========================================================================== */
function rowPrazo(c){
  const dias = diasAte(c.prazoEntrega);
  const st = prazoState(c);
  const cls = st === 'atrasada' ? 'late' : (st === 'proxima' ? 'soon' : '');
  let quando;
  if(dias === null) quando = '';
  else if(dias < 0) quando = `${Math.abs(dias)} dia${Math.abs(dias)===1?'':'s'} em atraso`;
  else if(dias === 0) quando = 'vence hoje';
  else quando = `em ${dias} dia${dias===1?'':'s'}`;
  return `
    <div class="row-item" onclick="openDrawer('${c.id}')">
      <div class="row-main">
        <div class="row-title">${escapeHtml(c.nome)}</div>
        <div class="row-sub"><span class="mono">${escapeHtml(c.codigo)}</span> · ${escapeHtml(c.partes)} · ${escapeHtml(c.vara||'vara não informada')}</div>
      </div>
      <div class="row-side">
        <span class="pill ${STATUS[c.statusCaso].pill}">${STATUS[c.statusCaso].label}</span>
        <span class="row-date ${cls}" title="${quando}">${fmtDate(c.prazoEntrega)}</span>
      </div>
    </div>`;
}

function renderPrazos(){
  const base = casosDoContador().filter(c => c.prazoEntrega);
  const pend = base.filter(c => !STATUS[c.statusCaso].final).sort((a,b) => a.prazoEntrega.localeCompare(b.prazoEntrega));
  const concl = base.filter(c => STATUS[c.statusCaso].final).sort((a,b) => b.prazoEntrega.localeCompare(a.prazoEntrega));

  const grupos = [
    {titulo:'Atrasados', teste: c => diasAte(c.prazoEntrega) < 0, vazio:'Nenhum prazo vencido.'},
    {titulo:'Próximos sete dias', teste: c => { const d = diasAte(c.prazoEntrega); return d >= 0 && d <= 7; }, vazio:'Nada vencendo nesta semana.'},
    {titulo:'Próximos trinta dias', teste: c => { const d = diasAte(c.prazoEntrega); return d > 7 && d <= 30; }, vazio:'Nada no mês.'},
    {titulo:'Mais adiante', teste: c => diasAte(c.prazoEntrega) > 30, vazio:'Nada agendado.'},
  ];

  const blocos = grupos.map(g => {
    const items = pend.filter(g.teste);
    return `
      <div class="group">
        <div class="group-head">
          <h4>${g.titulo}</h4>
          <span class="pill pill-muted">${items.length}</span>
          <span class="group-rule"></span>
        </div>
        ${items.length ? `<div class="rows">${items.map(rowPrazo).join('')}</div>` : `<div class="chart-empty">${g.vazio}</div>`}
      </div>`;
  }).join('');

  const concluido = concl.length ? `
    <div class="group">
      <div class="group-head">
        <h4>Encerradas</h4>
        <span class="pill pill-muted">${concl.length}</span>
        <span class="group-rule"></span>
      </div>
      <div class="rows">${concl.map(rowPrazo).join('')}</div>
    </div>` : '';

  return `<div class="panel">${blocos}${concluido}</div>`;
}

/* ==========================================================================
   Seção: documentos
   ========================================================================== */
function renderDocs(){
  let docs = todosDocumentos();
  if(docFiltroTipo !== 'todos') docs = docs.filter(d => (d.tipo||'Outro') === docFiltroTipo);
  if(docQuery){
    const q = normalizeText(docQuery);
    docs = docs.filter(d => normalizeText(`${d.nome} ${d.fase||''} ${d.caso.codigo} ${d.caso.nome}`).includes(q));
  }
  const tiposPresentes = [...new Set(todosDocumentos().map(d => d.tipo || 'Outro'))].sort();

  const porFase = {};
  docs.forEach(d => {
    const k = d.fase || 'Sem fase identificada';
    (porFase[k] = porFase[k] || []).push(d);
  });

  return `
    <div class="section-gap">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <div class="search">
          ${svg('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>')}
          <input id="docSearch" type="text" value="${escapeHtml(docQuery)}" placeholder="Buscar documento, fase ou perícia" oninput="onDocSearch()">
        </div>
        <div class="chips">
          <button class="chip ${docFiltroTipo==='todos'?'active':''}" onclick="setDocTipo('todos')">Todos</button>
          ${tiposPresentes.map(t => `<button class="chip ${docFiltroTipo===t?'active':''}" onclick="setDocTipo('${escapeHtml(t).replace(/'/g,"\\'")}')">${escapeHtml(t)}</button>`).join('')}
        </div>
      </div>

      ${docs.length === 0
        ? `<div class="empty-state"><h3>Nenhum documento</h3><p>Importe um ZIP dentro de uma perícia ou adicione documentos manualmente.</p></div>`
        : `<div class="panel">
            ${Object.entries(porFase).map(([fase, items]) => `
              <div class="group">
                <div class="group-head">
                  <h4>${escapeHtml(fase)}</h4>
                  <span class="pill pill-muted">${items.length}</span>
                  <span class="group-rule"></span>
                </div>
                <div class="rows">
                  ${items.map(d => `
                    <div class="row-item" onclick="abrirDocumento('${d.caso.id}','${d.id}')">
                      <div class="row-main">
                        <div class="row-title">${escapeHtml(d.nome)}</div>
                        <div class="row-sub"><span class="mono">${escapeHtml(d.caso.codigo)}</span> · ${escapeHtml(d.caso.nome)}${d.tamanho ? ' · '+fmtBytes(d.tamanho) : ''}</div>
                      </div>
                      <div class="row-side">
                        <span class="pill ${pillForTipo(d.tipo)}">${escapeHtml(d.tipo||'Outro')}</span>

async function startDbSync(){
  try{
    const snap = await db.collection('casos').get();
    if(snap.empty && casos.length){
      for(const c of casos){
        const {id, documentos, ...data} = c;
        await db.collection('casos').doc(id).set(data);
        for(const d of (documentos||[])){
          const {id:docId, ...docData} = d;
          await db.collection('casos').doc(id).collection('documentos').doc(docId).set(docData);
        }
      }
    }
  }catch(e){ /* segue para a inscrição mesmo assim */ }
  if(casosUnsub) casosUnsub();
  casosUnsub = db.collection('casos').onSnapshot(snap => {
    const prevDocs = {};
    casos.forEach(c => { prevDocs[c.id] = c.documentos; });
    casos = snap.docs.map(d => ({id:d.id, documentos: prevDocs[d.id] || [], ...d.data()}));
    renderAll();
  }, err => {
    cloudSetBanner(bannerAviso('Não foi possível sincronizar os dados agora (' + escapeHtml(err.code||'erro') + '). Exibindo a última versão conhecida.'));
  });
  if(drawerCasoId) subscribeDocumentos(drawerCasoId);
}

function loadCasosFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_CASOS_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed; }
  }catch(e){ }
  return null;
}
function persistCasosToLocalStorage(){
  if(!usingLocalStorage) return;
  try{
    localStorage.setItem(LS_CASOS_KEY, JSON.stringify(casos));
  }catch(e){
    cloudSetBanner(usingDb
      ? bannerAviso('O armazenamento local deste navegador está cheio, mas seus dados continuam salvos na nuvem normalmente.')
      : bannerAviso('O armazenamento local deste navegador está cheio e a última alteração pode não ter sido salva. Entre com o Google para sincronizar com a nuvem, ou remova documentos grandes que não sejam mais necessários.'));
  }
}

  cloudSetBanner(bannerInfo('Dados salvos automaticamente neste navegador. Entre com o Google (conta autorizada) para sincronizar entre dispositivos.'));

async function saveCaso(id, patch){
  const idx = casos.findIndex(c => c.id === id);
  if(idx === -1) return;
  casos[idx] = {...casos[idx], ...patch};
  if(usingDb){
    try{ await db.collection('casos').doc(id).update(patch); }
    catch(e){ /* mantém o estado local */ }
  } else {
    persistCasosToLocalStorage();
    renderAll();
  }
}
async function criarCaso(data){
  const id = 'c' + Date.now();
  const novo = {id, documentos:[], ...data};
  casos.push(novo);
  if(usingDb){
    try{ await db.collection('casos').doc(id).set(data); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  renderAll();
  return id;
}
async function excluirCaso(id){
  casos = casos.filter(c => c.id !== id);
  if(usingDb){
    try{
      const snap = await db.collection('casos').doc(id).collection('documentos').get();
      for(const d of snap.docs){ await db.collection('casos').doc(id).collection('documentos').doc(d.id).delete(); }
    }catch(e){}
    try{ await db.collection('casos').doc(id).delete(); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  closeDrawer();
  renderAll();
}

   ========================================================================== */
function subscribeDocumentos(casoId){
  if(currentDocsUnsub){ currentDocsUnsub(); currentDocsUnsub = null; }
  if(!usingDb) return;
  const c = casos.find(x => x.id === casoId);
  if(c && !Array.isArray(c.documentos)) c.documentos = [];
  currentDocsUnsub = db.collection('casos').doc(casoId).collection('documentos').onSnapshot(snap => {
    const cc = casos.find(x => x.id === casoId);
    if(!cc) return;
    cc.documentos = snap.docs.map(d => ({id:d.id, ...d.data()}));
    if(drawerCasoId === casoId) renderDrawer();
  }, err => { /* mantém último estado conhecido */ });
}
async function addDoc(casoId, data, docId){
  docId = docId || ('d'+Date.now()+Math.random().toString(36).slice(2,6));
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).set(data); return docId; }
    catch(e){ /* cai para o modo local */ }
  }
  const c = casos.find(x => x.id === casoId);
  if(!c) return docId;
  c.documentos = [...(c.documentos||[]), {id:docId, ...data}];
  persistCasosToLocalStorage();
  return docId;
}
async function updateDoc(casoId, docId, patch){
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).update(patch); return; }
    catch(e){}
  }
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  c.documentos = c.documentos.map(d => d.id === docId ? {...d, ...patch} : d);
  persistCasosToLocalStorage();
}
async function removeDoc(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && c.documentos && c.documentos.find(x => x.id === docId);
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).delete(); }
    catch(e){}
    if(d && d.arquivo && d.arquivo.storagePath && storage){
      try{ await storage.ref().child(d.arquivo.storagePath).delete(); }catch(e){}
    }
  } else {
    if(c) c.documentos = c.documentos.filter(x => x.id !== docId);
    persistCasosToLocalStorage();
  }
  renderDrawer(); renderAll();
}

async function buildArquivo(casoId, docId, bytes, filename, mime){
  if(!bytes || bytes.length === 0) return {arquivo:null, obs:''};
  if(usingDb && storage && bytes.length <= MAX_STORAGE_BYTES){
    try{
      const path = `casos/${casoId}/documentos/${docId}/${filename}`;
      const ref = storage.ref().child(path);
      await ref.put(bytes, {contentType: mime});
      const url = await ref.getDownloadURL();
      return {arquivo:{url, storagePath:path, mime, tamanho:bytes.length}, obs:''};
    }catch(e){
      /* Storage indisponível — cai para embutir no Firestore */
    }
  }
  const embedLimit = usingDb ? MAX_FIRESTORE_EMBED_BYTES : MAX_EMBED_BYTES;
  if(bytes.length <= embedLimit){
    return {arquivo:{dataUrl:`data:${mime};base64,${bytesToBase64(bytes)}`, mime, tamanho:bytes.length}, obs:''};
  }
  return {arquivo:null, obs:`Arquivo de ${fmtBytes(bytes.length)}, grande demais para armazenar; apenas o registro foi salvo.`};
}

async function addDocFromForm(casoId){
  const nomeInput = document.getElementById(`docNome-${casoId}`);
  const nome = nomeInput.value.trim();
  if(!nome) return;
  const fase = document.getElementById(`docFase-${casoId}`).value.trim() || 'Sem fase identificada';
  const tipo = document.getElementById(`docTipo-${casoId}`).value;
  const data = document.getElementById(`docData-${casoId}`).value || todayIso();
  let obs = document.getElementById(`docObs-${casoId}`).value.trim();
  const fileInput = document.getElementById(`docArquivo-${casoId}`);
  let arquivo = null, tamanho = null;
  let processo = guessProcessoFromFilename(nome);
  let codigoAcesso = null;
  const docId = 'd'+Date.now()+Math.random().toString(36).slice(2,6);
  if(fileInput.files[0]){
    const f = fileInput.files[0];
    processo = processo || guessProcessoFromFilename(f.name);
    const bytes = new Uint8Array(await f.arrayBuffer());
    tamanho = bytes.length;
    if(extOf(f.name) === 'pdf'){
      const info = await extractPdfInfo(bytes);
      processo = processo || info.processo;
      codigoAcesso = info.codigoAcesso;
    }
    const mime = f.type || mimeFor(extOf(f.name));
    const built = await buildArquivo(casoId, docId, bytes, f.name, mime);
    arquivo = built.arquivo;
    if(built.obs) obs = (obs ? obs+' — ' : '') + built.obs;
  }
  await addDoc(casoId, {nome, fase, tipo, data, obs, tamanho, arquivo, processo, codigoAcesso}, docId);
  const c = casos.find(x => x.id === casoId);
  if(c && processo && !c.numeroProcesso){ await saveCaso(casoId, {numeroProcesso: processo}); }
  if(c && codigoAcesso && !c.codigoAcesso){ await saveCaso(casoId, {codigoAcesso}); }
  nomeInput.value=''; document.getElementById(`docFase-${casoId}`).value=''; document.getElementById(`docObs-${casoId}`).value=''; fileInput.value='';
  renderDrawer(); renderAll();
}

async function handleZipImport(casoId, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const statusEl = document.getElementById(`zipStatus-${casoId}`);
  if(typeof JSZip === 'undefined'){
    statusEl.textContent = 'Não foi possível carregar o leitor de ZIP. Tente novamente em alguns instantes.';
    inputEl.value = '';
    return;
  }
  statusEl.textContent = 'Lendo arquivo ZIP...';
  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const entries = Object.values(zip.files).filter(f => !f.dir);
    if(entries.length === 0){ statusEl.textContent = 'O ZIP não contém arquivos.'; inputEl.value=''; return; }
    let imported = 0, semArquivo = 0;
    const processosDetectados = [];
    const codigosDetectados = [];
    for(const entry of entries){
      statusEl.textContent = `Importando ${imported+1} de ${entries.length}...`;
      const bytes = await entry.async('uint8array');
      const parts = entry.name.split('/').filter(Boolean);
      const filename = parts[parts.length-1];
      const folder = parts.length > 1 ? parts[0] : null;
      const guess = guessFromFilename(filename);
      const fase = cleanFolderName(folder) || guess.fase || 'Sem fase identificada';
      const tipo = guess.tipo;
      const data = guessDateFromFilename(filename) || isoFromDate(entry.date || new Date());
      let processo = guessProcessoFromFilename(entry.name);
      let codigoAcesso = null;
      if(extOf(filename) === 'pdf'){
        statusEl.textContent = `Lendo texto do PDF ${imported+1} de ${entries.length}...`;
        const info = await extractPdfInfo(bytes);
        processo = processo || info.processo;
        codigoAcesso = info.codigoAcesso;
      }
      if(processo) processosDetectados.push(processo);
      if(codigoAcesso) codigosDetectados.push(codigoAcesso);
      let arquivo = null, obs = '';
      const docId = 'd'+Date.now()+Math.random().toString(36).slice(2,6);
      if(bytes.length > 0){
        const built = await buildArquivo(casoId, docId, bytes, filename, mimeFor(extOf(filename)));
        arquivo = built.arquivo;
        if(built.obs){ semArquivo++; obs = built.obs; }
      }
      await addDoc(casoId, {nome:filename, fase, tipo, data, obs, tamanho:bytes.length, arquivo, processo, codigoAcesso}, docId);
      imported++;
    }
    let processoMsg = '';
    const c = casos.find(x => x.id === casoId);
    if(c && processosDetectados.length){
      const freq = {};
      processosDetectados.forEach(p => { freq[p] = (freq[p]||0)+1; });
      const maisFrequente = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
      if(!c.numeroProcesso){
        await saveCaso(casoId, {numeroProcesso: maisFrequente});
        processoMsg = ` Número do processo identificado nos documentos e preenchido automaticamente: ${maisFrequente}.`;
      } else {
        const divergentes = processosDetectados.filter(p => p !== c.numeroProcesso).length;
        if(divergentes > 0){
          processoMsg = ` Atenção: ${divergentes} documento(s) têm número de processo diferente do cadastrado nesta perícia (${c.numeroProcesso}) — verifique se foram importados no caso certo.`;
        }
      }
    }
    let codigoMsg = '';
    if(c && codigosDetectados.length && !c.codigoAcesso){
      const freqC = {};
      codigosDetectados.forEach(p => { freqC[p] = (freqC[p]||0)+1; });
      const codigoMaisFrequente = Object.entries(freqC).sort((a,b)=>b[1]-a[1])[0][0];
      await saveCaso(casoId, {codigoAcesso: codigoMaisFrequente});
      codigoMsg = ` Código de acesso identificado nos documentos: ${codigoMaisFrequente}.`;
    }
    statusEl.textContent = `Importação concluída: ${imported} documento(s) adicionados${semArquivo ? ', '+semArquivo+' sem arquivo anexado (muito grandes)' : ''}.${processoMsg}${codigoMsg}`;
  }catch(e){
    statusEl.textContent = 'Não foi possível ler este ZIP. Verifique o arquivo e tente novamente.';
  }
  inputEl.value = '';
  renderDrawer(); renderAll();
}

async function downloadDoc(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && c.documentos.find(x => x.id === docId);
  if(!d || !d.arquivo) return;
  const src = arquivoSrc(d.arquivo);
  try{
    const res = await fetch(src);
    if(!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = d.nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }catch(e){
    window.open(src, '_blank');
  }
}

function editDoc(docId){ editingDocId = docId; renderDrawer(); }
function cancelEditDoc(){ editingDocId = null; renderDrawer(); }
async function saveDocEdit(casoId, docId){
  const fase = document.getElementById(`editFase-${docId}`).value.trim() || 'Sem fase identificada';
  const tipo = document.getElementById(`editTipo-${docId}`).value;
  const data = document.getElementById(`editData-${docId}`).value;
  await updateDoc(casoId, docId, {fase, tipo, data});
  editingDocId = null;
  renderDrawer(); renderAll();
}

function groupByFase(docs){
  const groups = {};
  (docs||[]).forEach(d => {
    const key = d.fase || 'Sem fase identificada';
    (groups[key] = groups[key] || []).push(d);
  });
  const entries = Object.entries(groups).map(([fase, items]) => {
    items.sort((a,b) => (a.data||'').localeCompare(b.data||''));
    const minDate = items.reduce((min,i) => (i.data && (!min || i.data < min)) ? i.data : min, null);
    return {fase, items, minDate};
  });
  entries.sort((a,b) => {
    if(a.fase === 'Sem fase identificada') return 1;
    if(b.fase === 'Sem fase identificada') return -1;
    return (a.minDate || '9999-99-99').localeCompare(b.minDate || '9999-99-99');
  });
  return entries;
}

/* ==========================================================================
   Gaveta de detalhe e visualizador
   ========================================================================== */
function openDrawer(id){
  drawerCasoId = id;
  editingDocId = null;
  document.getElementById('drawer').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderDrawer();
  subscribeDocumentos(id);
}
function closeDrawer(){
  if(currentDocsUnsub){ currentDocsUnsub(); currentDocsUnsub = null; }
  drawerCasoId = null;
  editingDocId = null;
  document.getElementById('drawer').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('drawer').innerHTML = '';
  renderAll();
}
function openViewer(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && (c.documentos||[]).find(x => x.id === docId);
  if(!d || !d.arquivo) return;
  const src = arquivoSrc(d.arquivo);
  const mime = arquivoMime(d.arquivo);
  let bodyHtml;
  if(mime === 'application/pdf'){
    bodyHtml = `<iframe src="${src}" title="${escapeHtml(d.nome)}"></iframe>`;
  } else if(mime.startsWith('image/')){
    bodyHtml = `<img src="${src}" alt="${escapeHtml(d.nome)}">`;
  } else {
    bodyHtml = `<div class="viewer-fallback">Pré-visualização não disponível para este tipo de arquivo.<br><button class="btn btn-ghost btn-sm" style="margin-top:12px;" onclick="downloadDoc('${casoId}','${docId}')">Baixar arquivo</button></div>`;
  }
  document.getElementById('viewerTitle').textContent = d.nome;
  document.getElementById('viewerBody').innerHTML = bodyHtml;
  document.getElementById('viewerOverlay').classList.add('open');
}
function closeViewer(){
  document.getElementById('viewerOverlay').classList.remove('open');
  document.getElementById('viewerBody').innerHTML = '';
}

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(document.getElementById('viewerOverlay').classList.contains('open')){ closeViewer(); return; }
  if(drawerCasoId) closeDrawer();
  else if(document.body.classList.contains('nav-open')) toggleNav(false);
});

function renderDocItem(c, d){
  const faseListId = `faseList-${c.id}`;
  if(editingDocId === d.id){
    return `
      <div class="doc-item editing">
        <input list="${faseListId}" id="editFase-${d.id}" value="${escapeHtml(d.fase||'')}" placeholder="Fase / despacho" style="width:100%; margin-bottom:6px; border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:var(--ground); color:var(--ink); font-family:inherit; font-size:13px;">
        <div class="add-row">
          <select id="editTipo-${d.id}">${DOC_TYPES.map(t=>`<option value="${t}" ${d.tipo===t?'selected':''}>${t}</option>`).join('')}</select>
          <input type="date" id="editData-${d.id}" value="${d.data||''}">
        </div>
        <div class="add-row">
          <button class="btn btn-primary btn-sm" onclick="saveDocEdit('${c.id}','${d.id}')">Salvar</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelEditDoc()">Cancelar</button>
        </div>
      </div>`;
  }
  const sizeTxt = fmtBytes(d.tamanho);
  const processoDivergente = d.processo && c.numeroProcesso && d.processo !== c.numeroProcesso;
  const openAttr = d.arquivo ? `onclick="openViewer('${c.id}','${d.id}')"` : '';
  return `
    <div class="doc-item ${d.arquivo ? 'has-file' : ''}" ${openAttr} ${d.arquivo ? `title="Clique para abrir ${escapeHtml(d.nome)}"` : ''}>
      <div style="min-width:0;">
        <div class="d-name">${escapeHtml(d.nome)}</div>
        <div class="d-meta">
          <span class="pill ${pillForTipo(d.tipo)}" style="margin-right:6px;">${escapeHtml(d.tipo||'Outro')}</span>
          <span class="mono">${fmtDate(d.data)}</span>${sizeTxt ? ' · '+sizeTxt : ''}${d.obs ? ' · '+escapeHtml(d.obs) : ''}
        </div>
        ${d.processo ? `<div class="d-meta">${processoDivergente ? `<span class="pill pill-warning" title="Processo cadastrado na perícia: ${escapeHtml(c.numeroProcesso)}">Processo diverge: <span class="mono">${escapeHtml(d.processo)}</span></span>` : `Processo: <span class="mono">${escapeHtml(d.processo)}</span>`}</div>` : ''}
        ${d.codigoAcesso ? `<div class="d-meta">Código de acesso: <span class="mono">${escapeHtml(d.codigoAcesso)}</span></div>` : ''}
      </div>
      <div class="d-actions">
        ${d.arquivo ? `<button class="icon-btn" title="Abrir arquivo" onclick="event.stopPropagation(); openViewer('${c.id}','${d.id}')">${svg('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>')}</button>` : ''}
        ${d.arquivo ? `<button class="icon-btn" title="Baixar arquivo" onclick="event.stopPropagation(); downloadDoc('${c.id}','${d.id}')">${svg('<path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>')}</button>` : ''}
        <button class="icon-btn" title="Editar" onclick="event.stopPropagation(); editDoc('${d.id}')">${svg('<path d="M4 20h4L19 9a2.1 2.1 0 00-3-3L5 17z"/>')}</button>
        <button class="icon-btn danger" title="Remover" onclick="event.stopPropagation(); removeDoc('${c.id}','${d.id}')">${svg('<path d="M18 6L6 18M6 6l12 12"/>')}</button>
      </div>
    </div>`;
}

function renderDocumentosSection(c){
  const docs = c.documentos || [];
  const faseListId = `faseList-${c.id}`;
  const groups = groupByFase(docs);
  const existingFases = [...new Set(docs.map(d => d.fase).filter(Boolean))];
  const suggestions = [...new Set([...existingFases, ...SUGGESTED_FASES])];
  const docTypeOptions = DOC_TYPES.map(t => `<option value="${t}">${t}</option>`).join('');
  const limite = usingDb && storage ? '50 MB' : '5 MB';
  return `
    <div class="sub">
      <h4>Documentos (${docs.length}) — por fase e data</h4>
      ${docs.length===0 ? `<div class="hint" style="margin-bottom:10px;">Nenhum documento ainda. Importe um ZIP ou adicione manualmente abaixo.</div>` : ''}
      ${groups.map(g => `
        <div class="fase-group">
          <div class="fase-title"><span>${escapeHtml(g.fase)}</span><span class="pill pill-muted">${g.items.length}</span></div>
          ${g.items.map(d => renderDocItem(c,d)).join('')}
        </div>`).join('')}

      <datalist id="${faseListId}">${suggestions.map(s => `<option value="${escapeHtml(s)}">`).join('')}</datalist>

      <div class="import-box">
        <input type="file" id="zipInput-${c.id}" accept=".zip" style="display:none" onchange="handleZipImport('${c.id}', this)">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('zipInput-${c.id}').click()">Importar ZIP de documentos</button>
        <div class="hint">Cada arquivo é separado por pasta (fase ou despacho) e pela data no nome. Arquivos até ${limite} ficam anexados; os maiores entram apenas como registro.</div>
        <div id="zipStatus-${c.id}" class="hint" style="color:var(--accent-deep);"></div>
      </div>

      <div style="margin-top:14px;">
        <div class="add-row" style="flex-wrap:wrap;">
          <input id="docNome-${c.id}" placeholder="Nome do documento" style="flex:1 1 100%;">
        </div>
        <div class="add-row">
          <input id="docFase-${c.id}" list="${faseListId}" placeholder="Fase / despacho">
          <select id="docTipo-${c.id}">${docTypeOptions}</select>
        </div>
        <div class="add-row">
          <input id="docData-${c.id}" type="date" value="${todayIso()}">
          <input id="docObs-${c.id}" placeholder="Observação (opcional)">
        </div>
        <div class="add-row">
          <input type="file" id="docArquivo-${c.id}" style="flex:1; border:none; padding:4px 0; background:transparent; font-size:12px;">
          <button class="btn btn-ghost btn-sm" onclick="addDocFromForm('${c.id}')">Adicionar</button>
        </div>
      </div>
    </div>`;
}

function renderObservacoesSection(c){
  const obs = c.observacoes || [];
  return `
    <div class="sub">
      <h4>Comentários e observações (${obs.length})</h4>
      <div class="add-row" style="flex-wrap:wrap; margin-top:0; margin-bottom:10px;">
        <textarea id="obsTexto-${c.id}" placeholder="Escreva um comentário sobre o andamento da perícia" style="flex:1 1 100%; min-height:64px; resize:vertical;"></textarea>
      </div>
      <div class="add-row" style="margin-top:0; margin-bottom:16px;"><button class="btn btn-ghost btn-sm" onclick="addObs('${c.id}')">Adicionar comentário</button></div>
      ${obs.length===0 ? `<div class="hint">Nenhum comentário ainda.</div>` : ''}
      ${[...obs].reverse().map(o => `
        <div class="obs-item"><div><div class="o-date mono">${fmtDate(o.data)}</div>${escapeHtml(o.texto)}</div></div>`).join('')}
    </div>`;
}

function renderDrawer(){
  const c = casos.find(x => x.id === drawerCasoId);
  if(!c){ closeDrawer(); return; }
  const saldo = (c.honorarios||0) - (c.valorRecebido||0);
  const statusOptions = Object.entries(STATUS).map(([k,v]) => `<option value="${k}" ${c.statusCaso===k?'selected':''}>${v.label}</option>`).join('');
  const contadorOptions = Object.entries(CONTADORES).map(([k,v]) => `<option value="${k}" ${c.contador===k?'selected':''}>${v.label}</option>`).join('');
  const statusProcessoOptions = `<option value="">—</option>` + Object.entries(STATUS_PROCESSO).map(([k,v]) => `<option value="${k}" ${c.statusProcesso===k?'selected':''}>${v.label}</option>`).join('');

  document.getElementById('drawer').innerHTML = `
    <div class="drawer-head">
      <button class="back-btn" onclick="closeDrawer()">
        ${svg('<path d="M19 12H5M11 18l-6-6 6-6"/>')}
        Voltar
      </button>
      <input class="codigo-input" value="${escapeHtml(c.codigo)}" onchange="fieldUpdate('${c.id}','codigo',this.value)" aria-label="Código da perícia">
      <input class="nome-input" value="${escapeHtml(c.nome)}" onchange="fieldUpdate('${c.id}','nome',this.value)" aria-label="Nome da perícia">
      <button class="btn btn-danger btn-sm" onclick="confirmDelete('${c.id}')">Excluir perícia</button>
    </div>
    <div class="drawer-body">
      <div id="drawerAlert-${c.id}" style="padding:0 24px;"></div>

      <div class="meta-grid">
        <div class="meta-item"><label>Perito responsável</label>
          <select onchange="changeContadorDoCaso('${c.id}', this.value)">${contadorOptions}</select>
        </div>
        <div class="meta-item"><label>Número do processo</label><input class="mono" value="${escapeHtml(c.numeroProcesso)}" onchange="fieldUpdate('${c.id}','numeroProcesso',this.value)"></div>
        <div class="meta-item"><label>Código de acesso</label><input class="mono" value="${escapeHtml(c.codigoAcesso||'')}" placeholder="—" onchange="fieldUpdate('${c.id}','codigoAcesso',this.value)"></div>
        <div class="meta-item"><label>Status do processo</label>
          <select onchange="fieldUpdate('${c.id}','statusProcesso',this.value)">${statusProcessoOptions}</select>
        </div>
        <div class="meta-item"><label>Vara</label><input value="${escapeHtml(c.vara)}" onchange="fieldUpdate('${c.id}','vara',this.value)"></div>
        <div class="meta-item"><label>Comarca</label><input value="${escapeHtml(c.comarca)}" onchange="fieldUpdate('${c.id}','comarca',this.value)"></div>
        <div class="meta-item"><label>Partes</label><input value="${escapeHtml(c.partes)}" onchange="fieldUpdate('${c.id}','partes',this.value)"></div>
        <div class="meta-item"><label>Data de nomeação</label><input type="date" value="${c.dataNomeacao}" onchange="fieldUpdate('${c.id}','dataNomeacao',this.value)"></div>
        <div class="meta-item"><label>Prazo de entrega</label><input type="date" value="${c.prazoEntrega}" onchange="fieldUpdate('${c.id}','prazoEntrega',this.value)"></div>
        <div class="meta-item"><label>Status</label>
          <select onchange="fieldUpdate('${c.id}','statusCaso',this.value)">${statusOptions}</select>
        </div>
        <div class="meta-item"><label>Honorários (R$)</label><input type="number" step="0.01" value="${c.honorarios}" onchange="fieldUpdate('${c.id}','honorarios',this.value,true)"></div>
        <div class="meta-item"><label>Valor recebido (R$)</label><input type="number" step="0.01" value="${c.valorRecebido}" onchange="fieldUpdate('${c.id}','valorRecebido',this.value,true)"></div>
        <div class="meta-item"><label>Saldo a receber</label><div class="readout" style="color:${saldo>0?'var(--danger)':'var(--ok)'}">${fmtMoney(Math.max(0,saldo))}</div></div>
      </div>

      <div class="drawer-cols">
        <div class="col-pane col-docs">${renderDocumentosSection(c)}</div>
        <div class="col-pane">${renderObservacoesSection(c)}</div>
      </div>
    </div>`;
}

async function addObs(casoId){
  const input = document.getElementById(`obsTexto-${casoId}`);
  const texto = input.value.trim();
  if(!texto) return;
  const c = casos.find(x => x.id === casoId);
  const observacoes = [...(c.observacoes||[]), {id:'o'+Date.now(), data:todayIso(), texto}];
  await saveCaso(casoId, {observacoes});
  renderDrawer();
}
function confirmDelete(casoId){
  document.getElementById(`drawerAlert-${casoId}`).innerHTML = `
    <div class="confirm-box" style="margin:16px 0 0;">
      Excluir esta perícia e todos os seus documentos e comentários? Esta ação não pode ser desfeita.
      <div class="row">
        <button class="btn btn-danger btn-sm" onclick="excluirCaso('${casoId}')">Sim, excluir</button>
        <button class="btn btn-ghost btn-sm" onclick="renderDrawer()">Cancelar</button>
      </div>
    </div>`;
}

initDb();
