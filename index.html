/* ==========================================================================
   Cálculo 2 — atualização de débito (correção + juros + multa)
   ========================================================================== */
async function rodarAtualizacao(){
  const principal = num(document.getElementById('aValor').value);
  const di = document.getElementById('aInicio').value;
  const df = document.getElementById('aFim').value;
  const chave = document.getElementById('aIndice').value;
  const jurosMes = num(document.getElementById('aJuros').value) / 100;
  const tipoJuros = document.getElementById('aTipoJuros').value;
  const multa = num(document.getElementById('aMulta').value) / 100;
  const baseMulta = document.getElementById('aBaseMulta').value;
  const saida = document.getElementById('calcSaidaBox');

  if(principal <= 0 || !di || !df){ saida.innerHTML = bannerAviso('Informe o valor, a data inicial e a data final.'); return; }
  if(di >= df){ saida.innerHTML = bannerAviso('A data final precisa ser posterior à inicial.'); return; }

  saida.innerHTML = `<div class="chart-empty">Consultando a série do Banco Central...</div>`;
  let serie;
  try{
    serie = await buscarIndice(INDICES[chave].cod, di, df);
  }catch(e){
    saida.innerHTML = bannerAviso('Não foi possível obter o índice agora: ' + escapeHtml(e.message));
    return;
  }

  let fator = 1;
  const linhasTab = [];
  serie.forEach(p => {
    fator *= (1 + p.valor/100);
    linhasTab.push([p.data, p.valor.toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:4}), fator.toFixed(8).replace('.', ','), brl(principal * fator)]);
  });

  const corrigido = principal * fator;
  const meses = mesesEntre(di, df);
  const ehSelic = chave === 'selic';
  const jurosAplicados = ehSelic ? 0 : (tipoJuros === 'composto'
    ? corrigido * (Math.pow(1 + jurosMes, meses) - 1)
    : corrigido * jurosMes * meses);
  const subtotal = corrigido + jurosAplicados;
  const valorMulta = multa * (baseMulta === 'corrigido' ? corrigido : subtotal);
  const total = subtotal + valorMulta;

  const colunas = ['Competência','Índice (%)','Fator acumulado','Valor corrigido (R$)'];
  const totais = ['Total', '', fator.toFixed(8).replace('.', ','), brl(corrigido)];

  calcDados.atualizacao = {
    titulo: `Atualização de débito por ${INDICES[chave].nome}`,
    parametros: [
      ['Valor original (R$)', brl(principal)],
      ['Período', `${dataBr(di)} a ${dataBr(df)}`],
      ['Índice', INDICES[chave].nome],
      ['Fator de correção', fator.toFixed(8).replace('.', ',')],
      ['Valor corrigido (R$)', brl(corrigido)],
      ['Juros de mora', ehSelic ? 'não aplicados (Selic já engloba juros)' : `${(jurosMes*100).toLocaleString('pt-BR')}% ao mês, ${tipoJuros}, por ${meses} meses`],
      ['Juros (R$)', brl(jurosAplicados)],
      ['Multa (R$)', brl(valorMulta)],
      ['Total apurado (R$)', brl(total)],
    ],
    colunas, linhas: linhasTab, totais,
    fonte: `Fonte: Banco Central do Brasil, serie SGS ${INDICES[chave].cod}, consultada em ${new Date().toLocaleDateString('pt-BR')}.`,
    resumo: `R$ ${brl(principal)} atualizado por ${INDICES[chave].nome} de ${dataBr(di)} a ${dataBr(df)} resulta em R$ ${brl(total)}.`,
  };

  saida.innerHTML = `
    ${ehSelic ? bannerInfo('A Selic acumulada já embute juros de mora, então os juros informados não foram aplicados — evita a contagem em duplicidade.') : ''}
    <div class="resumo-calc">
      <div class="resumo-item"><div class="k">Valor original</div><div class="v">R$ ${brl(principal)}</div></div>
      <div class="resumo-item"><div class="k">Correção</div><div class="v">R$ ${brl(corrigido - principal)}</div></div>
      <div class="resumo-item"><div class="k">Juros de mora</div><div class="v">R$ ${brl(jurosAplicados)}</div></div>
      <div class="resumo-item"><div class="k">Multa</div><div class="v">R$ ${brl(valorMulta)}</div></div>
      <div class="resumo-item destaque"><div class="k">Total apurado</div><div class="v">R$ ${brl(total)}</div></div>
    </div>
    <div class="calc-nota">
      Fator de correção acumulado no período: <b>${fator.toFixed(8).replace('.', ',')}</b> em ${serie.length} competências.
      Fonte: Banco Central do Brasil, série SGS ${INDICES[chave].cod}, consultada agora.
    </div>
    ${tabelaHtml(colunas, linhasTab, totais)}
    ${blocoAcoes('atualizacao')}`;
  calcSaida.atualizacao = saida.innerHTML;
}

/* ==========================================================================
   Cálculo 3 — verbas rescisórias
   ========================================================================== */
function rodarRescisao(){
  const salario = num(document.getElementById('rSalario').value);
  const adm = document.getElementById('rAdmissao').value;
  const dem = document.getElementById('rDemissao').value;
  const motivo = document.getElementById('rMotivo').value;
  const aviso = document.getElementById('rAviso').value;
  const feriasVencidas = Math.round(num(document.getElementById('rFeriasVenc').value));
  const saldoFgts = num(document.getElementById('rFgts').value);
  const saida = document.getElementById('calcSaidaBox');

  if(salario <= 0 || !adm || !dem){ saida.innerHTML = bannerAviso('Informe o salário, a data de admissão e a de demissão.'); return; }
  if(adm >= dem){ saida.innerHTML = bannerAviso('A data de demissão precisa ser posterior à admissão.'); return; }

  const dDem = new Date(dem+'T00:00:00');
  const anosCompletos = Math.floor(mesesEntre(adm, dem) / 12);

  // direitos conforme o motivo da rescisão
  const temAviso = (motivo === 'sem_justa_causa') && aviso === 'indenizado';
  const temDecimo = motivo !== 'justa_causa';
  const temFeriasProp = motivo !== 'justa_causa';
  const temMulta = (motivo === 'sem_justa_causa');
  const descontaAviso = (motivo === 'pedido' && aviso === 'nao_cumprido');

  // saldo de salário: dias trabalhados no mês da rescisão
  const diasSaldo = dDem.getDate();
  const saldoSalario = salario / 30 * diasSaldo;

  // aviso prévio: 30 dias + 3 por ano completo, limitado a 90 (Lei 12.506/2011)
  const diasAviso = Math.min(90, 30 + 3 * anosCompletos);
  const valorAviso = temAviso ? salario / 30 * diasAviso : 0;
  const descontoAviso = descontaAviso ? salario : 0;

  // a projeção do aviso indenizado integra o tempo de serviço
  const fimProjetado = new Date(dDem);
  if(temAviso) fimProjetado.setDate(fimProjetado.getDate() + diasAviso);
  const isoProjetado = fimProjetado.toISOString().slice(0,10);

  // 13º proporcional: avos no ano, contando mês com 15 dias ou mais
  const inicioAno = isoProjetado.slice(0,4) + '-01-01';
  const baseDecimo = adm > inicioAno ? adm : inicioAno;
  let avosDecimo = 0;
  if(temDecimo){
    avosDecimo = mesesEntre(baseDecimo, isoProjetado);
    const resto = diasEntre(baseDecimo, isoProjetado) - avosDecimo*30;
    if(resto >= 15) avosDecimo++;
    avosDecimo = Math.min(12, Math.max(0, avosDecimo));
  }
  const decimo = salario / 12 * avosDecimo;

  // férias proporcionais: avos desde o último período aquisitivo completo
  let avosFerias = 0;
  if(temFeriasProp){
    const mesesTotais = mesesEntre(adm, isoProjetado);
    avosFerias = mesesTotais % 12;
    const aniversario = new Date(adm+'T00:00:00');
    aniversario.setMonth(aniversario.getMonth() + (mesesTotais - avosFerias));
    const resto = diasEntre(aniversario.toISOString().slice(0,10), isoProjetado) - avosFerias*30;
    if(resto >= 15) avosFerias++;
    avosFerias = Math.min(12, Math.max(0, avosFerias));
  }
  const feriasProp = salario / 12 * avosFerias;
  const tercoProp = feriasProp / 3;
  const feriasVenc = salario * feriasVencidas;
  const tercoVenc = feriasVenc / 3;

  // FGTS do mês e multa rescisória
  const fgtsSobreVerbas = 0.08 * (saldoSalario + valorAviso + decimo);
  const baseMulta = saldoFgts + fgtsSobreVerbas;
  const multaFgts = temMulta ? 0.40 * baseMulta : 0;

  const itens = [
    ['Saldo de salário', `${diasSaldo} dia(s)`, saldoSalario],
    ['Aviso prévio indenizado', temAviso ? `${diasAviso} dia(s)` : 'não devido', valorAviso],
    ['13º salário proporcional', `${avosDecimo}/12`, decimo],
    ['Férias proporcionais', `${avosFerias}/12`, feriasProp],
    ['Um terço sobre férias proporcionais', '', tercoProp],
    ['Férias vencidas', feriasVencidas ? `${feriasVencidas} período(s)` : 'nenhuma', feriasVenc],
    ['Um terço sobre férias vencidas', '', tercoVenc],
    ['FGTS incidente sobre as verbas', '8%', fgtsSobreVerbas],
    ['Multa rescisória do FGTS', temMulta ? '40% sobre R$ '+brl(baseMulta) : 'não devida', multaFgts],
  ];
  if(descontoAviso > 0) itens.push(['Desconto de aviso prévio não cumprido', '', -descontoAviso]);

  const total = itens.reduce((s, it) => s + it[2], 0);
  const colunas = ['Verba','Base','Valor (R$)'];
  const linhasCsv = itens.map(it => [it[0], it[1], brl(it[2])]);
  const totais = ['Total bruto', '', brl(total)];

  const MOTIVOS = {sem_justa_causa:'Dispensa sem justa causa', pedido:'Pedido de demissão', justa_causa:'Dispensa por justa causa', termino:'Término de contrato por prazo determinado'};

  calcDados.rescisao = {
    titulo: 'Verbas rescisórias',
    parametros: [
      ['Salário (R$)', brl(salario)],
      ['Admissão', dataBr(adm)],
      ['Demissão', dataBr(dem)],
      ['Motivo', MOTIVOS[motivo]],
      ['Tempo de serviço', `${anosCompletos} ano(s), ${mesesEntre(adm,dem)} meses`],
      ['Projeção do aviso até', temAviso ? dataBr(isoProjetado) : 'não aplicável'],
    ],
    colunas, linhas: linhasCsv, totais,
    resumo: `${MOTIVOS[motivo]} — total bruto de R$ ${brl(total)}.`,
  };

  saida.innerHTML = `
    <div class="resumo-calc">
      <div class="resumo-item"><div class="k">Tempo de serviço</div><div class="v">${anosCompletos}a ${mesesEntre(adm,dem)%12}m</div></div>
      <div class="resumo-item"><div class="k">Verbas salariais</div><div class="v">R$ ${brl(saldoSalario + valorAviso + decimo)}</div></div>
      <div class="resumo-item"><div class="k">Férias e terço</div><div class="v">R$ ${brl(feriasProp+tercoProp+feriasVenc+tercoVenc)}</div></div>
      <div class="resumo-item"><div class="k">FGTS e multa</div><div class="v">R$ ${brl(fgtsSobreVerbas+multaFgts)}</div></div>
      <div class="resumo-item destaque"><div class="k">Total bruto</div><div class="v">R$ ${brl(total)}</div></div>
    </div>
    ${tabelaHtml(colunas, linhasCsv, totais)}
    <div class="calc-nota">
      Valores <b>brutos</b>: não estão deduzidos INSS, imposto de renda nem descontos contratuais, que dependem das tabelas
      vigentes na competência. O aviso prévio segue a Lei 12.506/2011 — trinta dias, mais três por ano completo, limitado a noventa.
      Quando indenizado, a projeção integra o tempo de serviço e repercute no 13º e nas férias.
    </div>
    ${blocoAcoes('rescisao')}`;
  calcSaida.rescisao = saida.innerHTML;
}

/* ==========================================================================
   Cálculo 4 — taxas, anatocismo e viabilidade
   ========================================================================== */
function rodarTaxas(){
  const modo = document.getElementById('tModo').value;
  const saida = document.getElementById('calcSaidaBox');

  if(modo === 'equivalencia'){
    const taxa = num(document.getElementById('tTaxa').value)/100;
    const de = document.getElementById('tDe').value;
    const para = document.getElementById('tPara').value;
    const PER = {dia:1, mes:30, trimestre:90, semestre:180, ano:360};
    const expo = PER[para]/PER[de];
    const equivalente = Math.pow(1+taxa, expo) - 1;
    const proporcional = taxa * expo;
    const colunas = ['Critério','Taxa resultante','Diferença sobre R$ 100.000'];
    const linhas = [
      ['Equivalência composta (juros sobre juros)', pct(equivalente), 'R$ '+brl(100000*equivalente)],
      ['Proporcionalidade simples (linear)', pct(proporcional), 'R$ '+brl(100000*proporcional)],
      ['Diferença', pct(equivalente-proporcional), 'R$ '+brl(100000*(equivalente-proporcional))],
    ];
    calcDados.taxas = {
      titulo:'Equivalência de taxas',
      parametros:[['Taxa informada', pct(taxa)],['Período de origem', de],['Período de destino', para]],
      colunas, linhas, totais:null,
      resumo:`${pct(taxa)} ao ${de} equivale a ${pct(equivalente)} ao ${para}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item destaque"><div class="k">Taxa equivalente</div><div class="v">${pct(equivalente)}</div></div>
        <div class="resumo-item"><div class="k">Taxa proporcional</div><div class="v">${pct(proporcional)}</div></div>
        <div class="resumo-item"><div class="k">Diferença</div><div class="v">${pct(equivalente-proporcional)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas)}
      <div class="calc-nota">
        A conversão proporcional divide a taxa linearmente e é o critério dos juros simples; a equivalente preserva o
        montante sob capitalização composta. A distância entre as duas é justamente o ponto discutido nas ações revisionais.
      </div>
      ${blocoAcoes('taxas')}`;

  } else if(modo === 'anatocismo'){
    const capital = num(document.getElementById('tCapital').value);
    const taxa = num(document.getElementById('tTaxaMes').value)/100;
    const n = Math.round(num(document.getElementById('tMeses').value));
    if(capital <= 0 || n <= 0){ saida.innerHTML = bannerAviso('Informe o capital e o número de meses.'); return; }
    if(n > 600){ saida.innerHTML = bannerAviso('O prazo máximo aceito é de 600 meses.'); return; }
    const linhas = [];
    for(let k=1; k<=n; k++){
      const simples = capital * (1 + taxa*k);
      const composto = capital * Math.pow(1+taxa, k);
      linhas.push([k, brl(simples), brl(composto), brl(composto-simples)]);
    }
    const mSimples = capital*(1+taxa*n), mComposto = capital*Math.pow(1+taxa,n);
    const colunas = ['Mês','Montante simples (R$)','Montante composto (R$)','Diferença (R$)'];
    calcDados.taxas = {
      titulo:'Juros simples comparados a juros compostos',
      parametros:[['Capital (R$)', brl(capital)],['Taxa mensal', pct(taxa)],['Prazo (meses)', n]],
      colunas, linhas, totais:['Final', brl(mSimples), brl(mComposto), brl(mComposto-mSimples)],
      resumo:`Em ${n} meses a ${pct(taxa)} ao mês, a capitalização composta supera a simples em R$ ${brl(mComposto-mSimples)}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item"><div class="k">Montante simples</div><div class="v">R$ ${brl(mSimples)}</div></div>
        <div class="resumo-item"><div class="k">Montante composto</div><div class="v">R$ ${brl(mComposto)}</div></div>
        <div class="resumo-item destaque"><div class="k">Diferença</div><div class="v">R$ ${brl(mComposto-mSimples)}</div></div>
        <div class="resumo-item"><div class="k">Excesso relativo</div><div class="v">${pct((mComposto-mSimples)/mSimples, 2)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas, calcDados.taxas.totais)}
      <div class="calc-nota">A diferença mês a mês é exatamente o efeito da capitalização de juros sobre juros no período.</div>
      ${blocoAcoes('taxas')}`;

  } else {
    const fluxoTxt = document.getElementById('tFluxo').value;
    const taxaDesc = num(document.getElementById('tDesconto').value)/100;
    const fluxo = fluxoTxt.split(/[;,\n\s]+/).map(s=>s.trim()).filter(Boolean).map(num);
    if(fluxo.length < 2){ saida.innerHTML = bannerAviso('Informe ao menos dois valores no fluxo, começando pelo investimento como negativo.'); return; }
    const valorPresente = vpl(taxaDesc, fluxo);
    const taxaInterna = tir(fluxo);
    const colunas = ['Período','Fluxo (R$)','Fator de desconto','Valor presente (R$)'];
    const linhas = fluxo.map((v,k) => {
      const fator = 1/Math.pow(1+taxaDesc, k);
      return [k, brl(v), fator.toFixed(8).replace('.', ','), brl(v*fator)];
    });
    calcDados.taxas = {
      titulo:'Valor presente líquido e taxa interna de retorno',
      parametros:[['Taxa de desconto', pct(taxaDesc)],['Períodos', fluxo.length-1]],
      colunas, linhas, totais:['VPL','','', brl(valorPresente)],
      resumo:`VPL de R$ ${brl(valorPresente)} à taxa de ${pct(taxaDesc)}${taxaInterna!==null?`, com TIR de ${pct(taxaInterna)}`:''}.`,
    };
    saida.innerHTML = `
      <div class="resumo-calc">
        <div class="resumo-item destaque"><div class="k">VPL</div><div class="v">R$ ${brl(valorPresente)}</div></div>
        <div class="resumo-item"><div class="k">TIR por período</div><div class="v">${taxaInterna!==null?pct(taxaInterna):'não converge'}</div></div>
        <div class="resumo-item"><div class="k">Taxa de desconto</div><div class="v">${pct(taxaDesc)}</div></div>
      </div>
      ${tabelaHtml(colunas, linhas, calcDados.taxas.totais)}
      <div class="calc-nota">
        Serve tanto para apuração de haveres e avaliação de fluxo quanto para o Custo Efetivo Total de um financiamento:
        nesse caso, informe o valor liberado como positivo no período zero e as prestações como negativas.
        ${taxaInterna!==null ? `A TIR encontrada, de ${pct(taxaInterna)} por período, equivale a ${pct(Math.pow(1+taxaInterna,12)-1, 2)} ao ano se o período for mensal.` : 'O fluxo informado não muda de sinal, então não existe TIR.'}
      </div>
      ${blocoAcoes('taxas')}`;
  }
  calcSaida.taxas = saida.innerHTML;
}

function formFinanciamento(){
  return `
    <div class="form-grid">

/* ---------- número por extenso, em reais ---------- */
const EXT_UNI = ['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const EXT_DEZ = ['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const EXT_CEM = ['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function trecho(n){
  if(n === 0) return '';
  if(n === 100) return 'cem';
  let t = [];
  const c = Math.floor(n/100), d = n % 100;
  if(c) t.push(EXT_CEM[c]);
  if(d){
    if(d < 20) t.push(EXT_UNI[d]);
    else {
      const dz = Math.floor(d/10), un = d % 10;
      t.push(EXT_DEZ[dz] + (un ? ' e ' + EXT_UNI[un] : ''));
    }
  }
  return t.join(' e ');
}
function inteiroExtenso(n){
  if(n === 0) return 'zero';
  const grupos = [];
  let resto = n;
  while(resto > 0){ grupos.push(resto % 1000); resto = Math.floor(resto/1000); }
  const nomes = [['',''],['mil','mil'],['milhão','milhões'],['bilhão','bilhões']];
  const partes = [];
  for(let g = grupos.length-1; g >= 0; g--){
    const v = grupos[g];
    if(v === 0) continue;
    let txt = (g === 1 && v === 1) ? 'mil' : trecho(v);
    if(g > 1) txt += ' ' + (v === 1 ? nomes[g][0] : nomes[g][1]);
    else if(g === 1 && v !== 1) txt += ' mil';
    partes.push({txt, valor:v});
  }
  /* O conectivo "e" entra antes do último grupo quando ele é menor que cem
     ou uma centena exata; nos demais casos a norma pede vírgula.
     Ex.: mil e quinhentos · doze mil, trezentos e quarenta e cinco */
  let saida = '';
  partes.forEach((p, idx) => {
    if(idx === 0){ saida = p.txt; return; }
    const usaE = p.valor < 100 || p.valor % 100 === 0;
    saida += (usaE ? ' e ' : ', ') + p.txt;
  });
  return saida;
}
function porExtenso(valor){
  const inteiro = Math.floor(Math.abs(valor));
  const centavos = Math.round((Math.abs(valor) - inteiro) * 100);
  const partes = [];
  if(inteiro > 0){
    const txt = inteiroExtenso(inteiro);
    /* milhão e bilhão redondos pedem a preposição: "um milhão de reais" */
    const usaDe = /(milhão|milhões|bilhão|bilhões)$/.test(txt);
    partes.push(txt + (usaDe ? ' de reais' : (inteiro === 1 ? ' real' : ' reais')));
  }
  if(centavos > 0) partes.push(inteiroExtenso(centavos) + (centavos === 1 ? ' centavo' : ' centavos'));
  if(partes.length === 0) return 'zero real';
  return partes.join(' e ');
}
/* "setenta e duas horas", "vinte e uma horas" */
function extensoFeminino(n){
  return inteiroExtenso(n).replace(/\bum\b/g, 'uma').replace(/\bdois\b/g, 'duas');
}
function capitalizar(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

/* ---------- rascunhos: o que o perito ajusta antes de gerar ---------- */
function juizoSugerido(c){
  const vara = (c.vara || '').trim();
  const comarca = (c.comarca || '').trim();
  if(!vara && !comarca) return 'AO DOUTO JUÍZO DE DIREITO';
  const partes = ['AO DOUTO JUÍZO DE DIREITO'];
  if(vara) partes.push('DA ' + vara.toUpperCase());
  if(comarca) partes.push('DA COMARCA DE ' + comarca.toUpperCase());
  return partes.join(' ');
}
function acaoSugerida(c, analise){
  const {autor, reu} = partesDoCaso(c);
  const acao = (c.nome || analise.area).toUpperCase();
  const encerra = t => /[.;]$/.test(t) ? t : t + '.';
  let linha = 'AÇÃO: ' + acao;
  if(autor) linha += ' REQUERENTE:' + encerra(autor.toUpperCase());
  if(reu) linha += ' REQUERIDO:' + encerra(reu.toUpperCase());
  return linha;
}
function resumoSugerido(c, analise){
  const {autor, reu} = partesDoCaso(c);
  const acao = (c.nome || analise.area);
  let t = 'O processo trata de ' + acao;
  if(autor) t += ' proposta por ' + autor;
  if(reu) t += ' em face de ' + reu;
  t += ', cabendo à perícia contábil ' + analise.obj;
  if(c.valorCausa) t += ', observado o valor atribuído à causa de R$ ' + brl(num(c.valorCausa));
  return t + ', nos limites dos quesitos deferidos por este juízo.';
}

  if(nDocs) t += ', com exame dos ' + nDocs + ' documento' + (nDocs === 1 ? '' : 's') + ' já reunidos nos autos';

let propostaCasoId = null;
let rascunho = null;
let salvarTimer = null;

function casoDaProposta(){
  const lista = casosVisiveis();
  if(lista.length === 0) return null;
  let c = lista.find(x => x.id === propostaCasoId);
  if(!c){ c = lista[0]; propostaCasoId = c.id; }

function carregarRascunho(c){
  const base = rascunhoPadrao(c);
  const salvo = c.proposta || {};
  rascunho = {...base, ...salvo};
  if(!Array.isArray(rascunho.horas) || rascunho.horas.length !== TAREFAS.length) rascunho.horas = base.horas;
  rascunho.horas = rascunho.horas.map(h => Math.max(0, num(h)));
  return rascunho;
}
function agendarSalvar(){
  clearTimeout(salvarTimer);
  salvarTimer = setTimeout(() => {
    if(propostaCasoId && rascunho) saveCaso(propostaCasoId, {proposta: {...rascunho}});

function propCampo(chave, valor){
  if(!rascunho) return;
  rascunho[chave] = (chave === 'horaTecnica' || chave === 'adiantamento') ? num(valor) : valor;
  atualizarTotais();
  agendarSalvar();
}
function propHora(i, valor){
  if(!rascunho) return;
  rascunho.horas[i] = Math.max(0, num(valor));
  atualizarTotais();
  agendarSalvar();
}
function totaisProposta(){
  const horas = rascunho.horas.reduce((s,h) => s + h, 0);
  const valor = horas * rascunho.horaTecnica;
  const pct = Math.min(100, Math.max(0, rascunho.adiantamento));
  return {horas, valor, pct, adiantado: valor * pct / 100};
}
function atualizarTotais(){
  if(!rascunho) return;
  const t = totaisProposta();
  const põe = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };
  põe('propTotalHoras', String(t.horas));
  põe('propHorasExtenso', t.horas ? '(' + extensoFeminino(t.horas) + ')' : '');
  põe('propValor', 'R$ ' + brl(t.valor));
  põe('propValorExtenso', t.valor ? porExtenso(t.valor) : '');
  põe('propAdiantValor', 'R$ ' + brl(t.adiantado));
  põe('propSaldo', 'R$ ' + brl(t.valor - t.adiantado));

function refazerTexto(qual){

  if(qual === 'horas') rascunho.horas = analise.horas.slice();
  agendarSalvar();
  renderAll();
}

/* ==========================================================================
   Reescrita do .docx
   Um parágrafo do Word costuma vir picado em vários <w:t>; por isso o texto é
   lido e reescrito no parágrafo inteiro, mantendo a formatação do primeiro
   trecho e esvaziando os demais.
   ========================================================================== */
function escaparXml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function desescaparXml(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"')
                  .replace(/&apos;/g,"'").replace(/&#39;/g,"'").replace(/&amp;/g,'&');
}
function definirTextoParagrafo(par, texto){
  let i = 0;
  const novo = par.replace(/(<w:t)((?:\s[^>]*)?)(>)([\s\S]*?)(<\/w:t>)/g, (m, ini, attrs, fecha, conteudo, fim) => {
    const valor = i === 0 ? escaparXml(texto) : '';
    i++;
    const comEspaco = attrs.includes('xml:space') ? attrs : attrs + ' xml:space="preserve"';
    return ini + comEspaco + fecha + valor + fim;
  });
  return i === 0 ? par : novo;
}
/* Percorre só os parágrafos-folha: é onde o texto realmente mora, inclusive
   dentro das caixas de texto que o Word duplica em <mc:Fallback>. */
function mapearParagrafos(xml, fn){
  const tok = /<w:p(?:\s[^>]*)?>|<\/w:p>/g;
  const pilha = [], trocas = [];
  let m;
  while((m = tok.exec(xml)) !== null){
    if(m[0] === '</w:p>'){
      const ini = pilha.pop();
      if(ini === undefined) continue;
      const fim = m.index + m[0].length;
      const corpo = xml.slice(ini, fim);
      if(/<w:p[\s>]/.test(corpo.slice(1))) continue;
      const texto = (corpo.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>/g) || [])
        .map(t => desescaparXml(t.replace(/^<w:t(?:\s[^>]*)?>/, '').replace(/<\/w:t>$/, ''))).join('');
      const novo = fn(texto, corpo);
      if(novo !== null && novo !== undefined) trocas.push({ini, fim, corpo: definirTextoParagrafo(corpo, novo)});
    } else {
      pilha.push(m.index);
    }
  }
  let saida = xml;
  for(let i = trocas.length - 1; i >= 0; i--){
    saida = saida.slice(0, trocas[i].ini) + trocas[i].corpo + saida.slice(trocas[i].fim);
  }
  return saida;
}
function inicioParagrafoDeCorpo(xml, pos){
  const tok = /<w:p(?:\s[^>]*)?>|<\/w:p>/g;
  let m, prof = 0, inicio = -1;
  while((m = tok.exec(xml)) !== null){
    if(m[0] === '</w:p>'){
      prof--;
      if(prof === 0 && inicio >= 0 && inicio <= pos && pos < m.index + m[0].length) return inicio;
    } else {
      if(prof === 0) inicio = m.index;
      prof++;
    }
  }
  return -1;
}
function paragrafoCentrado(texto, negrito){
  const rpr = '<w:rFonts w:ascii="Calibri"/>' + (negrito ? '<w:b/>' : '') + '<w:sz w:val="24"/>';
  return '<w:p><w:pPr><w:spacing w:before="200"/><w:jc w:val="center"/><w:rPr>' + rpr + '</w:rPr></w:pPr>'
       + '<w:r><w:rPr>' + rpr + '</w:rPr><w:t xml:space="preserve">' + escaparXml(texto) + '</w:t></w:r></w:p>';
}
/* O arquivo de origem traz o carimbo visual de uma assinatura digital já
   aplicada. Ele é retirado e no lugar fica a linha de assinatura em branco —
   o documento novo precisa ser assinado com o certificado do perito. */
function trocarCarimboPorAssinatura(xml, ficha){
  const i = xml.indexOf('Assinado');
  if(i < 0) return xml;
  const corte = inicioParagrafoDeCorpo(xml, i);
  if(corte < 0) return xml;
  /* aproveita a última seção do arquivo (tamanho da página e margens), sem as
     colunas que existiam só para acomodar o carimbo */
  let sect = '';
  const fimBody = xml.lastIndexOf('</w:body>');
  const fimSect = fimBody > 0 ? xml.lastIndexOf('</w:sectPr>', fimBody) : -1;
  const iniSect = fimSect > 0 ? xml.lastIndexOf('<w:sectPr', fimSect) : -1;
  if(iniSect > 0 && iniSect > corte){
    sect = xml.slice(iniSect, fimSect + 11)
              .replace(/<w:type[^>]*\/>/g, '')
              .replace(/<w:cols[\s\S]*?<\/w:cols>/g, '')
              .replace(/<w:cols[^>]*\/>/g, '');
  }
  const assinatura =
      paragrafoCentrado('')
    + paragrafoCentrado('_____________________________________________')
    + paragrafoCentrado(ficha.nomeCompleto || '', true)
    + paragrafoCentrado('Perito-Contador' + (ficha.crcRegistro ? ' — CRC ' + ficha.crcRegistro : ''));
  return xml.slice(0, corte) + assinatura + sect + '</w:body></w:document>';
}
/* O modelo traz uma quebra de seção num parágrafo vazio, herdada da conversão
   do PDF: ela gasta uma folha inteira sem escrever nada. Quando a seção
   seguinte tem o mesmo tamanho de página e as mesmas margens, a quebra sai. */
function juntarSecoesIguais(xml){
  const fimBody = xml.lastIndexOf('</w:body>');
  const iniFinal = fimBody > 0 ? xml.lastIndexOf('<w:sectPr', fimBody) : -1;
  if(iniFinal < 0) return xml;
  const chave = frag => ((frag.match(/<w:pgSz[^>]*\/>/) || [''])[0]) + ((frag.match(/<w:pgMar[^>]*\/>/) || [''])[0]);
  const alvo = chave(xml.slice(iniFinal, fimBody));
  if(!alvo) return xml;
  return xml.replace(/<w:p(?:\s[^>]*)?>(?:(?!<\/w:p>)[\s\S])*?<\/w:p>/g, par => {
    if(!/<w:sectPr/.test(par) || /<w:t[\s>]/.test(par)) return par;
    const sect = (par.match(/<w:sectPr[\s\S]*?<\/w:sectPr>/) || [''])[0];
    if(!sect || /<w:type\s[^>]*w:val="(?!nextPage)/.test(sect)) return par;
    if(chave(sect) !== alvo) return par;
    return par.replace(sect, '');
  });
}
/* Quadro orçamentário: as tarefas são fixas, então só as horas, o total e o
   valor mudam. As linhas são localizadas pelo texto da primeira coluna. */
function preencherQuadro(xml, d){
  const iniTbl = xml.indexOf('<w:tbl>');
  if(iniTbl < 0) return xml;
  const fimTbl = xml.indexOf('</w:tbl>', iniTbl);
  if(fimTbl < 0) return xml;
  const tbl = xml.slice(iniTbl, fimTbl + 8);
  const linhas = tbl.match(/<w:tr(?:\s[^>]*)?>[\s\S]*?<\/w:tr>/g);
  if(!linhas) return xml;
  /* os runs já trazem os espaços; juntar com espaço extra quebraria a busca */
  const textoDe = frag => normalizeText((frag.match(/<w:t(?:\s[^>]*)?>[\s\S]*?<\/w:t>/g) || [])
    .map(t => desescaparXml(t.replace(/^<w:t(?:\s[^>]*)?>/, '').replace(/<\/w:t>$/, ''))).join(''))
    .replace(/\s+/g, ' ').trim();
  const celulasDe = tr => tr.match(/<w:tc>[\s\S]*?<\/w:tc>/g) || [];

  let idxCabecalho = -1, idxTotal = -1, idxValor = -1;
  linhas.forEach((tr, k) => {
    const primeira = textoDe(celulasDe(tr)[0] || '');
    if(idxCabecalho < 0 && /^tarefas a serem executadas/.test(primeira)) idxCabecalho = k;
    if(idxValor < 0 && /^hora t[eé]cnica/.test(primeira)) idxValor = k;
    else if(idxTotal < 0 && /^total de horas/.test(primeira)) idxTotal = k;
  });
  if(idxCabecalho < 0 || idxTotal < 0) return xml;
  const fimTarefas = idxValor > idxCabecalho ? Math.min(idxTotal, idxValor) : idxTotal;

  /* escreve o texto na segunda coluna, preservando a formatação da célula */
  const definirSegundaColuna = (tr, texto) => {
    const cels = celulasDe(tr);
    if(cels.length < 2) return tr;
    const alvo = cels[cels.length - 1];
    let primeiro = true;
    const novoAlvo = mapearParagrafos(alvo, () => {
      if(primeiro){ primeiro = false; return texto; }
      return '';
    });
    return tr.slice(0, tr.lastIndexOf(alvo)) + novoAlvo + tr.slice(tr.lastIndexOf(alvo) + alvo.length);
  };

  let t = 0;
  const novas = linhas.map((tr, k) => {
    if(k > idxCabecalho && k < fimTarefas){
      const valor = t < d.horas.length ? String(d.horas[t]) : '0';
      t++;
      return definirSegundaColuna(tr, valor);
    }
    if(k === idxTotal) return definirSegundaColuna(tr, String(d.totalHoras));
    if(k === idxValor) return definirSegundaColuna(tr, 'R$ ' + brl(d.valor));
    return tr;
  });
  let novoTbl = tbl;
  for(let k = linhas.length - 1; k >= 0; k--){
    if(novas[k] === linhas[k]) continue;
    const pos = novoTbl.lastIndexOf(linhas[k]);
    if(pos < 0) continue;
    novoTbl = novoTbl.slice(0, pos) + novas[k] + novoTbl.slice(pos + linhas[k].length);
  }
  return xml.slice(0, iniTbl) + novoTbl + xml.slice(fimTbl + 8);
}
function dadosDoDocumento(c, r, ficha){
  const horas = r.horas.reduce((s,h) => s + h, 0);
  const valor = horas * r.horaTecnica;
  const pct = Math.min(100, Math.max(0, r.adiantamento));
  const adiantado = valor * pct / 100;
  const hoje = new Date();
  const mes = capitalizar(hoje.toLocaleDateString('pt-BR', {month:'long'}));
  const sigla = (ficha.crcRegistro || '').slice(0,2).toUpperCase();
  return {
    horas: r.horas, totalHoras: horas, valor, pct, adiantado,
    juizo: r.juizo,
    processo: c.numeroProcesso || '',
    acao: r.acao,
    resumo: r.resumo,
    complexidade: r.complexidade,
    requerimento: (r.requerimento || '').trim(),
    qualificacao: [
      ficha.nomeCompleto || '',
      'contador, perito judicial e extrajudicial, especializado em Perícia Contábil',
      ficha.crcEstado ? 'regularmente inscrito no Conselho Regional de Contabilidade de ' + ficha.crcEstado
        + (sigla ? ' – CRC ' + sigla : '') + (ficha.crcRegistro ? ' com registro número ' + ficha.crcRegistro : '') : '',
      ficha.cpf ? 'inscrito no CPF sob o nº ' + ficha.cpf : '',
      'com endereço profissional indicado no rodapé desta, em cumprimento à intimação recebida, a fim de realizar o encargo confiado, '
        + 'vem, mui respeitosamente, apresentar a PROPOSTA DE HONORÁRIOS PERICIAIS na forma que segue:',
    ].filter(Boolean).join(', '),
    paragrafoHora: 'Ressalta-se que o valor da hora técnica empregado nesta proposta levou em consideração os padrões da '
      + (ficha.referenciaHora || 'entidade de classe da categoria') + ', no montante de R$ ' + brl(r.horaTecnica)
      + ' (' + porExtenso(r.horaTecnica) + ');',
    paragrafoHoras: 'Para apresentação do Laudo Pericial e dos elementos que formarão prova no processo, estima-se o quantitativo de '
      + horas + ' (' + capitalizar(extensoFeminino(horas)) + ') horas técnicas, conforme quadro composto pelas respectivas tarefas abaixo:',
    paragrafoAdiantamento: 'Requer-se, o adiantamento de ' + pct + '% (' + inteiroExtenso(Math.round(pct))
      + ' por cento) do valor estipulado para os honorários periciais, correspondente a R$ ' + brl(adiantado)
      + ', ficando o saldo remanescente para pagamento após a entrega do laudo e a prestação dos esclarecimentos necessários, '
      + 'nos termos do art. 465, §4º, do CPC.',
    dataLinha: (ficha.cidadeUf || (c.comarca || 'Goiânia')) + ', ' + String(hoje.getDate()).padStart(2,'0')
      + ' de ' + mes + ' de ' + hoje.getFullYear(),
    ficha,
  };
}
const RE_DATA_LOCAL = /^[^,]{2,60},\s*\d{1,2}\s+de\s+\p{L}+\s+de\s+\d{4}\s*$/u;
function reescreverDocumento(xml, d){
  xml = trocarCarimboPorAssinatura(xml, d.ficha);
  xml = juntarSecoesIguais(xml);
  xml = preencherQuadro(xml, d);
  let jaRequerimento = false;
  return mapearParagrafos(xml, texto => {
    const t = texto.trim();
    if(!t) return null;
    if(/^AO\s+DOUTO\s+JU[ÍI]ZO/i.test(t)) return d.juizo;
    if(/^PROCESSO\s*:/i.test(t)) return 'PROCESSO: ' + d.processo;
    if(/^A[ÇC][ÃA]O\s*:/i.test(t)) return d.acao;
    if(/regularmente inscrito no Conselho Regional/i.test(t)) return d.qualificacao;
    if(/^O processo trata/i.test(t)) return d.resumo;
    if(/^A realiza[çc][ãa]o do procedimento pericial/i.test(t)) return d.complexidade;
    if(/valor da hora t[ée]cnica empregado/i.test(t)) return d.paragrafoHora;
    if(/estima-se o quantitativo de/i.test(t)) return d.paragrafoHoras;
    if(/^Requer-se,?\s*o adiantamento/i.test(t)) return d.paragrafoAdiantamento;
    if(/^Em aten[çc][ãa]o ao art\.\s*473/i.test(t)){ jaRequerimento = true; return d.requerimento; }
    if(jaRequerimento && /junte aos autos/i.test(t)){ jaRequerimento = false; return ''; }
    if(RE_DATA_LOCAL.test(t)) return d.dataLinha;
    return null;
  });
}
function reescreverRodape(xml, ficha){
  return mapearParagrafos(xml, texto => {
    const t = texto.trim();
    if(/^Tel\.?\s*:/i.test(t) && ficha.telefone) return 'Tel.: ' + ficha.telefone;
    if(/^Endere[çc]o\s*:/i.test(t) && ficha.endereco) return 'Endereço: ' + ficha.endereco;
    return null;
  });
}
async function montarDocx(baseBytes, d){
  const zip = await JSZip.loadAsync(baseBytes);
  const doc = zip.file('word/document.xml');
  if(!doc) throw new Error('documento sem word/document.xml');
  zip.file('word/document.xml', reescreverDocumento(await doc.async('string'), d));
  for(const nome of Object.keys(zip.files)){
    if(/^word\/(header|footer)\d*\.xml$/.test(nome)){
      zip.file(nome, reescreverRodape(await zip.file(nome).async('string'), d.ficha));
    }
  }
  return await zip.generateAsync({type:'uint8array'});
}

/* ---------- importação do modelo ---------- */
async function importarModelo(input){
  const f = input.files[0];
  if(!f) return;
  const status = document.getElementById('modeloStatus');
  const bytes = new Uint8Array(await f.arrayBuffer());
  if(bytes.length > 3 * 1024 * 1024){
    status.textContent = 'O modelo passa de 3 MB. Use um arquivo menor.';
    input.value = ''; return;
  }
  if(extOf(f.name) !== 'docx'){
    status.textContent = 'O modelo precisa ser um arquivo .docx do Word.';
    input.value = ''; return;
  }
  modeloProposta = {nome:f.name, ext:'docx', base64:bytesToBase64(bytes), quando:todayIso(), tamanho:bytes.length};
  try{
    localStorage.setItem(LS_MODELO, JSON.stringify(modeloProposta));
  }catch(e){
    status.textContent = 'O modelo foi carregado, mas não coube no armazenamento do navegador — ele vale só para esta sessão.';
  }
  input.value = '';
  renderAll();
}
function removerModelo(){
  modeloProposta = null;
  try{ localStorage.removeItem(LS_MODELO); }catch(e){}
  renderAll();
}

/* ---------- geração ---------- */
async function gerarProposta(anexar){
  const status = document.getElementById('propStatus');
  const c = casoDaProposta();
  if(!c || !rascunho){ if(status) status.textContent = 'Escolha a perícia.'; return; }
  const ficha = fichaDe(donoDe(c));
  if(!ficha.nomeCompleto){
    status.textContent = 'Preencha a ficha do perito em Configurações antes de gerar.';
    return;
  }
  const d = dadosDoDocumento(c, rascunho, ficha);
  if(d.totalHoras <= 0){ status.textContent = 'Informe as horas de pelo menos uma tarefa.'; return; }
  status.textContent = 'Gerando...';
  let bytes, nomeArq, mime;
  try{
    if(modeloProposta && typeof JSZip !== 'undefined'){
      bytes = await montarDocx(base64ToBytes(modeloProposta.base64), d);
      nomeArq = 'proposta_honorarios_' + c.codigo + '.docx';
      mime = 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    } else {
      bytes = new TextEncoder().encode(propostaPadrao(d, c));
      nomeArq = 'proposta_honorarios_' + c.codigo + '.doc';
      mime = 'application/msword';
    }
  }catch(e){
    status.textContent = 'Não foi possível reescrever o modelo (' + (e.message || 'erro') + ').';
    return;
  }
  const patch = {proposta: {...rascunho}};
  if(!c.honorarios) patch.honorarios = d.valor;   /* nao mexe num valor que o perito ja anotou */
  await saveCaso(c.id, patch);
  if(anexar){
    const docId = 'd' + Date.now() + Math.random().toString(36).slice(2,6);
    const built = await buildArquivo(c.id, docId, bytes, nomeArq, mime);
    await addDoc(c.id, {
      nome: nomeArq, fase:'Proposta de Honorários', tipo:'Outro', data: todayIso(),
      obs: 'R$ ' + brl(d.valor) + ' — ' + d.totalHoras + ' horas a R$ ' + brl(rascunho.horaTecnica) + '/hora.',
      tamanho: bytes.length, arquivo: built.arquivo, processo: c.numeroProcesso || null, codigoAcesso: null
    }, docId);
    status.textContent = 'Anexado em ' + c.codigo + '.';
    renderNav();
  } else {
    const blob = new Blob([bytes], {type:mime});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nomeArq;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    status.textContent = 'Documento gerado.';
  }
}

/* ---------- tela ---------- */
function renderProposta(){
  const c = casoDaProposta();
  if(!c){
    return '<div class="empty-state"><h3>Nenhuma perícia cadastrada</h3><p>Crie uma perícia para gerar a proposta de honorários dela.</p></div>';
  }
  const lista = casosVisiveis();
  const r = carregarRascunho(c);
  const ficha = fichaDe(donoDe(c));
  const analise = analisarPericia(c);
  const totais = totaisProposta();

  const avisoFicha = ficha.nomeCompleto ? '' : `
      <div class="banner" style="margin-bottom:12px;">
        ${svg('<path d="M12 9v4M12 17v.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L14.7 3.9a2 2 0 00-3.4 0z"/>')}
        <span>A ficha de ${escapeHtml(membroDe(donoDe(c)).nome)} está incompleta. Preencha nome, CRC e CPF em Configurações.</span>
      </div>`;

  const corpoModelo = (modeloProposta ? `
      <div class="rows" style="margin-bottom:12px;">
        <div class="row-item" style="cursor:default;">
          <div class="row-main">
            <div class="row-title">${escapeHtml(modeloProposta.nome)}</div>
            <div class="row-sub">Importado em ${fmtDate(modeloProposta.quando)} · ${fmtBytes(modeloProposta.tamanho || Math.round(modeloProposta.base64.length*3/4))}</div>
          </div>
          <div class="row-side"><button class="btn btn-ghost btn-sm" onclick="removerModelo()">Remover</button></div>
        </div>
      </div>
      <div class="calc-nota" style="margin-top:0;">
        O documento gerado sai do seu arquivo: mesma fonte, mesmas margens, mesmo rodapé.
        O carimbo de assinatura digital que veio no modelo é retirado e no lugar fica a linha de assinatura em branco — assine o novo documento com o seu certificado.
      </div>`
    : `
      <div class="banner banner-info" style="margin-bottom:12px;">
        ${svg('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>')}
        <span>Nenhum modelo importado. Por enquanto o app gera uma proposta com a mesma estrutura, em arquivo que abre no Word.</span>
      </div>`)
    + `
      <input type="file" id="modeloInput" accept=".docx" style="display:none" onchange="importarModelo(this)">
      <div class="acoes">
        <button class="btn btn-primary" onclick="document.getElementById('modeloInput').click()">
          ${svg('<path d="M12 21V9M7 13l5-5 5 5M4 4h16"/>')} ${modeloProposta ? 'Trocar modelo' : 'Importar modelo'}
        </button>
        <span class="dica" style="font-size:11.5px; color:var(--muted);">Arquivo .docx do Word</span>
      </div>
      <div id="modeloStatus" class="hint"></div>`;

  const corpoProcesso = `
      <div class="form-grid">
        <div class="field" style="grid-column:1/-1;"><label for="propCaso">Perícia</label>
          <select id="propCaso" onchange="trocarPericiaProposta(this)">
            ${lista.map(x => `<option value="${x.id}" ${x.id===c.id?'selected':''}>${escapeHtml(x.codigo)} — ${escapeHtml(x.nome)}</option>`).join('')}
          </select></div>
        <div class="field" style="grid-column:1/-1;"><label for="propJuizo">Endereçamento ao juízo</label>
          <input id="propJuizo" value="${escapeHtml(r.juizo)}" oninput="propCampo('juizo', this.value)">
          <span class="dica">Montado a partir da vara e da comarca cadastradas · <a href="#" onclick="event.preventDefault();refazerTexto('juizo')">refazer</a></span></div>
        <div class="field" style="grid-column:1/-1;"><label for="propAcao">Linha da ação e das partes</label>
          <input id="propAcao" value="${escapeHtml(r.acao)}" oninput="propCampo('acao', this.value)">
          <span class="dica">Requerente e requerido saem do campo Partes · <a href="#" onclick="event.preventDefault();refazerTexto('acao')">refazer</a></span></div>
      </div>
      <div class="kv-grid" style="margin-top:12px;">
        <div class="kv"><div class="k">Processo</div><div class="v mono" style="font-size:13px;">${escapeHtml(c.numeroProcesso || '—')}</div></div>
        <div class="kv"><div class="k">Natureza identificada</div><div class="v" style="font-size:13px;">${escapeHtml(analise.area)}</div></div>
        <div class="kv"><div class="k">Perito</div><div class="v" style="font-size:13px;">${escapeHtml(ficha.nomeCompleto || membroDe(donoDe(c)).nome)}</div></div>
        <div class="kv"><div class="k">Valor da causa</div><div class="v num">${c.valorCausa ? 'R$ ' + brl(num(c.valorCausa)) : '—'}</div></div>
      </div>`;

  const corpoTextos = `
      <div class="field" style="margin-bottom:14px;">
        <label for="propResumo">Resumo do processo</label>
        <textarea id="propResumo" rows="5" oninput="propCampo('resumo', this.value)">${escapeHtml(r.resumo)}</textarea>
        <span class="dica">Rascunho a partir da natureza e das partes · <a href="#" onclick="event.preventDefault();refazerTexto('resumo')">refazer rascunho</a></span>
      </div>
      <div class="field">
        <label for="propComplexidade">Justificativa da complexidade</label>
        <textarea id="propComplexidade" rows="7" oninput="propCampo('complexidade', this.value)">${escapeHtml(r.complexidade)}</textarea>
        <span class="dica">Descreva aqui o volume documental e as particularidades do caso · <a href="#" onclick="event.preventDefault();refazerTexto('complexidade')">refazer rascunho</a></span>
      </div>`;

  const corpoQuadro = `
      <div class="tabela-wrap" style="margin-top:0;">
        <table class="memoria">
          <thead><tr><th>Tarefa</th><th style="width:118px;">Horas</th></tr></thead>
          <tbody>
            ${TAREFAS.map((t,i) => `
              <tr>
                <td style="white-space:normal; font-family:inherit;">${escapeHtml(t)}</td>
                <td><input inputmode="numeric" value="${r.horas[i]}" oninput="propHora(${i}, this.value)" class="celula-horas"></td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="form-grid" style="margin-top:14px;">
        <div class="field"><label for="propHoraTec">Hora técnica (R$)</label>
          <input id="propHoraTec" inputmode="decimal" value="${brl(r.horaTecnica)}" oninput="propCampo('horaTecnica', this.value)">
          <span class="dica">Padrão da ficha do perito · <a href="#" onclick="event.preventDefault();refazerTexto('horas')">refazer horas sugeridas</a></span></div>
        <div class="field"><label for="propAdiant">Adiantamento (%)</label>
          <input id="propAdiant" inputmode="numeric" value="${r.adiantamento}" oninput="propCampo('adiantamento', this.value)">
          <span class="dica">Art. 465, §4º, do CPC</span></div>
      </div>
      <div class="kv-grid" style="margin-top:14px;">
        <div class="kv"><div class="k">Total de horas</div><div class="v num"><span id="propTotalHoras">${totais.horas}</span> <span id="propHorasExtenso" style="font-size:12px; font-weight:400; color:var(--muted);">${totais.horas ? '(' + extensoFeminino(totais.horas) + ')' : ''}</span></div></div>
        <div class="kv"><div class="k">Honorários</div><div class="v num" id="propValor">R$ ${brl(totais.valor)}</div></div>
        <div class="kv"><div class="k">Adiantamento</div><div class="v num" id="propAdiantValor">R$ ${brl(totais.adiantado)}</div></div>
        <div class="kv"><div class="k">Saldo na entrega</div><div class="v num" id="propSaldo">R$ ${brl(totais.valor - totais.adiantado)}</div></div>
      </div>
      <div class="calc-nota">Por extenso: <span id="propValorExtenso">${totais.valor ? porExtenso(totais.valor) : ''}</span></div>`;

  const corpoRequerimento = `
      <div class="field">
        <label for="propRequerimento">Requerimento adicional (opcional)</label>
        <textarea id="propRequerimento" rows="4" placeholder="Ex.: Em atenção ao art. 473, §3º, do CPC/2015, requer-se que a parte junte aos autos..." oninput="propCampo('requerimento', this.value)">${escapeHtml(r.requerimento || '')}</textarea>
        <span class="dica">Entra logo antes do pedido final. Deixe em branco para omitir.</span>
      </div>
      <div class="acoes" style="margin-top:16px;">
        <button class="btn btn-primary" onclick="gerarProposta(false)">Gerar documento</button>
        <button class="btn btn-ghost" onclick="gerarProposta(true)">Gerar e anexar à perícia</button>
        <span id="propStatus" style="font-size:12px; color:var(--accent-deep); font-weight:500;"></span>
      </div>`;

  return `
    <div class="section-gap">
      ${avisoFicha}
      ${panel('propModelo', 'Modelo do escritório', modeloProposta ? 'importado' : 'nenhum importado', corpoModelo)}
      ${panel('propProcesso', 'Perícia e endereçamento', escapeHtml(c.codigo), corpoProcesso)}
      ${panel('propTextos', 'Resumo e complexidade', 'rascunho automático, editável', corpoTextos)}
      ${panel('propQuadro', 'Quadro orçamentário', totais.horas + ' horas · R$ ' + brl(totais.valor), corpoQuadro)}
      ${panel('propFinal', 'Requerimentos e geração', '', corpoRequerimento)}
    </div>`;
}

/* ==========================================================================
   Seção: equipe
   Perfil de quem está conectado, quem mais tem acesso ao sistema e o
   inventário do que foi compartilhado — nos dois sentidos.
   ========================================================================== */
function avatarMembro(m, tamanho, foto){
  const lado = tamanho || 30;
  const dentro = foto
    ? `<img src="${escapeHtml(foto)}" alt="" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">`
    : escapeHtml(m.iniciais);
  return `<span class="perito-avatar" style="background:${m.cor}; width:${lado}px; height:${lado}px; font-size:${Math.round(lado*0.4)}px; overflow:hidden;">${dentro}</span>`;
}
function pillPapel(papel){
  const p = PAPEIS[papel] || PAPEIS.membro;
  const classe = papel === 'titular' ? 'pill-accent' : (papel === 'convidado' ? 'pill-muted' : 'pill-success');
  return `<span class="pill ${classe}">${p.label}</span>`;
}

function renderPerfil(){
  const el = document.getElementById('perfil');
  if(!el) return;
  const email = meuEmail();
  const m = membroDe(email);
  const foto = currentUser && currentUser.photoURL;
  const nome = email ? m.nome : 'Este navegador';
  const sub = email || 'sem conta conectada';
  el.innerHTML = `
    <button class="perito-btn perfil-card ${activeSection==='equipe'?'active':''}" style="--pcolor:${m.cor}; --pcolor-soft:var(--surface-2);"
            onclick="setSection('equipe')" title="${escapeHtml(nome)} — ${escapeHtml(sub)}">
      ${avatarMembro(m, 30, foto)}
      <span class="perito-info">
        <span class="perito-name">${escapeHtml(nome)}</span>
        <span class="perito-count">${escapeHtml(sub)}</span>
      </span>
    </button>
    <div class="perfil-nums">
      <button class="perfil-num ${activeVisao==='minhas'?'on':''}" onclick="irParaVisao('minhas')">
        <b>${contarVisao('minhas')}</b><span>minhas</span>
      </button>
      <button class="perfil-num ${activeVisao==='compartilhadas'?'on':''}" onclick="irParaVisao('compartilhadas')">
        <b>${contarVisao('compartilhadas')}</b><span>recebidas</span>
      </button>
    </div>`;
}
function irParaVisao(id){
  activeVisao = id;
  try{ localStorage.setItem('pericias.visao', id); }catch(e){}
  activeFilter = 'todas';
  searchQuery = '';
  setSection('pericias');
}

function linhaCompartilhamento(c, email, editavel){
  const m = membroDe(email);
  const nivel = nivelDe(c, email);
  const dono = nivel === 'dono';
  const avisoId = `conv-${c.id}-${email.replace(/[^a-z0-9]/gi,'')}`;
  const herdado = compartilhamentosDe(c).find(s => s.email === email && s.herdado);
  return `
    <div class="row-item com-avatar" style="cursor:default;">
      ${avatarMembro(m, 28)}
      <div class="row-main">
        <div class="row-title">${escapeHtml(m.nome)} ${email === meuEmail() ? '<span class="pill pill-muted">você</span>' : ''}</div>
        <div class="row-sub mono" style="font-size:11.5px;">${escapeHtml(email)}${herdado ? ' · acesso herdado da configuração antiga' : ''}</div>
      </div>
      <div class="row-side" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        ${dono
          ? '<span class="pill pill-accent">Dono</span>'
          : `<select onchange="mudarNivel('${c.id}','${escapeHtml(email)}',this.value)" ${editavel?'':'disabled'} style="padding:4px 8px; font-size:12px;">
               <option value="editar" ${nivel==='editar'?'selected':''}>Pode editar</option>
               <option value="leitura" ${nivel==='leitura'?'selected':''}>Somente leitura</option>
             </select>
             <button class="btn btn-ghost btn-sm" onclick="abrirConvite('${c.id}','${escapeHtml(email)}')" title="Abrir no seu programa de e-mail">Enviar convite</button>
             <button class="btn btn-ghost btn-sm" onclick="copiarConvite('${c.id}','${escapeHtml(email)}','${avisoId}')" title="Copiar o texto do convite">Copiar</button>
             ${editavel ? `<button class="btn btn-ghost btn-sm" onclick="descompartilhar('${c.id}','${escapeHtml(email)}')">Remover</button>` : ''}`}
      </div>
      <span id="${avisoId}" class="row-full dica" style="text-align:right; color:var(--accent-deep);"></span>
    </div>`;
}

function renderCompartilhamento(c){
  const editavel = podeEditar(c);
  const outros = acessosDe(c).filter(e => e !== donoDe(c));
  const corpo = `
      <div class="rows">
        ${linhaCompartilhamento(c, donoDe(c), false)}
        ${outros.map(e => linhaCompartilhamento(c, e, editavel)).join('')}
      </div>
      ${editavel ? `
      <div class="form-grid" style="margin:14px 0 0;">
        <div class="field" style="grid-column:1/-1;"><label for="shareEmail-${c.id}">Compartilhar com</label>
          <input id="shareEmail-${c.id}" type="email" placeholder="email@exemplo.com"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();enviarCompartilhamento('${c.id}')}">
          <span class="dica">A pessoa entra com a conta Google desse e-mail. Se ainda não estiver na equipe, entra como convidada.</span></div>
        <div class="field"><label for="shareNivel-${c.id}">Acesso</label>
          <select id="shareNivel-${c.id}">
            <option value="editar">Pode editar</option>
            <option value="leitura">Somente leitura</option>
          </select></div>
      </div>
      <div class="acoes" style="margin-top:10px;">
        <button class="btn btn-primary btn-sm" onclick="enviarCompartilhamento('${c.id}')">Compartilhar</button>
        <span id="shareAviso-${c.id}" style="font-size:12px; color:var(--accent-deep); font-weight:500;"></span>
      </div>`
      : `<div class="hint">Você tem acesso somente de leitura nesta perícia, então não pode alterar quem mais a enxerga.</div>`}`;
  const nota = outros.length ? `${outros.length} pessoa${outros.length===1?'':'s'} além do dono` : 'só o dono';
  return panel('share-'+c.id, 'Quem tem acesso', nota, corpo);
}
async function enviarCompartilhamento(casoId){
  const campo = document.getElementById('shareEmail-'+casoId);
  const nivel = document.getElementById('shareNivel-'+casoId).value;
  const aviso = document.getElementById('shareAviso-'+casoId);
  aviso.textContent = 'Compartilhando...';
  const r = await compartilhar(casoId, campo.value, nivel);
  if(r.erro){ aviso.textContent = r.erro; return; }
  const email = campo.value.trim().toLowerCase();
  campo.value = '';
  if(drawerCasoId === casoId) renderDrawer(); else renderAll();
  const novo = document.getElementById('shareAviso-'+casoId);
  if(novo) novo.textContent = 'Acesso liberado para ' + email + '.' + (r.aviso || '') + ' Use Enviar convite para avisar a pessoa.';
}

function renderEquipe(){
  const email = meuEmail();
  const eu = membroDe(email);
  const titular = souTitular();

  const corpoConta = `
      <div style="display:flex; gap:14px; align-items:center; flex-wrap:wrap;">
        ${avatarMembro(eu, 52, currentUser && currentUser.photoURL)}
        <div style="min-width:0;">
          <div style="font-size:16px; font-weight:600;">${escapeHtml(email ? eu.nome : 'Sem conta conectada')}</div>
          <div class="mono" style="font-size:12.5px; color:var(--muted); margin-top:2px;">${escapeHtml(email || 'os dados ficam só neste navegador')}</div>
          <div style="margin-top:7px;">${email ? pillPapel(eu.papel) : '<span class="pill pill-warning">local</span>'}
            <span class="dica" style="margin-left:6px;">${PAPEIS[eu.papel] ? PAPEIS[eu.papel].desc : ''}</span></div>
        </div>
      </div>
      <div class="kv-grid" style="margin-top:16px;">
        <div class="kv"><div class="k">Minhas perícias</div><div class="v num">${contarVisao('minhas')}</div></div>
        <div class="kv"><div class="k">Compartilhadas comigo</div><div class="v num">${contarVisao('compartilhadas')}</div></div>
        <div class="kv"><div class="k">Compartilhei com outros</div><div class="v num">${casos.filter(c => souDono(c) && acessosDe(c).length > 1).length}</div></div>
        <div class="kv"><div class="k">Pessoas na equipe</div><div class="v num">${equipe.membros.length}</div></div>
      </div>
      <div class="hint" style="margin-top:12px;">
        Os dados do perito que entram na proposta de honorários (CRC, CPF, endereço) ficam em Configurações, na ficha dos peritos.
      </div>`;

  const corpoMembros = `
      <div class="rows">
        ${equipe.membros.map(m => {
          const nPericias = casos.filter(c => donoDe(c) === m.email).length;
          const souEu = m.email === email;
          return `
          <div class="row-item com-avatar" style="cursor:default;">
            ${avatarMembro(m, 30)}
            <div class="row-main">
              <div class="row-title">${escapeHtml(m.nome)} ${souEu ? '<span class="pill pill-muted">você</span>' : ''}</div>
              <div class="row-sub mono" style="font-size:11.5px;">${escapeHtml(m.email)} · ${nPericias} perícia${nPericias===1?'':'s'} própria${nPericias===1?'':'s'}</div>
            </div>
            <div class="row-side" style="display:flex; gap:7px; align-items:center;">
              ${titular
                ? `<select onchange="alterarMembro('${escapeHtml(m.email)}','papel',this.value)" style="padding:4px 8px; font-size:12px;">
                     ${Object.entries(PAPEIS).map(([k,v]) => `<option value="${k}" ${m.papel===k?'selected':''}>${v.label}</option>`).join('')}
                   </select>
                   ${souEu ? '' : `<button class="btn btn-ghost btn-sm" onclick="confirmarRemocao('${escapeHtml(m.email)}')">Remover</button>`}`
                : pillPapel(m.papel)}
            </div>
          </div>`;
        }).join('')}
      </div>
      ${titular ? `
      <div class="form-grid" style="margin:16px 0 0;">
        <div class="field"><label for="novoMembroEmail">E-mail da conta Google</label>
          <input id="novoMembroEmail" type="email" placeholder="email@exemplo.com"></div>
        <div class="field"><label for="novoMembroNome">Nome</label>
          <input id="novoMembroNome" placeholder="como aparece na equipe"></div>
        <div class="field"><label for="novoMembroPapel">Papel</label>
          <select id="novoMembroPapel">
            ${Object.entries(PAPEIS).map(([k,v]) => `<option value="${k}" ${k==='membro'?'selected':''}>${v.label} — ${v.desc}</option>`).join('')}
          </select></div>
      </div>
      <div class="acoes" style="margin-top:6px;">
        <button class="btn btn-primary btn-sm" onclick="adicionarMembro()">Adicionar à equipe</button>
      </div>
      <div id="equipeAviso" class="hint"></div>`
      : `<div id="equipeAviso" class="hint">Só um titular pode incluir ou remover pessoas.</div>`}`;

  const recebidas = casos.filter(c => !souDono(c) && temAcesso(c));
  const corpoRecebidas = recebidas.length === 0
    ? `<div class="chart-empty">Ninguém compartilhou uma perícia com você ainda.</div>`
    : `<div class="rows">${recebidas.map(c => {
        const d = membroDe(donoDe(c));
        return `
        <div class="row-item com-avatar" onclick="openDrawer('${c.id}')">
          ${avatarMembro(d, 28)}
          <div class="row-main">
            <div class="row-title">${escapeHtml(c.codigo)} — ${escapeHtml(c.nome)}</div>
            <div class="row-sub">de ${escapeHtml(d.nome)} · ${escapeHtml(c.comarca || 'sem comarca')}</div>
          </div>
          <div class="row-side">
            <span class="pill ${podeEditar(c) ? 'pill-success' : 'pill-muted'}">${podeEditar(c) ? 'Pode editar' : 'Leitura'}</span>
          </div>
        </div>`;
      }).join('')}</div>`;

  const enviadas = casos.filter(c => souDono(c) && acessosDe(c).length > 1);
  const corpoEnviadas = enviadas.length === 0
    ? `<div class="chart-empty">Você ainda não compartilhou nenhuma perícia. Abra uma perícia e use o bloco “Quem tem acesso”.</div>`
    : `<div class="rows">${enviadas.map(c => {
        const outros = acessosDe(c).filter(e => e !== donoDe(c));
        return `
        <div class="row-item" onclick="openDrawer('${c.id}')">
          <div class="row-main">
            <div class="row-title">${escapeHtml(c.codigo)} — ${escapeHtml(c.nome)}</div>
            <div class="row-sub">${outros.map(e => escapeHtml(membroDe(e).nome) + (editoresDe(c).includes(e) ? '' : ' (leitura)')).join(' · ')}</div>
          </div>
          <div class="row-side"><span class="pill pill-accent">${outros.length} pessoa${outros.length===1?'':'s'}</span></div>
        </div>`;
      }).join('')}</div>`;

  return `
    <div class="section-gap">
      ${panel('minhaConta', 'Minha conta', email ? PAPEIS[eu.papel].label : 'sem login', corpoConta)}
      ${panel('membros', 'Pessoas com acesso ao sistema', `${equipe.membros.length} cadastrada${equipe.membros.length===1?'':'s'}`, corpoMembros)}
      ${panel('recebidas', 'Compartilhadas comigo', `${recebidas.length}`, corpoRecebidas)}
      ${panel('enviadas', 'Compartilhadas por mim', `${enviadas.length}`, corpoEnviadas)}
    </div>`;
}

/* ==========================================================================
   Seção: configurações
   ========================================================================== */
function renderConfig(){
  const totalDocs = casos.reduce((s,c) => s + (c.documentos||[]).length, 0);
  const comArquivo = casos.reduce((s,c) => s + (c.documentos||[]).filter(d => d.arquivo).length, 0);
  const bytes = casos.reduce((s,c) => s + (c.documentos||[]).reduce((t,d) => t + (d.tamanho||0), 0), 0);
  const corpoConta = `
        <div class="kv-grid">

function renderAll(){

  if(activeSection === 'visao') view.innerHTML = renderVisao();

  else if(activeSection === 'calculos') view.innerHTML = renderCalculos();

    const foco = document.activeElement;

  }

    const foco = document.activeElement;

    if(!(foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName) && view.contains(foco))) view.innerHTML = renderConfig();

}

function firebaseInit(){

  if(!firebase.apps || !firebase.apps.length){ firebase.initializeApp(FIREBASE_CONFIG); }
  auth = firebase.auth();
  storage = firebase.storage();
  auth.onAuthStateChanged(async (user) => {
    if(user && emailAutorizado(user.email)){
      currentUser = user;
    } else {
      if(user){
        cloudSetBanner(bannerAviso('O e-mail ' + escapeHtml(user.email||'') + ' não está na equipe. Peça a um titular para incluí-lo em Equipe.'));
        try{ await auth.signOut(); }catch(e){}
      }
      currentUser = null;
    }
    updateAuthButton();

  });

async function applyAuthState(){
  if(currentUser){
    db = firebase.firestore();
    usingDb = true;
    usingLocalStorage = false;
    await startDbSync();
    cloudSetBanner(bannerInfo('Conectado como ' + escapeHtml(currentUser.email) + '. Os dados sincronizam automaticamente entre os dispositivos em que você entrar com esta conta.'));
  } else {
    usingDb = false;
    db = null;
    if(casosUnsub){ casosUnsub(); casosUnsub = null; }
    if(currentDocsUnsub){ currentDocsUnsub(); currentDocsUnsub = null; }
    const loaded = loadCasosFromLocalStorage();
    if(loaded) casos = loaded;
    usingLocalStorage = true;
    persistCasosToLocalStorage();
    cloudSetBanner(bannerInfo('Dados salvos automaticamente neste navegador. Entre com o Google (conta autorizada) para sincronizar entre dispositivos.'));
    renderAll();

async function startDbSync(){
  try{
    const snap = await db.collection('casos').get();
    if(snap.empty && casos.length){
      for(const c of casos){
        const {id, documentos, ...data} = c;
        await db.collection('casos').doc(id).set(data);
        for(const d of (documentos||[])){
          const {id:docId, ...docData} = d;
          await db.collection('casos').doc(id).collection('documentos').doc(docId).set(docData);
        }
      }
    }
  }catch(e){ /* segue para a inscrição mesmo assim */ }
  assinarCasos(false);
  await sincronizarEquipe();
  sincronizarFichas();
  migrarAcessos();
  if(drawerCasoId) subscribeDocumentos(drawerCasoId);
}

/* A consulta ampla só passa enquanto as regras antigas valem. Com as regras
   por perícia, o servidor recusa ler a coleção inteira, e aí a inscrição é
   refeita filtrando pelo meu e-mail — o mesmo código serve aos dois momentos. */
function assinarCasos(filtrado){
  if(casosUnsub){ casosUnsub(); casosUnsub = null; }
  const email = meuEmail();
  const consulta = (filtrado && email)
    ? db.collection('casos').where('emails', 'array-contains', email)
    : db.collection('casos');
  casosUnsub = consulta.onSnapshot(snap => {
    const antes = {};
    casos.forEach(c => { antes[c.id] = c.documentos; });
    casos = snap.docs.map(d => ({id:d.id, documentos: antes[d.id] || [], ...d.data()}));
    if(!filtrado) migrarAcessos();
    renderAll();
  }, err => {
    if(!filtrado && email){ assinarCasos(true); return; }
    cloudSetBanner(bannerAviso('Não foi possível sincronizar agora (' + escapeHtml(err.code||'erro') + '). Exibindo a última versão conhecida.'));
  });
}

function loadCasosFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_CASOS_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed; }
  }catch(e){ }
  return null;
}
function persistCasosToLocalStorage(){
  if(!usingLocalStorage) return;
  try{
    localStorage.setItem(LS_CASOS_KEY, JSON.stringify(casos));
  }catch(e){
    cloudSetBanner(usingDb
      ? bannerAviso('O armazenamento local deste navegador está cheio, mas seus dados continuam salvos na nuvem normalmente.')
      : bannerAviso('O armazenamento local deste navegador está cheio e a última alteração pode não ter sido salva. Entre com o Google para sincronizar com a nuvem, ou remova documentos grandes que não sejam mais necessários.'));
  }
}

async function initDb(){
  const loaded = loadCasosFromLocalStorage();
  if(loaded) casos = loaded;
  usingLocalStorage = true;
  persistCasosToLocalStorage();
  cloudSetBanner(bannerInfo('Dados salvos automaticamente neste navegador. Entre com o Google (conta autorizada) para sincronizar entre dispositivos.'));
  renderAll();
  firebaseInit();
}

/* ==========================================================================
   Persistência: perícias
   ========================================================================== */
async function saveCaso(id, patch){
  const idx = casos.findIndex(c => c.id === id);
  if(idx === -1) return;
  casos[idx] = {...casos[idx], ...patch};
  if(usingDb){
    try{ await db.collection('casos').doc(id).update(patch); }
    catch(e){ /* mantém o estado local */ }
  } else {
    persistCasosToLocalStorage();
    renderAll();
  }
}
async function criarCaso(data){
  const id = 'c' + Date.now();
  const novo = {id, documentos:[], ...data};
  casos.push(novo);
  if(usingDb){
    try{ await db.collection('casos').doc(id).set(data); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  renderAll();
  return id;
}
async function excluirCaso(id){
  casos = casos.filter(c => c.id !== id);
  if(usingDb){
    try{
      const snap = await db.collection('casos').doc(id).collection('documentos').get();
      for(const d of snap.docs){ await db.collection('casos').doc(id).collection('documentos').doc(d.id).delete(); }
    }catch(e){}
    try{ await db.collection('casos').doc(id).delete(); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  closeDrawer();
  renderAll();
}
function nextCodigo(){
  const year = new Date().getFullYear();
  const n = casos.length + 1;
  return `PER-${year}-${String(n).padStart(3,'0')}`;
}
async function novaPericia(){
  if(!possoCriar()){
    cloudSetBanner(bannerAviso('Sua conta está como convidada: ela enxerga o que for compartilhado, mas não abre perícias novas.'));
    return;
  }
  const dono = meuEmail() || equipe.emails[0] || '';
  const data = {
    dono, emails:[dono], editores:[dono], compartilhamentos:[],
    codigo: nextCodigo(), nome:'Nova perícia', numeroProcesso:'', vara:'', comarca:'', partes:'',
    dataNomeacao: todayIso(), prazoEntrega: todayIso(), honorarios:0, valorRecebido:0,

  };
