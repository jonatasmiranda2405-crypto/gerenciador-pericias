/* ---------- PDF do manual ---------- */
async function manualBaixar(id){
  const lista = id === 'todos' ? MANUAIS : MANUAIS.filter(m => m.id === id);
  if(!lista.length) return;
  const ok = await gerarPdfDocs(lista, {
    arquivo: id === 'todos' ? 'gerenciador-pericia-manuais.pdf' : `gerenciador-pericia-manual-${id}.pdf`,
    rotulo: 'Gerenciador de Perícia · manual de uso', data: 'Atualizado em ' + MANUAL_DATA,
  });
  if(ok) pfAviso(id === 'todos' ? 'Manual completo baixado.' : `Manual "${lista[0].titulo}" baixado.`);
}
/* Gera um PDF A4 a partir de documentos no formato {titulo, resumo, secoes:[{t, b:[blocos]}]}.
   Blocos: ['p', texto] · ['lista', [itens]] · ['passos', [itens]] · ['alerta', título, texto] · ['dica', texto].
   Usado pelos manuais e pelos termos, pela política de privacidade e pela página de segurança. */
/* Ícone nos PDFs: no cabeçalho e como marca-d'água discreta em cada página. */
let PF_LOGO_PNG = null;
async function pfLogoPng(){
  if(PF_LOGO_PNG !== null) return PF_LOGO_PNG;
  try{
    const r = await fetch('icones/icone-192.png');
    const b = await r.blob();
    if(!r.ok || !/^image\/png/.test(b.type)) throw new Error('sem ícone');
    PF_LOGO_PNG = await new Promise((ok, falha) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = falha; f.readAsDataURL(b); });
  }catch(e){ PF_LOGO_PNG = ''; }
  return PF_LOGO_PNG;
}
function pdfMarcaDagua(doc, logo, L, W, H){
  if(!logo) return;
  for(let p = 1; p <= doc.getNumberOfPages(); p++){
    doc.setPage(p);
    try{
      doc.saveGraphicsState();
      doc.setGState(new doc.GState({opacity: 0.045}));
      doc.addImage(logo, 'PNG', L + W - 140, H - 230, 170, 170);
      doc.restoreGraphicsState();
    }catch(e){}
  }
}
async function gerarPdfDocs(lista, op){
  const logo = await pfLogoPng();
  try{ await iaCarregarJsPdf(); }
  catch(e){ pfAviso('Não foi possível gerar o PDF: ' + e.message + '. Recarregue a página e tente de novo.'); return false; }
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
  const T = iaPdfTexto;
  const L = 60, W = doc.internal.pageSize.getWidth() - 2 * L, H = doc.internal.pageSize.getHeight(), FIM = H - 66;
  const ESCURO = [26, 34, 38], CINZA = [85, 99, 106], AZUL = [51, 89, 114], AZUL_CLARO = [232, 241, 248], VERM = [163, 61, 51], VERM_CLARO = [250, 236, 232];
  const rodapes = [];   /* título do manual de cada página, para o rodapé */
  let y = 64, atual = null;
  const novaPagina = () => { doc.addPage(); y = 64; rodapes.push(atual); };
  const quebra = h => { if(y + h > FIM) novaPagina(); };
  const linhas = (txt, tam, estilo, larg) => { doc.setFont('helvetica', estilo || 'normal'); doc.setFontSize(tam); return doc.splitTextToSize(T(txt), larg); };
  const escrever = (txt, tam, estilo, cor, x, larg, entre) => {
    const ls = linhas(txt, tam, estilo, larg || W);
    const lh = tam * (entre || 1.45);
    ls.forEach(l => {
      quebra(lh);
      doc.setFont('helvetica', estilo || 'normal'); doc.setFontSize(tam); doc.setTextColor(...cor);
      doc.text(l, x || L, y + tam);
      y += lh;
    });
  };
  const caixa = (titulo, texto, fundo, barra) => {
    const larg = W - 30;
    const lt = titulo ? linhas(titulo, 10.5, 'bold', larg) : [];
    const lx = linhas(texto, 10, 'normal', larg);
    const h = 22 + lt.length * 15 + (lt.length ? 3 : 0) + lx.length * 14.5;
    quebra(h + 4);
    doc.setFillColor(...fundo); doc.rect(L, y, W, h, 'F');
    doc.setFillColor(...barra); doc.rect(L, y, 3, h, 'F');
    let yy = y + 11;
    if(lt.length){ doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...barra); doc.text(lt, L + 16, yy + 10.5); yy += lt.length * 15 + 3; }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(...ESCURO); doc.text(lx, L + 16, yy + 10, {lineHeightFactor:1.45});
    y += h + 10;
  };

  lista.forEach((m, i) => {
    atual = m.titulo;
    if(i === 0) rodapes.push(atual); else novaPagina();
    /* capa do manual */
    if(logo){ try{ doc.addImage(logo, 'PNG', L, y - 2, 18, 18); }catch(e){} }
    escrever(op.rotulo, 9.5, 'normal', CINZA, logo ? L + 25 : L, logo ? W - 25 : W); y += 6;
    escrever(m.titulo, 24, 'bold', ESCURO, L, W, 1.25); y += 6;
    escrever(m.resumo, 11.5, 'normal', CINZA); y += 6;
    escrever(op.data, 9, 'normal', CINZA); y += 10;
    doc.setDrawColor(...AZUL); doc.setLineWidth(1.5); doc.line(L, y, L + 44, y);
    y += 20;
    escrever(op.indice || 'Neste manual', 10, 'bold', AZUL); y += 2;
    m.secoes.forEach((s, k) => escrever(`${k + 1}.  ${s.t}`, 10, 'normal', ESCURO, L + 4, W - 4, 1.6));
    y += 16;
    m.secoes.forEach((s, k) => {
      quebra(70);
      escrever(`${k + 1}. ${s.t}`, 14, 'bold', AZUL, L, W, 1.3); y += 4;
      s.b.forEach(bl => {
        const tipo = bl[0];
        if(tipo === 'p'){ escrever(bl[1], 10.5, 'normal', ESCURO); y += 7; }
        else if(tipo === 'passos' || tipo === 'lista'){
          bl[1].forEach((item, n) => {
            const ls = linhas(item, 10.5, 'normal', W - 26);
            quebra(Math.min(ls.length, 2) * 15.2);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...AZUL);
            doc.text(tipo === 'passos' ? `${n + 1}.` : '•', L + (tipo === 'passos' ? 0 : 4), y + 10.5);
            escrever(item, 10.5, 'normal', ESCURO, L + 20, W - 26);
            y += 4;
          });
          y += 5;
        }
        else if(tipo === 'alerta') caixa(bl[1], bl[2], VERM_CLARO, VERM);
        else if(tipo === 'dica') caixa('Dica', bl[1], AZUL_CLARO, AZUL);
      });
      y += 10;
    });
  });

  pdfMarcaDagua(doc, logo, L, W, H);
  const total = doc.getNumberOfPages();
  for(let p = 1; p <= total; p++){
    doc.setPage(p);
    doc.setDrawColor(213, 219, 222); doc.setLineWidth(0.75); doc.line(L, H - 46, L + W, H - 46);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...CINZA);
    doc.text(T('Gerenciador de Perícia · ' + (rodapes[p - 1] || '')), L, H - 32);
    doc.text(`p. ${p} de ${total}`, L + W, H - 32, {align:'right'});
  }
  doc.save(op.arquivo);
  return true;
}

/* ==========================================================================
   Análise por IA
   Lê o que já existe na perícia — cadastro, documentos anexados em PDF,
   cálculos e a proposta — e pede ao Gemini um resumo de leitura: do que trata,
   o que merece atenção, quais quesitos cabem, o que falta pedir e qual é a
   linha do tempo.

   Três coisas valem dizer em voz alta, porque mudam o que é seguro fazer aqui:

   1. O texto sai do seu computador. A chamada vai para a API do Google com a
      sua chave. Documento sob sigilo processual deixa de estar só com você no
      momento em que a análise roda. Por isso nada é enviado sem clique, e a
      primeira vez exige um aceite específico, guardado em perfil.ia.
   2. A chave é sua e fica no seu perfil (usuarios/{uid}), que só a sua conta
      lê. Quem entrar na sua conta alcança a chave — trate-a como senha.
   3. O resultado é rascunho de leitura, não laudo. O modelo erra e inventa com
      aparência de certeza. Cada item sai com a fonte de onde foi tirado,
      justamente para você conferir contra os autos antes de usar qualquer
      linha disso.
   ========================================================================== */

const IA_ENDPOINT = 'https://generativelanguage.googleapis.com/v1beta/models/';
/* Nome de modelo envelhece: o Google aposenta versões e o app quebraria junto.
   Por isso o padrão são os apelidos -latest, que sempre apontam para a versão
   corrente da linha, e a lista do seletor é perguntada à própria API. */
const IA_MODELO_PADRAO = 'gemini-flash-latest';

const IA_FORA = /tts|image|audio|transcribe|robotics|computer-use|lyria|nano-banana|embedding|veo|imagen|deep-research|antigravity|customtools|omni/i;
let iaCatalogo = null;      /* lista viva, quando a API responde */
let iaCatalogoErro = null;
let iaBuscandoCatalogo = false;

async function iaCarregarCatalogo(forcar){
  if(!iaChaveGemini()) return;
  if(iaBuscandoCatalogo && !forcar) return;
  if(iaCatalogo && !forcar) return;
  iaBuscandoCatalogo = true;
  /* sem prazo, uma chamada que nunca responde deixaria a lista travada para
     sempre e sem erro na tela — o seletor ficaria mudo sem explicação */
  const corta = new AbortController();
  const relogio = setTimeout(() => corta.abort(), 15000);
  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',
      {headers:{'x-goog-api-key': iaChaveGemini()}, signal: corta.signal});
    const j = await res.json();
    if(!res.ok) throw new Error((j.error && j.error.message) || ('erro ' + res.status));
    const lista = (j.models || [])
      .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
      .map(m => String(m.name).replace('models/', ''))
      .filter(n => !IA_FORA.test(n) && !IA_APOSENTADOS.includes(n));
    const apelidos = lista.filter(n => n.endsWith('-latest')).sort();
    const resto = lista.filter(n => !n.endsWith('-latest')).sort().reverse();
    iaCatalogo = [...apelidos, ...resto];
    iaCatalogoErro = null;
  }catch(e){
    iaCatalogoErro = (e.name === 'AbortError')
      ? 'o Google não respondeu em 15 segundos'
      : e.message;
  }finally{
    clearTimeout(relogio);
    iaBuscandoCatalogo = false;
    if(activeSection === 'ia') renderAll();
  }
}

  }
  return IA_MODELOS;
}

/* ---------- material: o que a IA vai ler ----------
   A assinatura resume o estado do material. Se ela muda, a análise guardada
   envelheceu e o app avisa em vez de mostrar algo que já não corresponde. */
function iaAssinatura(c){
  const partes = [
    c.nome, c.numeroProcesso, c.vara, c.comarca, c.partes, c.objeto,
    c.statusCaso, c.prazoEntrega, c.honorarios, c.valorRecebido,
    (c.documentos||[]).map(d => d.id + ':' + (d.tamanho||0)).sort().join(','),
    c.proposta ? JSON.stringify(c.proposta.horas || []) : '',
  ].join('|');
  let h = 0;
  for(const ch of partes) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return String(h);
}
function iaAnalise(c){ return c && c.analiseIA ? c.analiseIA : null; }
function iaDesatualizada(c){
  const a = iaAnalise(c);
  return !!a && a.assinatura !== iaAssinatura(c);
}

async function iaTextoDoPdf(bytes, maxPag){
  if(!ensurePdfJs()) return '';
  try{
    const doc = await pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported: false, enableXfa: false}).promise;
    const n = Math.min(doc.numPages, maxPag || IA_MAX_PAGINAS);
    const partes = [];
    for(let i=1; i<=n; i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      partes.push(content.items.map(it => it.str).join(' '));
      if(partes.join(' ').length > IA_MAX_CHARS) break;
    }
    const texto = partes.join('\n').replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    return doc.numPages > n ? texto + `\n[... documento continua; lidas ${n} de ${doc.numPages} páginas ...]` : texto;
  }catch(e){ return ''; }
}
async function iaBytesDoDoc(d){
  if(!d.arquivo) return null;
  try{
    const res = await fetch(arquivoSrc(d.arquivo));
    if(!res.ok) return null;
    return new Uint8Array(await res.arrayBuffer());
  }catch(e){ return null; }
}
function iaEhPdf(d){
  const mime = (d.arquivo && d.arquivo.mime) || '';
  return /pdf/i.test(mime) || /\.pdf$/i.test(d.nome || '');
}

function iaFichaDoCaso(c){
  const st = (STATUS[c.statusCaso] || {}).label || c.statusCaso || '—';
  const linhas = [
    ['Código interno', c.codigo],
    ['Nome da perícia', c.nome],
    ['Processo', c.numeroProcesso],
    ['Vara', c.vara],
    ['Comarca', c.comarca],
    ['Partes', c.partes],
    ['Objeto declarado', c.objeto],
    ['Situação', st],
    ['Nomeação', c.dataNomeacao ? fmtDate(c.dataNomeacao) : ''],
    ['Prazo de entrega', c.prazoEntrega ? fmtDate(c.prazoEntrega) : ''],
    ['Honorários arbitrados', c.honorarios ? fmtMoney(c.honorarios) : ''],
    ['Já recebido', c.valorRecebido ? fmtMoney(c.valorRecebido) : ''],
  ].filter(([,v]) => v !== undefined && v !== null && String(v).trim() !== '');
  return linhas.map(([k,v]) => `${k}: ${v}`).join('\n');
}
function iaTextoDaProposta(c){
  const p = c.proposta;
  if(!p || !Array.isArray(p.horas)) return '';
  const horas = p.horas.reduce((s,h) => s + num(h), 0);
  const hora = num(p.horaTecnica || 0);
  const linhas = TAREFAS.map((t,i) => `  - ${t}: ${num(p.horas[i]||0)} h`);
  return [
    'PROPOSTA DE HONORÁRIOS EM RASCUNHO',
    p.area ? 'Área: ' + p.area : '',
    p.objeto ? 'Objeto proposto: ' + p.objeto : '',
    'Horas por tarefa:', ...linhas,
    `Total: ${horas} h x ${fmtMoney(hora)} = ${fmtMoney(horas*hora)}`,
    p.adiantamento ? `Adiantamento pedido: ${p.adiantamento}%` : '',
  ].filter(Boolean).join('\n');
}
function iaObservacoes(c){
  const obs = (c.observacoes || []).filter(o => o && (o.texto || o));
  if(obs.length === 0) return '';
  return 'ANOTAÇÕES DO PERITO\n' + obs.map(o => '- ' + (o.texto || o)).join('\n');
}

/* Reúne tudo e devolve o material e a lista do que entrou — a lista é
   mostrada ao perito antes do envio, para ele ver o que está saindo. */
/* na nuvem, os documentos de uma perícia só chegam quando ela é aberta: a revisão lê sempre a lista atual */
async function iaGarantirDocumentos(c){
  if(!(usingDb && db && c)) return;
  try{
    const snap = await db.collection('casos').doc(c.id).collection('documentos').get();
    c.documentos = snap.docs.filter(d => ID_SEGURO.test(d.id)).map(d => limparDocumento({...d.data(), id: d.id}));
    DOCS_OK.add(c.id);
  }catch(e){ /* sem rede: segue com o que já havia */ }
}
async function iaReunirMaterial(c, progresso, opcoes){
  if(progresso) progresso('Buscando a lista de documentos da perícia...');
  await iaGarantirDocumentos(c);
  const blocos = [];
  const fontes = [];
  const avisos = [];
  const pdfs = [];
  const comPdf = !!(opcoes && opcoes.pdfs);
  let paginasPdf = 0, bytesPdf = 0;

  blocos.push('FICHA DA PERÍCIA\n' + iaFichaDoCaso(c));
  fontes.push({tipo:'ficha', nome:'Ficha cadastral da perícia', chars: blocos[0].length});

  const prop = iaTextoDaProposta(c);
  if(prop){ blocos.push(prop); fontes.push({tipo:'proposta', nome:'Proposta de honorários (rascunho)', chars: prop.length}); }

  const anot = iaObservacoes(c);
  if(anot){ blocos.push(anot); fontes.push({tipo:'anotacao', nome:'Anotações do perito', chars: anot.length}); }

  const docs = (c.documentos || []).slice().sort((a,b) => (a.data||'').localeCompare(b.data||''));
  let total = blocos.join('\n\n').length;
  for(let i=0; i<docs.length; i++){
    const d = docs[i];
    const cabeca = `DOCUMENTO: ${d.nome || 'sem nome'}\nFase: ${d.fase || '—'} · Tipo: ${d.tipo || '—'} · Data: ${d.data ? fmtDate(d.data) : '—'}${d.obs ? '\nObservação: ' + d.obs : ''}`;
    let corpo = '';
    if(iaEhPdf(d) && d.arquivo){
      if(progresso) progresso(`Lendo ${i+1} de ${docs.length}: ${d.nome || 'documento'}`);
      const bytes = await iaBytesDoDoc(d);
      if(!bytes){
        avisos.push(`${d.nome || 'Documento'}: o arquivo não pôde ser baixado para leitura. Entrou só pelo cabeçalho.`);
      } else {
        corpo = await iaTextoDoPdf(bytes);
        /* para o Claude, o PDF vai inteiro (texto e imagem de cada página) enquanto couber */
        if(comPdf && (iaPdfInteiro() || !corpo)){
          const pag = await iaPaginasDoPdf(bytes);
          if(pag && paginasPdf + pag <= CLAUDE_MAX_PAGINAS_PDF && bytesPdf + bytes.length <= CLAUDE_MAX_BYTES_PDF){
            paginasPdf += pag; bytesPdf += bytes.length;
            pdfs.push({nome: d.nome || 'documento.pdf', base64: bytesToBase64(bytes), paginas: pag});
            fontes.push({tipo: 'documento', nome: d.nome || 'Documento', chars: 0, comTexto: true, pdf: pag});
            blocos.push(cabeca + `\n---\n[PDF anexado inteiro: "${d.nome || 'documento.pdf'}", ${pag} página${pag === 1 ? '' : 's'}]`);
            continue;
          }
          if(!corpo) avisos.push(`${d.nome || 'Documento'}: PDF digitalizado que não coube no limite de ${CLAUDE_MAX_PAGINAS_PDF} páginas por revisão. Entrou só pelo cabeçalho.`);
        }
        if(!corpo && !comPdf) avisos.push(`${d.nome || 'Documento'}: PDF sem camada de texto, provavelmente digitalizado. Entrou só pelo cabeçalho — use o Claude, que lê PDF digitalizado, ou faça OCR antes.`);
      }
    } else if(d.arquivo){
      avisos.push(`${d.nome || 'Documento'}: formato não lido aqui. Entrou só pelo cabeçalho.`);
    }
    const bloco = corpo ? cabeca + '\n---\n' + corpo : cabeca;
    if(total + bloco.length > IA_MAX_CHARS){
      avisos.push(`O material passou do limite de leitura. ${docs.length - i} documento(s) ficaram de fora: ${docs.slice(i).map(x => x.nome).filter(Boolean).join(', ')}.`);
      break;
    }
    total += bloco.length;
    blocos.push(bloco);
    fontes.push({tipo:'documento', nome: d.nome || 'Documento', chars: bloco.length, comTexto: !!corpo});
  }
  if(pdfs.length) avisos.push(`${pdfs.length} PDF${pdfs.length === 1 ? '' : 's'} (${paginasPdf} página${paginasPdf === 1 ? '' : 's'}) foram lidos inteiros pelo Claude.`);
  return {texto: blocos.join('\n\n==============================\n\n'), fontes, avisos, pdfs};
}
async function iaPaginasDoPdf(bytes){
  if(!ensurePdfJs()) return 0;
  try{ const doc = await pdfjsLib.getDocument({data: bytes.slice(), isEvalSupported: false, enableXfa: false}).promise; return doc.numPages; }
  catch(e){ return 0; }
}

    method: 'POST',
    headers: {'Content-Type':'application/json', 'x-goog-api-key': iaChaveGemini()},
    body: JSON.stringify(corpo),
  });
  if(!res.ok){
    let detalhe = '';
    try{ const j = await res.json(); detalhe = (j.error && j.error.message) || ''; }catch(e){}
    const erro = new Error((IA_ERROS[res.status] || ('Erro ' + res.status + ' na chamada.')) + (detalhe ? ' (' + detalhe + ')' : ''));
    erro.status = res.status;
    throw erro;
  }
  const dados = await res.json();
  const cand = (dados.candidates || [])[0];
  if(!cand) throw new Error('O modelo não devolveu resposta. Pode ter sido bloqueio de conteúdo.');
  const texto = ((cand.content || {}).parts || []).map(p => p.text || '').join('');
  if(!texto) throw new Error('A resposta veio vazia.');
  try{ return JSON.parse(texto); }
  catch(e){ throw new Error('A resposta não veio no formato esperado.'); }
}
/* 503 é fila cheia, passa sozinho: vale esperar. 404 é modelo aposentado:
   não adianta insistir, mas adianta cair no apelido da versão corrente. */
async function iaChamarGemini(material, c, aviso){
  let modelo = iaModelo();
  const esperas = [0, 5000, 12000];
  let ultimo = null;
  for(let i = 0; i < esperas.length; i++){
    if(esperas[i]){
      if(aviso) aviso('O modelo está com fila. Tentando de novo em ' + (esperas[i]/1000) + ' segundos...');
      await new Promise(r => setTimeout(r, esperas[i]));
    }
    try{ return {saida: await iaUmaChamada(modelo, material, c), modelo}; }
    catch(e){
      ultimo = e;
      if(e.status === 404 && modelo !== IA_MODELO_PADRAO){
        modelo = IA_MODELO_PADRAO;
        await iaSalvarConfig({modelo});
        if(aviso) aviso('O modelo escolhido saiu do ar. Passando para ' + IA_MODELO_PADRAO + '...');
        iaCarregarCatalogo(true);
        continue;
      }
      if(e.status !== 503) throw e;
    }
  }
  throw ultimo;
}

/* ---------- Claude (Anthropic) ---------- */
const CLAUDE_ERROS = {
  400: 'O pedido não foi aceito: o material pode ter ficado grande demais para uma leitura.',
  401: 'Chave inválida. Confira em "IA e chave".',
  403: 'A chave não tem permissão para este modelo, ou a conta está sem créditos.',
  404: 'Este modelo não existe nesta conta.',
  413: 'O material passou do tamanho que a API aceita. Desligue "Mandar os PDFs inteiros" ou revise menos documentos.',
  429: 'Limite de uso da sua conta atingido. Espere alguns minutos.',
  500: 'O serviço da Anthropic falhou agora.',
  529: 'O Claude está com procura alta no momento.',
};
/* o esquema do Gemini usa tipos em maiúsculas; o JSON Schema do Claude, em minúsculas */
function iaEsquemaJson(s){
  if(Array.isArray(s)) return s.map(iaEsquemaJson);
  if(s && typeof s === 'object'){
    const o = {};
    for(const [k, v] of Object.entries(s)) o[k] = (k === 'type' && typeof v === 'string') ? v.toLowerCase() : iaEsquemaJson(v);
    return o;
  }
  return s;
}
async function iaClaudePedir(conteudo, esquema, ferramenta, maxTokens){
  const res = await fetch(CLAUDE_URL, {
    method: 'POST',
    headers: {'content-type': 'application/json', 'x-api-key': iaChaveClaude(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true'},
    body: JSON.stringify({
      model: iaModeloClaude(),
      max_tokens: maxTokens || 16000,
      tools: [{name: ferramenta, description: 'Registra o resultado no Gerenciador de Perícia.', input_schema: iaEsquemaJson(esquema)}],
      tool_choice: {type: 'tool', name: ferramenta},
      messages: [{role: 'user', content: conteudo}],
    }),
  });
  if(!res.ok){
    let detalhe = '';
    try{ const j = await res.json(); detalhe = (j.error && j.error.message) || ''; }catch(e){}
    const erro = new Error((CLAUDE_ERROS[res.status] || ('Erro ' + res.status + ' na chamada.')) + (detalhe ? ' (' + detalhe + ')' : ''));
    erro.status = res.status;
    throw erro;
  }
  const j = await res.json();
  const uso = (j.content || []).find(b => b.type === 'tool_use');
  if(!uso || !uso.input || typeof uso.input !== 'object'){
    throw new Error(j.stop_reason === 'max_tokens' ? 'A resposta ficou longa demais e foi cortada. Tente o Claude Opus ou revise menos documentos.' : 'O Claude não devolveu a revisão no formato esperado.');
  }
  return uso.input;
}
async function iaChamarClaude(material, c, aviso){
  const conteudo = [
    ...material.pdfs.map(p => ({type: 'document', source: {type: 'base64', media_type: 'application/pdf', data: p.base64}, title: p.nome.slice(0, 200)})),
    {type: 'text', text: iaInstrucao(c) + '\n\n' + material.texto},
  ];
  const esperas = [0, 6000, 15000];
  let ultimo = null;
  for(let i = 0; i < esperas.length; i++){
    if(esperas[i]){
      if(aviso) aviso('O Claude está com fila. Tentando de novo em ' + (esperas[i] / 1000) + ' segundos...');
      await new Promise(r => setTimeout(r, esperas[i]));
    }
    try{ return {saida: await iaClaudePedir(conteudo, IA_ESQUEMA, 'registrar_revisao', 16000), modelo: (CLAUDE_MODELOS.find(x => x.id === iaModeloClaude()) || {}).nome || iaModeloClaude()}; }
    catch(e){ ultimo = e; if(e.status !== 529 && e.status !== 503 && e.status !== 500) throw e; }
  }
  throw ultimo;
}
async function iaChamar(material, c, aviso){
  return iaProvedor() === 'claude' ? iaChamarClaude(material, c, aviso) : iaChamarGemini(material.texto, c, aviso);
}
/* pedido curto de JSON (usado, por exemplo, para variar o texto do agente comercial) */
async function iaPedirJson(prompt, esquema){
  const p = iaProvedor();
  if(p === 'claude'){
    if(!iaChaveClaude()) throw new Error('guarde a chave do Claude na Revisão IA');
    return iaClaudePedir([{type: 'text', text: prompt}], esquema, 'registrar_texto', 2000);
  }
  if(p === 'gemini'){
    if(!iaChaveGemini()) throw new Error('guarde a chave do Gemini na Revisão IA');
    const res = await fetch(IA_ENDPOINT + encodeURIComponent(iaModelo()) + ':generateContent', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'x-goog-api-key': iaChaveGemini()},
      body: JSON.stringify({contents: [{role: 'user', parts: [{text: prompt}]}], generationConfig: {temperature: 0.8, responseMimeType: 'application/json', responseSchema: esquema}}),
    });
    const j = await res.json();
    if(!res.ok) throw new Error((j.error && j.error.message) || ('erro ' + res.status));
    const txt = ((((j.candidates || [])[0] || {}).content || {}).parts || []).map(x => x.text || '').join('');
    return JSON.parse(txt);
  }
  throw new Error('com "Minha conta de IA" não há chamada automática; peça a variação no seu chat');
}

function iaExtrairJson(texto){
  let t = String(texto || '').trim();
  const cerca = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(cerca) t = cerca[1];
  const i = t.indexOf('{'), f = t.lastIndexOf('}');
  if(i < 0 || f <= i) throw new Error('não achei o bloco JSON. Copie a resposta inteira do chat.');
  try{ return JSON.parse(t.slice(i, f + 1)); }
  catch(e){ throw new Error('o JSON da resposta veio quebrado. Peça ao chat: "responda de novo só com o JSON completo".'); }
}
function iaLimparSaida(s){
  const txt = (v, n) => String(v == null ? '' : v).slice(0, n || 2000);
  const lista = (v, fn, n) => (Array.isArray(v) ? v : []).filter(x => x && typeof x === 'object').slice(0, n || 200).map(fn);
  return {
    resumo: txt(s.resumo, 4000), areaProvavel: txt(s.areaProvavel, 200), objeto: txt(s.objeto, 1000),
    confianca: ['alta', 'media', 'baixa'].includes(String(s.confianca).toLowerCase().replace('é', 'e')) ? String(s.confianca).toLowerCase().replace('é', 'e') : 'media',
    achados: lista(s.achados, a => ({categoria: IA_CATEGORIAS.includes(a.categoria) ? a.categoria : 'Outros', gravidade: ['erro', 'atencao', 'verificar'].includes(a.gravidade) ? a.gravidade : 'verificar',
      titulo: txt(a.titulo, 300), detalhe: txt(a.detalhe), efeito: txt(a.efeito, 600), fonte: txt(a.fonte, 400), trecho: txt(a.trecho, 400)})),
    documentos: lista(s.documentos, d => ({item: txt(d.item, 300), deQuem: txt(d.deQuem, 200), porque: txt(d.porque, 600)})),
    linhaDoTempo: lista(s.linhaDoTempo, l => ({data: txt(l.data, 40), fato: txt(l.fato, 600), fonte: txt(l.fonte, 300)})),
    prazos: lista(s.prazos, p => ({quando: txt(p.quando, 80), oQue: txt(p.oQue, 400), critico: !!p.critico})),
    lacunas: (Array.isArray(s.lacunas) ? s.lacunas : []).slice(0, 100).map(x => txt(x, 600)),
  };
}

    const prep = IA_CONTA[casoId] || {};
    const analise = {...iaLimparSaida(bruto), quando: new Date().toISOString(), modelo: IA_APPS[iaApp()].nome + ' (sua conta)', por: meuEmail(),
      assinatura: iaAssinatura(c), fontes: prep.fontes || [], avisos: prep.avisos || [], chars: prep.chars || 0};

    delete IA_CONTA[casoId]; delete iaEstado[casoId];

  }catch(e){ iaEstado[casoId] = 'Não consegui ler a resposta: ' + e.message; }
  renderAll();
}

async function iaAnalisar(casoId, silencioso){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  if(iaRodando.has(casoId)) return;
  if(!temPro()){ if(!silencioso) setSection('ia'); return; }
  if(!iaPronta()){ setSection('ia'); return; }
  if(!podeEditar(c)){
    iaEstado[casoId] = 'Só quem tem acesso de edição pode gravar a análise nesta perícia.';
    renderAll(); return;
  }
  if(iaProvedor() === 'conta'){ if(!silencioso) iaPrepararConta(casoId); return; }
  iaRodando.add(casoId);
  const passo = msg => { iaEstado[casoId] = msg; if(activeSection === 'ia') renderAll(); };
  passo('Reunindo o material...');
  try{
    const material = await iaReunirMaterial(c, passo, {pdfs: iaProvedor() === 'claude'});
    passo(`Enviando para o ${IA_PROVEDORES[iaProvedor()].curto} e aguardando a leitura...`);
    const r = await iaChamar(material, c, passo);
    const analise = {
      ...r.saida,
      quando: new Date().toISOString(),
      modelo: r.modelo,
      por: meuEmail(),
      assinatura: iaAssinatura(c),
      fontes: material.fontes,
      avisos: material.avisos,
      chars: material.texto.length,
    };
    await saveCaso(casoId, {analiseIA: analise});
    delete iaEstado[casoId];
  }catch(e){
    iaEstado[casoId] = 'Não deu certo: ' + e.message;
  }finally{
    iaRodando.delete(casoId);
    renderAll();
  }
}

/* Automático: só quando a pessoa liga a opção. Espera a poeira baixar depois
   de um anexo, para não disparar uma análise por arquivo de um lote. */
function iaAgendarAuto(casoId){
  if(!temPro() || !iaAuto() || !iaPronta()) return;
  clearTimeout(iaAutoTimer);
  iaAutoTimer = setTimeout(() => iaAnalisar(casoId, true), 25000);
}

  const v = String(r||'').toLowerCase();
  if(v.startsWith('alt')) return 'pill-danger';
  if(v.startsWith('med')) return 'pill-warning';
  return 'pill-muted';
}
function iaRotuloRisco(r){
  const v = String(r||'').toLowerCase();
  if(v.startsWith('alt')) return 'risco alto';
  if(v.startsWith('med')) return 'risco médio';
  return 'risco baixo';
}

}

/* ==========================================================================
   Revisão do processo pela IA — carrossel por categoria
   A IA aponta erros e inconsistências ("achados") com o lugar exato para
   conferir. O perito decide cada um: confirmado, não é erro ou ver depois.
   As decisões ficam na perícia (campo iaRevisao); o PDF dos erros sai daqui.
   ========================================================================== */
const IA_CATEGORIAS = ['Cálculo','Valores','Índices','Datas','Documentos','Prazos','Honorários','Outros'];
const IA_GRAV = {
  erro:      {rotulo:'Erro',      pill:'pill-danger',  cor:'var(--danger)'},
  atencao:   {rotulo:'Atenção',   pill:'pill-warning', cor:'var(--warn)'},
  verificar: {rotulo:'Verificar', pill:'pill-accent',  cor:'var(--s1)'},
};
const IA_DECISAO = {
  confirmado: {curto:'erro'},
  descartado: {curto:'não é erro'},
  depois:     {curto:'depois'},
};
let iaFiltro = 'Todos';
const iaSel = {};
let iaMaisAba = 'resumo';

function iaHash(s){ let h = 0; for(const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return 'r' + h.toString(36); }
function iaGravidade(v){
  const t = normalizeText(v || '');
  if(t.startsWith('err') || t.startsWith('alt')) return 'erro';
  if(t.startsWith('aten') || t.startsWith('med')) return 'atencao';
  return 'verificar';
}
function iaCategoria(v){
  const t = normalizeText(v || '');
  return IA_CATEGORIAS.find(c => normalizeText(c) === t) || 'Outros';
}
/* Análises antigas (pontosAtencao) viram achados; quesitos sugeridos não são mais usados. */
function iaAchados(c){
  const a = iaAnalise(c);
  if(!a) return [];
  const brutos = Array.isArray(a.achados) ? a.achados
    : (a.pontosAtencao || []).map(p => ({categoria:'Outros', gravidade:p.risco, titulo:p.titulo, detalhe:p.detalhe, efeito:'', fonte:p.fonte, trecho:''}));
  const dec = c.iaRevisao || {};
  const ordem = {erro:0, atencao:1, verificar:2};
  const t = v => (v == null || typeof v === 'object') ? '' : String(v);
  return brutos.filter(x => x && typeof x === 'object').map(x => {
    const chave = iaHash(t(x.titulo) + '|' + t(x.fonte));
    return {categoria: iaCategoria(t(x.categoria)), gravidade: iaGravidade(t(x.gravidade)), titulo: t(x.titulo) || 'Sem título',
      detalhe: t(x.detalhe), efeito: t(x.efeito), fonte: t(x.fonte), trecho: t(x.trecho), chave,
      decisao: IA_DECISAO[dec[chave]] ? dec[chave] : ''};
  }).sort((p, q) => ordem[p.gravidade] - ordem[q.gravidade]);
}
function iaFiltrados(c){
  const todos = iaAchados(c);
  if(iaFiltro !== 'Todos' && !todos.some(x => x.categoria === iaFiltro)) iaFiltro = 'Todos';
  return iaFiltro === 'Todos' ? todos : todos.filter(x => x.categoria === iaFiltro);
}
function iaFiltrar(cat){ iaFiltro = cat; if(iaCasoId) iaSel[iaCasoId] = 0; renderAll(); }
function iaIr(k){
  const c = casos.find(x => x.id === iaCasoId);
  if(!c) return;
  const n = iaFiltrados(c).length;
  if(!n) return;
  iaSel[c.id] = Math.max(0, Math.min(n - 1, k));
  renderAll();
  requestAnimationFrame(() => {
    const el = document.querySelector('.ia-card.sel');
    if(el) el.scrollIntoView({block:'nearest', inline:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
  });
}
function iaPasso(d){ iaIr((iaSel[iaCasoId] || 0) + d); }
async function iaDecidir(chave, v){
  const c = casos.find(x => x.id === iaCasoId);
  if(!c) return;
  if(!podeEditar(c)){ pfAviso('Só quem pode editar esta perícia marca os achados.'); return; }
  const dec = {...(c.iaRevisao || {})};
  if(dec[chave] === v) delete dec[chave]; else dec[chave] = v;
  await saveCaso(c.id, {iaRevisao: dec});
  const F = iaFiltrados(c);
  const i = F.findIndex(x => x.chave === chave);
  iaSel[c.id] = (dec[chave] && i >= 0 && i < F.length - 1) ? i + 1 : Math.max(0, i);
  renderAll();
}
function iaAba(k){ iaMaisAba = k; renderAll(); }

function iaCorpoAnalise(c){
  const a = iaAnalise(c);
  if(!a) return `
    <div class="ia-vazio">
      <b>Esta perícia ainda não foi revisada.</b>
      <span>A revisão lê a ficha, a proposta, as suas anotações e o texto dos PDFs anexados, e aponta erros e inconsistências com o lugar exato para conferir.</span>
      ${(c.documentos || []).length ? '' : `<span>Ela fica bem melhor com os autos anexados: <button class="link-sutil" onclick="pfOrigemImport='projudi'; setSection('importar')">baixe os autos do PROJUDI</button>.</span>`}
    </div>`;

  const todos = iaAchados(c);
  const F = iaFiltrados(c);
  const conta = g => todos.filter(x => x.gravidade === g).length;
  const revisados = todos.filter(x => x.decisao).length;
  const resumo = `
    <div class="ia-resumo">
      <span class="ia-cont"><i class="ia-ponto" style="background:${IA_GRAV.erro.cor}"></i>${conta('erro')} erro${conta('erro') === 1 ? '' : 's'}</span>
      <span class="ia-cont"><i class="ia-ponto" style="background:${IA_GRAV.atencao.cor}"></i>${conta('atencao')} pede${conta('atencao') === 1 ? '' : 'm'} atenção</span>
      <span class="ia-cont"><i class="ia-ponto" style="background:${IA_GRAV.verificar.cor}"></i>${conta('verificar')} para verificar</span>
      <span class="ia-prog"><div><i style="width:${todos.length ? Math.round(100 * revisados / todos.length) : 0}%"></i></div>Revisados ${revisados} de ${todos.length}</span>
    </div>`;

  let carrossel = '';
  if(!todos.length){
    carrossel = `<div class="ia-vazio"><b>Nenhum erro ou inconsistência no material lido.</b><span>Confira em "Mais da revisão" o que faltou no material: a revisão só vale para o que foi lido.</span></div>`;
  } else {
    const i = Math.min(iaSel[c.id] || 0, F.length - 1);
    iaSel[c.id] = i;
    const s = F[i];
    const g = IA_GRAV[s.gravidade];
    const extras = [...new Set(todos.map(x => x.categoria))].filter(k => !IA_CATEGORIAS.includes(k));
    const cats = ['Todos', ...IA_CATEGORIAS.filter(k => todos.some(x => x.categoria === k)), ...extras];
    const botaoDec = (v, rotulo, classe) => `<button class="btn ${classe}" aria-pressed="${s.decisao === v}" onclick="iaDecidir(${jsq(s.chave)},${jsq(v)})">${s.decisao === v ? '✓ ' : ''}${rotulo}</button>`;
    carrossel = `
    <div class="ia-chips" role="group" aria-label="Filtrar por assunto">
      ${cats.map(k => `<button class="ia-chip" aria-pressed="${iaFiltro === k}" onclick="iaFiltrar(${jsq(k)})">${escapeHtml(k)}<span>${k === 'Todos' ? todos.length : todos.filter(x => x.categoria === k).length}</span></button>`).join('')}
    </div>
    <section aria-label="Achados">
      <div class="ia-nav">
        <span>Achado ${i + 1} de ${F.length}</span>
        <span style="flex:1"></span>
        <button class="icon-btn" aria-label="Achado anterior" onclick="iaPasso(-1)" ${i === 0 ? 'disabled' : ''}>${svg('<path d="m15 6-6 6 6 6"/>')}</button>
        <button class="icon-btn" aria-label="Próximo achado" onclick="iaPasso(1)" ${i === F.length - 1 ? 'disabled' : ''}>${svg('<path d="m9 6 6 6-6 6"/>')}</button>
      </div>
      <div class="ia-trilho">
        ${F.map((x, k) => `
          <button class="ia-card ${k === i ? 'sel' : ''}" onclick="iaIr(${k})" aria-current="${k === i}">
            <span class="ia-card-top"><i class="ia-ponto" style="background:${IA_GRAV[x.gravidade].cor}"></i>${escapeHtml(x.categoria)}${x.decisao ? `<em>${IA_DECISAO[x.decisao].curto}</em>` : ''}</span>
            <span class="ia-card-tit">${escapeHtml(x.titulo)}</span>
            <span class="ia-card-fonte mono">${escapeHtml(x.fonte.length > 70 ? x.fonte.slice(0, 68) + '…' : (x.fonte || 'fonte não indicada'))}</span>
          </button>`).join('')}
      </div>
    </section>
    <section class="ia-detalhe" id="iaDetalhe" aria-live="polite">
      <div class="ia-det-txt">
        <div style="display:flex; flex-wrap:wrap; gap:8px;"><span class="pill pill-muted">${escapeHtml(s.categoria)}</span><span class="pill ${g.pill}">${g.rotulo}</span></div>
        <h2>${escapeHtml(s.titulo)}</h2>
        ${s.detalhe ? `<p>${escapeHtml(s.detalhe)}</p>` : ''}
        ${s.efeito ? `<p><b style="color:var(--ink);">Efeito:</b> ${escapeHtml(s.efeito)}</p>` : ''}
        <span class="ia-nota">Achado para conferência, não conclusão: quem conclui é o perito.</span>
      </div>
      <div class="ia-det-lado">
        <div class="ia-onde">
          <b>Onde conferir</b>
          <span class="mono">${escapeHtml(s.fonte || 'A revisão não indicou a fonte.')}</span>
          ${s.trecho ? `<q>${escapeHtml(s.trecho)}</q>` : ''}
        </div>
        <div class="ia-acoes">
          ${botaoDec('confirmado', 'Confirmar erro', 'btn-primary')}
          ${botaoDec('descartado', 'Não é erro', 'btn-ghost')}
          ${botaoDec('depois', 'Ver depois', 'btn-ghost')}
        </div>
      </div>
    </section>`;
  }

  const linha = (titulo, sub, lado) => `<div class="row-item" style="cursor:default;"><div class="row-main"><div class="row-title">${titulo}</div>${sub ? `<div class="row-sub">${sub}</div>` : ''}</div>${lado ? `<div class="row-side">${lado}</div>` : ''}</div>`;
  const vazio = t => `<div class="chart-empty">${t}</div>`;
  const abas = [
    ['resumo', 'Resumo'],
    ['tempo', 'Linha do tempo', (a.linhaDoTempo || []).length],
    ['docs', 'Documentos a pedir', (a.documentos || []).length],
    ['prazos', 'Prazos', (a.prazos || []).length],
    ['faltou', 'O que faltou', (a.lacunas || []).length],
    ['fontes', 'Fontes lidas', (a.fontes || []).length],
  ];
  const aba = abas.some(x => x[0] === iaMaisAba) ? iaMaisAba : 'resumo';
  let corpo = '';
  if(aba === 'resumo') corpo = `
      <p style="margin:0 0 12px; font-size:14.5px; line-height:1.65;">${escapeHtml(a.resumo || '—')}</p>
      ${a.objeto ? `<p class="hint" style="margin:0 0 14px;"><b>Objeto:</b> ${escapeHtml(a.objeto)}</p>` : ''}
      <div class="kv-grid">
        <div class="kv"><div class="k">Área provável</div><div class="v">${escapeHtml(a.areaProvavel || '—')}</div></div>
        <div class="kv"><div class="k">Confiança da leitura</div><div class="v">${escapeHtml(a.confianca || '—')}</div></div>
        <div class="kv"><div class="k">Fontes lidas</div><div class="v num">${(a.fontes || []).length}</div></div>
        <div class="kv"><div class="k">Modelo</div><div class="v">${escapeHtml(a.modelo || '—')}</div></div>
      </div>`;
  else if(aba === 'tempo') corpo = (a.linhaDoTempo || []).length ? `<div class="rows">${a.linhaDoTempo.map(t => linha(escapeHtml(t.fato || ''), `<span class="mono">${escapeHtml(t.fonte || 'fonte não indicada')}</span>`, `<span class="mono" style="font-size:12px;">${escapeHtml(t.data || '—')}</span>`)).join('')}</div>` : vazio('Sem datas no material lido.');
  else if(aba === 'docs') corpo = (a.documentos || []).length ? `<div class="rows">${a.documentos.map(d => linha(escapeHtml(d.item || ''), escapeHtml(d.porque || ''), `<span class="pill pill-muted">${escapeHtml(d.deQuem || '—')}</span>`)).join('')}</div>` : vazio('Nenhum documento a pedir.');
  else if(aba === 'prazos') corpo = (a.prazos || []).length ? `<div class="rows">${a.prazos.map(p => linha(escapeHtml(p.oQue || ''), '', `<span class="mono" style="font-size:12px;">${escapeHtml(p.quando || '—')}</span>${p.critico ? ' <span class="pill pill-danger">crítico</span>' : ''}`)).join('')}</div>` : vazio('Nenhum prazo no material lido.');
  else if(aba === 'faltou') corpo = (a.lacunas || []).length ? `<ul style="margin:0; padding-left:18px; font-size:13.5px; line-height:1.7; color:var(--ink-2);">${a.lacunas.map(l => `<li>${escapeHtml(l)}</li>`).join('')}</ul>` : vazio('Nada apontado como faltante.');
  else corpo = `<div class="hint" style="line-height:1.7;">${(a.fontes || []).map(f => escapeHtml(f.nome) + (f.comTexto === false ? ' (só cabeçalho)' : '')).join(' · ') || '—'}</div>
      ${(a.avisos && a.avisos.length) ? `<div class="hint" style="margin-top:10px;"><b>Sobre a leitura:</b> ${a.avisos.map(x => escapeHtml(x)).join(' ')}</div>` : ''}`;
  const mais = `<section class="ia-mais" aria-label="Mais da revisão">
      <div class="ia-abas" role="tablist">${abas.map(([k, rotulo, n]) => `<button class="ia-aba" role="tab" aria-selected="${aba === k}" onclick="iaAba(${jsq(k)})">${rotulo}${n ? ` <span>${n}</span>` : ''}</button>`).join('')}</div>
      ${corpo}</section>`;

  return resumo + carrossel + mais;
}

function renderIA(){
  if(iaProvedor() === 'gemini' && iaChaveGemini() && !iaCatalogo && !iaBuscandoCatalogo && !iaCatalogoErro) iaCarregarCatalogo();
  const conta = iaProvedor() === 'conta';
  const lista = casosVisiveis();
  const c = lista.find(x => x.id === iaCasoId) || lista[0] || null;
  if(c) iaCasoId = c.id;
  const pronta = iaPronta();
  if(c && usingDb && !DOCS_OK.has(c.id)) setTimeout(() => docsGarantir(c).then(() => { if(activeSection === 'ia') renderAll(); }), 0);
  const a = c && iaAnalise(c);
  const rodando = c && iaRodando.has(c.id);
  const msg = c && iaEstado[c.id];
  const velho = c && iaDesatualizada(c);
  const acao = conta ? `Preparar para o ${escapeHtml(IA_APPS[iaApp()].nome)}` : (a ? 'Revisar de novo' : 'Revisar esta perícia');

  const topo = !c ? '' : `
    <div class="ia-topo">
      <div class="ia-topo-esq">
        ${lista.length > 1
          ? `<select id="iaPericia" aria-label="Perícia" onchange="iaEscolher(this.value)">${lista.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${escapeHtml(x.codigo || '')} · ${escapeHtml(casoNomeCurto(x))}</option>`).join('')}</select>`
          : `<b class="ia-um">${escapeHtml(c.codigo || '')} · ${escapeHtml(casoNomeCurto(c))}</b>`}
        <span class="ia-num mono">${escapeHtml(c.numeroProcesso || 'sem número de processo')}</span>
      </div>
      <div class="ia-topo-dir">
        <button class="ia-com" onclick="iaAbrirConfig()" title="Trocar a IA e a chave">${svg('<path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5l-1.9-4.6L5.5 9l4.6-1.4z"/>')}<span>${escapeHtml(iaNomeModelo())}</span>${svg('<path d="m6 9 6 6 6-6"/>')}</button>
        ${a ? `<button class="btn btn-ghost" onclick="iaBaixarPdf(${jsq(c.id)})">${svg('<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>')} Baixar PDF dos erros</button>` : ''}
        <button class="btn btn-primary" onclick="iaAnalisar(${jsq(c.id)})" ${rodando || !pronta ? 'disabled' : ''}>${rodando ? (conta ? 'Preparando…' : 'Revisando…') : acao}</button>
      </div>
    </div>
    ${a ? `
    <div class="ia-fresco ${velho ? 'velho' : ''}">
      <i></i><span>${velho ? 'A perícia mudou depois da revisão de ' + iaQuando(a.quando) + '.' : 'Em dia · ' + iaQuando(a.quando) + ' · ' + (a.fontes || []).length + ' fonte' + ((a.fontes || []).length === 1 ? '' : 's') + (a.modelo ? ' · ' + escapeHtml(a.modelo) : '')}</span>
      ${velho && !rodando && pronta ? `<button class="link-sutil" onclick="iaAnalisar(${jsq(c.id)})">${conta ? 'Preparar de novo' : 'Revisar de novo'}</button>` : ''}
      ${conta ? '' : `<label class="ia-auto"><input type="checkbox" ${iaAuto() ? 'checked' : ''} onchange="iaAlternarAuto(this.checked)"> Revisar sozinha ao chegar documento</label>`}
    </div>` : ''}
    ${rodando ? marcaCarregando(msg || 'Conferindo os autos…') : msg ? `<div class="banner">${svg('<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/>')}<span>${escapeHtml(msg)}</span></div>` : ''}
    ${conta && IA_CONTA[c.id] && !rodando ? iaCorpoConta(c) : ''}`;

  /* primeira vez: configuração em uma tela só, em vez dos resultados */
  const setup = pronta ? '' : `
    <section class="ia-setup">
      <header><b>Configure a Revisão IA</b><span>Escolha quem lê os autos. Dá para trocar depois, no botão da IA no alto.</span></header>
      ${iaCorpoChave()}
      ${(conta || iaChave()) && !iaCiente() ? iaCorpoCiencia() : ''}
    </section>`;

  const corpo = !c ? `<div class="ia-vazio"><b>Nenhuma perícia para revisar ainda.</b></div>` : pronta ? iaCorpoAnalise(c) : '';
  return `<div class="section-gap ia-tela">${topo}${setup}${corpo}</div>${pronta ? iaModalConfig() : ''}`;
}

/* deslizar o cartão no celular e setas do teclado */
(function(){
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => {
    const el = e.target.closest && e.target.closest('#iaDetalhe');
    if(!el){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e => {
    if(x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) iaPasso(dx < 0 ? 1 : -1);
  }, {passive:true});
  document.addEventListener('keydown', e => {
    if(activeSection !== 'ia' || e.altKey || e.ctrlKey || e.metaKey) return;
    if(typeof pfPal !== 'undefined' && pfPal.aberta) return;
    const t = document.activeElement;
    if(t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if(e.key === 'ArrowRight'){ e.preventDefault(); iaPasso(1); }
    else if(e.key === 'ArrowLeft'){ e.preventDefault(); iaPasso(-1); }
  });
})();

/* ---------- PDF dos erros (jsPDF guardado no próprio site, em vendor/) ---------- */
function iaCarregarJsPdf(){
  if(window.jspdf) return Promise.resolve();
  return new Promise((ok, falha) => {
    const s = document.createElement('script');
    s.src = 'vendor/jspdf-4.2.1.umd.min.js';
    s.onload = () => window.jspdf ? ok() : falha(new Error('o gerador de PDF não carregou'));
    s.onerror = () => falha(new Error('o gerador de PDF não carregou'));
    document.head.appendChild(s);
  });
}
/* as fontes padrão do PDF só têm o alfabeto latino: tira o que não cabe nelas */
function iaPdfTexto(s){
  return String(s || '').replace(/[‐-‒]/g, '-')
    .replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF–—‘’“”…•€]/g, '');
}
async function iaBaixarPdf(casoId){
  const logo = await pfLogoPng();
  const c = casos.find(x => x.id === casoId);
  const a = iaAnalise(c);
  if(!a){ pfAviso('Revise a perícia antes de gerar o PDF.'); return; }
  try{ await iaCarregarJsPdf(); }
  catch(e){ pfAviso('Não foi possível gerar o PDF: ' + e.message + '. Recarregue a página e tente de novo.'); return; }
  const todos = iaAchados(c);
  const conf = todos.filter(x => x.decisao === 'confirmado');
  const pend = todos.filter(x => !x.decisao || x.decisao === 'depois');
  const desc = todos.filter(x => x.decisao === 'descartado');
  const doc = new window.jspdf.jsPDF({unit:'pt', format:'a4'});
  const T = iaPdfTexto;
  const L = 56, W = doc.internal.pageSize.getWidth() - 2 * L, H = doc.internal.pageSize.getHeight(), FIM = H - 64;
  const ESCURO = [26, 34, 38], CINZA = [85, 99, 106], MEIO = [55, 65, 72];
  let y = 60;
  const quebra = h => { if(y + h > FIM){ doc.addPage(); y = 60; } };
  const linhas = (txt, tam, estilo, larg) => { doc.setFont('helvetica', estilo || 'normal'); doc.setFontSize(tam); return doc.splitTextToSize(T(txt), larg || W); };
  const escrever = (txt, tam, estilo, cor) => {
    const ls = linhas(txt, tam, estilo);
    quebra(ls.length * tam * 1.4);
    doc.setTextColor(...(cor || ESCURO));
    doc.text(ls, L, y + tam);
    y += ls.length * tam * 1.4;
  };
  if(logo){ try{ doc.addImage(logo, 'PNG', L, y - 1, 18, 18); }catch(e){} }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...CINZA);
  doc.text(T('Gerenciador de Perícia · documento de trabalho do perito'), logo ? L + 25 : L, y + 12);
  y += 26;
  escrever('Relatório de verificação dos autos', 20, 'bold'); y += 10;
  [
    ['Perícia', (c.codigo || '') + ' · ' + (c.nome || '')],
    ['Processo', c.numeroProcesso || '—'],
    ['Juízo', [c.vara, c.comarca].filter(Boolean).join(' · ') || '—'],
    ['Revisão', iaQuando(a.quando) + ' · ' + (a.fontes || []).length + ' fonte(s) lida(s)'],
    ['Situação', `${conf.length} erro(s) confirmado(s) · ${pend.length} ponto(s) a conferir · ${desc.length} descartado(s), fora deste relatório`],
  ].forEach(([k, v]) => {
    const ls = linhas(v, 10.5, 'normal', W - 100);
    const h = ls.length * 14.7 + 9;
    quebra(h);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
    doc.setTextColor(...CINZA); doc.text(T(k), L, y + 11);
    doc.setTextColor(...ESCURO); doc.text(ls, L + 100, y + 11);
    y += h;
    doc.setDrawColor(213, 219, 222); doc.setLineWidth(0.75); doc.line(L, y - 4, L + W, y - 4);
  });
  y += 10;
  escrever('Cada linha traz o que foi encontrado e onde conferir nos autos. Marque o quadrado à medida que conferir. Este relatório não é laudo nem conclusão pericial.', 10.5);
  y += 12;
  let n = 0;
  const secao = (titulo, itens) => {
    quebra(60);
    escrever(`${titulo} (${itens.length})`, 14, 'bold'); y += 6;
    if(!itens.length){ escrever('Nenhum.', 10.5, 'normal', CINZA); y += 10; return; }
    itens.forEach(x => {
      n++;
      const larg = W - 56;
      const blocos = [
        [x.titulo, 11, 'bold', ESCURO],
        x.detalhe ? [x.detalhe, 10.5, 'normal', ESCURO] : null,
        x.efeito ? ['Efeito: ' + x.efeito, 10.5, 'normal', ESCURO] : null,
        ['Onde conferir: ' + (x.fonte || 'não indicado'), 10, 'normal', MEIO],
        x.trecho ? ['Trecho: "' + x.trecho + '"', 10, 'italic', MEIO] : null,
      ].filter(Boolean);
      const alt = blocos.reduce((s, [t, tam, est]) => s + linhas(t, tam, est, larg).length * tam * 1.4, 0) + 18;
      quebra(alt);
      const y0 = y;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...ESCURO);
      doc.text(String(n), L, y + 11);
      doc.setDrawColor(...ESCURO); doc.setLineWidth(1); doc.rect(L + W - 13, y + 1, 12, 12);
      blocos.forEach(([t, tam, est, cor]) => {
        const ls = linhas(t, tam, est, larg);
        doc.setTextColor(...cor); doc.text(ls, L + 26, y + tam);
        y += ls.length * tam * 1.4;
      });
      y = Math.max(y, y0 + 16) + 6;
      doc.setDrawColor(185, 194, 199); doc.setLineWidth(0.75); doc.line(L, y, L + W, y);
      y += 10;
    });
    y += 8;
  };
  secao('Erros confirmados', conf);
  secao('Pontos a conferir', pend);
  quebra(140);
  escrever('Anotações do perito', 14, 'bold');
  for(let k = 0; k < 3; k++){ y += 22; doc.setDrawColor(185, 194, 199); doc.line(L, y, L + W, y); }
  y += 40;
  doc.setDrawColor(...ESCURO); doc.setLineWidth(0.75); doc.line(L, y, L + W * 0.42, y); doc.line(L + W * 0.47, y, L + W * 0.64, y);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...CINZA);
  doc.text('Conferido por', L, y + 13); doc.text('Data', L + W * 0.47, y + 13);
  /* carimbo de conferência, ao lado da assinatura */
  const cx = L + W * 0.68, cy = y - 30, cw = W * 0.32;
  doc.setDrawColor(27, 56, 80); doc.setLineWidth(1.1); doc.roundedRect(cx, cy, cw, 46, 6, 6, 'S');
  if(logo){ try{ doc.addImage(logo, 'PNG', cx + 8, cy + 11, 24, 24); }catch(e){} }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(...CINZA);
  doc.text('CONFERIDO NO', cx + 38, cy + 14);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(9.5); doc.setTextColor(...ESCURO);
  doc.text(T('Gerenciador de Perícia'), cx + 38, cy + 26);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(7); doc.setTextColor(...CINZA);
  doc.text(T(`${new Date().toLocaleDateString('pt-BR')} · ${conf.length} confirmado(s)`), cx + 38, cy + 37);
  pdfMarcaDagua(doc, logo, L, W, H);
  const total = doc.getNumberOfPages();
  for(let p = 1; p <= total; p++){
    doc.setPage(p); doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...CINZA);
    doc.text(T(`Gerado pelo Gerenciador de Perícia em ${new Date().toLocaleDateString('pt-BR')}. Os achados apontam onde conferir; a conclusão é do perito.`), L, H - 30);
    doc.text(`p. ${p} de ${total}`, L + W, H - 30, {align:'right'});
  }
  doc.save(`verificacao-${(c.codigo || 'pericia').replace(/[^A-Za-z0-9_-]+/g, '-')}.pdf`);
  pfAviso('PDF dos erros gerado.');
}

      view.innerHTML = activeSection === 'importar' ? renderImportar() : activeSection === 'tarefas' ? renderTarefas()

  }
  else if(activeSection === 'integracoes') view.innerHTML = renderIntegracoes();
  else if(activeSection === 'privacidade') view.innerHTML = renderPrivacidade();
  else if(activeSection === 'config') view.innerHTML = renderConfig();
  else if(activeSection === 'admin') view.innerHTML = renderAdmin();
  else if(activeSection === 'comercial'){
    const foco = document.activeElement;
    if(!(foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName) && view.contains(foco))) view.innerHTML = renderComercial();
  }
  else if(activeSection === 'perfil'){
    const foco = document.activeElement;
    if(!(foco && /^(INPUT|TEXTAREA|SELECT)$/.test(foco.tagName) && view.contains(foco))) view.innerHTML = renderMeuPerfil();
  }
  if(drawerCasoId) renderDrawer();

async function startDbSync(){
  try{
    const snap = await db.collection('casos').get();
    if(snap.empty && casos.length){
      for(const c of casos){
        const {id, documentos, ...data} = c;
        await db.collection('casos').doc(id).set(data);
        for(const d of (documentos||[])){
          const {id:docId, ...docData} = d;
          await db.collection('casos').doc(id).collection('documentos').doc(docId).set(docData);
        }
      }
    }
  }catch(e){ /* segue para a inscrição mesmo assim */ }
  assinarCasos(false);
  await carregarPerfil();
  migrarAcessos();
  if(drawerCasoId) subscribeDocumentos(drawerCasoId);
}

/* A consulta ampla só passa enquanto as regras antigas valem. Com as regras
   por perícia, o servidor recusa ler a coleção inteira, e aí a inscrição é
   refeita filtrando pelo meu e-mail — o mesmo código serve aos dois momentos. */
function assinarCasos(filtrado){
  if(casosUnsub){ casosUnsub(); casosUnsub = null; }
  const email = meuEmail();
  const consulta = (filtrado && email)
    ? db.collection('casos').where('emails', 'array-contains', email)
    : db.collection('casos');
  casosUnsub = consulta.onSnapshot(snap => {
    const antes = {};
    casos.forEach(c => { antes[c.id] = c.documentos; });
    casos = snap.docs.filter(d => ID_SEGURO.test(d.id)).map(d => limparCaso({...d.data(), id:d.id, documentos: antes[d.id] || []}));
    if(!filtrado) migrarAcessos();
    renderAll();
  }, err => {
    if(!filtrado && email){ assinarCasos(true); return; }
    cloudSetBanner(bannerAviso('Não foi possível sincronizar agora (' + escapeHtml(err.code||'erro') + '). Exibindo a última versão conhecida.'));
  });
}

function loadCasosFromLocalStorage(){
  try{
    const raw = localStorage.getItem(LS_CASOS_KEY);
    if(raw){ const parsed = JSON.parse(raw); if(Array.isArray(parsed)) return parsed; }
  }catch(e){ }
  return null;
}
function persistCasosToLocalStorage(){
  if(!usingLocalStorage) return;
  try{
    localStorage.setItem(LS_CASOS_KEY, JSON.stringify(casos));
  }catch(e){
    cloudSetBanner(usingDb
      ? bannerAviso('O armazenamento local deste navegador está cheio, mas seus dados continuam salvos na nuvem normalmente.')
      : bannerAviso('O armazenamento local deste navegador está cheio e a última alteração pode não ter sido salva. Entre com o Google para sincronizar com a nuvem, ou remova documentos grandes que não sejam mais necessários.'));
  }
}

}

async function saveCaso(id, patch){
  const idx = casos.findIndex(c => c.id === id);
  if(idx === -1) return;
  casos[idx] = {...casos[idx], ...patch};
  if(usingDb){
    try{ await db.collection('casos').doc(id).update(patch); }
    catch(e){ /* mantém o estado local */ }
  } else {
    persistCasosToLocalStorage();
    renderAll();
  }
}
async function criarCaso(data){
  const id = 'c' + Date.now();
  const novo = {id, documentos:[], ...data};
  casos.push(novo);
  if(usingDb){
    try{ await db.collection('casos').doc(id).set(data); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  renderAll();
  return id;
}
async function excluirCaso(id){
  casos = casos.filter(c => c.id !== id);
  if(usingDb){
    try{
      const snap = await db.collection('casos').doc(id).collection('documentos').get();
      for(const d of snap.docs){ await db.collection('casos').doc(id).collection('documentos').doc(d.id).delete(); }
    }catch(e){}
    try{ await db.collection('casos').doc(id).delete(); }catch(e){}
  } else {
    persistCasosToLocalStorage();
  }
  closeDrawer();
  renderAll();
}

   edição, para não perder de vista o que acompanhava. */
async function mudarDono(id, novoDono){
  const c = casos.find(x => x.id === id);
  if(!c || !souDono(c)) return;
  const antigo = donoDe(c);
  const dono = String(novoDono).toLowerCase();
  if(dono === antigo) return;
  const emails = [...new Set([dono, ...acessosDe(c)])];
  const editores = [...new Set([dono, ...editoresDe(c), antigo])];
  const compartilhamentos = [...compartilhamentosDe(c).filter(x => x.email !== dono),
    {email: antigo, nivel:'editar', quando: todayIso(), por: antigo}];
  await saveCaso(id, {dono, emails, editores, compartilhamentos});
  renderAll();
}
function fieldUpdate(id, key, val, isNumber){
  saveCaso(id, {[key]: isNumber ? (parseFloat(val)||0) : val});
}

   Persistência: documentos
   ========================================================================== */
function subscribeDocumentos(casoId){
  if(currentDocsUnsub){ currentDocsUnsub(); currentDocsUnsub = null; }
  if(!usingDb) return;
  const c = casos.find(x => x.id === casoId);
  if(c && !Array.isArray(c.documentos)) c.documentos = [];
  currentDocsUnsub = db.collection('casos').doc(casoId).collection('documentos').onSnapshot(snap => {
    const cc = casos.find(x => x.id === casoId);
    if(!cc) return;
    cc.documentos = snap.docs.filter(d => ID_SEGURO.test(d.id)).map(d => limparDocumento({...d.data(), id:d.id}));
    if(drawerCasoId === casoId) renderDrawer();
  }, err => { /* mantém último estado conhecido */ });
}
async function addDoc(casoId, data, docId){
  docId = docId || ('d'+Date.now()+Math.random().toString(36).slice(2,6));
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).set(data); return docId; }
    catch(e){ /* cai para o modo local */ }
  }
  const c = casos.find(x => x.id === casoId);
  if(!c) return docId;
  c.documentos = [...(c.documentos||[]), {id:docId, ...data}];
  persistCasosToLocalStorage();
  return docId;
}
async function updateDoc(casoId, docId, patch){
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).update(patch); return; }
    catch(e){}
  }
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  c.documentos = c.documentos.map(d => d.id === docId ? {...d, ...patch} : d);
  persistCasosToLocalStorage();
}
async function removeDoc(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && c.documentos && c.documentos.find(x => x.id === docId);
  if(usingDb){
    try{ await db.collection('casos').doc(casoId).collection('documentos').doc(docId).delete(); }
    catch(e){}
    if(d && d.arquivo && d.arquivo.storagePath && storage){
      try{ await storage.ref().child(d.arquivo.storagePath).delete(); }catch(e){}
    }
  } else {
    if(c) c.documentos = c.documentos.filter(x => x.id !== docId);
    persistCasosToLocalStorage();
  }
  renderDrawer(); renderAll();
}

async function buildArquivo(casoId, docId, bytes, filename, mime){
  if(!bytes || bytes.length === 0) return {arquivo:null, obs:''};
  if(usingDb && storage && bytes.length <= MAX_STORAGE_BYTES){
    try{
      const path = `casos/${casoId}/documentos/${docId}/${filename}`;
      const ref = storage.ref().child(path);
      await ref.put(bytes, {contentType: mime});
      const url = await ref.getDownloadURL();
      return {arquivo:{url, storagePath:path, mime, tamanho:bytes.length}, obs:''};
    }catch(e){
      /* Storage indisponível — cai para embutir no Firestore */
    }
  }
  const embedLimit = usingDb ? MAX_FIRESTORE_EMBED_BYTES : MAX_EMBED_BYTES;
  if(bytes.length <= embedLimit){
    return {arquivo:{dataUrl:`data:${mime};base64,${bytesToBase64(bytes)}`, mime, tamanho:bytes.length}, obs:''};
  }
  return {arquivo:null, obs:`Arquivo de ${fmtBytes(bytes.length)}, grande demais para armazenar; apenas o registro foi salvo.`};
}

async function addDocFromForm(casoId){
  const nomeInput = document.getElementById(`docNome-${casoId}`);
  const nome = nomeInput.value.trim();
  if(!nome) return;
  const fase = document.getElementById(`docFase-${casoId}`).value.trim() || 'Sem fase identificada';
  const tipo = document.getElementById(`docTipo-${casoId}`).value;
  const data = document.getElementById(`docData-${casoId}`).value || todayIso();
  let obs = document.getElementById(`docObs-${casoId}`).value.trim();
  const fileInput = document.getElementById(`docArquivo-${casoId}`);
  let arquivo = null, tamanho = null;
  let processo = guessProcessoFromFilename(nome);
  let codigoAcesso = null;
  const docId = 'd'+Date.now()+Math.random().toString(36).slice(2,6);
  if(fileInput.files[0]){
    const f = fileInput.files[0];
    processo = processo || guessProcessoFromFilename(f.name);
    const bytes = new Uint8Array(await f.arrayBuffer());
    tamanho = bytes.length;
    if(extOf(f.name) === 'pdf'){
      const info = await extractPdfInfo(bytes);
      processo = processo || info.processo;
      codigoAcesso = info.codigoAcesso;
    }
    const mime = f.type || mimeFor(extOf(f.name));
    const built = await buildArquivo(casoId, docId, bytes, f.name, mime);
    arquivo = built.arquivo;
    if(built.obs) obs = (obs ? obs+' — ' : '') + built.obs;
  }
  await addDoc(casoId, {nome, fase, tipo, data, obs, tamanho, arquivo, processo, codigoAcesso}, docId);
  const c = casos.find(x => x.id === casoId);
  if(c && processo && !c.numeroProcesso){ await saveCaso(casoId, {numeroProcesso: processo}); }
  if(c && codigoAcesso && !codigoAcessoValido(c.codigoAcesso)){ await saveCaso(casoId, {codigoAcesso}); }
  iaAgendarAuto(casoId);

async function handleZipImport(casoId, inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const statusEl = document.getElementById(`zipStatus-${casoId}`);
  if(typeof JSZip === 'undefined'){
    statusEl.textContent = 'Não foi possível carregar o leitor de ZIP. Tente novamente em alguns instantes.';
    inputEl.value = '';
    return;
  }
  statusEl.textContent = 'Lendo arquivo ZIP...';
  try{
    const buf = await file.arrayBuffer();
    const zip = await JSZip.loadAsync(buf);
    const entries = Object.values(zip.files).filter(f => !f.dir);
    if(entries.length === 0){ statusEl.textContent = 'O ZIP não contém arquivos.'; inputEl.value=''; return; }
    let imported = 0, semArquivo = 0;
    const processosDetectados = [];
    const codigosDetectados = [];
    for(const entry of entries){
      statusEl.textContent = `Importando ${imported+1} de ${entries.length}...`;
      const bytes = await entry.async('uint8array');
      const parts = entry.name.split('/').filter(Boolean);
      const filename = parts[parts.length-1];
      const folder = parts.length > 1 ? parts[0] : null;
      const guess = guessFromFilename(filename);
      const fase = cleanFolderName(folder) || guess.fase || 'Sem fase identificada';
      const tipo = guess.tipo;
      const data = guessDateFromFilename(filename) || isoFromDate(entry.date || new Date());
      let processo = guessProcessoFromFilename(entry.name);
      let codigoAcesso = null;
      if(extOf(filename) === 'pdf'){
        statusEl.textContent = `Lendo texto do PDF ${imported+1} de ${entries.length}...`;
        const info = await extractPdfInfo(bytes);
        processo = processo || info.processo;
        codigoAcesso = info.codigoAcesso;
      }
      if(processo) processosDetectados.push(processo);
      if(codigoAcesso) codigosDetectados.push(codigoAcesso);
      let arquivo = null, obs = '';
      const docId = 'd'+Date.now()+Math.random().toString(36).slice(2,6);
      if(bytes.length > 0){
        const built = await buildArquivo(casoId, docId, bytes, filename, mimeFor(extOf(filename)));
        arquivo = built.arquivo;
        if(built.obs){ semArquivo++; obs = built.obs; }
      }
      await addDoc(casoId, {nome:filename, fase, tipo, data, obs, tamanho:bytes.length, arquivo, processo, codigoAcesso}, docId);
      imported++;
    }
    let processoMsg = '';
    const c = casos.find(x => x.id === casoId);
    if(c && processosDetectados.length){
      const freq = {};
      processosDetectados.forEach(p => { freq[p] = (freq[p]||0)+1; });
      const maisFrequente = Object.entries(freq).sort((a,b)=>b[1]-a[1])[0][0];
      if(!c.numeroProcesso){
        await saveCaso(casoId, {numeroProcesso: maisFrequente});
        processoMsg = ` Número do processo identificado nos documentos e preenchido automaticamente: ${maisFrequente}.`;
      } else {
        const divergentes = processosDetectados.filter(p => p !== c.numeroProcesso).length;
        if(divergentes > 0){
          processoMsg = ` Atenção: ${divergentes} documento(s) têm número de processo diferente do cadastrado nesta perícia (${c.numeroProcesso}) — verifique se foram importados no caso certo.`;
        }
      }
    }
    let codigoMsg = '';
    if(c && codigosDetectados.length && !codigoAcessoValido(c.codigoAcesso)){
      const freqC = {};
      codigosDetectados.forEach(p => { freqC[p] = (freqC[p]||0)+1; });
      const codigoMaisFrequente = Object.entries(freqC).sort((a,b)=>b[1]-a[1])[0][0];
      await saveCaso(casoId, {codigoAcesso: codigoMaisFrequente});
      codigoMsg = ` Código de acesso identificado nos documentos: ${codigoMaisFrequente}.`;
    }
    statusEl.textContent = `Importação concluída: ${imported} documento(s) adicionados${semArquivo ? ', '+semArquivo+' sem arquivo anexado (muito grandes)' : ''}.${processoMsg}${codigoMsg}`;
  }catch(e){
    statusEl.textContent = 'Não foi possível ler este ZIP. Verifique o arquivo e tente novamente.';
  }
  inputEl.value = '';
  iaAgendarAuto(casoId);
  renderDrawer(); renderAll();
}

async function downloadDoc(casoId, docId){
  const c = casos.find(x => x.id === casoId);
  const d = c && c.documentos.find(x => x.id === docId);
  if(!d || !d.arquivo) return;
  const src = arquivoSrc(d.arquivo);
  if(!src){ pfAviso('Este arquivo tem um endereço inválido e não foi aberto.'); return; }
  try{
    const res = await fetch(src);
    if(!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = d.nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }catch(e){
    window.open(src, '_blank', 'noopener');
  }
}

function groupByFase(docs){
  const groups = {};
  (docs||[]).forEach(d => {
    const key = d.fase || 'Sem fase identificada';
    (groups[key] = groups[key] || []).push(d);
  });
  const entries = Object.entries(groups).map(([fase, items]) => {
    items.sort((a,b) => (a.data||'').localeCompare(b.data||''));
    const minDate = items.reduce((min,i) => (i.data && (!min || i.data < min)) ? i.data : min, null);
    return {fase, items, minDate};
  });
  entries.sort((a,b) => {
    if(a.fase === 'Sem fase identificada') return 1;
    if(b.fase === 'Sem fase identificada') return -1;
    return (a.minDate || '9999-99-99').localeCompare(b.minDate || '9999-99-99');
  });
  return entries;
}

/* ==========================================================================
   Autos do PROJUDI — integração com a extensão "PROJUDI PDFs" (v1.7+)

   Quem faz o quê:
   - Página da perícia (aqui): botão "Baixar autos do PROJUDI". Manda à extensão o número,
     o código de acesso (se houver) e a lista do que já foi importado (projudiId).
   - Extensão: abre o PROJUDI numa aba, consulta pelo código (sem login) ou com o login do
     perito (certificado digital ou CPF e senha, feito pelo próprio perito na aba do tribunal),
     lê a lista de arquivos e entrega UM arquivo por vez a esta página.
   - Esta página grava cada arquivo no Storage/Firestore da conta, com ID fixo "pj_<id no
     PROJUDI>": repetir o pedido nunca duplica, e a extensão nem baixa o que já existe.
   O Gerenciador de Perícia nunca pede nem guarda senha ou certificado do PROJUDI.
   Conversa com a extensão: window.postMessage { __pf:"app" } ⇄ { __pf:"ext" } (periciaflow.js).
   ========================================================================== */
const PJ = {
  versao: null,          // versão da extensão instalada (null = não detectada)
  status: {},            // casoId -> { etapa, texto, feitos, total, falhas, pedidoId }
  pedidos: {},           // pedidoId -> casoId
  ofertas: new Map(),    // pedidoId -> pedido vindo de "Enviar ao Gerenciador de Perícia" no PROJUDI
  respostas: new Map(), ref: 0,
  fila: Promise.resolve(),
};
const PJ_VERSAO_MINIMA = '1.7.0';
const PJ_METODOS = [
  {id:'auto',   nome:'Automático',          desc:'Usa o código de acesso quando a perícia tiver um; se não tiver, usa o seu login no PROJUDI.'},
  {id:'sessao', nome:'Sempre o meu login',  desc:'Busca com a sua sessão no PROJUDI (certificado digital ou CPF e senha).'},
  {id:'codigo', nome:'Só código de acesso', desc:'Consulta pública "Processo por Código", sem login. A perícia precisa ter o código cadastrado.'},
];

function pjMetodo(){ try{ return localStorage.getItem('pf_projudi_metodo') || 'auto'; }catch(e){ return 'auto'; } }
function pjDefinirMetodo(id){ try{ localStorage.setItem('pf_projudi_metodo', id); }catch(e){} renderAll(); }
function pjVersaoOk(){
  if(!PJ.versao) return false;
  const a = PJ.versao.split('.').map(Number), b = PJ_VERSAO_MINIMA.split('.').map(Number);
  for(let i=0;i<3;i++){ if((a[i]||0) !== (b[i]||0)) return (a[i]||0) > (b[i]||0); }
  return true;
}
function pjPost(dados){ window.postMessage({__pf:'app', ...dados}, location.origin); }
function pjPedir(dados, ms){
  return new Promise(res => {
    const ref = ++PJ.ref;
    PJ.respostas.set(ref, res);
    pjPost({...dados, ref});
    setTimeout(() => { if(PJ.respostas.has(ref)){ PJ.respostas.delete(ref); res({ok:false, erro:'A extensão não respondeu. Recarregue a página e tente de novo.'}); } }, ms || 20000);
  });
}
function pjComPrazo(promessa, ms, padrao){
  return Promise.race([promessa, new Promise(r => setTimeout(() => r(padrao), ms))]);
}

/* ---------- estado e mensagens na tela ---------- */
function pjStatusHtml(casoId){
  const s = PJ.status[casoId];
  if(!s) return '';
  const pill = {erro:'pill-danger', cancelado:'pill-muted', login:'pill-warning', assistido:'pill-warning', captcha:'pill-warning', confirmar:'pill-warning', fim:'pill-success'}[s.etapa] || 'pill-accent';
  const rotulo = {erro:'erro', cancelado:'cancelado', login:'entre no PROJUDI', assistido:'precisa de você', captcha:'verificação', confirmar:'clique em Consultar', fim:'concluído', transferindo:'recebendo'}[s.etapa] || 'em andamento';
  const barra = s.etapa === 'transferindo' && s.total
    ? `<div class="bar-track" style="margin-top:6px; height:6px;"><div class="bar-seg" style="width:${Math.round(100*s.feitos/s.total)}%; background:var(--accent); height:100%;"></div></div>` : '';
  const ativo = s.pedidoId && !['fim','erro','cancelado'].includes(s.etapa);
  return `<div style="display:flex; gap:8px; align-items:flex-start; margin-top:8px;">
      <span class="pill ${pill}">${rotulo}</span>
      <span style="flex:1; min-width:0;">${escapeHtml(s.texto || '')}${barra}</span>
      ${ativo ? `<button class="btn btn-ghost btn-sm" onclick="pjCancelar(${jsq(casoId)})">Cancelar</button>` : ''}
    </div>`;
}
function pjStatus(casoId, patch){
  if(!casoId) return;
  PJ.status[casoId] = {...(PJ.status[casoId] || {}), ...patch};
  const el = document.getElementById(`pjStatus-${casoId}`);
  if(el) el.innerHTML = pjStatusHtml(casoId);
}
function pjCasoDoPedido(pedidoId, casoId){ return casoId || PJ.pedidos[pedidoId] || null; }

/* ---------- pedir os autos (página da perícia) ---------- */
async function pjIdsJaImportados(casoId){
  const c = casos.find(x => x.id === casoId);
  const ids = new Set(((c && c.documentos) || []).map(d => d.projudiId).filter(Boolean).map(String));
  if(usingDb){
    try{
      const snap = await db.collection('casos').doc(casoId).collection('documentos').get();
      snap.forEach(d => { const v = d.data().projudiId; if(v) ids.add(String(v)); });
    }catch(e){ /* sem a lista do servidor, valem as do navegador; o ID fixo evita duplicar */ }
  }
  return [...ids];
}

async function pjBaixarAutos(casoId){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  if(!temPro()){ pjStatus(casoId, {etapa:'erro', texto:'A busca de processo no PROJUDI faz parte do Gerenciador PRO. Veja os planos em Sistema > Gerenciador PRO.'}); return; }
  if(!podeEditar(c)){ pjStatus(casoId, {etapa:'erro', texto:'Só quem pode editar esta perícia consegue baixar os autos.'}); return; }
  if(!PJ.versao){ pjStatus(casoId, {etapa:'erro', texto:'Extensão PROJUDI PDFs não encontrada neste navegador. Instale a versão 1.7 ou mais nova e recarregue a página.'}); return; }
  if(!pjVersaoOk()){ pjStatus(casoId, {etapa:'erro', texto:`A extensão instalada é a ${PJ.versao}. Atualize para a ${PJ_VERSAO_MINIMA} ou mais nova.`}); return; }
  const numero = (c.numeroProcesso || '').trim();
  if(numero.replace(/\D/g,'').length !== 20){ pjStatus(casoId, {etapa:'erro', texto:'Preencha o número do processo no formato CNJ (20 dígitos), em "Número do processo".'}); return; }
  const codigo = codigoAcessoValido(c.codigoAcesso) ? String(c.codigoAcesso).trim() : '';
  const metodo = pjMetodo();
  if(metodo === 'codigo' && !codigo){ pjStatus(casoId, {etapa:'erro', texto: c.codigoAcesso ? `O código "${String(c.codigoAcesso).slice(0, 30)}" não é uma chave de acesso do PROJUDI (ela mistura letras e números, como zrrxk42nj8dcwbqmzd). Corrija em "Código de acesso".` : 'Você escolheu "Só código de acesso", mas esta perícia não tem código cadastrado.'}); return; }

  pjStatus(casoId, {etapa:'pedindo', texto:'Conferindo o que já foi importado…', feitos:0, total:0, falhas:0, pedidoId:null});
  const jaTenho = await pjIdsJaImportados(casoId);
  const r = await pjPedir({tipo:'baixar', casoId, numero, codigo, jaTenho, preferencia: metodo});
  if(!r.ok){ pjStatus(casoId, {etapa:'erro', texto: r.erro || 'A extensão recusou o pedido.'}); return; }
  PJ.pedidos[r.pedido.id] = casoId;
  pjStatus(casoId, {etapa:'buscando', pedidoId:r.pedido.id, texto: r.pedido.metodo === 'codigo'
    ? 'Consultando o PROJUDI pelo código de acesso, numa aba em segundo plano…'
    : 'Abrindo o PROJUDI com o seu login, numa aba em segundo plano…'});
}

function pjCancelar(casoId){
  const s = PJ.status[casoId];
  if(s && s.pedidoId){ pjPost({tipo:'cancelar', pedidoId:s.pedidoId}); delete PJ.pedidos[s.pedidoId]; }
  pjStatus(casoId, {etapa:'cancelado', texto:'Pedido cancelado. O que já chegou continua salvo.', pedidoId:null});
}

/* ---------- gravar cada arquivo recebido (um por vez) ---------- */
async function pjGravarArquivo(d){
  const casoId = pjCasoDoPedido(d.pedidoId, d.casoId);
  const c = casos.find(x => x.id === casoId);
  let ok = false;
  try{
    if(!c) throw new Error('perícia não encontrada');
    const m = d.meta;
    const bytes = new Uint8Array(await d.blob.arrayBuffer());
    const nome = m.nome || ('documento_' + m.idArquivo);
    const ext = extOf(nome) || (m.mime === 'application/pdf' ? 'pdf' : 'html');
    const docId = 'pj_' + String(m.idArquivo).replace(/[^A-Za-z0-9_-]/g, '_').slice(0, 120);
    const guess = guessFromFilename(nome);
    const fase = cleanFolderName(m.fase) || guess.fase || 'Sem fase identificada';
    let codigoAcesso = null;
    if(ext === 'pdf'){
      const info = await pjComPrazo(extractPdfInfo(bytes), 15000, {});
      codigoAcesso = info.codigoAcesso || null;
    }
    const built = await buildArquivo(casoId, docId, bytes, nome, mimeFor(ext));
    if(!usingDb) c.documentos = (c.documentos || []).filter(x => x.id !== docId); // sem duplicar no modo local
    await addDoc(casoId, {
      nome, fase, tipo: guess.tipo, data: m.data || todayIso(), obs: built.obs || '',
      tamanho: bytes.length, arquivo: built.arquivo, processo: c.numeroProcesso || null, codigoAcesso,
      projudiId: String(m.idArquivo), origem: 'projudi', movimentacao: m.mov || ''
    }, docId);
    if(codigoAcesso && !codigoAcessoValido(c.codigoAcesso)) await saveCaso(casoId, {codigoAcesso});
    ok = true;
  }catch(e){
    ok = false;
  }
  const s = PJ.status[casoId] || {};
  pjStatus(casoId, {
    feitos: (s.feitos || 0) + 1,
    falhas: (s.falhas || 0) + (ok ? 0 : 1),
    texto: `Recebendo ${Math.min((s.feitos || 0) + 1, s.total || 0)} de ${s.total || '?'}: ${d.meta.nome}`
  });
  pjPost({tipo:'salvo', pedidoId:d.pedidoId, ok});
}

function pjCriarPericiaDoProjudi(pedido){
  const dono = meuEmail();
