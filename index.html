<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerenciador de Perícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
<style>
:root{
  color-scheme: light;
  --ground:#F3F5F4;
  --surface:#FFFFFF;
  --surface-2:#E9EDEB;
  --surface-3:#DFE5E3;
  --ink:#16202A;
  --ink-2:#31424A;
  --muted:#5B6B6E;
  --line:#DAE1DF;
  --line-strong:#C3CDCA;
  --accent:#14655C;
  --accent-deep:#0E4A44;
  --accent-soft:#E1EEEB;
  --ok:#2E6B4F;
  --ok-soft:#DFEDE5;
  --warn:#8A5F10;
  --warn-soft:#F4EAD2;
  --danger:#A33D33;
  --danger-soft:#F5E2DE;
  --violet:#5B4A86;
  --violet-soft:#EAE5F3;
  /* series validadas para superficie clara */
  --s1:#0b8f7f;
  --s2:#eb6834;
  --r1:#62c1b4; --r2:#38a99b; --r3:#0b8f7f; --r4:#0a7568; --r5:#085a50;
  --shadow:0 1px 2px rgba(22,32,42,.05), 0 10px 24px -16px rgba(22,32,42,.22);
  --radius:10px;
  --sidebar-w:248px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0E1417;
    --surface:#151D20;
    --surface-2:#1C262A;
    --surface-3:#243036;
    --ink:#E3EBE9;
    --ink-2:#C2D0CD;
    --muted:#93A5A2;
    --line:#27353A;
    --line-strong:#38484E;
    --accent:#5FB8AE;
    --accent-deep:#8FD3C9;
    --accent-soft:#12302D;
    --ok:#74C39A;
    --ok-soft:#163024;
    --warn:#D3A15A;
    --warn-soft:#332916;
    --danger:#E08B7A;
    --danger-soft:#33201C;
    --violet:#B3A3DD;
    --violet-soft:#241F33;
    --s1:#2a9d8f;
    --s2:#d95926;
    --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0E1417;
  --surface:#151D20;
  --surface-2:#1C262A;
  --surface-3:#243036;
  --ink:#E3EBE9;
  --ink-2:#C2D0CD;
  --muted:#93A5A2;
  --line:#27353A;
  --line-strong:#38484E;
  --accent:#5FB8AE;
  --accent-deep:#8FD3C9;
  --accent-soft:#12302D;
  --ok:#74C39A;
  --ok-soft:#163024;
  --warn:#D3A15A;
  --warn-soft:#332916;
  --danger:#E08B7A;
  --danger-soft:#33201C;
  --violet:#B3A3DD;
  --violet-soft:#241F33;
  --s1:#2a9d8f;
  --s2:#d95926;
  --r1:#085a50; --r2:#0a7568; --r3:#0b8f7f; --r4:#38a99b; --r5:#62c1b4;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums;}
.num{font-family:'IBM Plex Mono','SFMono-Regular',ui-monospace,monospace; font-variant-numeric:tabular-nums; letter-spacing:-.01em;}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.011em;}
button{font-family:inherit;}
a{color:var(--accent); text-underline-offset:2px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* ---------- estrutura ---------- */
.app{display:grid; grid-template-columns:auto 1fr; min-height:100%;}

.sidebar{
  background:var(--surface);
  border-right:1px solid var(--line);
  display:flex; flex-direction:column; gap:20px;
  padding:20px 14px;
  position:sticky; top:0; height:100vh; overflow-y:auto; overflow-x:hidden;
  width:var(--sidebar-w);
  transition:width .22s ease, padding .22s ease;
}

/* punho para recolher a barra lateral */
.rail-toggle{
  position:fixed; top:50%; left:var(--sidebar-w);
  transform:translate(-50%,-50%);
  width:18px; height:70px; padding:0; border:none; background:transparent;
  cursor:pointer; z-index:40;
  display:flex; align-items:center; justify-content:center;
  transition:left .22s ease;
}
.rail-toggle::before{
  content:''; width:4px; height:42px; border-radius:99px;
  background:var(--line-strong);
  transition:background .15s ease, height .15s ease;
}
.rail-toggle:hover::before{background:var(--accent); height:58px;}
.rail-toggle:focus-visible::before{background:var(--accent); height:58px;}

body.rail{--sidebar-w:66px;}
body.rail .sidebar{padding-left:11px; padding-right:11px;}
body.rail .brand-text,
body.rail .perito-info,
body.rail .side-label,
body.rail .nav-item > span,
body.rail .nav-badge,
body.rail .account-text,
body.rail #authBtn{display:none;}
body.rail .brand,
body.rail .account{justify-content:center; padding:0;}
body.rail .perito-btn{justify-content:center; padding:8px 0;}
body.rail .nav-item{justify-content:center; padding:10px 0;}
body.rail .side-actions{justify-content:center;}
body.rail #themeBtn{flex:1; justify-content:center;}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px;}
.brand-mark{
  width:34px; height:34px; border-radius:8px; flex-shrink:0;
  background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:13px; letter-spacing:.02em;
  font-family:'IBM Plex Mono',monospace;
}
.brand-text{min-width:0;}
.brand-name{font-size:13.5px; font-weight:600; line-height:1.2; letter-spacing:-.01em;}
.brand-sub{font-size:10.5px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-top:2px; white-space:nowrap;}

.side-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); font-weight:600; padding:0 8px; margin-bottom:8px;
}
.peritos{display:flex; flex-direction:column; gap:6px;}
.perfil-nums{display:flex; gap:6px; margin-top:7px;}
.perfil-num{
  flex:1; min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:1px;
  padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:transparent;
  color:var(--muted); font-family:inherit; cursor:pointer; text-align:left;
  transition:border-color .15s ease, background .15s ease;
}
.perfil-num:hover{background:var(--surface-2);}
.perfil-num.on{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-deep);}
.perfil-num b{font-size:15px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink);}
.perfil-num.on b{color:var(--accent-deep);}
.perfil-num span{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;}
body.rail .perfil-nums{display:none;}
.chips.visoes{margin-bottom:2px;}
.chip-num{
  margin-left:7px; padding:1px 6px; border-radius:99px; font-size:10.5px;
  background:var(--surface-2); color:var(--muted); font-variant-numeric:tabular-nums;
}
.chip.active .chip-num{background:rgba(255,255,255,.22); color:inherit;}
.perito-btn{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 9px; border-radius:8px; cursor:pointer;
  border:1px solid transparent; background:transparent; color:inherit;
  transition:background .12s, border-color .12s;
}
.perito-btn:hover{background:var(--surface-2);}
.perito-btn.active{background:var(--pcolor-soft); border-color:var(--pcolor);}
.perito-avatar{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  background:var(--pcolor); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; font-family:'IBM Plex Mono',monospace;
}
:root[data-theme="dark"] .perito-avatar, :root:not([data-theme="light"]) .perito-avatar{color:#0E1417;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .perito-avatar{color:#fff;} }
.perito-info{min-width:0; display:flex; flex-direction:column;}
.perito-name{font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.perito-count{font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums;}

.nav{display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  border:none; background:transparent; color:var(--ink-2);
  font-size:13.5px; font-weight:500; text-align:left;
  transition:background .12s, color .12s;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink);}
.nav-item.active{background:var(--accent-soft); color:var(--accent-deep); font-weight:600;}
.nav-item svg{width:17px; height:17px; flex-shrink:0; stroke-width:1.75;}
.nav-badge{
  margin-left:auto; font-size:11px; font-family:'IBM Plex Mono',monospace;
  background:var(--surface-3); color:var(--muted);
  padding:1px 6px; border-radius:99px; font-variant-numeric:tabular-nums;
}
.nav-item.active .nav-badge{background:var(--accent); color:var(--surface);}
.nav-badge.alert{background:var(--danger-soft); color:var(--danger);}

.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:14px; border-top:1px solid var(--line);}
.account{display:flex; align-items:center; gap:8px; padding:0 4px; min-width:0;}
.account-dot{width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--muted);}
.account-dot.on{background:var(--ok);}
.account-text{min-width:0; font-size:11.5px; line-height:1.35;}
.account-state{color:var(--ink); font-weight:500;}
.account-mail{color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.side-actions{display:flex; gap:6px;}

/* ---------- area principal ---------- */
.main{min-width:0; display:flex; flex-direction:column;}
.topbar{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:16px 28px;
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.menu-btn{display:none; background:transparent; border:1px solid var(--line); border-radius:8px; padding:7px; cursor:pointer; color:var(--ink);}
.menu-btn svg{width:18px; height:18px; display:block;}
.topbar-title{display:flex; flex-direction:column; min-width:0; margin-right:auto;}
.topbar-title h1{font-size:19px;}
.topbar-title p{margin:1px 0 0; font-size:12.5px; color:var(--muted);}
.content{padding:24px 28px 72px; max-width:1180px; width:100%;}

/* ---------- controles ---------- */
.btn{
  border:1px solid transparent; border-radius:8px; padding:9px 14px;
  font-size:13px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  transition:background .12s, border-color .12s, color .12s;
}
.btn svg{width:15px; height:15px; stroke-width:2;}
.btn-primary{background:var(--accent); color:var(--surface);}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent; color:var(--ink); border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:transparent; color:var(--danger); border-color:var(--danger);}
.btn-danger:hover{background:var(--danger-soft);}
.btn-sm{padding:6px 11px; font-size:12.5px;}
.btn[disabled]{opacity:.5; cursor:default;}
.icon-btn{
  background:transparent; border:none; cursor:pointer; color:var(--muted);
  padding:4px; border-radius:6px; display:inline-flex; line-height:0;
}
.icon-btn svg{width:15px; height:15px; stroke-width:1.9;}
.icon-btn:hover{background:var(--surface-2); color:var(--ink);}
.icon-btn.danger:hover{background:var(--danger-soft); color:var(--danger);}

.search{position:relative; flex:1 1 280px; max-width:420px;}
.search input{
  width:100%; padding:9px 12px 9px 34px; border-radius:8px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-size:13.5px; font-family:inherit;
}
.search svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--muted); stroke-width:2;}

.chips{display:flex; gap:7px; flex-wrap:wrap;}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--muted);
  border-radius:99px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer;
}
.chip:hover{border-color:var(--line-strong); color:var(--ink);}
.chip.active{background:var(--accent); border-color:var(--accent); color:var(--surface);}

.pill{font-size:11px; font-weight:600; padding:3px 9px; border-radius:99px; display:inline-block; white-space:nowrap;}
.pill-muted{background:var(--surface-2); color:var(--muted);}
.pill-accent{background:var(--accent-soft); color:var(--accent-deep);}
.pill-warning{background:var(--warn-soft); color:var(--warn);}
.pill-success{background:var(--ok-soft); color:var(--ok);}
.pill-danger{background:var(--danger-soft); color:var(--danger);}

.banner{
  border-radius:var(--radius); padding:11px 14px; font-size:12.5px;
  margin-bottom:18px; display:flex; gap:9px; align-items:flex-start;
  background:var(--warn-soft); color:var(--warn); border:1px solid var(--warn);
}
.banner-info{background:var(--accent-soft); color:var(--accent-deep); border-color:var(--accent);}
.banner svg{width:15px; height:15px; flex-shrink:0; margin-top:2px; stroke-width:2;}

/* ---------- blocos ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); overflow:hidden;
}
.panel-head{
  width:100%; display:flex; align-items:center; gap:10px;
  padding:15px 20px; background:transparent; border:none; cursor:pointer;
  text-align:left; color:inherit;
  transition:background .12s ease;
}
.panel-head:hover{background:var(--surface-2);}
.panel-head h3{font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.panel-head .note{margin-left:auto; font-size:11.5px; color:var(--muted); white-space:nowrap;}
.panel-caret{display:flex; color:var(--muted); flex-shrink:0; transition:transform .22s ease;}
.panel-caret svg{width:15px; height:15px; stroke-width:2.2;}
.panel.collapsed .panel-caret{transform:rotate(-90deg);}
.panel-body{display:grid; grid-template-rows:1fr; transition:grid-template-rows .22s ease;}
.panel.collapsed .panel-body{grid-template-rows:0fr;}
.panel-body > .panel-inner{overflow:hidden; min-height:0;}
.panel-inner > .panel-pad{padding:0 20px 18px;}
.section-gap{display:flex; flex-direction:column; gap:18px;}

.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px;}
.kpi .k{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:600;}
.kpi .v{font-size:27px; font-weight:600; margin-top:5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
.kpi .sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.kpi.tone-danger{border-left:3px solid var(--danger);}
.kpi.tone-danger .v{color:var(--danger);}
.kpi.tone-accent{border-left:3px solid var(--accent);}
.kpi.tone-ok{border-left:3px solid var(--ok);}
.kpi.tone-ok .v{color:var(--ok);}

.two-col{display:grid; grid-template-columns:1.25fr 1fr; gap:18px; align-items:start;}

/* ---------- graficos ---------- */
.legend{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
.legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted);}
.legend-swatch{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.bar-row{display:grid; grid-template-columns:minmax(96px,auto) 1fr; gap:12px; align-items:center; margin-bottom:11px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:12.5px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.bar-track{display:flex; align-items:center; gap:10px; min-width:0;}
.bar{display:flex; height:16px; flex:1; min-width:0; background:var(--surface-2); border-radius:4px; overflow:hidden; gap:2px;}
.bar-seg{height:100%; min-width:2px; transition:filter .12s;}
.bar-seg:first-child{border-radius:4px 0 0 4px;}
.bar-seg:last-child{border-radius:0 4px 4px 0;}
.bar-seg:only-child{border-radius:4px;}
.bar-seg:hover{filter:brightness(1.12);}
.bar-value{font-size:12px; color:var(--ink-2); white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.chart-empty{font-size:12.5px; color:var(--muted); padding:8px 0;}

#tooltip{
  position:fixed; z-index:200; pointer-events:none; opacity:0;
  background:var(--ink); color:var(--ground);
  padding:6px 9px; border-radius:6px; font-size:12px; line-height:1.4;
  box-shadow:0 6px 18px -8px rgba(0,0,0,.5); transition:opacity .1s;
  max-width:240px;
}
#tooltip .tt-v{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

/* ---------- lista de pericias ---------- */
.list{display:flex; flex-direction:column; gap:9px;}
.case{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:14px 17px; display:grid; gap:14px; align-items:center; cursor:pointer;
  grid-template-columns:auto 1fr auto auto;
  transition:border-color .12s;
}
.case:hover{border-color:var(--accent);}
.case-code{font-size:11.5px; color:var(--accent-deep); background:var(--accent-soft); padding:4px 8px; border-radius:6px; font-weight:600; font-family:'IBM Plex Mono',monospace;}
.case-title{min-width:0;}
.case-name{font-weight:600; font-size:14.5px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-meta{font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.case-prazo{text-align:right; white-space:nowrap;}
.case-prazo .lbl{font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.case-prazo .d{font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:13px;}
.case-prazo.atrasada .d{color:var(--danger);}
.case-prazo.proxima .d{color:var(--warn);}
.case-right{display:flex; flex-direction:column; align-items:flex-end; gap:5px; white-space:nowrap;}
.case-valor{font-size:12.5px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}

.empty-state{text-align:center; padding:48px 20px; color:var(--muted);}
.empty-state h3{color:var(--ink); margin-bottom:6px; font-size:15px;}
.empty-state p{margin:0; font-size:13px;}

/* ---------- tabelas / agenda / documentos ---------- */
.group{margin-bottom:22px;}
.group:last-child{margin-bottom:0;}
.group-head{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.group-head h4{font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);}
.group-rule{flex:1; height:1px; background:var(--line);}
.rows{display:flex; flex-direction:column; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
.row-item{
  background:var(--surface); padding:11px 15px; display:grid; gap:12px; align-items:center;
  grid-template-columns:1fr auto; cursor:pointer;
}
.row-item:hover{background:var(--surface-2);}
.row-item.com-avatar{grid-template-columns:auto 1fr auto;}
.drawer-body.somente-leitura input, .drawer-body.somente-leitura select,
.drawer-body.somente-leitura textarea{opacity:.6; pointer-events:none;}
.row-full{grid-column:1/-1;}
.row-main{min-width:0;}
.row-title{font-size:13.5px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:12px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-side{display:flex; align-items:center; gap:10px; white-space:nowrap;}
.row-date{font-size:12.5px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink-2);}
.row-date.late{color:var(--danger); font-weight:600;}
.row-date.soon{color:var(--warn); font-weight:600;}

/* ---------- projudi ---------- */
.svc{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:start; padding:13px 0; border-bottom:1px solid var(--line);}
.svc:last-child{border-bottom:none; padding-bottom:0;}
.svc-code{
  font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600;
  background:var(--surface-2); color:var(--ink-2); padding:3px 8px; border-radius:6px; white-space:nowrap;
}
.svc-name{font-size:13.5px; font-weight:600;}
.svc-desc{font-size:12.5px; color:var(--muted); margin-top:2px;}
.svc-fields{font-size:11.5px; color:var(--muted); margin-top:5px; font-family:'IBM Plex Mono',monospace;}
.consulta-form{display:flex; gap:9px; flex-wrap:wrap; align-items:center;}
.consulta-form input{
  flex:1 1 240px; padding:9px 12px; border-radius:8px; border:1px solid var(--line);
  background:var(--ground); color:var(--ink); font-size:13.5px;
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;
}
/* ---------- calculadoras ---------- */
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(172px,1fr)); gap:13px; margin-bottom:14px;}
.field{display:flex; flex-direction:column; gap:4px; min-width:0;}
.field label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.field input, .field select{
  border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%;
}
.field input[inputmode="decimal"]{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.field .dica{font-size:10.5px; color:var(--muted);}
.field textarea{
  border:1px solid var(--line); border-radius:7px; padding:9px 11px; font-size:13px; line-height:1.55;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%; resize:vertical; min-height:70px;
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
}
.celula-horas{
  width:82px; text-align:right; padding:5px 8px; border:1px solid var(--line); border-radius:6px;
  background:var(--ground); color:var(--ink);
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; font-size:12.5px;
}
.acoes{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
.resumo-calc{display:grid; grid-template-columns:repeat(auto-fit,minmax(152px,1fr)); gap:12px; margin:4px 0 14px;}
.resumo-item{background:var(--ground); border:1px solid var(--line); border-radius:8px; padding:11px 13px;}
.resumo-item.destaque{border-color:var(--accent); background:var(--accent-soft);}
.resumo-item .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.resumo-item .v{font-size:17px; font-weight:600; margin-top:3px; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.tabela-wrap{overflow-x:auto; overflow-y:auto; max-height:420px; border:1px solid var(--line); border-radius:8px; margin-top:14px;}
table.memoria{border-collapse:collapse; width:100%; font-size:12.5px;}
table.memoria th{
  position:sticky; top:0; z-index:1; background:var(--surface-2); text-align:right;
  padding:8px 11px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); white-space:nowrap; font-weight:600;
}
table.memoria th:first-child, table.memoria td:first-child{text-align:left;}
table.memoria td{
  padding:7px 11px; text-align:right; border-top:1px solid var(--line);
  font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums; white-space:nowrap;
}
table.memoria tbody tr:hover{background:var(--surface-2);}
table.memoria tfoot td{font-weight:600; border-top:2px solid var(--line-strong); background:var(--surface-2);}
.calc-nota{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.55;}
.kv-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:13px;}
.kv{min-width:0;}
.kv .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.kv .v{font-size:13.5px; margin-top:2px; overflow-wrap:break-word;}

/* ---------- gaveta (detalhe da pericia) ---------- */
.drawer{
  position:fixed; inset:0; background:var(--ground); z-index:60;
  display:flex; flex-direction:column;
  opacity:0; visibility:hidden; pointer-events:none; transform:scale(.995);
  transition:opacity .16s ease, transform .16s ease;
}
.drawer.open{opacity:1; visibility:visible; pointer-events:auto; transform:scale(1);}
.drawer-head{
  padding:13px 24px; border-bottom:1px solid var(--line); background:var(--surface);
  display:flex; align-items:center; gap:14px; flex-shrink:0; flex-wrap:wrap;
}
.back-btn{
  background:transparent; border:1px solid var(--line); color:var(--ink-2); cursor:pointer;
  font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
  padding:7px 11px; border-radius:8px; flex-shrink:0;
}
.back-btn:hover{background:var(--surface-2); color:var(--ink);}
.back-btn svg{width:14px; height:14px; stroke-width:2.2;}
.codigo-input{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--accent-deep);
  background:var(--accent-soft); border:1px solid transparent; border-radius:6px;
  padding:6px 9px; font-weight:600; width:150px; flex-shrink:0;
}
.nome-input{
  font-size:18px; font-weight:600; border:1px solid transparent; background:transparent;
  color:var(--ink); flex:1; padding:4px 6px; min-width:160px; border-radius:6px;
  font-family:inherit; letter-spacing:-.011em;
}
.nome-input:hover, .codigo-input:hover{border-color:var(--line);}
.drawer-body{flex:1; overflow-y:auto;}
.meta-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:13px;
  padding:18px 24px; border-bottom:1px solid var(--line); background:var(--surface);
}
.meta-item{display:flex; flex-direction:column; gap:4px; min-width:0;}
.meta-item label{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600;}
.meta-item input, .meta-item select{
  border:1px solid var(--line); border-radius:7px; padding:7px 9px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; width:100%;
}
.meta-item .readout{padding:7px 0; font-size:14px; font-weight:600; font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
.drawer-cols{display:grid; grid-template-columns:1.35fr 1fr; gap:0;}
.col-pane{padding:20px 24px;}
.col-docs{border-right:1px solid var(--line);}
.sub{margin-bottom:22px;}
.sub:last-child{margin-bottom:0;}
.sub h4{font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:10px;}
.fase-group{border-left:2px solid var(--line); padding-left:14px; margin:0 0 16px 4px; position:relative;}
.fase-group:before{content:''; position:absolute; left:-5px; top:3px; width:8px; height:8px; border-radius:50%; background:var(--accent);}
.fase-title{display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:600; font-size:12.5px; margin-bottom:8px;}
.doc-item, .obs-item{
  border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px;
  font-size:13px; display:flex; justify-content:space-between; gap:10px;
  background:var(--surface); align-items:flex-start;
}
.doc-item .d-name{font-weight:600;}
.doc-item .d-meta, .obs-item .o-date{font-size:11.5px; color:var(--muted); margin-top:3px;}
.doc-item .d-actions{display:flex; gap:2px; flex-shrink:0;}
.doc-item.editing{display:block;}
.doc-item.has-file{cursor:pointer;}
.doc-item.has-file:hover{border-color:var(--accent);}
.add-row{display:flex; gap:8px; margin-top:7px;}
.add-row input, .add-row select, .add-row textarea{
  flex:1; border:1px solid var(--line); border-radius:7px; padding:8px 10px; font-size:13px;
  background:var(--ground); color:var(--ink); font-family:inherit; min-width:0;
}
.add-row .btn{flex:0 0 auto;}
.hint{font-size:11.5px; color:var(--muted); margin-top:6px;}
.import-box{border-top:1px solid var(--line); padding-top:13px; margin-top:8px;}
.confirm-box{background:var(--danger-soft); border:1px solid var(--danger); border-radius:8px; padding:11px 13px; font-size:13px; color:var(--ink);}
.confirm-box .row{display:flex; gap:8px; margin-top:9px;}

/* ---------- visualizador ---------- */
.viewer-overlay{
  position:fixed; inset:0; background:rgba(10,14,18,.72); z-index:80;
  display:flex; align-items:center; justify-content:center; padding:22px;
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity .15s;
}
.viewer-overlay.open{opacity:1; visibility:visible; pointer-events:auto;}
.viewer-box{
  background:var(--surface); border-radius:12px; width:min(900px,100%); height:min(88vh,100%);
  display:flex; flex-direction:column; overflow:hidden; box-shadow:0 24px 60px -20px rgba(0,0,0,.6);
}
.viewer-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 17px; border-bottom:1px solid var(--line); flex-shrink:0;}
.viewer-head .v-title{font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0;}
.viewer-body{flex:1; overflow:auto; background:var(--ground); display:flex; align-items:center; justify-content:center;}
.viewer-body iframe{width:100%; height:100%; border:none;}
.viewer-body img{max-width:100%; max-height:100%; object-fit:contain;}
.viewer-fallback{padding:40px; text-align:center; color:var(--muted); font-size:13px;}

/* ---------- responsivo ---------- */
.scrim{display:none;}
@media (max-width:1040px){
  .two-col{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(2,1fr);}
  .drawer-cols{grid-template-columns:1fr;}
  .col-docs{border-right:none; border-bottom:1px solid var(--line);}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr;}
  .rail-toggle{display:none;}
  body.rail{--sidebar-w:270px;}
  body.rail .brand-text, body.rail .side-label, body.rail .account-text{display:block;}
  body.rail .perito-info{display:flex;}
  body.rail .nav-item > span{display:inline;}
  body.rail .nav-badge{display:inline-block;}
  body.rail #authBtn{display:inline-flex;}
  body.rail .brand, body.rail .account, body.rail .perito-btn, body.rail .nav-item{justify-content:flex-start;}
  body.rail .nav-item{padding:9px 10px;}
  body.rail .perito-btn{padding:8px 9px;}
  body.rail .sidebar{padding:20px 14px;}
  .sidebar{
    position:fixed; left:0; top:0; bottom:0; width:270px; z-index:70;
    transform:translateX(-100%); transition:transform .18s ease; height:100%;
  }
  body.nav-open .sidebar{transform:translateX(0);}
  body.nav-open .scrim{display:block; position:fixed; inset:0; background:rgba(10,14,18,.45); z-index:65;}
  .menu-btn{display:inline-flex;}
  .topbar{padding:13px 16px;}
  .content{padding:18px 16px 64px;}
  .meta-grid, .col-pane, .drawer-head{padding-left:16px; padding-right:16px;}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr;}
  .case{grid-template-columns:1fr; gap:9px;}
  .case-prazo, .case-right{text-align:left; align-items:flex-start;}
  .case-code{justify-self:start;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important; animation:none !important;}
}

<script>
/* ==========================================================================
   Constantes de domínio
   ========================================================================== */
const STATUS = {
  aguardando_nomeacao: {label:'Aguardando nomeação', pill:'pill-muted',   final:false, ramp:'var(--r1)'},
  aguardando_quesitos: {label:'Aguardando quesitos', pill:'pill-warning', final:false, ramp:'var(--r2)'},
  em_andamento:        {label:'Em andamento',        pill:'pill-accent',  final:false, ramp:'var(--r3)'},
  laudo_entregue:      {label:'Laudo entregue',      pill:'pill-success', final:true,  ramp:'var(--r4)'},
  concluida:           {label:'Concluída',           pill:'pill-success', final:true,  ramp:'var(--r5)'},
};
const DOC_TYPES = ['Despacho','Laudo Pericial','Quesitos','Procuração','Comprovante de Pagamento','Ofício','Ata de Audiência','Manifestação','Decisão/Sentença','Memória de Cálculo','Outro'];

/* Séries do Banco Central usadas na correção monetária (api.bcb.gov.br, consulta pública) */
const INDICES = {
  ipca:  {cod:433,  nome:'IPCA (IBGE)',            nota:'variação mensal'},
  ipcaE: {cod:7478, nome:'IPCA-E (IPCA-15)',       nota:'variação mensal'},
  inpc:  {cod:188,  nome:'INPC (IBGE)',            nota:'variação mensal'},
  igpm:  {cod:189,  nome:'IGP-M (FGV)',            nota:'variação mensal'},
  tr:    {cod:226,  nome:'TR (Banco Central)',     nota:'acumulada por período'},
  selic: {cod:4390, nome:'Selic acumulada no mês', nota:'já engloba juros de mora'},
};
const STATUS_PROCESSO = {
  em_tramitacao:  {label:'Em tramitação'},
  suspenso:       {label:'Suspenso'},
  sobrestado:     {label:'Sobrestado'},
  aguardando_julgamento: {label:'Aguardando julgamento'},
  baixado:        {label:'Baixado para cumprimento'},
  arquivado:      {label:'Arquivado'},
  transitado:     {label:'Transitado em julgado'},
  extinto:        {label:'Extinto'},
};
/* ==========================================================================
   Equipe e acesso
   Cada perícia guarda o e-mail do dono e a lista de quem recebeu acesso.
   A relação de membros mora no Firestore, em config/equipe, e é a mesma lista
   que as regras do servidor consultam para liberar o login — mudar aqui muda
   quem entra, sem precisar republicar o site.
   ========================================================================== */
const LS_EQUIPE = 'pericias.equipe';
const CORES_MEMBRO = ['var(--accent)','var(--violet)','var(--s2)','var(--ok)','var(--warn)','var(--danger)'];
const PAPEIS = {
  titular:   {label:'Titular',   desc:'administra a equipe e cria perícias'},
  membro:    {label:'Perito',    desc:'cria e gerencia as próprias perícias'},
  convidado: {label:'Convidado', desc:'vê apenas o que for compartilhado com ele'},
};
const EQUIPE_PADRAO = {
  membros: [
    {email:'jonatasmiranda2405@gmail.com',     nome:'Jonatas Miranda', iniciais:'JM', cor:'var(--accent)', papel:'titular'},
    {email:'rodrigodosantosmiranda@gmail.com', nome:'Rodrigo Miranda', iniciais:'RM', cor:'var(--violet)', papel:'membro'},
    {email:'periciamiranda@gmail.com',         nome:'Perícia Miranda', iniciais:'PM', cor:'var(--s2)',     papel:'titular'},
  ],
};
/* As três listas abaixo são derivadas dos membros e gravadas no mesmo
   documento: as regras do Firestore leem arrays, que não têm o problema de
   chave com ponto que um e-mail traria se virasse nome de campo. */
function listasDaEquipe(membros){
  return {
    emails:    membros.map(m => m.email),
    titulares: membros.filter(m => m.papel === 'titular').map(m => m.email),
    criadores: membros.filter(m => m.papel !== 'convidado').map(m => m.email),
  };
}
function iniciaisDe(texto){
  const partes = String(texto || '').replace(/@.*/, '').split(/[\s._-]+/).filter(Boolean);
  if(partes.length === 0) return '?';
  if(partes.length === 1) return partes[0].slice(0,2).toUpperCase();
  return (partes[0][0] + partes[partes.length-1][0]).toUpperCase();
}
function normalizarEquipe(bruto){
  const membros = (bruto && Array.isArray(bruto.membros) ? bruto.membros : EQUIPE_PADRAO.membros)
    .filter(m => m && m.email)
    .map((m, i) => ({
      email: String(m.email).trim().toLowerCase(),
      nome: m.nome || String(m.email).split('@')[0],
      iniciais: m.iniciais || iniciaisDe(m.nome || m.email),
      cor: m.cor || CORES_MEMBRO[i % CORES_MEMBRO.length],
      papel: PAPEIS[m.papel] ? m.papel : 'membro',
    }));
  return {membros, ...listasDaEquipe(membros)};
}
let equipe = (function(){
  try{
    const raw = localStorage.getItem(LS_EQUIPE);
    if(raw) return normalizarEquipe(JSON.parse(raw));
  }catch(e){}
  return normalizarEquipe(EQUIPE_PADRAO);
})();
function persistirEquipe(){
  try{ localStorage.setItem(LS_EQUIPE, JSON.stringify({membros: equipe.membros})); }catch(e){}
}
async function gravarEquipe(){
  equipe = normalizarEquipe(equipe);
  persistirEquipe();
  if(usingDb && db){
    try{ await db.collection('config').doc('equipe').set({membros: equipe.membros, ...listasDaEquipe(equipe.membros)}); }
    catch(e){ cloudSetBanner(bannerAviso('A equipe mudou aqui, mas o servidor recusou a gravação — só um titular pode alterar a lista.')); }
  }
  renderAll();
}
async function sincronizarEquipe(){
  if(!usingDb || !db) return;
  try{
    const doc = await db.collection('config').doc('equipe').get();
    if(doc.exists){
      equipe = normalizarEquipe(doc.data());
      persistirEquipe();
    } else {
      await db.collection('config').doc('equipe').set({membros: equipe.membros, ...listasDaEquipe(equipe.membros)});
    }
  }catch(e){ /* offline ou sem permissão: segue com a cópia local */ }
}

/* ---------- quem sou eu ---------- */
function meuEmail(){ return ((currentUser && currentUser.email) || '').trim().toLowerCase(); }
function membroDe(email){
  const e = String(email || '').trim().toLowerCase();
  const achado = equipe.membros.find(m => m.email === e);
  if(achado) return achado;
  return {email:e, nome: e ? e.split('@')[0] : 'Sem conta', iniciais: iniciaisDe(e), cor:'var(--muted)', papel:'convidado', forasteiro:true};
}
function souTitular(){
  const e = meuEmail();
  if(!e) return true;                       /* sem login, o app é só deste navegador */
  return equipe.titulares.includes(e);
}
function possoCriar(){
  const e = meuEmail();
  return !e || equipe.criadores.includes(e);
}

/* ---------- dono e acesso de cada perícia ---------- */
const DE_PARA_ANTIGO = {jonatas:'jonatasmiranda2405@gmail.com', rodrigo:'rodrigodosantosmiranda@gmail.com'};
function donoDe(c){
  if(c && c.dono) return String(c.dono).toLowerCase();
  if(c && c.contador && DE_PARA_ANTIGO[c.contador]) return DE_PARA_ANTIGO[c.contador];
  return meuEmail() || (equipe.emails[0] || '');
}
function acessosDe(c){ return Array.isArray(c.emails) ? c.emails : [donoDe(c)]; }
function editoresDe(c){ return Array.isArray(c.editores) ? c.editores : [donoDe(c)]; }
function souDono(c){ const e = meuEmail(); return !e || donoDe(c) === e; }
function temAcesso(c){ const e = meuEmail(); return !e || acessosDe(c).includes(e); }
function podeEditar(c){ const e = meuEmail(); return !e || editoresDe(c).includes(e); }
function compartilhamentosDe(c){ return Array.isArray(c.compartilhamentos) ? c.compartilhamentos : []; }

/* ---------- migração das perícias antigas ----------
   Toda perícia sem dono recebe um: o perito que estava marcado nela. As outras
   contas da equipe entram como acesso herdado, para ninguém perder de vista o
   que já enxergava; dá para remover uma a uma dentro da perícia. */
let migracaoFeita = false;
async function migrarAcessos(){
  if(migracaoFeita || !usingDb || !db) return;
  const pendentes = casos.filter(c => !c.dono || !Array.isArray(c.emails));
  if(pendentes.length === 0){ migracaoFeita = true; return; }
  for(const c of pendentes){
    const dono = donoDe(c);
    const outros = equipe.emails.filter(e => e !== dono);
    try{
      await saveCaso(c.id, {
        dono,
        emails: [dono, ...outros],
        editores: [dono, ...outros],
        compartilhamentos: outros.map(e => ({email:e, nivel:'editar', quando: todayIso(), por: dono, herdado:true})),
      });
    }catch(e){ return; }
  }
  migracaoFeita = true;
  renderAll();
}

/* ---------- compartilhar ---------- */
function nivelDe(c, email){
  const e = String(email||'').toLowerCase();
  if(donoDe(c) === e) return 'dono';
  if(!acessosDe(c).includes(e)) return null;
  return editoresDe(c).includes(e) ? 'editar' : 'leitura';
}
async function compartilhar(casoId, emailBruto, nivel){
  const c = casos.find(x => x.id === casoId);
  if(!c) return {erro:'Perícia não encontrada.'};
  const email = String(emailBruto||'').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return {erro:'Informe um e-mail válido.'};
  if(email === donoDe(c)) return {erro:'Este e-mail já é o dono da perícia.'};
  if(!podeEditar(c)) return {erro:'Só quem tem acesso de edição pode compartilhar.'};

  let aviso = '';
  if(!equipe.emails.includes(email)){
    if(!souTitular()) return {erro:'Este e-mail não está na equipe. Peça a um titular para incluí-lo em Equipe.'};
    equipe.membros = [...equipe.membros, {email, nome: email.split('@')[0], iniciais: iniciaisDe(email),
      cor: CORES_MEMBRO[equipe.membros.length % CORES_MEMBRO.length], papel:'convidado'}];
    await gravarEquipe();
    aviso = ' O e-mail entrou na equipe como convidado, senão não conseguiria fazer login.';
  }
  const emails = [...new Set([...acessosDe(c), email])];
  const editores = nivel === 'editar'
    ? [...new Set([...editoresDe(c), email])]
    : editoresDe(c).filter(x => x !== email);
  const compartilhamentos = [...compartilhamentosDe(c).filter(s => s.email !== email),
    {email, nivel, quando: todayIso(), por: meuEmail() || donoDe(c)}];
  await saveCaso(casoId, {emails, editores, compartilhamentos});
  return {ok:true, aviso};
}
async function mudarNivel(casoId, email, nivel){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const e = String(email).toLowerCase();
  const editores = nivel === 'editar'
    ? [...new Set([...editoresDe(c), e])]
    : editoresDe(c).filter(x => x !== e);
  await saveCaso(casoId, {
    editores,
    compartilhamentos: compartilhamentosDe(c).map(s => s.email === e ? {...s, nivel, herdado:false} : s),
  });
  renderAll();
}
async function descompartilhar(casoId, email){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const e = String(email).toLowerCase();
  await saveCaso(casoId, {
    emails: acessosDe(c).filter(x => x !== e),
    editores: editoresDe(c).filter(x => x !== e),
    compartilhamentos: compartilhamentosDe(c).filter(s => s.email !== e),
  });
  renderAll();
}

/* ---------- convite por e-mail ---------- */
function enderecoDoApp(){ return location.origin + location.pathname; }
function textoConvite(c, email){
  const nivel = nivelDe(c, email) === 'editar' ? 'editar a perícia e anexar documentos' : 'consultar a perícia e os documentos';
  const quem = membroDe(meuEmail() || donoDe(c));
  return [
    'Olá,',
    '',
    `Compartilhei com você a perícia ${c.codigo} — ${c.nome} no Gerenciador de Perícias.`,
    '',
    c.numeroProcesso ? `Processo: ${c.numeroProcesso}` : null,
    (c.vara || c.comarca) ? `Vara: ${[c.vara, c.comarca].filter(Boolean).join(' — ')}` : null,
    c.partes ? `Partes: ${c.partes}` : null,
    `Seu acesso permite ${nivel}.`,
    '',
    `Endereço: ${enderecoDoApp()}`,
    `Entre com a conta Google ${email}.`,
    '',
    quem.nome,
  ].filter(l => l !== null).join('\n');
}
function abrirConvite(casoId, email){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const assunto = `Perícia ${c.codigo} compartilhada com você`;
  location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(assunto)}&body=${encodeURIComponent(textoConvite(c, email))}`;
}
async function copiarConvite(casoId, email, alvoId){
  const c = casos.find(x => x.id === casoId);
  if(!c) return;
  const aviso = document.getElementById(alvoId);
  try{
    await navigator.clipboard.writeText(textoConvite(c, email));
    if(aviso) aviso.textContent = 'Convite copiado.';
  }catch(e){
    if(aviso) aviso.textContent = 'Não foi possível copiar; use o botão de e-mail.';
  }
  setTimeout(() => { if(aviso) aviso.textContent = ''; }, 4000);
}

async function adicionarMembro(){
  const aviso = document.getElementById('equipeAviso');
  const email = (document.getElementById('novoMembroEmail').value || '').trim().toLowerCase();
  const nome = (document.getElementById('novoMembroNome').value || '').trim();

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ aviso.textContent = 'Informe um e-mail válido.'; return; }
  if(equipe.emails.includes(email)){ aviso.textContent = 'Esse e-mail já está na equipe.'; return; }
  equipe.membros = [...equipe.membros, {email, nome: nome || email.split('@')[0], iniciais: iniciaisDe(nome || email),
    cor: CORES_MEMBRO[equipe.membros.length % CORES_MEMBRO.length], papel}];
  await gravarEquipe();
}
async function alterarMembro(email, campo, valor){
  const e = String(email).toLowerCase();
  equipe.membros = equipe.membros.map(m => m.email === e
    ? {...m, [campo]: valor, ...(campo === 'nome' ? {iniciais: iniciaisDe(valor || e)} : {})}
    : m);
  equipe = normalizarEquipe(equipe);
  persistirEquipe();
  if(usingDb && db){
    try{ await db.collection('config').doc('equipe').set({membros: equipe.membros, ...listasDaEquipe(equipe.membros)}); }catch(e2){}
  }
}

  const alvo = document.getElementById('equipeAviso');
  const m = membroDe(email);
  const nPericias = casos.filter(c => donoDe(c) === m.email).length;
  alvo.innerHTML = `

      Tirar <b>${escapeHtml(m.nome)}</b> da equipe? A conta deixa de conseguir entrar e perde o acesso ao que foi compartilhado com ela.
      ${nPericias ? `<br>Atenção: ${nPericias} perícia${nPericias===1?'':'s'} tem esse e-mail como dono e ficaria sem responsável.` : ''}

    </div>`;
}
async function removerMembro(email){
  const e = String(email).toLowerCase();
  if(e === meuEmail()){ document.getElementById('equipeAviso').textContent = 'Você não pode remover a própria conta.'; return; }
  equipe.membros = equipe.membros.filter(m => m.email !== e);
  if(equipe.membros.filter(m => m.papel === 'titular').length === 0){
    document.getElementById('equipeAviso').textContent = 'A equipe precisa de pelo menos um titular.';
    equipe = normalizarEquipe(equipe);
    return;
  }
  await gravarEquipe();
  /* tira o acesso dessa conta de tudo que passa por este navegador */
  for(const c of casos.filter(c => acessosDe(c).includes(e) && donoDe(c) !== e && podeEditar(c))){
    await descompartilhar(c.id, e);
  }
}

  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function normalizeText(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }

function fmtBytes(n){
  if(!n) return '';
  if(n < 1024) return n+' B';
  if(n < 1024*1024) return (n/1024).toFixed(1)+' KB';
  return (n/1024/1024).toFixed(1)+' MB';
}
function bytesToBase64(bytes){
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){ binary += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk)); }
  return btoa(binary);
}
function base64ToBytes(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

  if((m = filename.match(/(\d{4})[-_.](\d{2})[-_.](\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if((m = filename.match(/(\d{2})[-_.](\d{2})[-_.](\d{4})/))) return `${m[3]}-${m[2]}-${m[1]}`;
  if((m = filename.match(/(?:^|[^\d])(\d{8})(?:[^\d]|$)/))){
    const s = m[1], y = s.slice(0,4);
    if(y >= '1990' && y <= '2100') return `${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`;
  }
  return null;
}
function guessProcessoFromFilename(filename){
  let m = filename.match(/(\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4})/);
  if(m) return m[1];
  m = filename.match(/(?:^|[^\d])(\d{20})(?:[^\d]|$)/);
  if(m){
    const s = m[1];
    return `${s.slice(0,7)}-${s.slice(7,9)}.${s.slice(9,13)}.${s.slice(13,14)}.${s.slice(14,16)}.${s.slice(16,20)}`;
  }
  return null;
}
function isoFromDate(d){ try{ return d.toISOString().slice(0,10); }catch(e){ return todayIso(); } }
function mimeFromDataUrl(dataUrl){
  const m = dataUrl && dataUrl.match(/^data:([^;]+);/);
  return m ? m[1] : 'application/octet-stream';
}
function arquivoSrc(arquivo){ return arquivo.url || arquivo.dataUrl; }
function arquivoMime(arquivo){ return arquivo.mime || mimeFromDataUrl(arquivo.dataUrl); }
function guessCodigoAcessoFromText(text){
  const m = text.match(/c[oó]digo\s*(?:de|do)?\s*acesso\s*[:\-]?\s*([A-Za-z0-9]{4,20})/i);
  return m ? m[1].toUpperCase() : null;
}
function svg(path, extra){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${path}</svg>`;
}
function diasAte(iso){
  if(!iso) return null;
  return Math.round((new Date(iso+'T00:00:00') - new Date(todayIso()+'T00:00:00')) / 86400000);
}
function prazoState(caso){
  const meta = STATUS[caso.statusCaso];
  if(meta && meta.final) return 'ok';
  const diff = diasAte(caso.prazoEntrega);
  if(diff === null) return 'ok';
  if(diff < 0) return 'atrasada';
  if(diff <= 7) return 'proxima';
  return 'ok';
}
function pillForTipo(tipo){
  const map = {'Despacho':'pill-accent','Laudo Pericial':'pill-success','Decisão/Sentença':'pill-success','Quesitos':'pill-warning','Manifestação':'pill-warning'};
  return map[tipo] || 'pill-muted';
}

let pdfJsReady = false;
function ensurePdfJs(){
  if(typeof pdfjsLib === 'undefined') return false;
  if(!pdfJsReady){
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      pdfJsReady = true;
    }catch(e){ return false; }
  }
  return true;
}
async function extractPdfInfo(bytes){
  const result = {processo:null, codigoAcesso:null};
  if(!ensurePdfJs()) return result;
  try{
    const doc = await pdfjsLib.getDocument({data: bytes.slice()}).promise;
    let text = '';
    const maxPages = Math.min(doc.numPages, 3);
    for(let i=1; i<=maxPages; i++){
      const page = await doc.getPage(i);
      const content = await page.getTextContent();
      text += ' ' + content.items.map(it => it.str).join(' ');
      if(text.length > 20000) break;
    }
    result.processo = guessProcessoFromFilename(text);
    result.codigoAcesso = guessCodigoAcessoFromText(text);
  }catch(e){ /* PDF sem camada de texto, corrompido ou leitor indisponível */ }
  return result;
}

function matchesQuery(c, q){
  if(!q) return true;
  const hay = [c.codigo, c.nome, c.numeroProcesso, c.comarca, c.vara, c.partes].join(' ').toLowerCase();
  return hay.includes(q.toLowerCase());
}
function matchesFilter(c, f){
  if(f === 'todas') return true;
  if(f === 'ativas') return !STATUS[c.statusCaso].final;
  if(f === 'atrasadas') return prazoState(c) === 'atrasada';
  if(f === 'concluidas') return STATUS[c.statusCaso].final;
  return true;
}

function visibleCasos(){
  return casosVisiveis()
    .filter(c => matchesFilter(c, activeFilter) && matchesQuery(c, searchQuery))
    .sort((a,b) => (a.prazoEntrega||'').localeCompare(b.prazoEntrega||''));
}
function todosDocumentos(){
  const out = [];
  casosVisiveis().forEach(c => {
    (c.documentos||[]).forEach(d => out.push({...d, caso:c}));
  });
  return out.sort((a,b) => (b.data||'').localeCompare(a.data||''));
}

const tooltipEl = () => document.getElementById('tooltip');
function showTip(evt, html){
  const t = tooltipEl();
  t.innerHTML = html;
  t.style.opacity = '1';
  moveTip(evt);
}
function moveTip(evt){
  const t = tooltipEl();
  const pad = 14;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  const r = t.getBoundingClientRect();
  if(x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
  if(y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
  t.style.left = x + 'px';
  t.style.top = y + 'px';
}
function hideTip(){ tooltipEl().style.opacity = '0'; }

function chartHonorarios(base){
  const visiveis = casos.filter(temAcesso);
  const donos = [...new Set(visiveis.map(donoDe))];
  const linhas = donos.map(email => {
    const list = visiveis.filter(c => donoDe(c) === email);
    const recebido = list.reduce((s,c) => s + (c.valorRecebido||0), 0);
    const aReceber = list.reduce((s,c) => s + Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)), 0);
    return {nome: membroDe(email).nome, recebido, aReceber, total: recebido + aReceber};
  }).filter(l => l.total > 0).sort((a,b) => b.total - a.total);

  if(linhas.length === 0) return `<div class="chart-empty">Nenhum honorário lançado ainda.</div>`;
  const max = Math.max(...linhas.map(l => l.total));

  return `
    <div class="legend">
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s1)"></span>Recebido</span>
      <span class="legend-item"><span class="legend-swatch" style="background:var(--s2)"></span>A receber</span>
    </div>
    ${linhas.map(l => {
      const wR = max ? (l.recebido / max) * 100 : 0;
      const wA = max ? (l.aReceber / max) * 100 : 0;
      return `
      <div class="bar-row">
        <span class="bar-label">${escapeHtml(l.nome)}</span>
        <span class="bar-track">
          <span class="bar">
            ${l.recebido > 0 ? `<span class="bar-seg" style="width:${wR}%; background:var(--s1)"
              onmousemove="showTip(event, 'Recebido<br><span class=\\'tt-v\\'>${fmtMoney(l.recebido)}</span>')" onmouseleave="hideTip()"></span>` : ''}
            ${l.aReceber > 0 ? `<span class="bar-seg" style="width:${wA}%; background:var(--s2)"
              onmousemove="showTip(event, 'A receber<br><span class=\\'tt-v\\'>${fmtMoney(l.aReceber)}</span>')" onmouseleave="hideTip()"></span>` : ''}
          </span>
          <span class="bar-value">${fmtMoney(l.total)}</span>
        </span>
      </div>`;
    }).join('')}`;
}

function chartStatus(base){
  const counts = Object.entries(STATUS).map(([key, meta]) => ({
    key, label: meta.label, ramp: meta.ramp,
    n: base.filter(c => c.statusCaso === key).length
  }));
  const total = counts.reduce((s,c) => s + c.n, 0);
  if(total === 0) return `<div class="chart-empty">Nenhuma perícia cadastrada para este perito.</div>`;
  const max = Math.max(...counts.map(c => c.n));
  return counts.map(c => `
    <div class="bar-row">
      <span class="bar-label">${c.label}</span>
      <span class="bar-track">
        <span class="bar">
          ${c.n > 0 ? `<span class="bar-seg" style="width:${(c.n/max)*100}%; background:${c.ramp}"
            onmousemove="showTip(event, '${c.label}<br><span class=\\'tt-v\\'>${c.n} de ${total}</span>')" onmouseleave="hideTip()"></span>` : ''}
        </span>
        <span class="bar-value">${c.n}</span>
      </span>
    </div>`).join('');
}

function renderVisao(){
  const base = casosVisiveis();
  const ativas = base.filter(c => !STATUS[c.statusCaso].final).length;
  const atrasadas = base.filter(c => prazoState(c) === 'atrasada').length;
  const aReceber = base.reduce((s,c) => s + Math.max(0,(c.honorarios||0)-(c.valorRecebido||0)), 0);
  const recebido = base.reduce((s,c) => s + (c.valorRecebido||0), 0);
  const concluidas = base.filter(c => STATUS[c.statusCaso].final).length;
  const totalHon = aReceber + recebido;
  const pctRecebido = totalHon ? Math.round((recebido/totalHon)*100) : 0;

  const proximos = base
    .filter(c => !STATUS[c.statusCaso].final && c.prazoEntrega)
    .sort((a,b) => a.prazoEntrega.localeCompare(b.prazoEntrega))
    .slice(0,5);

  return `
    <div class="section-gap">
      <div class="kpis">
        <div class="kpi tone-accent">
          <div class="k">Em andamento</div>
          <div class="v">${ativas}</div>
          <div class="sub">de ${base.length} perícia${base.length===1?'':'s'}</div>
        </div>
        <div class="kpi ${atrasadas ? 'tone-danger' : ''}">
          <div class="k">Prazos atrasados</div>
          <div class="v">${atrasadas}</div>
          <div class="sub">${atrasadas ? 'exigem atenção imediata' : 'nenhum prazo vencido'}</div>
        </div>
        <div class="kpi">
          <div class="k">Honorários a receber</div>
          <div class="v">${fmtMoney(aReceber)}</div>
          <div class="sub">${pctRecebido}% do total já recebido</div>
        </div>
        <div class="kpi tone-ok">
          <div class="k">Concluídas</div>
          <div class="v">${concluidas}</div>
          <div class="sub">laudo entregue ou encerrada</div>
        </div>
      </div>

      <div class="two-col">
        ${panel('honorarios', 'Honorários por perito', 'acumulado, por responsável', chartHonorarios(base))}
        ${panel('status', 'Distribuição por status', `${base.length} perícia${base.length===1?'':'s'}`, chartStatus(base))}
      </div>

      ${panel('entregas', 'Próximas entregas', 'perícias não concluídas',
        proximos.length === 0
          ? `<div class="chart-empty">Nenhuma entrega pendente.</div>`
          : `<div class="rows">${proximos.map(c => rowPrazo(c)).join('')}</div>`)}
    </div>`;
}

function rowPrazo(c){
  const dias = diasAte(c.prazoEntrega);
  const st = prazoState(c);
  const cls = st === 'atrasada' ? 'late' : (st === 'proxima' ? 'soon' : '');
  let quando;
  if(dias === null) quando = '';
  else if(dias < 0) quando = `${Math.abs(dias)} dia${Math.abs(dias)===1?'':'s'} em atraso`;
  else if(dias === 0) quando = 'vence hoje';
  else quando = `em ${dias} dia${dias===1?'':'s'}`;
  return `
    <div class="row-item" onclick="openDrawer('${c.id}')">
      <div class="row-main">
        <div class="row-title">${escapeHtml(c.nome)}</div>
        <div class="row-sub"><span class="mono">${escapeHtml(c.codigo)}</span> · ${escapeHtml(c.partes)} · ${escapeHtml(c.vara||'vara não informada')}</div>
      </div>
      <div class="row-side">
        <span class="pill ${STATUS[c.statusCaso].pill}">${STATUS[c.statusCaso].label}</span>
        <span class="row-date ${cls}" title="${quando}">${fmtDate(c.prazoEntrega)}</span>
      </div>
    </div>`;
}

function renderPrazos(){
  const base = casosVisiveis().filter(c => c.prazoEntrega);
  const pend = base.filter(c => !STATUS[c.statusCaso].final).sort((a,b) => a.prazoEntrega.localeCompare(b.prazoEntrega));

  const grupos = [
    {titulo:'Atrasados', teste: c => diasAte(c.prazoEntrega) < 0, vazio:'Nenhum prazo vencido.'},

    {titulo:'Próximos trinta dias', teste: c => { const d = diasAte(c.prazoEntrega); return d > 7 && d <= 30; }, vazio:'Nada no mês.'},
    {titulo:'Mais adiante', teste: c => diasAte(c.prazoEntrega) > 30, vazio:'Nada agendado.'},
  ];

  const blocos = grupos.map((g, i) => {
    const items = pend.filter(g.teste);
    return panel('prazo'+i, g.titulo, `${items.length} perícia${items.length===1?'':'s'}`,
      items.length
        ? `<div class="rows">${items.map(rowPrazo).join('')}</div>`
        : `<div class="chart-empty">${g.vazio}</div>`);
  }).join('');

  const concluido = concl.length
    ? panel('prazoFim', 'Encerradas', `${concl.length} perícia${concl.length===1?'':'s'}`,
        `<div class="rows">${concl.map(rowPrazo).join('')}</div>`)
    : '';

  return `<div class="section-gap">${blocos}${concluido}</div>`;
}

/* aceita 1.234,56 · 1234,56 · 1234.56 */
function num(v){
  if(typeof v === 'number') return v;
  let s = String(v ?? '').trim().replace(/\s|R\$/g, '');
  if(!s) return 0;
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  const n = parseFloat(s);
  return isFinite(n) ? n : 0;
}
const brl = n => (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n, casas) => (isFinite(n) ? n*100 : 0).toLocaleString('pt-BR', {minimumFractionDigits:casas??4, maximumFractionDigits:casas??4}) + '%';

/* ---------- sistemas de amortização ---------- */
function tabelaPrice(pv, i, n){
  const linhas = [];
  const pmt = i === 0 ? pv/n : pv * i / (1 - Math.pow(1+i, -n));
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let amort = pmt - juros, parcela = pmt;
    if(k === n){ amort = saldo; parcela = amort + juros; }   // fecha o saldo no último mês
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
function tabelaSac(pv, i, n){
  const linhas = [], amortFixa = pv/n;
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let amort = (k === n) ? saldo : amortFixa;
    const parcela = amort + juros;
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
function tabelaSam(pv, i, n){
  const p = tabelaPrice(pv, i, n), s = tabelaSac(pv, i, n);
  const linhas = [];
  let saldo = pv;
  for(let k=1; k<=n; k++){
    const juros = saldo * i;
    let parcela = (p[k-1].parcela + s[k-1].parcela) / 2;
    let amort = parcela - juros;
    if(k === n){ amort = saldo; parcela = amort + juros; }
    saldo -= amort;
    if(Math.abs(saldo) < 0.005) saldo = 0;
    linhas.push({k, parcela, juros, amort, saldo});
  }
  return linhas;
}
const SISTEMAS = {price:{nome:'Price', fn:tabelaPrice}, sac:{nome:'SAC', fn:tabelaSac}, sam:{nome:'Misto (SAM)', fn:tabelaSam}};

/* ---------- valor presente, VPL e TIR ---------- */
function vpl(taxa, fluxo){ return fluxo.reduce((s,v,k) => s + v/Math.pow(1+taxa, k), 0); }
function tir(fluxo){
  let lo = -0.9999, hi = 10, flo = vpl(lo, fluxo);
  if(!isFinite(flo) || flo * vpl(hi, fluxo) > 0) return null;
  for(let it=0; it<300; it++){
    const mid = (lo+hi)/2, f = vpl(mid, fluxo);
    if(flo * f <= 0){ hi = mid; } else { lo = mid; flo = f; }
  }
  return (lo+hi)/2;
}

/* ---------- datas ---------- */
function dataBr(iso){ return iso ? iso.split('-').reverse().join('/') : ''; }
function mesesEntre(ini, fim){
  const a = new Date(ini+'T00:00:00'), b = new Date(fim+'T00:00:00');
  let m = (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth());
  if(b.getDate() < a.getDate()) m--;
  return Math.max(0, m);
}
function diasEntre(ini, fim){
  return Math.round((new Date(fim+'T00:00:00') - new Date(ini+'T00:00:00')) / 86400000);
}

/* ---------- consulta de índice no Banco Central ---------- */
async function buscarIndice(cod, dataIni, dataFim){
  const url = `https://api.bcb.gov.br/dados/serie/bcdata.sgs.${cod}/dados?formato=json`
            + `&dataInicial=${dataBr(dataIni)}&dataFinal=${dataBr(dataFim)}`;
  const r = await fetch(url, {cache:'no-store'});
  if(!r.ok) throw new Error('O Banco Central respondeu com status ' + r.status);
  const j = await r.json();
  if(!Array.isArray(j) || j.length === 0) throw new Error('A série não retornou valores para esse período.');
  return j.map(x => ({data:x.data, valor: parseFloat(String(x.valor).replace(',', '.'))}));
}

function csvDe(aba){
  const d = calcDados[aba];
  if(!d) return '';
  const linhas = [d.titulo, ''];
  (d.parametros||[]).forEach(([k,v]) => linhas.push(`${k};${v}`));
  linhas.push('');
  linhas.push(d.colunas.join(';'));
  d.linhas.forEach(l => linhas.push(l.join(';')));
  if(d.totais){ linhas.push(d.totais.join(';')); }
  linhas.push('');
  linhas.push('Gerado pelo Gerenciador de Pericias em ' + new Date().toLocaleString('pt-BR'));
  if(d.fonte) linhas.push(d.fonte);
  return linhas.join('\n');
}
function nomeArquivoCalc(aba){
  const d = calcDados[aba];
  const base = (d && d.titulo ? d.titulo : 'calculo').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_|_$/g,'').toLowerCase();
  return base.slice(0,60) + '_' + todayIso() + '.csv';
}
function exportarCSV(aba){

/* ==========================================================================
   Cálculo 1 — financiamento (Price, SAC e Misto)
   ========================================================================== */
function rodarFinanciamento(){
  const pv = num(document.getElementById('fPv').value);
  const prazo = Math.round(num(document.getElementById('fPrazo').value));
  const taxaInf = num(document.getElementById('fTaxa').value) / 100;
  const periodo = document.getElementById('fPeriodo').value;
  const sistema = document.getElementById('fSistema').value;
  const saida = document.getElementById('calcSaidaBox');

  if(pv <= 0 || prazo <= 0){
    saida.innerHTML = bannerAviso('Informe o valor financiado e o prazo em meses.');
    return;
  }
  if(prazo > 600){
    saida.innerHTML = bannerAviso('O prazo máximo aceito é de 600 meses.');
    return;
  }
  // taxa anual vira mensal equivalente (capitalização composta)
  const i = periodo === 'ano' ? Math.pow(1 + taxaInf, 1/12) - 1 : taxaInf;

  const linhas = SISTEMAS[sistema].fn(pv, i, prazo);
  const totalJuros = linhas.reduce((s,l)=>s+l.juros, 0);
  const totalPago = linhas.reduce((s,l)=>s+l.parcela, 0);

  const comparativo = Object.entries(SISTEMAS).map(([k, s]) => {
    const t = s.fn(pv, i, prazo);
    return {chave:k, nome:s.nome, juros:t.reduce((a,l)=>a+l.juros,0), total:t.reduce((a,l)=>a+l.parcela,0), primeira:t[0].parcela, ultima:t[t.length-1].parcela};
  });
  const maxTotal = Math.max(...comparativo.map(c=>c.total));
