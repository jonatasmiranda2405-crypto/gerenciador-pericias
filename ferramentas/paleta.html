<div id="pfPaleta" hidden onclick="if(event.target===this) pfFecharPaleta()">
  <div class="pf-pal-caixa" role="dialog" aria-modal="true" aria-label="Buscar ou ir para">
    <div class="pf-pal-busca">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input id="pfPalInput" placeholder="Buscar perícia, tela ou ação" oninput="pfFiltrarPaleta(this.value)" autocomplete="off" spellcheck="false" role="combobox" aria-controls="pfPalLista" aria-expanded="true">
      <kbd>Esc</kbd>
    </div>
    <div id="pfPalLista" role="listbox" aria-label="Resultados"></div>
    <div class="pf-pal-rodape"><span><kbd>↑</kbd><kbd>↓</kbd> navegar</span><span><kbd>Enter</kbd> abrir</span><span><kbd>/</kbd> ou <kbd>Ctrl K</kbd> abre de qualquer tela</span></div>
  </div>
</div>
